# Local infrastructure for development and tests. Start with `make up`.
#
# mysql and redis are opt-in (`make up-db`) because most dev machines already run native
# ones on ports 3306 / 6379; mailpit and minio always start with `make up`.
services:
  mysql:
    profiles: [db]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: siapp
      MYSQL_USER: siapp
      MYSQL_PASSWORD: siapp
    command: ["--default-time-zone=+00:00"]
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: [db]
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO no longer publishes images (minio/minio is gone from Docker Hub), so this uses
  # Bitnami's frozen legacy build of the same server. Local S3 for development only.
  minio:
    image: bitnamilegacy/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/bitnami/minio/data]

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  mysql-data:
  minio-data:
