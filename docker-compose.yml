# Local stack for development and tests. Everything SiAPP talks to runs here.
#
#   make up         postgres, redis, minio                (infrastructure only)
#   make up-app     + migrate, api, worker in containers  (from Phase 00.2)
#   make up-cctv    + MediaMTX                            (Phase 13.2)
name: siapp

x-app: &app
  build: .
  env_file: .env
  # Inside the compose network services are reached by name, not localhost.
  environment:
    DATABASE_URL: postgres://siapp_app:siapp_app@postgres:5432/siapp?sslmode=disable
    MIGRATE_DSN: postgres://siapp_owner:siapp_owner@postgres:5432/siapp?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    # The folder of the local storage driver inside the containers: the media-data volume below.
    # .env holds the laptop's ./data/media, which means nothing in a container.
    STORAGE_LOCAL_DIR: /var/lib/siapp/media
    # kpi-personalia-api runs on the host (see docs/dev-setup.md), not in this stack.
    PERSONEL_BASE_URL: http://host.docker.internal:8081/api/v3/integrations/siapp
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: siapp_owner        # owns the database, runs migrations
      POSTGRES_PASSWORD: siapp_owner
      POSTGRES_DB: siapp
      TZ: UTC
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is first created: creates the app role siapp_app.
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siapp_owner -d siapp"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # minio/minio is no longer published on Docker Hub; Bitnami's frozen build of the
  # same server is used for local S3 only.
  minio:
    image: bitnamilegacy/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: persist-media
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/bitnami/minio/data]

  migrate:
    <<: *app
    profiles: [app]
    entrypoint: ["/migrate", "up"]
    restart: "no"

  api:
    <<: *app
    profiles: [app]
    ports: ["8080:8080"]
    # ⚠ The API and the worker mount the SAME volume: with STORAGE_DRIVER=local the worker's
    # media:cleanup deletes the files the API stored. On a server, replace the named volume
    # with a bind mount of a host folder (for example /srv/siapp/media, owned by uid 65532) in
    # both services, so the photos survive the containers and can be backed up.
    volumes: [media-data:/var/lib/siapp/media]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    profiles: [app]
    entrypoint: ["/worker"]
    volumes: [media-data:/var/lib/siapp/media]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # CCTV stream gateway (Phase 13.2, after the camera vendor is confirmed).
  mediamtx:
    profiles: [cctv]
    image: bluenviron/mediamtx
    ports: ["8554:8554", "8888:8888"]

volumes:
  postgres-data:
  minio-data:
  # Photos of the local storage driver (api and worker, same folder).
  media-data:
