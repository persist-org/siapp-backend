  /attendances/selfie/check-in:
    post:
      operationId: postAttendancesSelfieCheckIn
      tags:
      - Attendance
      summary: Absen datang selfie + GPS
      description: 'Online-only. `shift_ref` harus salah satu shift dari `GET /attendances/today`, selain itu 422 `ATTENDANCE_SHIFT_NOT_ACTIVE`.
        Selfie didaftarkan dulu lewat modul media (purpose `ATTENDANCE_SELFIE`). Di luar radius: geofence ketat menolak (422
        `ATTENDANCE_OUTSIDE_AREA`), geofence longgar menyimpan dengan `check_in_within_area: false`. Absen terlambat tidak
        ditolak: catatan menyimpan `late_minutes`. Hari kerja sebelumnya (jadwal terakhir sebelum tanggal shift yang bukan
        OFF) harus beres. Sudah absen datang tetapi belum absen pulang: 422 `ATTENDANCE_PREVIOUS_NOT_CHECKED_OUT`. Tidak ada
        catatan sama sekali (alpa): 422 `ATTENDANCE_PREVIOUS_NOT_CHECKED_IN`, hanya bila personil sudah pernah absen datang
        lewat SiAPP sebelum hari itu (hari sebelum absen pertamanya tidak dinilai). Keduanya memuat `previous_work_date`.
        Dianggap beres: absen pulang yang lengkap, izin yang disetujui (LEAVE), atau mangkir yang sudah ditandai (ABSENT).
        Check-in ganda 409 `ATTENDANCE_ALREADY_CHECKED_IN`; shift yang sudah tercatat izin/mangkir 422 `ATTENDANCE_NOT_ALLOWED`;
        proyek tanpa koordinat 422 `PROJECT_NOT_CONFIGURED`. Foto yang bukan milik pemanggil atau tidak ada: 404 `MEDIA_NOT_FOUND`
        (aturan modul media).'
