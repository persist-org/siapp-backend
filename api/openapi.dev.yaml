          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /permission-categories:
    get:
      operationId: getPermissionCategories
      tags:
      - Permission
      summary: Daftar kategori izin, cuti dan sakit (lookup, delta-sync)
      description: |-
        Kategori milik SiAPP (D2), tidak lagi dibaca dari Personel. Dua bentuk jawaban:
        - **Tanpa `since`**: semua baris aktif sekaligus, dengan `meta.server_time` sebagai
          watermark pertama klien.
        - **Dengan `since`** (delta-sync, DL-34/DL-57): baris yang berubah di `data`, dan yang
          dinonaktifkan di `deleted` (tombstone, berkunci `code`). Simpan `meta.server_time`.
          Tanpa `pagination`; `meta.has_more` selalu false dan tidak ada `next_cursor`. `since` harus RFC 3339.

        Tanpa `since`, `pagination` berisi satu halaman penuh (`page` 1, `limit` = jumlah baris, tanpa `deleted`).
        `type` menyaring satu tipe (LEAVE, PERMIT atau SICK); selain itu 422 `VALIDATION_ERROR`.
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LeaveCategoryType'
      - $ref: '#/components/parameters/SinceParam'
      responses:
        '200':
          description: OK. `meta.server_time` WAJIB.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaveCategory'
                    deleted:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaveCategoryTombstone'
                    pagination:
                      $ref: '#/components/schemas/Pagination'
                    meta:
                      $ref: '#/components/schemas/DeltaMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /permissions/quota:
    get:
      operationId: getPermissionsQuota
      tags:
      - Permission
      summary: Sisa kuota milik sendiri untuk satu kategori
      description: 'Cuti tahunan: `quota_days` adalah saldo buku besar. Kategori lain: hari kuota klien regu itu (bila tidak
        ada baris, 0) dikurangi hari yang dipegang pengajuan menunggu dan disetujui tahun ini. `team_code` boleh dikosongkan
        bila orang itu hanya bertugas di satu regu; bertugas di lebih dari satu regu dan `team_code` kosong: 422 `VALIDATION_ERROR`
        (field `team_code`); `team_code` yang bukan regu tempat ia bertugas hari ini, atau ia tidak bertugas di regu mana pun:
        403 `PERMISSION_DENIED`. Klien yang pengajuannya dimatikan: kuota 0 (kecuali cuti tahunan). Kategori tidak ada: 404
        `LEAVE_CATEGORY_NOT_FOUND`. Sakit, kategori tanpa kuota, dan kategori nonaktif: 422 `LEAVE_CATEGORY_INVALID`. `category_code`
        kosong: 422 `VALIDATION_ERROR`. Perlu `attendance.leave.request` (403 `PERMISSION_DENIED`).'
      parameters:
      - name: category_code
        in: query
        required: true
        schema:
          type: string
          example: ANNUAL
      - name: team_code
        in: query
        required: false
        schema:
          type: string
          example: 1K-IBMI-S1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LeaveQuota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
