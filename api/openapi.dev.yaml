      summary: Ringkasan bulanan regu (DANRU)
      description: 'Hitungan per hari kerja regu sebulan: `scheduled` (personil yang terjadwal, bukan OFF), `present`, `leave`,
        `absent`, `missing` (terjadwal tapi belum ada catatan sama sekali, baik hari itu sudah lewat atau belum), `swapped`
        (izin/mangkir yang sudah ada tukar jaga aktif, subset dari `leave`/`absent`). Izin sama dengan `GET /attendances`.'
      parameters:
      - name: team_code
        in: query
        required: true
        schema:
          type: string
          example: 1K-IBMI-S1
      - name: month
        in: query
        required: true
        description: Bulan, YYYY-MM.
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-03
      responses:
        '200':
          description: OK, tanggal naik.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        type: object
                        required:
                        - work_date
                        - scheduled
                        - present
                        - leave
                        - absent
                        - missing
                        - swapped
                        properties:
                          work_date:
                            type: string
                            format: date
                          scheduled:
                            type: integer
                          present:
                            type: integer
                          leave:
                            type: integer
                          absent:
                            type: integer
                          missing:
                            type: integer
                          swapped:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /attendances:
    get:
      operationId: getAttendances
      tags:
      - Attendance
      summary: Monitor kehadiran regu (DANRU)
      description: 'Setiap personil dan harinya dari regu yang dijangkau izin `attendance.group.view` atau `attendance.absence.view`
        pemanggil, terbaru lebih dulu. Tanpa `team_code`: setiap regu yang dijangkau salah satu izin itu; kosong keduanya:
        403 `PERMISSION_DENIED`. `team_code` di luar jangkauan: 403 `PERMISSION_DENIED` juga, sama dengan regu yang tidak
        dijangkau sama sekali. Pemegang izin hanya sebagai `SELF` (anggota biasa) hanya melihat catatannya sendiri, mis. riwayat
        mangkir `?status=ABSENT&month=`. `month` tidak bisa dipakai bersama `date_from`/ `date_to` (422).'
      parameters:
      - name: team_code
        in: query
        description: Regu tertentu; selain itu setiap regu yang dijangkau.
        schema:
          type: string
          example: 1K-IBMI-S1
      - name: project_code
        in: query
        description: Proyek tertentu.
        schema:
          type: string
          example: 1K-IBMI-S
      - name: status
        in: query
        description: Status tersimpan; `ABSENT` untuk riwayat mangkir.
        schema:
          type: string
          enum:
          - PRESENT
          - LEAVE
          - ABSENT
      - name: month
        in: query
        description: Bulan, YYYY-MM.
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-03
      - $ref: '#/components/parameters/DateFromParam'
