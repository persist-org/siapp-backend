        team_code:
          type: string
        shift_id:
          type: integer
          format: int64
          nullable: true
        check_in_at:
          type: string
          format: date-time
        check_in_latitude:
          type: number
          format: double
        check_in_longitude:
          type: number
          format: double
        check_out_at:
          type: string
          format: date-time
          nullable: true
        check_out_latitude:
          type: number
          format: double
          nullable: true
        check_out_longitude:
          type: number
          format: double
          nullable: true
    LocationPoint:
