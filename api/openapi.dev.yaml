    put:
      operationId: putAdminPermissionCategoriesByCodeQuotas
      tags:
      - Permission
      summary: Ganti kuota hari sebuah kategori (ORG_ADMIN)
      description: 'Baris yang dikirim adalah baris yang ada sesudahnya. `default_days` berlaku untuk klien tanpa barisnya
        sendiri; **tanpa baris sama sekali berarti 0 hari**, jadi kategori itu belum bisa diajukan. Cuti tahunan dibatasi
        saldo (bukan kuota) dan sakit tidak berkuota: keduanya 422 `LEAVE_CATEGORY_INVALID` (begitu pula kategori yang `has_quota`-nya
        false). Kode kategori tidak ada: 404 `LEAVE_CATEGORY_NOT_FOUND`. `clients[].client_code` ganda atau tidak ada, atau
        hari di luar 0 sampai 366: 422 `VALIDATION_ERROR` (field `clients[i].client_code`). `quota_days` yang dihilangkan dihitung 0.
        REGION_ADMIN: 403 `ACCESS_ORG_ADMIN_ONLY`. Body bukan JSON 400; lebih dari 1 MB 413.'
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveQuotasInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
