                      message: Kode sudah dipakai.
                      details:
                        reason: CODE_TAKEN
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR: huruf PT bukan K/I/P, region_code salah bentuk, atau deskripsi kosong.'
          content:
            application/json:
              schema:
