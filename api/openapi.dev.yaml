          baris yang dihapus atau dinonaktifkan di `deleted` (tombstone) supaya cache offline bisa
          membuangnya. Simpan `meta.server_time` sebagai `since` berikutnya. Baris yang baru saja
          berubah boleh datang dua kali: upsert berdasarkan `id`.
      parameters:
      - $ref: '#/components/parameters/SinceParam'
      responses:
        '200':
          description: OK. `meta.server_time` WAJIB.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ReportCategory'
                    deleted:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tombstone'
                    pagination:
                      $ref: '#/components/schemas/Pagination'
                    meta:
                      $ref: '#/components/schemas/DeltaMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
