            meta:
              request_id: req_abc123
    PatrolAdminForbidden:
      description: '403: `FORBIDDEN` reason `NOT_ADMIN` (bukan admin web), atau `SCOPE_DENIED` reason `ACCESS_OUTSIDE_ADMIN_SCOPE` (proyek zona di luar wilayah REGION_ADMIN).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Anda bukan admin. Akses ini hanya untuk admin.
              details:
