              examples:
                badIsActive:
                  summary: is_active=maybe
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
                      errors:
                      - field: is_active
                        code: INVALID
                        message: Harus true atau false.
                    meta:
                      request_id: req_abc123
                badLimit:
                  summary: limit=1000
