        "sebagian hari"), `requires_change_day` (perlu hari tukar), `makes_leave_days` (persetujuan menulis baris LEAVE),
        `excuses_lateness` (menghapus keterlambatan hari itu), `has_quota`.'
      required:
      - code
      - name
      - type
      - is_annual
      - skips_day_check
      - requires_time_range
      - requires_change_day
      - makes_leave_days
      - excuses_lateness
      - has_quota
      - sort_order
      - is_active
      - created_at
      - updated_at
      properties:
        code:
          type: string
          example: ANNUAL
        name:
          type: string
          example: Cuti Tahunan
        type:
          $ref: '#/components/schemas/LeaveCategoryType'
        is_annual:
          type: boolean
        skips_day_check:
          type: boolean
        requires_time_range:
          type: boolean
        requires_change_day:
          type: boolean
        makes_leave_days:
          type: boolean
        excuses_lateness:
          type: boolean
        has_quota:
          type: boolean
        sort_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LeaveCategoryDetail:
