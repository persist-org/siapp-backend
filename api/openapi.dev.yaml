            error:
              code: RATE_LIMITED
              message: Terlalu banyak permintaan. Coba lagi nanti.
            meta:
              request_id: req_abc123
    PatrolForbidden:
      description: '403 `FORBIDDEN`, `details.reason` = `PERMISSION_DENIED`: pemanggil tidak bertugas di proyek/regu itu, tidak punya izin patroli/jaga yang dibutuhkan, atau regu/proyek yang diminta di luar jangkauannya.'
