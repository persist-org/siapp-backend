      - full_name
      - role
      - team_code
      - project_code
      - online
      properties:
        personnel_id:
          type: integer
          format: int64
        full_name:
          type: string
        photo_url:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - DANRU
          - MEMBER
        position_name:
          type: string
          nullable: true
        team_code:
          type: string
          example: 1K-IBMI-S1
        project_code:
          type: string
          example: 1K-IBMI-S
        online:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        accuracy_meters:
          type: number
          format: double
          nullable: true
        logged_at:
          type: string
          format: date-time
          nullable: true
          description: Waktu titik terakhir direkam perangkat.
    NotificationType:
      type: string
      description: Jenis notifikasi. 12 yang pertama adalah event Tabel 7 manual (PERPINDAHAN_REGU = `TEAM_CHANGED`, PERGANTIAN_POSISI
        = `POSITION_CHANGED`); 4 yang terakhir tersirat dari alur manual (keputusan izin, umpan balik instruksi, tukar jaga,
        panik selesai).
      enum:
      - LEAVE_REQUESTED
      - ABSENCE_MARKED
      - REPORT_SUBMITTED
      - INSTRUCTION_RECEIVED
      - TEAM_CHANGED
      - POSITION_CHANGED
      - PATROL_SUBMITTED
      - PATROL_APPROVED
      - GUARD_SUBMITTED
      - GUARD_APPROVED
      - PANIC_TRIGGERED
      - OFFLINE_SUBMISSION_SENT
      - LEAVE_DECIDED
      - INSTRUCTION_FEEDBACK
      - SWAP_ASSIGNED
      - PANIC_RESOLVED
      - LEAVE_CANCELLED
    NotificationPriority:
      type: string
      enum:
      - NORMAL
      - HIGH
      description: '`HIGH` hanya untuk panik: dikirim lewat antrean prioritas dan kanal sirine di perangkat.'
    Notification:
      type: object
      description: Satu notifikasi untuk satu penerima (AC-API-NTF-1). `title` dan `body` sudah dirender (Bahasa Indonesia,
        label mengikuti `business_line` proyek) dan tidak memuat NIK.
      required:
      - id
      - organization_id
      - personnel_id
      - type
      - title
      - body
      - priority
      - is_read
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        personnel_id:
          type: integer
          format: int64
          description: Penerima.
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        body:
          type: string
        priority:
          $ref: '#/components/schemas/NotificationPriority'
        entity_type:
          type: string
          nullable: true
          description: Jenis record yang dituju (mis. `panic`), untuk deep-link.
        entity_id:
          type: integer
          format: int64
          nullable: true
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Payload deep-link (entity id/route).
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Berubah saat dibaca; dasar delta-sync.
    WsTicket:
      type: object
      required:
      - ticket
      - expires_in
      properties:
        ticket:
          type: string
          description: Dipakai sekali pada GET /api/v1/ws?ticket=.
        expires_in:
          type: integer
          example: 30
          description: Detik.
    PersonelEvent:
      type: object
      required:
      - event_id
      - type
      - organization_id
      - timestamp
      properties:
        event_id:
          type: string
          maxLength: 128
          description: Unik per event; dasar penolakan kiriman ulang (7 hari).
        type:
          type: string
          example: employee.deactivated
          description: employee.updated | employee.deactivated | placement.changed | position.changed | leave.decided
        organization_id:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          description: employee.* dan position.changed membawa `nik` (position.changed juga `position_name`); placement.changed
            membawa `project_id`.
          properties:
            nik:
              type: string
            position_name:
              type: string
            project_id:
              type: integer
              format: int64
    PersonelEventResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - processed
          - duplicate
          - ignored
    NotificationTokenInput:
      type: object
      required:
      - firebase_token
      - platform
      properties:
        firebase_token:
          type: string
          maxLength: 4096
          description: Push token perangkat ini. Satu token hanya milik satu perangkat; mendaftar ulang memperbarui baris
            yang sama.
        platform:
          type: string
          enum:
          - android
          - ios
          - web
        app_version:
          type: string
          maxLength: 64
          example: 1.4.2
    NotificationTokenDelete:
      type: object
      required:
      - firebase_token
      properties:
        firebase_token:
          type: string
          minLength: 1
          maxLength: 4096
    NotificationCount:
      type: object
      required:
      - unread
      - total
      properties:
        unread:
          type: integer
          example: 3
        total:
          type: integer
          example: 42
paths:
  /auth/login:
    post:
      operationId: postAuthLogin
      tags:
      - Auth
      summary: Login dengan akun Personalia (email + password)
      description: |
        Seluruh karyawan grup (KPI, IDS, PCD) masuk ke satu organisasi (D17). 403
        AUTH_NOT_IN_GROUP: karyawan itu bekerja untuk PT di luar grup, dan SiAPP tidak melayaninya.

        Kegagalan lain (details.reason): 401 AUTH_INVALID_CREDENTIALS (email atau kata sandi salah;
        email yang tidak dikenal dijawab sama persis); 403 AUTH_ACCOUNT_DISABLED (karyawan tidak aktif
        atau tanpa data kerja), AUTH_DEVICE_BOUND (akun terikat ke HP lain), AUTH_ORGANIZATION_SUSPENDED
        (organisasi dinonaktifkan); 429 terlalu banyak percobaan gagal (lihat `Retry-After`); 503
        PERSONEL_UNAVAILABLE (Personalia tidak menjawab, atau kunci integrasinya ditolak).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags:
      - Auth
      summary: Tukar refresh → access token baru (refresh token berotasi, hanya berlaku sekali)
      description: |
        Token lama langsung mati dan token baru diterbitkan. Memakai ulang token yang sudah dipakai
        mematikan seluruh rantai sesi (AUTH_REFRESH_REUSED). Kegagalan 401: AUTH_TOKEN_INVALID,
        AUTH_REFRESH_REUSED, AUTH_DEVICE_CHANGED (HP tidak lagi terikat); semuanya berarti kembali
        ke layar login. 403 AUTH_ACCOUNT_DISABLED: karyawan sudah tidak aktif di Personalia.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      operationId: getAuthMe
      tags:
      - Auth
      summary: Profil + role per-regu
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/MeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/web-roles:
    get:
      operationId: getAdminWebRoles
      tags:
      - Auth
      summary: Daftar penugasan peran web di organisasi ini (hanya ORG_ADMIN)
      description: |
        Peran web (admin) adalah data SiAPP sendiri: Personalia menyatakan siapa seseorang,
        SiAPP menyatakan apa yang boleh dilakukannya di sini. Menggantikan /admin/web-users
        yang dimiliki Personalia (D5).
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebRoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/web-roles/{personnel_id}:
    parameters:
    - $ref: '#/components/parameters/PersonnelIdPath'
    put:
      operationId: putAdminWebRole
      tags:
      - Auth
      summary: Beri atau ubah peran web seseorang (hanya ORG_ADMIN)
      description: |
        Admin tidak dapat menyempitkan penugasannya sendiri (409 CONFLICT), supaya admin
        terakhir tidak mengunci semua orang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebRoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/WebRoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteAdminWebRole
      tags:
      - Auth
      summary: Cabut peran web seseorang (hanya ORG_ADMIN)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/field-permissions:
    get:
      operationId: getAdminFieldPermissions
      tags:
      - Auth
      summary: Katalog hak akses lapangan dan matriks per peran regu (hanya ORG_ADMIN)
      description: |
        Hak akses petugas lapangan adalah data organisasi: tiap peran regu (DANRU, MEMBER) punya jangkauan per hak
        (`NONE`, `SELF`, `TEAM`, `PROJECT`). Katalog (daftar hak, deskripsi, bidang usaha, dan nilai bawaan dari Tabel 8 manual)
        ditetapkan oleh aplikasi; matriks adalah nilai yang berlaku sekarang. Organisasi yang belum pernah diisi mendapat
        nilai bawaan saat dibaca, jadi matriks tidak pernah kosong.
        Wewenang: hanya ORG_ADMIN. REGION_ADMIN: 403 `ROLE_DENIED` (`ACCESS_ORG_ADMIN_ONLY`), karena matriks berlaku untuk seluruh organisasi.
        Admin web tidak melewati hak lapangan; jalur `/admin` dijaga web role.
      x-roles:
      - ORG_ADMIN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/FieldPermissionMatrix'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN `NOT_ADMIN` (staf lapangan) atau ROLE_DENIED `ACCESS_ORG_ADMIN_ONLY` (REGION_ADMIN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notAdmin:
                  summary: Staf lapangan
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                orgAdminOnly:
                  summary: REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: ROLE_DENIED
                      message: Hanya admin organisasi yang dapat melakukan ini.
                      details:
                        reason: ACCESS_ORG_ADMIN_ONLY
                    meta:
                      request_id: req_abc123
  /admin/field-permissions/{team_role}:
    parameters:
    - $ref: '#/components/parameters/TeamRolePath'
    put:
      operationId: putAdminFieldPermissionsByTeamRole
      tags:
      - Auth
      summary: Ganti semua hak lapangan satu peran regu (hanya ORG_ADMIN)
      description: |
        Mengganti seluruh hak satu peran dalam satu transaksi (gagal berarti tidak ada yang berubah) dan mengembalikan hak peran itu
        sekarang. `grants` harus memuat setiap hak di katalog tepat satu kali: ini penggantian, jadi hak yang tidak disebut ditolak
        (422 `REQUIRED`) dan bukan dianggap dicabut, dan daftar yang pendek tidak dapat melucuti peran. Kunci yang tidak ada di
        katalog: 422 `PERMISSION_UNKNOWN`. Kunci ganda atau jangkauan di luar `NONE`, `SELF`, `TEAM`, `PROJECT`: 422 `VALIDATION_ERROR`.
        `errors[]` menyebut grant yang mana (`grants[3].scope`).
        Hak yang berubah dicatat di audit log dengan jangkauan lama dan baru; penggantian yang tidak mengubah apa pun tidak mencatat
        apa-apa. Perubahan berlaku pada permintaan berikutnya orang-orang yang memegang peran itu (hak dibaca dari database, bukan dari token).
        Wewenang: hanya ORG_ADMIN. REGION_ADMIN: 403 `ROLE_DENIED` (`ACCESS_ORG_ADMIN_ONLY`).
      x-roles:
      - ORG_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPermissionsInput'
      responses:
        '200':
          description: OK (hak peran itu sekarang)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/FieldPermissionRole'
        '400':
          description: 'BAD_REQUEST: body kosong, bukan JSON yang valid, lebih dari satu objek, atau memuat karakter NUL.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                empty:
                  summary: Body kosong
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Body wajib diisi.
                    meta:
                      request_id: req_abc123
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN `NOT_ADMIN` (staf lapangan) atau ROLE_DENIED `ACCESS_ORG_ADMIN_ONLY` (REGION_ADMIN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                orgAdminOnly:
                  summary: REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: ROLE_DENIED
                      message: Hanya admin organisasi yang dapat melakukan ini.
                      details:
                        reason: ACCESS_ORG_ADMIN_ONLY
                    meta:
                      request_id: req_abc123
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: 'PAYLOAD_TOO_LARGE: body lebih dari 1 MB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tooLarge:
                  value:
                    success: false
                    error:
                      code: PAYLOAD_TOO_LARGE
                      message: Body terlalu besar.
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR: daftar hak tidak valid. Reason `PERMISSION_UNKNOWN` bila ada kunci yang tidak dikenal.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unknownPermission:
                  summary: Kunci tidak dikenal
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Ada hak akses yang tidak dikenal.
                      details:
                        reason: PERMISSION_UNKNOWN
                      errors:
                      - field: grants[2].permission
                        code: UNKNOWN
                        message: Hak akses tidak dikenal.
                    meta:
                      request_id: req_abc123
                missing:
                  summary: Hak yang tidak disebut
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
                      errors:
                      - field: grants
                        code: REQUIRED
                        message: Hak akses cctv.view wajib ada di daftar.
                    meta:
                      request_id: req_abc123
  /admin/personnel/{personnel_id}/device-binding:
    parameters:
    - $ref: '#/components/parameters/PersonnelIdPath'
    delete:
      operationId: deleteAdminPersonnelDeviceBinding
      tags:
      - Auth
      summary: Reset ikatan HP seseorang (satu orang = satu HP)
      description: |
        Reset HR di panel Personalia hanya membebaskan aplikasi Personalia; ikatan HP SiAPP
        adalah catatan SiAPP sendiri dan direset di sini. Dalam satu transaksi ikatan dihapus
        dan sesi MOBILE orang itu dicabut (token aksesnya mati seketika). ORG_ADMIN, atau
        REGION_ADMIN untuk orang yang tergabung di regu pada koordinator wilayahnya. Orang tanpa
        ikatan: tidak terjadi apa-apa, tetap 200.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags:
      - Auth
      summary: Akhiri sesi ini (seluruh rantai refresh) + hapus FCM token
      description: |
        Mematikan refresh token dan access token sesi ini seketika. Tidak melepas ikatan HP
        (itu catatan admin dan bertahan setelah logout).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                firebase_token:
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/permission-categories:
    get:
      operationId: getAdminPermissionCategories
      tags:
      - Permission
      summary: Daftar kategori izin (ORG_ADMIN)
      description: Kategori izin, cuti dan sakit milik SiAPP (D2), aktif atau tidak. Apa yang istimewa dari sebuah kategori
        ada pada bendera barisnya, bukan pada kode atau namanya.
      security:
      - bearerSession: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LeaveCategoryType'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/QParam'
      - $ref: '#/components/parameters/IsActiveParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaveCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: postAdminPermissionCategories
      tags:
      - Permission
      summary: Buat kategori izin (ORG_ADMIN)
      description: 'Kode, tipe dan `is_annual` tidak bisa diubah sesudahnya, dan kode tidak pernah dipakai dua kali (409 `LEAVE_CATEGORY_CODE_TAKEN`).
        Bendera yang saling bertentangan: 422.'
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveCategoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LeaveCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/permission-categories/{code}:
    parameters:
    - name: code
      in: path
      required: true
      schema:
        type: string
        example: ANNUAL
    get:
      operationId: getAdminPermissionCategoriesByCode
      tags:
      - Permission
      summary: Detail kategori izin beserta kuotanya (ORG_ADMIN)
      security:
      - bearerSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LeaveCategoryDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchAdminPermissionCategoriesByCode
      tags:
      - Permission
      summary: Ubah atau nonaktifkan kategori izin (ORG_ADMIN)
      description: 'Kategori tidak dihapus, hanya dinonaktifkan (`is_active: false`): permintaan lama tetap menunjuk padanya.
        Kode, tipe dan `is_annual` tidak bisa diubah (422).'
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveCategoryUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LeaveCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/permission-categories/{code}/quotas:
    parameters:
    - name: code
      in: path
      required: true
      schema:
        type: string
        example: UNPAID
    put:
      operationId: putAdminPermissionCategoriesByCodeQuotas
      tags:
      - Permission
      summary: Ganti kuota hari sebuah kategori (ORG_ADMIN)
      description: 'Baris yang dikirim adalah baris yang ada sesudahnya. `default_days` berlaku untuk klien tanpa barisnya
        sendiri; **tanpa baris sama sekali berarti 0 hari**, jadi kategori itu belum bisa diajukan. Cuti tahunan dibatasi
        saldo (bukan kuota) dan sakit tidak berkuota: keduanya 422 `LEAVE_CATEGORY_INVALID`.'
