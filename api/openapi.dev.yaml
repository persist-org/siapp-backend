        note:
          type: string
          nullable: true
          maxLength: 1000
        media_ids:
          type: array
          maxItems: 5
          items:
            type: integer
            format: int64
          description: Foto jawaban ini (`POST /media` dengan tujuan `PATROL_SCAN`).
    PatrolScanCreate:
      type: object
      required:
