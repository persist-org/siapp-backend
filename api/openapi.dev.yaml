        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /permissions:
    get:
      operationId: getPermissions
      tags:
      - Permission
      summary: Antrean pengajuan regu yang dipimpin pemanggil (DANRU)
      description: 'Berdasarkan regu yang dipimpin pemanggil SEKARANG (`attendance.leave.approve`, TEAM), bukan berdasarkan
        DANRU yang tercatat saat diajukan: setelah DANRU diganti, yang baru melihatnya. Terbaru dulu. `type` dan `status`
        boleh diulang atau dipisah koma (nilai salah: 422 `VALIDATION_ERROR`). `q` mencari nama atau nomor. Tiap item memuat `person`, `overlaps_with` dan `coverage`.
        Tanpa izin `attendance.leave.approve`, tidak memimpin regu mana pun, atau `team_code` di luar regu yang dipimpin: 403 `PERMISSION_DENIED`.
        `project_code` dan `region_code` tidak dipakai di sini.'
      security:
      - bearerSession: []
      parameters:
      - name: team_code
        in: query
        required: false
        schema:
          type: string
          example: 1K-IBMI-S1
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: LEAVE,SICK
      - $ref: '#/components/parameters/StatusParam'
      - $ref: '#/components/parameters/QParam'
      - name: from_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: postPermissions
      tags:
      - Permission
      summary: Ajukan izin, cuti atau sakit
      description: |-
        Satu transaksi, urutan seperti Personalia: orang dikunci, regu dan DANRU ditentukan, tumpang tindih, hari kerja, kuota, nomor, baris, foto, lalu pemotongan saldo (cuti tahunan dipotong SAAT diajukan dan dikembalikan bila ditolak atau dibatalkan). Perlu `attendance.leave.request`. Idempoten.
        - 403: bukan anggota regu yang disebut pada `start_date`. - 409 `LEAVE_OVERLAP`: bertabrakan dengan pengajuan lain yang masih berlaku. - 422 `LEAVE_SCHEDULE_MISSING` (ada tanggal tanpa jadwal; `details.dates`),
          `LEAVE_NO_WORKING_DAYS`, `LEAVE_QUOTA_EXCEEDED` (field `category_code`),
          `LEAVE_CATEGORY_INVALID` (tipe tidak cocok atau kategori nonaktif), dan kesalahan isian
          per field (`VALIDATION_ERROR`: tanggal wajib/berurutan/paling lama 366 hari, jam `HH:MM` berpasangan sesuai bendera kategori,
          `team_code` wajib bila bertugas di lebih dari satu regu, isian sakit hanya untuk SICK, surat dokter wajib satu foto bila `letter_status`).
        - 403 `PERMISSION_DENIED` juga tanpa `attendance.leave.request`. - 404 `LEAVE_CATEGORY_NOT_FOUND`: kode kategori tidak ada;
          404 `MEDIA_NOT_FOUND`, 409 `MEDIA_NOT_UPLOADED`/`MEDIA_EXPIRED`/`MEDIA_ALREADY_ATTACHED`, 422 `MEDIA_PURPOSE_MISMATCH`: aturan foto.
          Klien yang pengajuannya dimatikan memakai kuota 0 (`LEAVE_QUOTA_EXCEEDED`). Body bukan JSON 400; lebih dari 1 MB 413.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
