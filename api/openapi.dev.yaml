                      - field: description
                        code: INVALID
                        message: Tidak boleh kosong.
                    meta:
                      request_id: req_abc123
        '413':
          description: 'PAYLOAD_TOO_LARGE: body lebih dari 1 MB.'
          content:
            application/json:
              schema:
