        action:
          type: string
          minLength: 1
          maxLength: 300
        instruction:
          type: string
          nullable: true
          maxLength: 1000
        min_photos:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        max_photos:
          type: integer
          minimum: 0
          maximum: 5
          description: Bawaan 1, atau `min_photos` bila lebih besar. `min_photos` tidak boleh melebihi `max_photos`.
        is_note_required:
          type: boolean
          default: false
    PatrolCheckpointActionsReplace:
