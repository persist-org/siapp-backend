                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: sort_order
                        code: TOO_LARGE
                        message: 'Terlalu besar (maksimum 10000).'
                    meta:
                      request_id: req_abc123
                unknownField:
                  summary: 'Field tidak dikenal'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: code
                        code: INVALID
                        message: 'Field tidak dikenal.'
                    meta:
                      request_id: req_abc123
                wrongType:
                  summary: 'Tipe salah'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: sort_order
                        code: INVALID
                        message: 'Harus bertipe angka.'
                    meta:
                      request_id: req_abc123
        '413':
          $ref: '#/components/responses/MdPayloadTooLarge'
