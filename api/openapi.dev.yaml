      summary: Batalkan Mangkir (DANRU)
      description: 'DANRU membatalkan mangkir yang keliru ditandai: baris dihapus (bukan diubah statusnya) dan sebuah event
        `ABSENT_CANCELLED` dikirim ke Personel. Sama izinnya dengan membuat mangkir, dinilai dari tanggal kerja dan regu catatan
        itu, bukan hari ini. Catatan yang bukan mangkir, tidak ada, atau di luar jangkauan izin pemanggil: 404 (sama untuk
        ketiganya, sehingga id tidak bisa diuji coba). Bila mangkir itu sudah ditutup tukar jaga, tukar jaga yang belum dimulai
        ikut dibatalkan; bila pengganti sudah absen datang: 409 `SWAP_ALREADY_STARTED` dan catatan tetap ada.'
      responses:
