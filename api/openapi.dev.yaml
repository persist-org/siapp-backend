          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolCheckpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolCheckpointNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '422 `CHECKPOINT_ACTION_INVALID` (`VALIDATION_ERROR`), field menyebut tempatnya: `actions` lebih dari 30, `actions[i].action` kosong atau lebih dari 300 karakter, `actions[i].instruction` lebih dari 1000, `actions[i].min_photos`/`max_photos` di luar 0 sampai 5 atau `min_photos` > `max_photos`, `actions[i].id` bukan uuid, ganda, atau bukan aksi aktif checkpoint ini. `actions` hilang: 422 biasa.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /admin/checkpoints/{id}/qr:
