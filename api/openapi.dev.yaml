    StakeholderTypeCreate:
      type: object
      description: Nama unik di organisasi (tanpa membedakan huruf besar/kecil, termasuk tipe nonaktif) → 409 STAKEHOLDER_TYPE_NAME_TAKEN.
        Kode yang sudah dipakai (juga oleh tipe terhapus) → 409 STAKEHOLDER_TYPE_CODE_TAKEN; kode yang dibuat dari nama diberi
        akhiran _2, _3 bila terpakai.
