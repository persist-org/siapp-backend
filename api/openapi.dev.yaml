  /zones/{id}/scan:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postZonesByIdScan
      tags:
      - Patrol
      summary: Scan QR zona (offline-capable, geofence)
      description: |
        Memeriksa berurutan, dan yang pertama gagal menjadi jawabannya: QR (`ZONE_QR_INVALID`),
        izin `patrol.scan`/`guard.scan` menurut tipe zona, keanggotaan proyek dan regu
        (`ZONE_NOT_IN_PROJECT`, 403), geofence (`ZONE_OUTSIDE_RADIUS`: jarak lebih dari radius
        ditambah `min(accuracy_meters, 30)`), interval patroli proyek (`ZONE_INTERVAL_NOT_ELAPSED`),
        lalu checklist (`CHECKLIST_ITEM_INVALID`, `CHECKLIST_ANSWER_REQUIRED`,
        `CHECKLIST_ANSWER_INVALID`, `CHECKLIST_ATTACHMENT_REQUIRED`) dan foto (`SCAN_PHOTO_REQUIRED`).
        Scan offline dinilai dengan checklist saat `occurred_at`: butir yang dinonaktifkan sesudahnya
        diabaikan, butir yang dibuat sesudahnya tidak wajib. Kirim ulang dengan `local_id` yang sama
        mengembalikan scan tersimpan (200) tanpa notifikasi. Setelah tersimpan, DANRU regu diberi tahu
        (`PATROL_SUBMITTED`/`GUARD_SUBMITTED`) dan, untuk `submitted_offline`, pengirim menerima
        `OFFLINE_SUBMISSION_SENT`.
      security:
      - bearerSession: []
      - oauth2ClientCredentials:
        - patrol:write
      - apiKey: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolScanCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolScan'
        '200':
          description: Idempotent replay (local_id/key sama)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validasi atau aturan bisnis gagal; `details.reason` memuat alasannya
          content:
            application/json:
              schema:
