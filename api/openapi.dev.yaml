    PersonnelPosition:
      type: object
      description: 'Posisi terakhir seorang anggota regu. Pada daftar peta hanya anggota online yang muncul, jadi koordinat
        selalu terisi; pada `GET /personnels/{id}/position` anggota yang offline dikembalikan dengan `online: false` dan koordinat
        null.'
      required:
