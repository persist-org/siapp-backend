      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LeaveApprover'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
