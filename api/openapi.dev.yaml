              request_id: req_abc123
    PatrolCheckpointNotFound:
      description: '404 `NOT_FOUND`, `details.reason` = `CHECKPOINT_NOT_FOUND`: checkpoint tidak ada, sudah dihapus, milik organisasi lain, atau id bukan uuid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Checkpoint tidak ditemukan.
              details:
                reason: CHECKPOINT_NOT_FOUND
            meta:
              request_id: req_abc123
    PatrolScanNotFound:
      description: '404 `NOT_FOUND`, `details.reason` = `SCAN_NOT_FOUND`: scan tidak ada, milik organisasi lain, di luar jangkauan pemanggil, atau id bukan angka positif.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Scan tidak ditemukan.
              details:
                reason: SCAN_NOT_FOUND
            meta:
              request_id: req_abc123
    PatrolRouteNotFound:
      description: '404 `NOT_FOUND`, `details.reason` = `PATROL_NOT_FOUND`: patroli tidak ada, milik organisasi lain, milik orang lain di luar jangkauan pemanggil, atau id bukan angka positif.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Patroli tidak ditemukan.
              details:
                reason: PATROL_NOT_FOUND
            meta:
              request_id: req_abc123
  schemas:
    Meta:
      type: object
      required:
      - request_id
      properties:
        request_id:
          type: string
          description: Korelasi audit.
        server_time:
          type: string
          format: date-time
          description: Watermark monoton untuk delta-sync (DL-34).
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      - total_pages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 143
        total_pages:
          type: integer
          example: 8
    SuccessEnvelope:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    ListEnvelope:
      type: object
      required:
      - success
      - data
      - pagination
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorCode:
      type: string
      description: Kode error UPPERCASE machine-readable permukaan /api/v1/*.
      enum:
      - VALIDATION_ERROR
      - UNAUTHENTICATED
      - TOKEN_EXPIRED
      - FORBIDDEN
      - INSUFFICIENT_SCOPE
      - NOT_FOUND
      - CONFLICT
      - DUPLICATE
      - UNDERSTAFFED
      - PAYLOAD_TOO_LARGE
      - UNPROCESSABLE
      - RATE_LIMITED
      - INTERNAL_ERROR
      - BAD_REQUEST
      - ROLE_DENIED
      - ORG_MISMATCH
      - SCOPE_DENIED
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          example: nik
        code:
          type: string
          example: DUPLICATE
        message:
          type: string
          example: NIK sudah terdaftar.
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Pesan human-readable (Bahasa Indonesia).
            details:
              type: object
              additionalProperties: true
              description: |
                Konteks tambahan opsional (mis. scope_required, retry_after). `details.reason` adalah
                kode mesin yang lebih rinci dari `error.code`; yang sudah dirilis tidak pernah diganti
                namanya. Reason lintas-modul (reason milik satu endpoint ada pada deskripsi endpoint itu):

                - 401 `AUTH_TOKEN_INVALID`: token hilang, rusak, atau salah tanda tangan; ke layar login.
                - 401 `AUTH_TOKEN_EXPIRED` (code `TOKEN_EXPIRED`): token akses lewat masa berlaku;
                  refresh sekali lalu ulangi.
                - 401 `AUTH_INVALID_CREDENTIALS`, 403 `AUTH_DEVICE_BOUND`, 403
                  `AUTH_ORGANIZATION_SUSPENDED`: lihat `POST /auth/login`.
                - 409 `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`,
                  `IDEMPOTENCY_RESPONSE_NOT_STORED`: lihat header `Idempotency-Key`.
                - 422 `OCCURRED_AT_IN_FUTURE`: item offline mengaku terjadi lebih dari 5 menit ke depan.
                - 422 `OCCURRED_AT_TOO_OLD`: item offline lebih tua dari jendela offline 7 hari.
                - 503 `PERSONEL_UNAVAILABLE` (code `INTERNAL_ERROR`): Personalia tidak menjawab; coba lagi nanti.
                - 404 `NOT_FOUND` dengan reason `ATTENDANCE_NOT_FOUND`, `NOTIFICATION_NOT_FOUND`,
                  `CATEGORY_NOT_FOUND`, `PANIC_TYPE_NOT_FOUND`, `LETTERHEAD_NOT_FOUND`, `APP_LINK_NOT_FOUND`,
                  `LEAVE_CATEGORY_NOT_FOUND`, `LEAVE_CLIENT_NOT_FOUND`: data tidak ada, sudah dihapus, atau
                  milik organisasi/orang lain (tidak dibedakan).
                - 422 `CATEGORY_KIND_MISMATCH`: kategori bukan untuk jenis data itu.
                - 409 `MASTER_IN_USE`: master masih dipakai; nonaktifkan, jangan hapus.
                - 409 `ACCESS_OWN_ROLE_PROTECTED`: admin tidak boleh mencabut atau mempersempit perannya sendiri.
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
    Tombstone:
      type: object
      description: Record terhapus untuk cache lokal delta-sync (DL-34).
      required:
      - id
      - deleted_at
      properties:
        id:
          type: integer
          format: int64
        deleted_at:
          type: string
          format: date-time
    DeltaMeta:
      type: object
      description: Meta untuk respons delta-sync (DL-34) — `server_time` WAJIB sebagai watermark monoton untuk pull berikutnya.
      required:
      - request_id
      - server_time
      properties:
        request_id:
          type: string
          description: Korelasi audit.
        server_time:
          type: string
          format: date-time
          description: Watermark monoton (= titik mulai pull `since` berikutnya).
        next_cursor:
          type: string
          description: Cursor opaque untuk halaman berikutnya; dihilangkan bila tidak ada lagi data (lihat has_more).
        has_more:
          type: boolean
          description: true bila masih ada data setelah halaman ini (tarik lagi dengan cursor).
    LoginRequest:
      type: object
      description: Field yang tidak dikenal ditolak (422 VALIDATION_ERROR, `Field tidak dikenal.`).
      required:
      - identifier
      - password
      - client
      properties:
        identifier:
          type: string
          format: email
          maxLength: 254
          description: Email akun Persist Personalia; dipangkas spasinya dan diubah ke huruf kecil oleh server. Password
            diperiksa oleh Personalia, SiAPP tidak menyimpannya. Bukan email yang valid → 422 `INVALID`.
          example: budi@contoh.com
        password:
          type: string
          format: password
          maxLength: 256
        client:
          type: string
          enum:
          - MOBILE
          - WEB
          description: Aplikasi yang login. MOBILE mengikat satu perangkat per orang; WEB tidak mengikat perangkat.
        device_token:
          type: string
          maxLength: 512
          description: Pengenal perangkat. Wajib bila client = MOBILE (satu orang = satu HP; kosong → 422 `REQUIRED`); tidak
            dipakai untuk WEB (batas 512 karakter tetap berlaku).
        remember_me:
          type: boolean
          default: false
          description: Memperpanjang umur sesi (refresh token).
        organization_code:
          type: string
          deprecated: true
          description: Diabaikan. Organisasi ditentukan oleh Personalia (perusahaan tempat orang itu bekerja), bukan oleh
            request.
          example: OS1
    AuthUser:
      type: object
      description: |
        Orang yang sedang masuk, seperti yang dikirim `/auth/login`, `/auth/refresh`, dan `/auth/me`. Hanya field di bawah
        yang dikirim; data lain milik Personalia tidak pernah muncul di sini.
      required:
      - id
      - organization_id
      - first_name
      - is_active
      properties:
        id:
          type: integer
          format: int64
          description: id personil.
        organization_id:
          type: integer
          format: int64
        first_name:
          type: string
          example: Andi Budi
          description: Nama lengkap dari Personalia (satu nama utuh, tidak dipecah menjadi first/middle/last).
        is_active:
          type: boolean
          description: Selalu true pada login dan refresh. Di `/auth/me` bisa false bila token dibuat sebelum orang itu
            dinonaktifkan.
        nik:
          type: string
          example: '************5678'
          description: NIK yang sudah disamarkan (hanya 4 karakter terakhir terlihat). Tidak dikirim bila orang itu tidak punya NIK.
        email:
          type: string
          example: user01@contoh.com
          description: Tidak dikirim bila kosong.
        phone:
          type: string
          example: 08xxxxxxxxxx
          description: Tidak dikirim bila kosong.
        profile_photo:
          type: string
          description: URL foto profil dari Personalia. Tidak dikirim bila kosong.
    LoginResult:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
          description: 'JWT sesi SiAPP. Kirim sebagai `Authorization: Bearer <token>`.'
        refresh_token:
          type: string
          description: Dipakai di `POST /auth/refresh`; berotasi dan hanya berlaku sekali.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          example: 900
          description: Umur access token dalam detik.
        user:
          $ref: '#/components/schemas/AuthUser'
    RefreshRequest:
      type: object
      description: Field yang tidak dikenal ditolak (422 VALIDATION_ERROR).
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 128
    MeResult:
      type: object
      description: Hanya field di bawah yang dikirim. `web_role` tidak ada untuk petugas lapangan; `team_role` tidak pernah
        dikirim (peran per regu ada di `memberships[].role`).
      required:
      - user
      - organization
      - roles
      - memberships
      - permissions
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        roles:
          type: array
          description: Peran web orang ini. `[]` untuk petugas lapangan; satu isi (`ORG_ADMIN` atau `REGION_ADMIN`) untuk admin.
          items:
            type: string
            enum:
            - ORG_ADMIN
            - REGION_ADMIN
          example:
          - REGION_ADMIN
        organization:
          type: object
          description: Organisasi (tenant) orang ini. Satu organisasi untuk seluruh grup (KPI, IDS, PCD); PT orang itu hanya
            informasi tampilan (D17).
          required:
          - id
          - name
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        web_role:
          type: object
          description: Penugasan peran web (admin) milik SiAPP. Field ini tidak dikirim sama sekali untuk petugas lapangan.
          required:
          - role
          properties:
            role:
              type: string
              enum:
              - ORG_ADMIN
              - REGION_ADMIN
            region_code:
              type: string
              example: OS1
              description: Koordinator wilayah milik REGION_ADMIN. Tidak dikirim untuk ORG_ADMIN.
        memberships:
          type: array
          description: Regu tempat orang ini bertugas hari ini (kosong bila tidak ada).
          items:
            $ref: '#/components/schemas/MeMembership'
        permissions:
          type: array
          description: |
            Hak akses lapangan orang ini hari ini, untuk menampilkan atau menyembunyikan menu. Selalu ada; kosong bila orang
            ini tidak bertugas di regu mana pun (admin web tidak memakai hak lapangan). Tiap kunci muncul sekali, dengan jangkauan
            terluas dari semua keanggotaan yang masih berjalan; kunci tanpa jangkauan tidak dikirim. Hak yang khusus satu bidang
            usaha (mis. `ememo.use`, hanya cleaning) dihitung hanya dari keanggotaan di proyek bidang itu.
            Daftar ini hanya untuk tampilan: setiap fitur memeriksa haknya sendiri di server.
          items:
            $ref: '#/components/schemas/MePermission'
    PermissionKey:
      type: string
      description: Kunci hak akses lapangan; katalog tetap di server (Tabel 8 manual), dilihat di /admin/field-permissions.
      enum:
      - attendance.checkin
      - attendance.qr.display
      - attendance.leave.request
      - attendance.leave.approve
      - attendance.absence.create
      - attendance.absence.view
      - attendance.group.view
      - attendance.swap.create
      - report.create
      - report.create.danru_only
      - report.view
      - instruction.create
      - team.positions.view
      - patrol.scan
      - patrol.approve
      - guard.scan
      - guard.approve
      - cctv.view
      - panic.create
      - panic.view
      - panic.finish
      - asset.report
      - ememo.use
    PermissionModule:
      type: string
      description: Modul pemilik hak, untuk mengelompokkan di layar.
      enum:
      - attendance
      - report
      - instruction
      - team
      - patrol
      - guard
      - cctv
      - panic
      - asset
      - ememo
    PermissionScope:
      type: string
      enum:
      - SELF
      - TEAM
      - PROJECT
      description: |
