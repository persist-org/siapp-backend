                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: REGION_ADMIN di luar wilayahnya (dijawab sebelum database ditanya, juga untuk kode yang tidak ada)
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: Data ini berada di luar wilayah yang Anda kelola.
                      details:
                        reason: ACCESS_OUTSIDE_ADMIN_SCOPE
                    meta:
                      request_id: req_abc123
        '404':
          description: Baris tidak ada, sudah dihapus, atau milik organisasi lain (anti-enumerasi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                REGION_NOT_FOUND:
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Koordinator wilayah tidak ditemukan.
                      details:
                        reason: REGION_NOT_FOUND
                    meta:
                      request_id: req_abc123
        '409':
          description: 'DUPLICATE: kode sudah dipakai.'
          content:
            application/json:
              schema:
