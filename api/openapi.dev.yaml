      - work_date
      - shift_name
      - replacing_personnel_name
      - replacing_check_in_at
      - replacing_check_out_at
      properties:
        work_date:
          type: string
          format: date
        shift_name:
          type: string
        replacing_personnel_name:
          type: string
        replacing_check_in_at:
          type: string
          format: date-time
          nullable: true
        replacing_check_out_at:
          type: string
          format: date-time
          nullable: true
    AttendanceReplacingRow:
      type: object
      description: Satu baris tab "Menggantikan" (GET /attendances/replacing).
      required:
      - work_date
      - shift_name
      - replaced_personnel_name
      - check_in_at
      - check_out_at
      properties:
        work_date:
          type: string
          format: date
        shift_name:
          type: string
        replaced_personnel_name:
          type: string
        check_in_at:
          type: string
          format: date-time
          nullable: true
        check_out_at:
          type: string
          format: date-time
          nullable: true
    MediaPurpose:
      type: string
      enum:
      - PROFILE_PHOTO
      - ATTENDANCE_SELFIE
      - REPORT
      - INSTRUCTION
      - PATROL_SCAN
      - PANIC_REPORT
      - ASSET_REPORT
      - EMEMO
      - LETTERHEAD_LOGO
      - LEAVE_ATTACHMENT
      description: 'Untuk apa foto itu. Fitur yang melampirkannya menolak tujuan yang tidak cocok (MEDIA_PURPOSE_MISMATCH).
        `PROFILE_PHOTO` tidak dapat didaftarkan (422): foto profil berasal dari Persist Personalia.'
    MediaStatus:
      type: string
      enum:
      - PENDING
      - UPLOADED
      description: '`PENDING` sudah didaftarkan tetapi byte belum dikonfirmasi; `UPLOADED` sudah dikonfirmasi dan boleh dilampirkan.'
    CaptureSource:
      type: string
      enum:
      - CAMERA
      - GALLERY
      - UNKNOWN
      description: Dari mana foto berasal. Swafoto absensi hanya boleh `CAMERA` (manual §3.2.3.1).
    MediaCreate:
      type: object
      required:
      - purpose
      - content_type
      - size_bytes
      - capture_source
      properties:
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          description: Jenis lain 422 `MEDIA_TYPE_NOT_ALLOWED`.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Ukuran tepat berkas dalam byte. Lebih dari 10485760 (10 MB) 413 `MEDIA_TOO_LARGE`. Byte yang diunggah
            harus sebesar ini, atau konfirmasi gagal.
        captured_at:
          type: string
          format: date-time
          nullable: true
          description: Waktu foto diambil menurut perangkat (UTC). Paling jauh 5 menit di depan waktu server.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Harus dikirim bersama `longitude`.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Harus dikirim bersama `latitude`.
        capture_source:
          $ref: '#/components/schemas/CaptureSource'
    MediaUpload:
      type: object
      required:
      - id
      - upload_url
      - upload_method
      - upload_headers
      - expires_at
      properties:
        id:
          type: integer
          format: int64
          description: Dipakai di `POST /media/{id}/complete` dan di `media_ids`.
        upload_url:
          type: string
          format: uri
          description: |
            Alamat tujuan byte. Klien memakainya apa adanya dan tidak pernah menyusun alamat sendiri.
            Bisa alamat penyimpanan objek (S3/MinIO) atau `/media/blobs/{token}` di server ini,
            tergantung lingkungan. Token di dalamnya adalah kredensial: jangan dicatat di log.
            Satu URL untuk satu foto: sesudah berhasil, URL yang sama tidak dapat menimpanya dan
            dijawab 412 (oleh penyimpanan mana pun). Bila jawaban unggahan hilang, langsung panggil `complete`.
        upload_method:
          type: string
          enum:
          - PUT
          description: Selalu `PUT`. Ada di respons agar metode lain (misalnya POST bertanda tangan) tidak memerlukan rilis
            aplikasi.
        upload_headers:
          type: object
          additionalProperties:
            type: string
          description: Header yang HARUS dikirim bersama byte (di antaranya `Content-Type`). Header lain tidak boleh ditambahkan.
        expires_at:
          type: string
          format: date-time
          description: Setelah ini `upload_url` ditolak. Minta URL baru lewat `POST /media/{id}/upload-url` (id tetap sama).
    Media:
      type: object
      required:
      - id
      - purpose
      - content_type
      - size_bytes
      - status
      - capture_source
      - created_at
      properties:
        id:
          type: integer
          format: int64
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/MediaStatus'
        captured_at:
          type: string
          format: date-time
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        capture_source:
          $ref: '#/components/schemas/CaptureSource'
        created_at:
          type: string
          format: date-time
    PatrolZone:
      type: object
      description: |
        Zona patroli (`PATROL`) atau pos jaga (`GUARD`) beserta checklist aktifnya (Phase 10.1).
        Proyek dan regu dikenali dengan kode (D19), bukan id. Rahasia QR TIDAK pernah ada di sini:
        isinya hanya ada di gambar QR yang dicetak admin (`GET /admin/zones/{id}/qr`).
      required:
      - id
      - project_code
      - type
      - name
      - min_visit
      - photo_required
      - is_active
      - checklist
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        project_code:
          type: string
          example: 1K-IBMI-S
        team_code:
          type: string
          nullable: true
          example: 1K-IBMI-S1
          description: null = zona untuk seluruh proyek; terisi = zona khusus satu regu.
        type:
          type: string
          enum:
          - PATROL
          - GUARD
          description: Jaga = GUARD (DL-11).
        name:
          type: string
        alias:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        popup_text:
          type: string
          nullable: true
          description: Ditampilkan saat zona dibuka.
        latitude:
          type: number
          format: double
          nullable: true
          example: -6.2
          description: Pusat zona. latitude, longitude dan radius_meters terisi bersama atau kosong bersama.
        longitude:
          type: number
          format: double
          nullable: true
          example: 106.8
        radius_meters:
          type: integer
          nullable: true
          minimum: 1
          description: Zona tanpa geofence (semua null) hanya mengandalkan QR.
        min_visit:
          type: integer
          minimum: 1
          description: Jumlah scan yang dibutuhkan (lingkaran merah).
        start_date:
          type: string
          format: date
          nullable: true
        photo_required:
          type: boolean
          description: Scan butuh minimal satu foto, walau tidak ada butir checklist yang meminta (SQD §4.3).
        is_active:
          type: boolean
        checklist:
          type: array
          description: Butir checklist yang aktif, urut menurut `sort_order`.
          items:
            $ref: '#/components/schemas/PatrolChecklistItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PatrolChecklistOption:
      type: object
      required:
      - value
      - label
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 100
          description: Nilai yang dikirim aplikasi; unik dalam satu butir.
        label:
          type: string
          minLength: 1
          maxLength: 200
    PatrolChecklistItem:
      type: object
      required:
      - id
      - sort_order
      - label
      - answer_type
      - required
      - photo_mode
      - photo_max
      - note_mode
      - attach_when
      properties:
        id:
          type: integer
          format: int64
        sort_order:
          type: integer
        label:
          type: string
          description: Pertanyaan.
        help_text:
          type: string
          nullable: true
          description: Petunjuk di bawah pertanyaan.
        answer_type:
          type: string
          enum:
          - BOOLEAN
          - TEXT
          - NUMBER
          - CHOICE
          description: '`BOOLEAN` = centang ya/tidak; `CHOICE` = pilih satu dari `options`.'
        options:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PatrolChecklistOption'
          description: Hanya untuk `CHOICE`; null untuk tipe lain.
        required:
          type: boolean
          description: Wajib dijawab.
        photo_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
        photo_max:
          type: integer
          minimum: 1
          maximum: 5
        note_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
        attach_when:
          type: string
          enum:
          - ALWAYS
          - ON_NO
          description: '`ON_NO` (hanya `BOOLEAN`): foto atau catatan `REQUIRED` hanya diminta bila jawabannya "tidak".'
    PatrolChecklistItemInput:
      type: object
      description: |
        Butir yang punya `id` diubah, yang tanpa `id` dibuat, dan yang tidak ada di badan permintaan
        dinonaktifkan (tidak pernah dihapus). Urutan array menentukan `sort_order`.
        Kombinasi yang salah (`CHOICE` tanpa opsi, `photo_max` di luar 1 sampai 5, `ON_NO` pada
        tipe selain `BOOLEAN`) ditolak 422 dengan nama field-nya, mis. `checklist[2].options`.
      required:
      - label
      - answer_type
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
          minLength: 1
          maxLength: 500
        help_text:
          type: string
          nullable: true
          maxLength: 1000
        answer_type:
          type: string
          enum:
          - BOOLEAN
          - TEXT
          - NUMBER
          - CHOICE
        options:
          type: array
          nullable: true
          minItems: 2
          maxItems: 50
          items:
            $ref: '#/components/schemas/PatrolChecklistOption'
        required:
          type: boolean
          default: true
        photo_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
          default: NONE
        photo_max:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        note_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
          default: NONE
        attach_when:
          type: string
          enum:
          - ALWAYS
          - ON_NO
          default: ALWAYS
    PatrolChecklistReplace:
      type: object
      required:
      - checklist
      properties:
        checklist:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PatrolChecklistItemInput'
    PatrolZoneInput:
      type: object
      required:
      - project_code
      - type
      - name
      properties:
        project_code:
          type: string
          example: 1K-IBMI-S
        team_code:
          type: string
          nullable: true
          description: Regu dari proyek itu; kosong = seluruh proyek.
        type:
          type: string
          enum:
          - PATROL
          - GUARD
        name:
          type: string
          minLength: 1
          maxLength: 200
        alias:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        popup_text:
          type: string
          nullable: true
          maxLength: 2000
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        radius_meters:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5000
          description: Bawaan 50 bila titik dikirim tanpa radius.
        min_visit:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        start_date:
          type: string
          format: date
          nullable: true
        photo_required:
          type: boolean
          default: true
        is_active:
          type: boolean
          default: true
        checklist:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PatrolChecklistItemInput'
    PatrolZoneUpdate:
      type: object
      description: |
        Hanya field yang dikirim yang berubah; `null` mengosongkan field yang boleh kosong.
        `project_code` tidak bisa diubah. `checklist`, bila dikirim, menggantikan checklist
        (aturannya sama dengan `PUT /admin/zones/{id}/checklist`). Titik dan radius harus tetap
        terisi bersama atau kosong bersama setelah perubahan.
      properties:
        team_code:
          type: string
          nullable: true
        type:
          type: string
          enum:
          - PATROL
          - GUARD
        name:
          type: string
          minLength: 1
          maxLength: 200
        alias:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        popup_text:
          type: string
          nullable: true
          maxLength: 2000
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        radius_meters:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5000
        min_visit:
          type: integer
          minimum: 1
          maximum: 100
        start_date:
          type: string
          format: date
          nullable: true
        photo_required:
          type: boolean
        is_active:
          type: boolean
        checklist:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PatrolChecklistItemInput'
    PatrolScanAnswer:
      type: object
      description: |
        Satu pertanyaan checklist beserta jawabannya, disalin seperti saat scan dibuat (judul,
        tipe, opsi dan aturan lampiran), jadi mengubah checklist tidak menulis ulang riwayat.
      required:
      - item_id
      - label
      - answer_type
      - required
      - photo_mode
      - photo_max
      - note_mode
      - attach_when
      - media_ids
      properties:
        item_id:
          type: integer
          format: int64
        label:
          type: string
        answer_type:
          type: string
          enum:
          - BOOLEAN
          - TEXT
          - NUMBER
          - CHOICE
        options:
          type: array
          items:
            $ref: '#/components/schemas/PatrolChecklistOption'
        required:
          type: boolean
        photo_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
        photo_max:
          type: integer
        note_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
        attach_when:
          type: string
          enum:
          - ALWAYS
          - ON_NO
        value:
          nullable: true
          description: Boolean, teks, angka atau nilai opsi menurut `answer_type`; null bila pertanyaan opsional tidak dijawab.
        note:
          type: string
          nullable: true
        media_ids:
          type: array
          items:
            type: integer
            format: int64
    PatrolScan:
      type: object
      description: Satu kunjungan ke zona. `team_code` dan `work_date` ditentukan server dari shift pemindai, bukan dikirim
        aplikasi.
      required:
      - id
      - local_id
      - zone_id
      - zone_type
      - personnel_id
      - team_code
      - project_code
      - occurred_at
      - received_at
      - work_date
      - latitude
      - longitude
      - accuracy_meters
      - subject
      - answers
      - status
      - submitted_offline
      - created_at
      properties:
        id:
          type: integer
          format: int64
        local_id:
          type: string
          format: uuid
        zone_id:
          type: integer
          format: int64
        zone_type:
          type: string
          enum:
          - PATROL
          - GUARD
        personnel_id:
          type: integer
          format: int64
        team_code:
          type: string
          example: 1K-IBMI-S1
        project_code:
          type: string
          example: 1K-IBMI-S
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        work_date:
          type: string
          format: date
          description: Tanggal mulai shift (shift malam setelah tengah malam tetap tanggal kemarin).
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy_meters:
          type: number
          format: double
        distance_meters:
