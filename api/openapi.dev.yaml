              type: integer
              format: int64
            name:
              type: string
            position:
              type: string
              nullable: true
        overlaps_with:
          type: array
          description: Anggota regu lain dengan izin DISETUJUI yang beririsan hari. Hanya untuk yang memutuskan.
          items:
