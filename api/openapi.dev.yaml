      summary: Ajukan izin, cuti atau sakit
      description: |-
        Satu transaksi, urutan seperti Personalia: orang dikunci, regu dan DANRU ditentukan, tumpang tindih, hari kerja, kuota, nomor, baris, foto, lalu pemotongan saldo (cuti tahunan dipotong SAAT diajukan dan dikembalikan bila ditolak atau dibatalkan). Perlu `attendance.leave.request`. Idempoten.
        - 403: bukan anggota regu yang disebut pada `start_date`. - 409 `LEAVE_OVERLAP`: bertabrakan dengan pengajuan lain yang masih berlaku. - 422 `LEAVE_SCHEDULE_MISSING` (ada tanggal tanpa jadwal; `details.dates`),
