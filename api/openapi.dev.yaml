      description: |
        `urgency` WAJIB (LOW, NORMAL, HIGH) dan tidak boleh dikosongkan saat ubah. Nama dirapikan dulu: deretan spasi/tab/baris baru jadi satu spasi, ujungnya dipotong; paling banyak 100 karakter setelah itu (body yang lebih dari 500 karakter ditolak lebih awal), tanpa karakter kontrol. Nama harus unik per jenis dan per lini bisnis (tanpa membedakan huruf besar/kecil), termasuk terhadap kategori nonaktif; `business_lines` kosong = semua lini, jadi bentrok dengan nama yang sama di lini mana pun. `business_lines` maksimal 2 nilai, duplikat dibuang. Body: satu objek JSON, maks 1 MB, field tidak dikenal 422. Mengubah kategori dari satu jenis ke jenis lain tidak mungkin.
      x-roles:
      - ORG_ADMIN
