                unauthenticated:
                  summary: Tanpa token
                  value:
                    success: false
                    error:
                      code: UNAUTHENTICATED
                      message: Token tidak ditemukan.
                    meta:
                      request_id: req_abc123
                expired:
                  summary: Token kedaluwarsa
                  value:
                    success: false
                    error:
                      code: TOKEN_EXPIRED
                      message: Token kedaluwarsa.
                    meta:
                      request_id: req_abc123
        '403':
          description: 'FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): REGION_ADMIN menyentuh
            regu di wilayah lain.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: Regu di wilayah lain, ada ataupun tidak
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: Data ini berada di luar wilayah yang Anda kelola.
                      details:
                        reason: ACCESS_OUTSIDE_ADMIN_SCOPE
                    meta:
                      request_id: req_abc123
        '404':
          description: Regu tidak ada, sudah dihapus, atau milik organisasi lain.
          content:
