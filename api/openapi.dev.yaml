  /admin/branches:
    get:
      operationId: getAdminBranches
      tags:
      - Organization
      summary: Daftar kantor cabang
      description: |
        ORG_ADMIN melihat semuanya. REGION_ADMIN hanya melihat wilayahnya sendiri (nomor di depan kode). Urutan: nomor lalu huruf (1K, 1P, 2K). `q` mencocokkan kode dan deskripsi.
      x-roles:
      - ORG_ADMIN
      - REGION_ADMIN
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/QParam'
      - $ref: '#/components/parameters/IsActiveParam'
      - $ref: '#/components/parameters/RegionCodeQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Branch'
        '400':
          description: 'BAD_REQUEST: query string mengandung karakter NUL (%00), yang tidak dapat disimpan di database.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nul:
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Query string tidak boleh berisi karakter NUL.
                    meta:
                      request_id: req_abc123
        '401':
          description: 'UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value:
                    success: false
                    error:
                      code: UNAUTHENTICATED
                      message: Token tidak ditemukan.
                    meta:
                      request_id: req_abc123
                expired:
                  summary: Token kedaluwarsa
                  value:
                    success: false
                    error:
                      code: TOKEN_EXPIRED
                      message: Token kedaluwarsa.
                    meta:
                      request_id: req_abc123
        '403':
          description: Tanpa web role (FORBIDDEN), atau di luar wewenang (ROLE_DENIED / SCOPE_DENIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR: parameter query tidak valid (is_active bukan true/false, page atau limit di luar
            batas, q lebih dari 100 karakter, business_line di luar enum).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                badIsActive:
                  summary: is_active=maybe
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
                      errors:
                      - field: is_active
                        code: INVALID
                        message: Harus true atau false.
                    meta:
                      request_id: req_abc123
                badLimit:
                  summary: limit=1000
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
                      errors:
                      - field: limit
                        code: INVALID
                        message: Maksimum 100.
                    meta:
                      request_id: req_abc123
    post:
      operationId: postAdminBranches
      tags:
      - Organization
      summary: Buat kantor cabang
      description: |
        Server membentuk kode dari `region_code` dan `company_letter` (OS1 + K = 1K).
        REGION_ADMIN hanya dapat membuat di wilayahnya sendiri (403 SCOPE_DENIED).
      x-roles:
      - ORG_ADMIN
      - REGION_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/Branch'
        '400':
          description: 'BAD_REQUEST: body kosong, bukan JSON yang valid, lebih dari satu nilai JSON, atau berisi karakter
            NUL (\u0000).'
