      description: Untuk pemiliknya, atau siapa pun yang izin `attendance.group.view` / `attendance.absence.view`-nya menjangkau
        regu catatan itu pada tanggal kerjanya (DANRU regu itu). Selain itu 404, sama dengan catatan yang tidak ada. URL selfie
        bertanda tangan dan kedaluwarsa; jangan disimpan.
      responses:
        '200':
          description: OK
