        occurred_at:
          type: string
          format: date-time
          description: Saat scan terjadi di perangkat. Maksimal 5 menit di depan dan 7 hari ke belakang.
        qr_payload:
          type: string
          example: PERSIST-ZONE:1:900101:42:abcdefghijklmnopqrstuv
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy_meters:
          type: number
          format: double
