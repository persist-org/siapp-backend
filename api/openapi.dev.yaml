            meta:
              request_id: req_abc123
    PatrolZoneNotFound:
      description: '404 `NOT_FOUND`, `details.reason` = `ZONE_NOT_FOUND`: zona tidak ada, sudah dihapus, milik organisasi lain, atau id bukan angka positif.'
      content:
