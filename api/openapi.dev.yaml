                      message: Personil bertugas di proyek dengan zona waktu berbeda pada tanggal tersebut.
                      details:
                        reason: SCHEDULE_TIMEZONE_AMBIGUOUS
                    meta:
                      request_id: req_abc123
        '413':
          description: 'PAYLOAD_TOO_LARGE: body lebih dari 1 MB.'
