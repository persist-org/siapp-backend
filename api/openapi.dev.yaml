      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Night Shift
          description: WAJIB. Unik di organisasi (tanpa membedakan huruf besar/kecil) di antara shift yang belum dihapus;
            409 SHIFT_NAME_TAKEN.
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '22:00'
          description: 'WAJIB untuk shift kerja, HH:mm. Shift OFF: tidak boleh dikirim (422 SHIFT_INVALID_TIME).'
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 06:00
          description: 'WAJIB untuk shift kerja, HH:mm, berbeda dari start_time. Harus setelah start_time bila overnight false,
            dan sebelum start_time bila overnight true (422 SHIFT_INVALID_TIME). Shift OFF: tidak boleh dikirim.'
        is_off:
          type: boolean
          default: false
          description: Opsional. true = hari libur tanpa jam. Tidak dapat diubah setelah dibuat.
        overnight:
          type: boolean
          default: false
          description: 'Opsional. true = shift berakhir keesokan harinya (mis. 22:00-06:00); wajib true agar end_time boleh
            sebelum start_time. Shift OFF: tidak boleh dikirim.'
        tolerance_minutes:
          type: integer
          minimum: 0
          maximum: 720
          default: 15
          description: 'Opsional. Bawaan 15; harus lebih pendek dari durasi shift (422 tolerance_minutes). Shift OFF: tidak
            boleh dikirim (disimpan 0).'
        is_active:
          type: boolean
          default: true
          description: Opsional. Shift nonaktif tidak dapat dipilih untuk shift group atau jadwal baru.
