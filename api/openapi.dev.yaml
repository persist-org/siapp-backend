        Hanya field yang dikirim yang berubah; `null` mengosongkan field yang boleh kosong.
        `project_code` hanya diterima bila sama dengan yang sekarang (proyek checkpoint tidak bisa
        diubah; selain itu 422). Checklist diganti lewat `PUT /admin/checkpoints/{id}/actions`.
        Titik dan radius harus tetap terisi bersama atau kosong bersama setelah perubahan; titik yang dikosongkan
        membawa radiusnya.
