          type: string
          format: date-time
          nullable: true
    AttendanceReplacingRow:
      type: object
      description: Satu baris tab "Menggantikan" (GET /attendances/replacing).
      required:
      - work_date
      - shift_name
      - replaced_personnel_name
      - check_in_at
      - check_out_at
      properties:
        work_date:
          type: string
          format: date
        shift_name:
          type: string
        replaced_personnel_name:
          type: string
        check_in_at:
          type: string
          format: date-time
          nullable: true
        check_out_at:
          type: string
          format: date-time
          nullable: true
    MediaPurpose:
      type: string
      enum:
      - PROFILE_PHOTO
      - ATTENDANCE_SELFIE
      - REPORT
      - INSTRUCTION
      - PATROL_SCAN
      - PANIC_REPORT
      - ASSET_REPORT
      - EMEMO
      - LETTERHEAD_LOGO
      - LEAVE_ATTACHMENT
      description: 'Untuk apa foto itu. Fitur yang melampirkannya menolak tujuan yang tidak cocok (MEDIA_PURPOSE_MISMATCH).
        `PROFILE_PHOTO` tidak dapat didaftarkan (422): foto profil berasal dari Persist Personalia.'
    MediaStatus:
      type: string
      enum:
      - PENDING
      - UPLOADED
      description: '`PENDING` sudah didaftarkan tetapi byte belum dikonfirmasi; `UPLOADED` sudah dikonfirmasi dan boleh dilampirkan.'
    CaptureSource:
      type: string
      enum:
      - CAMERA
      - GALLERY
      - UNKNOWN
      description: Dari mana foto berasal. Swafoto absensi hanya boleh `CAMERA` (manual §3.2.3.1).
    MediaCreate:
      type: object
      description: Field yang tidak dikenal ditolak (422 VALIDATION_ERROR).
      additionalProperties: false
      required:
      - purpose
      - content_type
      - size_bytes
      - capture_source
      properties:
        purpose:
          type: string
          enum:
          - ATTENDANCE_SELFIE
          - REPORT
          - INSTRUCTION
          - PATROL_SCAN
          - PANIC_REPORT
          - ASSET_REPORT
          - EMEMO
          - LETTERHEAD_LOGO
          - LEAVE_ATTACHMENT
          description: Untuk apa foto itu. `PROFILE_PHOTO` tidak dapat didaftarkan (422 `INVALID`).
        content_type:
          type: string
          minLength: 1
          example: image/jpeg
          description: Hanya `image/jpeg`, `image/png` atau `image/webp` (huruf besar/kecil dan parameter seperti `; q=1`
            diabaikan). Jenis lain 422 UNPROCESSABLE `MEDIA_TYPE_NOT_ALLOWED`; kosong / hanya spasi 422 `REQUIRED`.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Ukuran tepat berkas dalam byte. Lebih dari 10485760 (10 MB) 413 `MEDIA_TOO_LARGE`. Byte yang diunggah
            harus sebesar ini, atau konfirmasi gagal.
        captured_at:
          type: string
          format: date-time
          nullable: true
          description: Waktu foto diambil menurut perangkat (UTC). Lebih dari 5 menit di depan waktu server → 422 `INVALID`.
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
          description: Harus dikirim bersama `longitude` (salah satu saja → 422 `INVALID` pada `latitude`).
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
          description: Harus dikirim bersama `latitude`.
        capture_source:
          $ref: '#/components/schemas/CaptureSource'
    MediaUpload:
      type: object
      required:
      - id
      - upload_url
      - upload_method
      - upload_headers
      - expires_at
      properties:
        id:
          type: integer
          format: int64
          description: Dipakai di `POST /media/{id}/complete` dan di `media_ids`.
        upload_url:
          type: string
          format: uri
          description: |
            Alamat tujuan byte. Klien memakainya apa adanya dan tidak pernah menyusun alamat sendiri.
            Bisa alamat penyimpanan objek (S3/MinIO) atau `/media/blobs/{token}` di server ini,
            tergantung lingkungan. Token di dalamnya adalah kredensial: jangan dicatat di log.
            Satu URL untuk satu foto: sesudah berhasil, URL yang sama tidak dapat menimpanya dan
            dijawab 412 (oleh penyimpanan mana pun). Bila jawaban unggahan hilang, langsung panggil `complete`.
        upload_method:
          type: string
          enum:
          - PUT
          description: Selalu `PUT`. Ada di respons agar metode lain (misalnya POST bertanda tangan) tidak memerlukan rilis
            aplikasi.
        upload_headers:
          type: object
          additionalProperties:
            type: string
          description: Header yang HARUS dikirim bersama byte (di antaranya `Content-Type`). Header lain tidak boleh ditambahkan.
        expires_at:
          type: string
          format: date-time
          description: Setelah ini `upload_url` ditolak. Minta URL baru lewat `POST /media/{id}/upload-url` (id tetap sama).
    Media:
      type: object
      required:
      - id
      - purpose
      - content_type
      - size_bytes
      - status
      - capture_source
      - created_at
      properties:
        id:
          type: integer
          format: int64
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/MediaStatus'
        captured_at:
          type: string
          format: date-time
          description: Tidak dikirim bila tidak didaftarkan.
        latitude:
          type: number
          format: double
          description: Tidak dikirim bila tidak didaftarkan.
        longitude:
          type: number
          format: double
          description: Tidak dikirim bila tidak didaftarkan.
        capture_source:
          $ref: '#/components/schemas/CaptureSource'
        created_at:
          type: string
          format: date-time
    PatrolCheckpoint:
      type: object
      description: |
        Checkpoint: tempat yang di-scan petugas, dengan QR dan checklist sendiri (Phase 10.7). Satu checkpoint bisa
        ada di banyak zona (`zones`, dengan urutannya di tiap zona). Proyek dikenali dengan kode (D19). Rahasia QR
        TIDAK pernah ada di sini: isinya hanya ada di gambar QR yang dicetak admin
        (`GET /admin/checkpoints/{id}/qr`). Field opsional yang kosong (`description`, titik, `radius_meters`)
        tidak disertakan dalam respons, bukan `null`; `actions` dan `zones` selalu array.
      required:
      - id
      - project_code
      - name
      - is_active
      - qr_rotated_at
      - actions
      - zones
      - created_at
      - updated_at
      properties:
