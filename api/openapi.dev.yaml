        '409':
          description: 'DUPLICATE (CATEGORY_NAME_TAKEN): nama sudah dipakai kategori lain sejenis di lini bisnis yang beririsan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameTaken:
                  value:
                    success: false
                    error:
                      code: DUPLICATE
                      message: 'Nama kategori sudah dipakai untuk lini bisnis yang sama (termasuk kategori nonaktif).'
                      details:
                        reason: CATEGORY_NAME_TAKEN
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR: field body tidak valid (name, urgency, business_lines, sort_order, is_active, field tidak dikenal).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameMissing:
                  summary: 'name tidak dikirim'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
