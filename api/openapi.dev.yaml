          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolCheckpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolCheckpointNotFound'
  /attendances/qr/check-in:
    post:
      operationId: postAttendancesQrCheckIn
      tags:
      - Attendance
      summary: Absen datang via scan QR
      description: 'Memindai kode yang ditampilkan DANRU. Aturan shift, izin `attendance.checkin`, hari kerja sebelumnya,
        keterlambatan, dan check-in ganda sama dengan absen selfie; tanpa foto. Koordinat opsional: bila dikirim, diukur terhadap
        geofence proyek seperti absen selfie (422 `ATTENDANCE_OUTSIDE_AREA` untuk geofence ketat). Kode salah/palsu/organisasi
        lain/kode arah pulang: 422 `ATTENDANCE_QR_INVALID`; kode lewat semenit: 422 `ATTENDANCE_QR_EXPIRED`; kode regu lain:
        422 `ATTENDANCE_QR_WRONG_TEAM`. Kunci idempotensi yang sama dengan token berbeda adalah 409 `IDEMPOTENCY_KEY_REUSED`:
        pindai ulang dengan kunci baru. Tanpa `ATTENDANCE_QR_SECRET`: 503 `ATTENDANCE_QR_UNAVAILABLE` (absen selfie tetap
        berjalan). Tanpa izin `attendance.checkin`: 403 `PERMISSION_DENIED`. `shift_ref` bukan shift yang bisa diabsen sekarang:
        422 `ATTENDANCE_SHIFT_NOT_ACTIVE`. Sudah absen datang: 409 `ATTENDANCE_ALREADY_CHECKED_IN`; shift sudah tercatat izin/mangkir:
        422 `ATTENDANCE_NOT_ALLOWED`; hari kerja sebelumnya belum beres: 422 `ATTENDANCE_PREVIOUS_NOT_CHECKED_IN` / `ATTENDANCE_PREVIOUS_NOT_CHECKED_OUT`;
        koordinat dikirim tetapi proyek tanpa koordinat: 422 `PROJECT_NOT_CONFIGURED`. Body: field tak dikenal atau salah
        tipe 422 `VALIDATION_ERROR`; bukan JSON 400; lebih dari 1 MB 413.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceQrInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/Attendance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Metode QR belum dinyalakan (ATTENDANCE_QR_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
