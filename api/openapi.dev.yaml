      description: 'DANRU regu itu hari ini. Regu tanpa DANRU, atau pemanggil sendiri DANRU-nya: 404 `LEAVE_NO_APPROVER` (pengajuan
        tetap bisa dibuat; admin yang memutuskan). `team_code` boleh kosong bila pemanggil hanya bertugas di satu regu; bertugas
        di lebih dari satu regu dan kosong: 422 `VALIDATION_ERROR`; bukan regu tempat ia bertugas hari ini (atau tidak bertugas
        di regu mana pun): 403 `PERMISSION_DENIED`. Perlu `attendance.leave.request` (403 `PERMISSION_DENIED`).'
      parameters:
      - name: team_code
        in: query
