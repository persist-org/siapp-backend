      description: |
        Peran web (admin) adalah data SiAPP sendiri: Personalia menyatakan siapa seseorang,
        SiAPP menyatakan apa yang boleh dilakukannya di sini. Menggantikan /admin/web-users
        yang dimiliki Personalia (D5). REGION_ADMIN: 403 `ROLE_DENIED` (`ACCESS_ORG_ADMIN_ONLY`). Parameter `q`,
        `date`, `month` dan `category_id` tidak dipakai, tetapi bila dikirim tetap divalidasi (422).
      x-roles:
      - ORG_ADMIN
