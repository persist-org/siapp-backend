          maxLength: 2000
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        radius_meters:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000
        is_active:
          type: boolean
    PatrolZone:
      type: object
      description: |
        Zona patroli (`PATROL`) atau pos jaga (`GUARD`) beserta checklist aktifnya (Phase 10.1).
        Proyek dan regu dikenali dengan kode (D19), bukan id. Rahasia QR TIDAK pernah ada di sini:
        isinya hanya ada di gambar QR yang dicetak admin (`GET /admin/zones/{id}/qr`).
        Field opsional yang kosong (`team_code`, `alias`, `description`, `popup_text`, titik, `radius_meters`,
        `start_date`) tidak disertakan dalam respons, bukan `null`.
      required:
      - id
      - project_code
      - type
      - name
      - min_visit
      - photo_required
      - is_active
      - checklist
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        project_code:
          type: string
          example: 1K-IBMI-S
        team_code:
          type: string
          nullable: true
          example: 1K-IBMI-S1
          description: null = zona untuk seluruh proyek; terisi = zona khusus satu regu.
        type:
          type: string
          enum:
          - PATROL
          - GUARD
          description: Jaga = GUARD (DL-11).
        name:
          type: string
        alias:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        popup_text:
          type: string
          nullable: true
          description: Ditampilkan saat zona dibuka.
        latitude:
          type: number
          format: double
          nullable: true
          example: -6.2
          description: Pusat zona. latitude, longitude dan radius_meters terisi bersama atau kosong bersama.
        longitude:
          type: number
          format: double
          nullable: true
          example: 106.8
        radius_meters:
          type: integer
          nullable: true
          minimum: 1
          description: Zona tanpa geofence (semua null) hanya mengandalkan QR.
        min_visit:
          type: integer
          minimum: 1
          description: Jumlah scan yang dibutuhkan (lingkaran merah).
        start_date:
          type: string
          format: date
          nullable: true
        photo_required:
          type: boolean
          description: Scan butuh minimal satu foto, walau tidak ada butir checklist yang meminta (SQD §4.3).
        is_active:
          type: boolean
        checklist:
          type: array
          description: Butir checklist yang aktif, urut menurut `sort_order`.
          items:
            $ref: '#/components/schemas/PatrolChecklistItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PatrolChecklistOption:
      type: object
      required:
      - value
      - label
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 100
          description: Nilai yang dikirim aplikasi; unik dalam satu butir.
        label:
          type: string
          minLength: 1
          maxLength: 200
    PatrolChecklistItem:
      type: object
      description: Butir checklist aktif. `help_text` dan `options` yang kosong tidak disertakan dalam respons, bukan `null`.
