        phone:
          type: string
        is_default:
          type: boolean
    Attendance:
      type: object
      description: 'Satu instans shift seseorang di satu regu (orang × regu × tanggal kerja × shift). Ini bukti yang ditangkap
        SiAPP, bukan catatan resmi: catatan resminya di Persist Personel, yang menerima tiap perubahan lewat outbox (`personel_sync_status`).'
      required:
      - id
      - personnel_id
      - team_code
      - project_code
      - work_date
      - shift_id
      - shift_starts_at
      - shift_ends_at
      - timezone
      - status
      - late_minutes
      - check_out_update_count
      - personel_sync_status
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
        personnel_id:
          type: integer
          format: int64
        team_code:
          type: string
          example: 1K-IBMI-S1
        project_code:
          type: string
          example: 1K-IBMI-S
        work_date:
          type: string
          format: date
          description: Tanggal shift DIMULAI, di zona waktu proyek.
        shift_id:
          type: integer
          format: int64
        shift_starts_at:
          type: string
          format: date-time
          description: 'Salinan jam shift saat absen: tidak ikut berubah bila shift/proyek diedit kemudian.'
        shift_ends_at:
          type: string
          format: date-time
        timezone:
          type: string
          example: Asia/Jakarta
        status:
          type: string
          enum:
          - PRESENT
          - LEAVE
          - ABSENT
        check_in_at:
          type: string
          format: date-time
          nullable: true
        check_in_method:
          type: string
          enum:
          - QR
          - SELFIE
          - GROUP
          - FORCE
          nullable: true
        check_in_distance_meters:
          type: integer
          nullable: true
          description: Jarak ke titik proyek; null bila tidak ada fix GPS.
        check_in_within_area:
          type: boolean
          nullable: true
        late_minutes:
          type: integer
          minimum: 0
          description: Menit keterlambatan absen datang, dibulatkan ke bawah; 0 bila tepat waktu. Absen dalam toleransi shift
            dihitung tepat waktu; lewat dari itu, keterlambatan dihitung dari jam mulai shift. Disimpan saat absen, tidak
            berubah bila toleransi diedit kemudian.
        check_out_at:
          type: string
          format: date-time
          nullable: true
        check_out_method:
          type: string
          enum:
          - QR
          - SELFIE
          - GROUP
          - FORCE
          nullable: true
        check_out_distance_meters:
          type: integer
          nullable: true
        check_out_within_area:
          type: boolean
          nullable: true
        check_out_update_count:
          type: integer
          description: Berapa kali jam pulang diperbarui.
        leave_request_id:
          type: integer
          format: int64
          nullable: true
          description: Pengajuan izin/cuti/sakit yang membuat catatan LEAVE ini (GET /permissions/{id}); null untuk catatan
            lain.
        personel_sync_status:
          type: string
          enum:
          - PENDING
          - SYNCED
          - FAILED
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
