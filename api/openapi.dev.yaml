          - DECLINED
        patrol_id:
          type: integer
          format: int64
          nullable: true
          description: Patroli yang sedang berjalan saat scan (Phase 10.4); diisi server.
        submitted_offline:
          type: boolean
        created_at:
          type: string
          format: date-time
    PatrolScanAnswerInput:
      type: object
