                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
                      errors:
                      - field: region_code
                        code: INVALID
                        message: Harus berformat OS diikuti angka tanpa nol di depan, misalnya OS1.
                    meta:
                      request_id: req_abc123
                blankDescription:
                  summary: Deskripsi kosong atau hanya spasi
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
