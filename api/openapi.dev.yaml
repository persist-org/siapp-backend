  /admin/stakeholder-types:
    get:
      operationId: getAdminStakeholderTypes
      tags:
      - Masters
      summary: 'Daftar tipe stakeholder'
      description: |
        Hanya ORG_ADMIN. Urutan mengikuti `sort_order`, lalu nama. `q` mencocokkan nama atau kode. `is_active` memfilter status. Tipe yang dihapus tidak muncul.
      x-roles:
      - ORG_ADMIN
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/QParam'
      - $ref: '#/components/parameters/IsActiveParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StakeholderType'
        '400':
          $ref: '#/components/responses/MdBadRequestQuery'
        '401':
          $ref: '#/components/responses/MdUnauthorized'
        '403':
          $ref: '#/components/responses/MdAdminForbidden'
        '422':
          $ref: '#/components/responses/MdListValidation'
    post:
      operationId: postAdminStakeholderTypes
      tags:
      - Masters
      summary: 'Buat tipe stakeholder'
      description: |
        Nama dirapikan dulu: deretan spasi/tab/baris baru jadi satu spasi, ujungnya dipotong; paling banyak 100 karakter setelah itu (body yang lebih dari 500 karakter ditolak lebih awal), tanpa karakter kontrol. Nama unik di organisasi (tanpa membedakan huruf besar/kecil), termasuk tipe nonaktif. `code` opsional: bila kosong dibuat dari `name` (huruf besar, selain huruf latin/angka jadi satu garis bawah, misalnya "Kebakaran Hutan" jadi KEBAKARAN_HUTAN; diawali "P_" bila tidak diawali huruf atau kurang dari 2 karakter) dan diberi akhiran _2, _3 bila sudah terpakai; bila dikirim, diubah ke huruf besar dan harus cocok `^[A-Z][A-Z0-9_]{1,29}$`, dan yang sudah dipakai (juga oleh baris yang dihapus) 409. Kode tidak dapat diubah sesudahnya (PATCH tanpa field `code`, mengirimnya 422). `default_phone` (opsional) dinormalisasi ke E.164: "0812…" jadi "+62812…", spasi/strip/titik/kurung dibuang; nomor darurat nasional 110, 112, 113, 115, 118, 119, 123, 129 disimpan apa adanya; string kosong = tanpa nomor.
      x-roles:
      - ORG_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StakeholderTypeCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/StakeholderType'
        '400':
          $ref: '#/components/responses/MdBadRequestBody'
        '401':
          $ref: '#/components/responses/MdUnauthorized'
        '403':
          $ref: '#/components/responses/MdAdminForbidden'
        '409':
          description: 'DUPLICATE: STAKEHOLDER_TYPE_NAME_TAKEN atau STAKEHOLDER_TYPE_CODE_TAKEN (kode yang dikirim sudah dipakai, juga oleh tipe terhapus).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameTaken:
                  value:
                    success: false
                    error:
                      code: DUPLICATE
                      message: 'Nama tipe stakeholder sudah dipakai (termasuk tipe nonaktif).'
                      details:
                        reason: STAKEHOLDER_TYPE_NAME_TAKEN
                    meta:
                      request_id: req_abc123
                codeTaken:
                  value:
                    success: false
                    error:
                      code: DUPLICATE
                      message: 'Kode tipe stakeholder sudah dipakai.'
                      details:
                        reason: STAKEHOLDER_TYPE_CODE_TAKEN
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR: field body tidak valid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameMissing:
                  summary: 'name tidak dikirim'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: name
                        code: REQUIRED
                        message: 'Wajib diisi.'
                    meta:
                      request_id: req_abc123
                nameBlank:
                  summary: 'name hanya spasi'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: name
                        code: REQUIRED
                        message: 'Tidak boleh kosong.'
                    meta:
                      request_id: req_abc123
                nameTooLong:
                  summary: 'name lebih dari 100 karakter setelah spasi dirapikan'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: name
                        code: INVALID
                        message: 'Maksimum 100 karakter.'
                    meta:
                      request_id: req_abc123
                codeBad:
                  summary: 'code tidak sesuai pola'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: code
                        code: INVALID
                        message: 'Harus 2 sampai 30 karakter: huruf besar, angka atau garis bawah, diawali huruf.'
                    meta:
                      request_id: req_abc123
                codeUnderivable:
                  summary: 'code kosong dan tidak bisa dibuat dari name'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: code
                        code: INVALID
                        message: 'Kode tidak bisa dibuat dari nama ini. Isi kode secara manual.'
                    meta:
                      request_id: req_abc123
                codeTooLong:
                  summary: 'code lebih dari 30 karakter'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: code
                        code: TOO_LONG
                        message: 'Terlalu panjang (maksimum 30).'
                    meta:
                      request_id: req_abc123
                phoneBad:
                  summary: 'Nomor telepon tidak valid'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: default_phone
                        code: INVALID
                        message: 'Harus nomor telepon internasional (+62812…), nomor lokal (0812…) atau nomor darurat nasional (110, 113, …).'
                    meta:
                      request_id: req_abc123
                sortOrder:
