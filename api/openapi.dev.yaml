    post:
      operationId: postAdminLetterheads
      tags:
      - Masters
      summary: 'Buat kop surat'
      description: |
        Nama dirapikan dulu: deretan spasi/tab/baris baru jadi satu spasi, ujungnya dipotong; paling banyak 100 karakter setelah itu (body yang lebih dari 500 karakter ditolak lebih awal), tanpa karakter kontrol. Nama unik (tanpa membedakan huruf besar/kecil). `header_text`/`footer_text`: baris dirapikan (CRLF jadi LF, spasi di ujung baris dan baris kosong di ujung dibuang), maks 2000 karakter, tanpa karakter kontrol selain baris baru dan tab; teks kosong = tanpa teks. `logo_media_id`: foto milik pemanggil, status UPLOADED, purpose LETTERHEAD_LOGO, belum dilampirkan ke catatan lain; kegagalannya memakai galat media (404 MEDIA_NOT_FOUND, 409 MEDIA_NOT_UPLOADED / MEDIA_ALREADY_ATTACHED, 422 MEDIA_PURPOSE_MISMATCH). `logo_url` di respons adalah URL bertanda tangan berumur pendek (null bila tanpa logo). `is_default`: bila tidak dikirim, kop pertama organisasi otomatis menjadi default; `true` menggantikan default lama (paling banyak satu default).
      x-roles:
      - ORG_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
