          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolCheckpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolCheckpointNotFound'
        '409':
          description: '`DUPLICATE` `CHECKPOINT_NAME_TAKEN`: checkpoint lain di proyek ini sudah memakai nama itu.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'VALIDATION_ERROR: nilai di luar batas, titik tanpa pasangan atau radius tanpa titik, `project_code` berbeda.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    delete:
      operationId: deleteAdminCheckpointsById
      tags:
      - Patrol
      summary: Hapus/non-aktifkan PatrolCheckpoint
      description: |
        Checkpoint tetap ada di tabel (scan menunjuk ke sana) tetapi nonaktif, namanya bebas dipakai lagi, dan ia
        keluar dari semua zona. Urutan checkpoint lain di zona-zona itu dirapatkan kembali (1..n, tanpa celah);
        checkpoint nonaktif yang masih ada di zona itu tetap memegang tempatnya.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolCheckpointNotFound'
  /admin/checkpoints/{id}/actions:
    parameters:
    - $ref: '#/components/parameters/CheckpointIdPath'
    put:
      operationId: putAdminCheckpointsByIdActions
      tags:
      - Patrol
      summary: Ganti checklist checkpoint
      description: |
        Mengganti checklist saja. Aksi ber-`id` diubah, tanpa `id` dibuat, yang tidak dikirim dinonaktifkan (tidak
        pernah dihapus). Mengubah aksi tidak mengubah scan yang sudah dikirim (scan menyimpan salinan aksi).
        Tidak ada perubahan bila ada satu saja yang salah.
      requestBody:
