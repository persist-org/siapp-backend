  /media:
    post:
      operationId: postMedia
      tags:
      - Media
      summary: Daftarkan unggahan foto (offline-capable)
      description: |
        Langkah pertama dari tiga: daftarkan, `PUT` byte ke `upload_url`, lalu `POST /media/{id}/complete`.
        Siapa pun yang sudah masuk boleh mendaftarkan; fitur yang melampirkan foto menilai haknya
        atas catatannya sendiri. `Idempotency-Key` WAJIB: antrean media offline mengulang permintaan
        ini, dan ulangan dengan kunci yang sama mengembalikan id dan `upload_url` yang sama.
        `upload_url` hanya berlaku 30 menit (`expires_at`), sedangkan ulangan tetap menjawab URL
        yang sama: antrean yang mengulang setelah itu meminta URL baru lewat
        `POST /media/{id}/upload-url` (id tetap), bukan mendaftarkan ulang.

        Media yang tidak pernah dikonfirmasi atau tidak pernah dilampirkan dihapus otomatis
        sesudah 24 jam. Ulangan dengan `Idempotency-Key` yang sama tetap menjawab id lama walau
        barisnya sudah dihapus: `upload-url` dan `complete` lalu menjawab 404 `MEDIA_NOT_FOUND`
        (atau `upload-url` menjawab 409 `MEDIA_EXPIRED` menjelang batas itu). Antrean yang
        menemukan salah satunya mendaftarkan ulang dengan `Idempotency-Key` baru.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID stabil seumur item antrean. Tanpa header ini 422.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreate'
      responses:
        '201':
          description: 'Terdaftar. Ulangan dengan Idempotency-Key dan body yang sama dijawab 201 juga, berisi respons pertama
            apa adanya, dengan header `Idempotent-Replayed: true`.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/MediaUpload'
        '400':
          description: 'BAD_REQUEST: body kosong, bukan JSON yang valid, lebih dari satu objek, atau memuat karakter NUL.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 'PAYLOAD_TOO_LARGE: body JSON lebih dari 1 MB, atau `size_bytes` lebih dari 10 MB (reason `MEDIA_TOO_LARGE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tooLarge:
                  value:
                    success: false
                    error:
                      code: PAYLOAD_TOO_LARGE
                      message: Ukuran foto melebihi 10 MB.
                      details:
                        reason: MEDIA_TOO_LARGE
                    meta:
                      request_id: req_abc123
        '422':
          description: VALIDATION_ERROR (field salah, atau `Idempotency-Key` tidak ada) atau UNPROCESSABLE dengan reason `MEDIA_TYPE_NOT_ALLOWED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /media/{id}/upload-url:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postMediaUploadUrl
      tags:
      - Media
      summary: Minta URL unggah baru untuk media yang belum dikonfirmasi
      description: |
        Hanya pemilik, dan hanya selama media masih `PENDING`. `upload_url` dari `POST /media`
        berlaku 30 menit, dan ulangan `POST /media` dengan `Idempotency-Key` yang sama menjawab URL
        lama itu; endpoint ini menerbitkan URL baru untuk id yang sama, dengan jenis dan ukuran
        yang didaftarkan. Tidak ada body dan tidak butuh `Idempotency-Key`: setiap panggilan
        menandatangani URL baru.

        Bila byte sudah sampai tetapi jawabannya hilang, URL baru dijawab 412 saat dipakai
        (satu URL hanya membuat, tidak menimpa): panggil `complete`.

        Media orang lain, milik organisasi lain, atau yang tidak ada: 404 `MEDIA_NOT_FOUND`.
        Media yang sudah `UPLOADED`: 409 `MEDIA_ALREADY_UPLOADED`.

        Media yang sudah lebih dari 22,5 jam sejak didaftarkan: 409 `MEDIA_EXPIRED`. Media yang
        belum dilampirkan dihapus otomatis sesudah 24 jam, dan URL baru tidak boleh hidup lebih
        lama dari barisnya (byte yang masuk sesudah baris dihapus tidak akan pernah dibersihkan).
        Daftarkan ulang lewat `POST /media` dengan `Idempotency-Key` baru.
      responses:
        '200':
          description: URL baru
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/MediaUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONFLICT dengan reason `MEDIA_ALREADY_UPLOADED` (media sudah dikonfirmasi, tidak ada yang perlu diunggah)
            atau `MEDIA_EXPIRED` (terlalu dekat dengan batas hapus otomatis: daftarkan ulang).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                alreadyUploaded:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Foto sudah terunggah dan dikonfirmasi.
                      details:
                        reason: MEDIA_ALREADY_UPLOADED
                    meta:
                      request_id: req_abc123
                expired:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Pendaftaran foto sudah kedaluwarsa. Daftarkan ulang foto ini.
                      details:
                        reason: MEDIA_EXPIRED
                    meta:
                      request_id: req_abc123
  /media/{id}/complete:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postMediaComplete
      tags:
      - Media
      summary: Konfirmasi byte sudah terunggah
      description: |
        Hanya pemilik. Server memeriksa bahwa objeknya ada, ukurannya sama dengan yang didaftarkan,
        dan isinya benar-benar gambar dari jenis yang didaftarkan (bukan sekadar yang diakui klien),
        lalu mengubah status menjadi `UPLOADED`. Boleh diulang: media yang sudah `UPLOADED`
        dijawab 200 tanpa memeriksa lagi.

        Media orang lain, milik organisasi lain, atau yang tidak ada: 404 `MEDIA_NOT_FOUND`.
        Pemeriksaan gagal: 409 `MEDIA_NOT_UPLOADED`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONFLICT dengan reason `MEDIA_NOT_UPLOADED`: byte belum ada, ukurannya berbeda, atau isinya bukan
            gambar dari jenis yang didaftarkan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notUploaded:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Foto belum terunggah atau tidak sesuai dengan yang didaftarkan.
                      details:
                        reason: MEDIA_NOT_UPLOADED
                    meta:
                      request_id: req_abc123
  /media/blobs/{token}:
    parameters:
    - name: token
      in: path
      required: true
      description: Token bertanda tangan dari `upload_url` atau dari URL foto. Kredensial selama berlaku, jangan dicatat di
        log.
      schema:
        type: string
    get:
      operationId: getMediaBlob
      tags:
      - Media
      summary: Lihat foto di penyimpanan server (hanya STORAGE_DRIVER=local)
      description: |
        URL ini muncul di `photos` respons fitur, bukan untuk disusun klien. Tanpa bearer token:
        token bertanda tangan (operasi get, kunci, jenis, kedaluwarsa) adalah izinnya, dan umurnya
        pendek (sekitar 1 jam). Dikirim dengan `Content-Type` yang ditandatangani,
        `X-Content-Type-Options: nosniff`, `Content-Disposition: inline` dan
        `Cache-Control: private` yang tidak lebih lama dari umur token. Mendukung `Range`.
      security: []
      responses:
        '200':
          description: Isi foto
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '403':
          description: 'FORBIDDEN dengan reason `MEDIA_URL_INVALID`: token rusak, kedaluwarsa, atau untuk operasi lain.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putMediaBlob
      tags:
      - Media
      summary: Unggah byte ke penyimpanan server (hanya STORAGE_DRIVER=local)
      description: |
        Hanya ada bila server menyimpan berkas sendiri (`STORAGE_DRIVER=local`); dengan `minio` atau
        `s3` byte langsung ke penyimpanan objek dan rute ini dijawab 404. Klien tidak pernah
        menyusun alamat ini: ia memakai `upload_url` dan `upload_headers` dari `POST /media`.

        Tanpa bearer token: tanda tangan di token adalah izinnya. Token memuat operasi (put),
        kunci objek, jenis, ukuran paling besar dan waktu kedaluwarsa, sehingga token baca tidak
        bisa dipakai menulis. Body harus tepat sebesar yang ditandatangani (bukan batas 1 MB
        milik JSON). Berkas ditulis ke file sementara lalu dipindah, jadi unggahan yang terputus
        tidak meninggalkan berkas.

        Kegagalan: 403 `MEDIA_URL_INVALID` (token rusak, kedaluwarsa, untuk operasi lain, atau
        `Content-Type` tidak sama dengan yang ditandatangani), 413 `MEDIA_URL_INVALID` (body lebih
        besar dari yang ditandatangani), 412 `MEDIA_URL_INVALID` (foto untuk URL ini sudah
        tersimpan: satu URL hanya membuat, tidak pernah menimpa, agar foto yang sudah diperiksa
        atau dilampirkan tidak dapat diganti).
      security: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Tersimpan
        '400':
          description: 'BAD_REQUEST: body kosong, unggahan terputus, atau ukuran body tidak sama dengan yang didaftarkan (tidak
            ada yang disimpan, URL yang sama masih bisa dipakai dengan byte yang benar).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN dengan reason `MEDIA_URL_INVALID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '412':
          description: 'CONFLICT dengan reason `MEDIA_URL_INVALID`: foto untuk URL ini sudah tersimpan (status yang sama dengan
            S3/MinIO untuk kasus ini).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: 'PAYLOAD_TOO_LARGE dengan reason `MEDIA_URL_INVALID`: body lebih besar dari ukuran yang ditandatangani.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /zones:
