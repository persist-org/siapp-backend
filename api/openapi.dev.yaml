  /report-categories:
    get:
      operationId: getReportCategories
      tags:
      - Report
      summary: 'Daftar kategori laporan (lookup, delta-sync)'
      description: |-
        Kategori laporan yang ditawarkan ke lini bisnis proyek pemanggil. Dua bentuk jawaban:
        - **Tanpa `since`**: semua baris aktif sekaligus (tidak dipaginasi sungguhan: `pagination` selalu halaman 1, `limit` = jumlah baris, minimal 1), dengan
          `meta.server_time` sebagai watermark pertama klien.
        - **Dengan `since`** (delta-sync, DL-34/DL-57): baris yang berubah sejak itu di `data`, dan
          baris yang dihapus atau dinonaktifkan di `deleted` (tombstone) supaya cache offline bisa
          membuangnya. Tanpa `pagination`; `meta.next_cursor`/`has_more` tidak pernah diisi. Simpan `meta.server_time` sebagai `since` berikutnya. Baris yang baru saja
          berubah boleh datang dua kali (jendela tumpang tindih 5 detik): upsert berdasarkan `id`. Hanya kategori yang ditawarkan ke lini bisnis (security/cleaning) proyek yang dilayani pemanggil hari ini; kategori tanpa lini ditawarkan ke semua. Bila keanggotaan regu pemanggil mungkin berubah setelah `since`, jawabannya seluruh set (semua yang ditawarkan di `data`, sisanya di `deleted`).
        Cukup token sesi yang valid (tanpa web role).
      parameters:
      - $ref: '#/components/parameters/MdSinceParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - title: Full pull (tanpa since)
                  allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReportCategory'
                - title: Delta pull (dengan since)
                  allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - required:
                    - data
                    - deleted
                    - meta
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReportCategory'
                      deleted:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tombstone'
                      meta:
                        $ref: '#/components/schemas/DeltaMeta'
        '400':
          $ref: '#/components/responses/MdBadRequestQuery'
        '401':
          $ref: '#/components/responses/MdUnauthorized'
        '422':
          description: 'VALIDATION_ERROR: `since` bukan tanggal-waktu RFC 3339.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                badSince:
                  summary: 'since=kemarin'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: since
                        code: INVALID
                        message: 'Harus berformat tanggal-waktu RFC 3339, mis. 2026-06-01T03:00:00Z.'
                    meta:
                      request_id: req_abc123
