          - TEXT
          - NUMBER
          - CHOICE
        options:
          type: array
          nullable: true
          maxItems: 50
          description: '`CHOICE` wajib 2 sampai 50 opsi dengan `value` unik; tipe lain tidak boleh punya opsi (422 pada `checklist[i].options`).'
          items:
            $ref: '#/components/schemas/PatrolChecklistOption'
        required:
          type: boolean
          default: true
        photo_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
          default: NONE
        photo_max:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        note_mode:
          type: string
          enum:
          - NONE
          - OPTIONAL
          - REQUIRED
          default: NONE
        attach_when:
          type: string
          enum:
          - ALWAYS
          - ON_NO
          default: ALWAYS
    PatrolChecklistReplace:
