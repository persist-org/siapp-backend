      properties:
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 100
        default_phone:
          type: string
          maxLength: 50
          description: E.164 (+62812…), nomor lokal (0812…) atau nomor darurat nasional (110, 113, …); kosong = tanpa nomor
            cadangan.
