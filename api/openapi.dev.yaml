        is_active false ditolak selama shift dipakai shift group (409 SHIFT_IN_USE).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        overnight:
          type: boolean
          description: true = berakhir keesokan harinya (end_time sebelum start_time).
        tolerance_minutes:
          type: integer
          minimum: 0
          maximum: 720
        is_active:
          type: boolean
