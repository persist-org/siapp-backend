                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: Personil tidak bertugas di regu wilayah REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: Data ini berada di luar wilayah yang Anda kelola.
                      details:
                        reason: ACCESS_OUTSIDE_ADMIN_SCOPE
                    meta:
                      request_id: req_abc123
        '404':
          description: Personil atau shift group tidak ada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PERSONNEL_NOT_FOUND:
                  summary: Personil tidak ada di organisasi ini
                  value:
                    success: false
