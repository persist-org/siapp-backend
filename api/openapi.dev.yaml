        is_annual:
          type: boolean
          default: false
        skips_day_check:
          type: boolean
        requires_time_range:
          type: boolean
        requires_change_day:
          type: boolean
        makes_leave_days:
          type: boolean
          description: Bawaan true.
        excuses_lateness:
          type: boolean
        has_quota:
          type: boolean
          description: Bawaan false untuk SICK, selain itu true.
