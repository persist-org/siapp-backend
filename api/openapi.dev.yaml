        relationship_officer_personnel_id:
          type: integer
          format: int64
          minimum: 1
          description: Opsional. Harus personil aktif di organisasi ini (422 bila tidak).
        is_active:
          type: boolean
          default: true
          description: Opsional. Bawaan true.
    TeamUpdate:
      type: object
