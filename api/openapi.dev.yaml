                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: name
                        code: REQUIRED
                        message: 'Tidak boleh kosong.'
                    meta:
                      request_id: req_abc123
                nameTooLong:
                  summary: 'name lebih dari 100 karakter setelah spasi dirapikan'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: name
                        code: INVALID
                        message: 'Maksimum 100 karakter.'
                    meta:
                      request_id: req_abc123
                urgencyMissing:
                  summary: 'Kategori instruksi tanpa urgency'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: urgency
                        code: INVALID
                        message: 'Wajib diisi untuk kategori instruksi (LOW, NORMAL atau HIGH).'
                    meta:
                      request_id: req_abc123
                urgencyBad:
                  summary: 'urgency di luar enum'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: urgency
                        code: INVALID
                        message: 'Harus salah satu dari: LOW NORMAL HIGH.'
                    meta:
                      request_id: req_abc123
                linesBad:
                  summary: 'business_lines berisi nilai di luar enum'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: business_lines[0]
                        code: INVALID
                        message: 'Harus salah satu dari: security cleaning.'
                    meta:
                      request_id: req_abc123
                sortOrder:
                  summary: 'sort_order di luar 0..10000'
                  value:
                    success: false
