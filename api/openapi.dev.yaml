        `code` dan `project_code` tidak dapat dikirim (422, field tidak dikenal).
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: Tidak boleh hanya spasi.
        phone:
          type: string
          maxLength: 50
        min_personnel:
          type: integer
          minimum: 0
          maximum: 10000
        notes:
          type: string
          maxLength: 1000
        validate_shift:
          type: boolean
        reject_attendance_after_tolerance:
          type: boolean
        relationship_officer_personnel_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: null menghapus relationship officer. Officer BARU harus personil aktif di organisasi ini (422); officer
            yang sudah ada tetap walau kemudian nonaktif.
        is_active:
          type: boolean
    TeamRole:
      type: string
      enum:
      - DANRU
      - MEMBER
      description: Peran lapangan di regu (DL-04). Satu DANRU per regu per tanggal (BR-RULE-02).
    TeamMembership:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Dipakai oleh /admin/team-members/{id}/move dan /change-role.
        team_code:
          type: string
          example: 1K-IBMI-S1
        personnel_id:
          type: integer
          format: int64
        nik:
          type: string
          nullable: true
          example: '************0001'
          description: NIK dimasker (hanya 4 karakter terakhir).
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        start_date:
          type: string
          format: date
          example: '2026-01-15'
        end_date:
          type: string
          format: date
          nullable: true
          description: Inklusif; tidak ada = masih berjalan.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamMembershipInput:
      type: object
      additionalProperties: false
      required:
      - nik
      - role
      - start_date
      properties:
        nik:
          type: string
          minLength: 1
          maxLength: 32
          example: SIAPPA0002
          description: WAJIB. Dicari di Personalia; orang yang belum pernah login tetap dapat ditambahkan (404 PERSONNEL_NOT_FOUND
            bila NIK tidak dikenal, 422 PERSONNEL_INACTIVE bila nonaktif).
        role:
          $ref: '#/components/schemas/TeamRole'
        start_date:
          type: string
          format: date
          example: '2026-01-15'
          description: WAJIB. Boleh tanggal depan (keanggotaan terjadwal).
    TeamMembershipMoveInput:
      type: object
      additionalProperties: false
      required:
      - to_team_code
      - effective_date
      properties:
        to_team_code:
          type: string
          example: 1K-IBMI-S2
          description: WAJIB. Regu tujuan; harus ada (404 TEAM_NOT_FOUND) dan berbeda dari regu sekarang (422). Peran dibawa.
        effective_date:
          type: string
          format: date
          description: WAJIB. Baris lama berakhir sehari sebelumnya, baris baru mulai pada tanggal ini. Harus setelah tanggal
            mulai keanggotaan (422).
    TeamMembershipChangeRoleInput:
      type: object
      additionalProperties: false
      required:
      - role
      - effective_date
      properties:
        role:
          allOf:
          - $ref: '#/components/schemas/TeamRole'
          description: WAJIB. Harus berbeda dari peran sekarang (422).
        effective_date:
          type: string
          format: date
          description: WAJIB. Baris lama berakhir sehari sebelumnya, baris baru mulai pada tanggal ini. Harus setelah tanggal
            mulai keanggotaan (422).
    MeMembership:
      type: object
      description: Satu regu tempat orang ini bertugas hari ini (tanggal bisnis di zona waktu proyek regu itu).
      required:
      - team_code
      - team_name
      - project_code
      - project_name
      - role
      - start_date
      properties:
        team_code:
          type: string
          example: 1K-IBMI-S1
        team_name:
          type: string
        project_code:
          type: string
          example: 1K-IBMI-S
        project_name:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        start_date:
          type: string
          format: date
    Shift:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Day Shift
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 08:00
          description: Jam masuk lokal; 00:00 untuk OFF.
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '17:00'
          description: Jam pulang lokal; 00:00 untuk OFF.
        is_off:
          type: boolean
          description: Hari libur (tanpa jam).
        overnight:
          type: boolean
          description: true bila shift berakhir keesokan harinya (jam pulang sebelum jam masuk, mis. 22:00-06:00). Selalu
            false untuk OFF.
        tolerance_minutes:
          type: integer
          minimum: 0
          maximum: 720
          description: Toleransi terlambat (dipakai reject_attendance_after_tolerance regu). 0 untuk OFF.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShiftInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Night Shift
          description: WAJIB. Unik di organisasi (tanpa membedakan huruf besar/kecil) di antara shift yang belum dihapus;
            409 SHIFT_NAME_TAKEN.
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '22:00'
          description: 'WAJIB untuk shift kerja, HH:mm. Shift OFF: tidak boleh dikirim (422 SHIFT_INVALID_TIME).'
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: 06:00
          description: 'WAJIB untuk shift kerja, HH:mm, berbeda dari start_time. Harus setelah start_time bila overnight false,
            dan sebelum start_time bila overnight true (422 SHIFT_INVALID_TIME). Shift OFF: tidak boleh dikirim.'
        is_off:
          type: boolean
          default: false
          description: Opsional. true = hari libur tanpa jam. Tidak dapat diubah setelah dibuat.
        overnight:
          type: boolean
          default: false
          description: 'Opsional. true = shift berakhir keesokan harinya (mis. 22:00-06:00); wajib true agar end_time boleh
            sebelum start_time. Shift OFF: tidak boleh dikirim.'
        tolerance_minutes:
          type: integer
          minimum: 0
          maximum: 720
          default: 15
          description: 'Opsional. Bawaan 15; harus lebih pendek dari durasi shift (422 tolerance_minutes). Shift OFF: tidak
            boleh dikirim (disimpan 0).'
        is_active:
          type: boolean
          default: true
          description: Opsional. Shift nonaktif tidak dapat dipilih untuk shift group atau jadwal baru.
    ShiftUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional; yang tidak dikirim tidak berubah. `is_off` tidak dapat dikirim (422).
        Mengubah jam berlaku untuk semua tanggal yang sudah dijadwalkan dengan shift ini (seperti PJ48).
        Hasilnya diperiksa utuh: `overnight` yang tidak dikirim tetap milik shift, jadi jam baru harus
        sesuai dengannya (422 SHIFT_INVALID_TIME), dan toleransi harus lebih pendek dari durasi shift.
        Shift OFF tidak menerima start_time, end_time, overnight, maupun tolerance_minutes (422 SHIFT_INVALID_TIME).
        is_active false ditolak selama shift dipakai shift group (409 SHIFT_IN_USE).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        overnight:
          type: boolean
          description: true = berakhir keesokan harinya (end_time sebelum start_time).
        tolerance_minutes:
          type: integer
          minimum: 0
          maximum: 720
        is_active:
          type: boolean
    Weekday:
      type: string
      enum:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
    ShiftGroupDay:
      type: object
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        shift:
          $ref: '#/components/schemas/Shift'
    ShiftGroup:
      type: object
      description: Pola mingguan (shift group PJ48). Selalu tujuh hari, Senin lebih dulu.
