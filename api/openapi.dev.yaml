                    error:
                      code: TOKEN_EXPIRED
                      message: Token kedaluwarsa.
                    meta:
                      request_id: req_abc123
        '403':
          description: 'FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): personil di luar wilayah
            REGION_ADMIN.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: Personil tidak bertugas di regu wilayah REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: Data ini berada di luar wilayah yang Anda kelola.
                      details:
                        reason: ACCESS_OUTSIDE_ADMIN_SCOPE
                    meta:
                      request_id: req_abc123
        '404':
          description: Jadwal tidak ada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                SCHEDULE_NOT_FOUND:
                  summary: Jadwal tidak ada atau milik organisasi lain
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Jadwal tidak ditemukan.
                      details:
                        reason: SCHEDULE_NOT_FOUND
                    meta:
                      request_id: req_abc123
