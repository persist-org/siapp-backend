      x-roles:
      - ORG_ADMIN
      - REGION_ADMIN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/ShiftAssignment'
        '401':
          description: 'UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value:
                    success: false
                    error:
                      code: UNAUTHENTICATED
                      message: Token tidak ditemukan.
                    meta:
                      request_id: req_abc123
                expired:
                  summary: Token kedaluwarsa
                  value:
                    success: false
                    error:
                      code: TOKEN_EXPIRED
                      message: Token kedaluwarsa.
                    meta:
                      request_id: req_abc123
        '403':
          description: 'FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): personil di luar wilayah
            REGION_ADMIN.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: Personil tidak bertugas di regu wilayah REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: Data ini berada di luar wilayah yang Anda kelola.
                      details:
                        reason: ACCESS_OUTSIDE_ADMIN_SCOPE
                    meta:
                      request_id: req_abc123
        '404':
          description: Personil tidak ada, atau belum punya pengaturan jadwal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                PERSONNEL_NOT_FOUND:
                  summary: Personil tidak ada di organisasi ini
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Personil tidak ditemukan.
                      details:
                        reason: PERSONNEL_NOT_FOUND
                    meta:
                      request_id: req_abc123
                SHIFT_ASSIGNMENT_NOT_FOUND:
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Personil ini belum memiliki pengaturan jadwal.
                      details:
                        reason: SHIFT_ASSIGNMENT_NOT_FOUND
                    meta:
                      request_id: req_abc123
    put:
      operationId: putAdminPersonnelByPersonnelIdShiftAssignment
      tags:
      - Organization
      summary: Atur jadwal personil (FIXED/FLEXIBLE)
      description: |
        Sama dengan halaman Shift Group PJ48, dalam satu transaksi.
        FIXED: jadwal dibuat dari pola shift group mulai effective_date sampai hari ini + 60 hari, lalu diperpanjang tiap malam. Sebelumnya jadwal yang akan diganti dihapus, mulai dari effective_date (atau effective_date lama bila lebih awal), tetapi tidak pernah tanggal lampau, dan tidak hari ini bila shift hari ini sudah dimulai. Jadwal manual dalam rentang itu ikut diganti, seperti PJ48.
        FLEXIBLE: tidak membuat dan tidak menghapus jadwal; admin mengisi tiap tanggal. FLEXIBLE juga
        boleh untuk personil yang tidak aktif (agar shift group-nya dapat dilepas); FIXED tidak (422 PERSONNEL_INACTIVE).
        Hari ini juga tidak diganti bila shift hari ini dari shift group baru sudah dimulai.
        Zona waktu "hari ini" adalah zona proyek regu personil (WIB bila tidak di regu mana pun).
        Wewenang REGION_ADMIN: personil yang bertugas, atau akan bertugas, di regu wilayahnya.
      x-roles:
      - ORG_ADMIN
      - REGION_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftAssignmentInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/ShiftAssignmentResult'
        '400':
          description: 'BAD_REQUEST: body kosong atau bukan JSON yang valid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                empty:
                  summary: Body kosong
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Body wajib diisi.
                    meta:
                      request_id: req_abc123
        '401':
          description: 'UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
