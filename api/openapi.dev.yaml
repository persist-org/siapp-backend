  /admin/attendances:
    get:
      operationId: getAdminAttendances
      tags:
      - Attendance
      summary: Monitor kehadiran (web admin, WEB-25)
      description: 'Setiap catatan dalam jangkauan admin: ORG_ADMIN melihat semua, REGION_ADMIN hanya proyek di bawah wilayahnya.
        Bukan admin: 403 `NOT_ADMIN`. Parameter tidak valid (`status`, `sync_status`, `date_from`, `date_to`, `page`, `limit`):
        422 `VALIDATION_ERROR`.'
      parameters:
      - name: team_code
        in: query
        schema:
          type: string
          example: 1K-IBMI-S1
      - name: project_code
        in: query
        schema:
          type: string
          example: 1K-IBMI-S
      - name: status
        in: query
        description: Status tersimpan.
        schema:
          type: string
          enum:
          - PRESENT
          - LEAVE
          - ABSENT
      - name: sync_status
        in: query
        description: Status kirim ke Personel.
        schema:
          type: string
          enum:
          - PENDING
          - SYNCED
          - FAILED
      - $ref: '#/components/parameters/DateFromParam'
      - $ref: '#/components/parameters/DateToParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
