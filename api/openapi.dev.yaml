  /admin/attendances/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    patch:
      operationId: patchAdminAttendancesById
      tags:
      - Attendance
      summary: Koreksi kehadiran
      description: '`reason` selalu wajib. `status: ABSENT` menjadikan catatan mangkir (menghapus jam datang/pulang bila ada);
        `status: PRESENT` (dari ABSENT/LEAVE atau yang sudah PRESENT) perlu `check_in_at` bila belum ada; `check_in_at`/`check_out_at`
        tanpa `status` mengoreksi jam catatan yang sudah hadir. Metode tersimpan `FORCE`; keterlambatan dihitung ulang terhadap
        toleransi shift saat ini dan izin yang disetujui, seperti absen datang biasa. Satu event `CORRECTED` selalu dikirim
        ke Personel, apa pun yang berubah. Di luar jangkauan wilayah admin, atau tidak ada: 404. `reason` kosong, atau tidak
        ada satu pun dari `status`/ `check_in_at`/`check_out_at`: 422 `VALIDATION_ERROR`. Mengubah catatan bertukar jaga menjadi
        `PRESENT` membatalkan tukar jaga yang belum dimulai; bila pengganti sudah absen datang: 409 `SWAP_ALREADY_STARTED`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCorrection'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/Attendance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /permission-categories:
    get:
      operationId: getPermissionCategories
      tags:
      - Permission
      summary: Daftar kategori izin, cuti dan sakit (lookup, delta-sync)
      description: |-
        Kategori milik SiAPP (D2), tidak lagi dibaca dari Personel. Dua bentuk jawaban:
        - **Tanpa `since`**: semua baris aktif sekaligus, dengan `meta.server_time` sebagai
          watermark pertama klien.
        - **Dengan `since`** (delta-sync, DL-34/DL-57): baris yang berubah di `data`, dan yang
          dinonaktifkan di `deleted` (tombstone, berkunci `code`). Simpan `meta.server_time`.

        `type` menyaring satu tipe (LEAVE, PERMIT atau SICK).
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LeaveCategoryType'
      - $ref: '#/components/parameters/SinceParam'
      responses:
        '200':
          description: OK. `meta.server_time` WAJIB.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaveCategory'
                    deleted:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaveCategoryTombstone'
                    pagination:
                      $ref: '#/components/schemas/Pagination'
                    meta:
                      $ref: '#/components/schemas/DeltaMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
