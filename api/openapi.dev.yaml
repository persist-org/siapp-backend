  /location-logs:
    post:
      operationId: postLocationLogs
      tags:
      - Tracking
      summary: Kirim titik GPS (batch, termasuk yang direkam saat offline)
      description: |
        Hanya diterima saat pemanggil sedang bertugas (jendela shift seperti absen) di proyek yang
        mengaktifkan `gps_tracking_enabled`. Tiap titik dinilai dari `logged_at`-nya sendiri: titik di
        luar jendela shift berpelacakan dihitung `rejected`, bukan disimpan.

        403 `TRACKING_DISABLED` hanya bila TIDAK ADA jendela shift berpelacakan yang bersinggungan
        dengan rentang waktu batch (klien berhenti mengirim sampai shift berikutnya). Bila ada
        jendela tetapi tidak satu pun titik jatuh di dalamnya (mis. satu titik sebelum shift dan satu
        sesudahnya), responsnya 200 dengan `accepted: 0`; itu bukan sinyal untuk berhenti.
        Titik yang sama (waktu sama) dua kali hanya tersimpan sekali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationBatchInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LocationBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'FORBIDDEN (TRACKING_DISABLED): pemanggil tidak sedang bertugas di proyek yang mengaktifkan pelacakan
            GPS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                TRACKING_DISABLED:
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Pelacakan lokasi tidak aktif.
                      details:
                        reason: TRACKING_DISABLED
                    meta:
                      request_id: req_abc123
        '422':
          description: VALIDATION_ERROR, atau UNPROCESSABLE (LOCATION_BATCH_TOO_LARGE) untuk lebih dari 100 titik.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                LOCATION_BATCH_TOO_LARGE:
                  value:
                    success: false
                    error:
                      code: UNPROCESSABLE
                      message: Maksimum 100 titik lokasi per permintaan.
                      details:
                        reason: LOCATION_BATCH_TOO_LARGE
                    meta:
                      request_id: req_abc123
