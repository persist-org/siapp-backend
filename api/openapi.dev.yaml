                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                SCHEDULE_NOT_FOUND:
                  summary: Jadwal tidak ada atau milik organisasi lain
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Jadwal tidak ditemukan.
                      details:
                        reason: SCHEDULE_NOT_FOUND
                    meta:
                      request_id: req_abc123
        '409':
          description: 'CONFLICT: tanggal tujuan sudah punya jadwal.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                SCHEDULE_EXISTS:
                  summary: Tanggal itu sudah punya jadwal (satu jadwal per personil per tanggal)
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Personil sudah memiliki jadwal pada 2026-10-21. Ubah jadwal tanggal tersebut.
                      details:
                        reason: SCHEDULE_EXISTS
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR / UNPROCESSABLE: tanggal salah format, shift tidak ada atau nonaktif, atau zona waktu
            ambigu pada tanggal baru.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unknownShift:
                  summary: Shift tidak ada
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
                      errors:
                      - field: shift_id
                        code: INVALID
                        message: Shift tidak ditemukan.
                    meta:
                      request_id: req_abc123
                SCHEDULE_TIMEZONE_AMBIGUOUS:
                  summary: Pada tanggal itu personil bertugas di proyek WIB dan WITA/WIT sekaligus
                  value:
                    success: false
                    error:
                      code: UNPROCESSABLE
                      message: Personil bertugas di proyek dengan zona waktu berbeda pada tanggal tersebut.
                      details:
                        reason: SCHEDULE_TIMEZONE_AMBIGUOUS
                    meta:
                      request_id: req_abc123
        '413':
          description: 'PAYLOAD_TOO_LARGE: body lebih dari 1 MB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tooLarge:
                  value:
                    success: false
                    error:
                      code: PAYLOAD_TOO_LARGE
                      message: Body terlalu besar.
                    meta:
                      request_id: req_abc123
    delete:
      operationId: deleteAdminSchedulesById
      tags:
      - Organization
      summary: Hapus jadwal
      description: |
        Dihapus sungguhan; jejaknya di audit log.
        Wewenang REGION_ADMIN: hanya personil yang bertugas di regu wilayahnya pada tanggal jadwal itu (wilayah regu = nomor di depan kode regu).
      x-roles:
      - ORG_ADMIN
      - REGION_ADMIN
      responses:
        '200':
          description: OK (data null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: 'UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value:
                    success: false
                    error:
                      code: UNAUTHENTICATED
                      message: Token tidak ditemukan.
                    meta:
                      request_id: req_abc123
                expired:
                  summary: Token kedaluwarsa
                  value:
                    success: false
                    error:
                      code: TOKEN_EXPIRED
                      message: Token kedaluwarsa.
                    meta:
                      request_id: req_abc123
        '403':
          description: 'FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): personil di luar wilayah
            REGION_ADMIN.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: Personil tidak bertugas di regu wilayah REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: Data ini berada di luar wilayah yang Anda kelola.
                      details:
                        reason: ACCESS_OUTSIDE_ADMIN_SCOPE
                    meta:
                      request_id: req_abc123
        '404':
          description: Jadwal tidak ada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                SCHEDULE_NOT_FOUND:
                  summary: Jadwal tidak ada atau milik organisasi lain
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: Jadwal tidak ditemukan.
                      details:
                        reason: SCHEDULE_NOT_FOUND
                    meta:
                      request_id: req_abc123
  /admin/zones/{id}/qr:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getAdminZonesByIdQr
      tags:
      - Patrol
      summary: Generate/print QR zona
      description: |
        Gambar QR (bukan amplop JSON) berisi `PERSIST-ZONE:1:{organizationId}:{zoneId}:{qrSecret}`. QR ini statis
        karena dicetak jadi stiker; keamanannya dari geofence di server, id organisasi di
        isinya, dan `POST /admin/zones/{id}/rotate-qr` bila stiker bocor. Header
        `Content-Disposition` memuat nama berkas dari nama zona; respons `Cache-Control: private, no-store`
        karena gambar memuat rahasia zona. `format` tidak membedakan huruf besar/kecil; selain png/svg 422.
        Zona di luar wilayah REGION_ADMIN: 403 `SCOPE_DENIED`.
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - png
          - svg
          default: png
      responses:
        '200':
          description: Gambar QR (PNG 512 piksel atau SVG)
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename=qr-zona-nama-zona.png
            Cache-Control:
              schema:
                type: string
                example: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
        '422':
          description: 'VALIDATION_ERROR: `format` bukan png atau svg.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /admin/zones/{id}/rotate-qr:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postAdminZonesByIdRotateQr
      tags:
      - Patrol
      summary: Ganti rahasia QR zona
      description: |
        Membuat rahasia QR baru. Semua stiker yang sudah dicetak berhenti berlaku (scan dengan QR lama 422
        `ZONE_QR_INVALID`); cetak ulang lewat `GET /admin/zones/{id}/qr`. Tanpa badan permintaan dan tanpa header
        `Idempotency-Key`. Zona di luar wilayah REGION_ADMIN: 403 `SCOPE_DENIED`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolZone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
  /admin/zones/{id}/checklist:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    put:
      operationId: putAdminZonesByIdChecklist
      tags:
      - Patrol
      summary: Ganti checklist zona
      description: |
        Mengganti checklist saja, tanpa mengirim ulang zonanya (`updated_at` zona ikut berubah). Aturannya sama
        dengan `checklist` pada badan zona: butir ber-`id` diubah, tanpa `id` dibuat, yang tidak dikirim
        dinonaktifkan. Urutan larik menentukan `sort_order`. Mengubah butir tidak mengubah scan yang sudah dikirim
        (scan menyimpan salinan pertanyaan). `id` harus butir aktif zona ini dan tidak boleh ganda. Zona di luar
        wilayah REGION_ADMIN: 403 `SCOPE_DENIED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolChecklistReplace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolZone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'VALIDATION_ERROR: `checklist` hilang atau lebih dari 100 butir, butir salah/tidak dikenal, `checklist[i].id` tidak ditemukan di zona ini atau ganda, `checklist[i].options` (CHOICE butuh minimal 2 opsi dengan nilai unik; tipe lain tanpa opsi), `checklist[i].attach_when` (`ON_NO` hanya BOOLEAN).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /admin/checkpoints:
    get:
      operationId: getAdminCheckpoints
      tags:
      - Patrol
      summary: List PatrolCheckpoint
      description: |
        Checkpoint di wilayah admin (aktif maupun nonaktif; yang dihapus tidak), urut menurut proyek lalu nama, dengan
        checklist aktif dan zona tempatnya berada. REGION_ADMIN hanya melihat checkpoint proyek di wilayahnya;
        `project_code` di luar wilayahnya: 403 `SCOPE_DENIED`. `q` mencari pada nama. `zone_id` menyisakan
        checkpoint satu zona.
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/QParam'
      - $ref: '#/components/parameters/IsActiveParam'
      - name: project_code
        in: query
        schema:
          type: string
      - name: zone_id
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PatrolCheckpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '422':
          description: 'VALIDATION_ERROR: `page`/`limit`/`q` di luar batas, `is_active` bukan true/false, `zone_id` bukan angka positif.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    post:
      operationId: postAdminCheckpoints
      tags:
      - Patrol
      summary: Buat PatrolCheckpoint
      description: |
        Membuat checkpoint, checklist-nya bila dikirim, dan rahasia QR baru (tanpa header `Idempotency-Key`). Titik
        (`latitude` + `longitude`) dan `radius_meters` harus terisi bersama; titik tanpa radius mendapat radius 30 m
        (paling besar 1000 m). Nama harus unik per proyek di antara checkpoint yang belum dihapus, tanpa membedakan
        huruf besar-kecil. Proyek di luar wilayah REGION_ADMIN: 403 `SCOPE_DENIED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolCheckpointInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolCheckpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          description: '`NOT_FOUND` `PROJECT_NOT_FOUND`: `project_code` tidak ada.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '409':
          description: '`DUPLICATE` `CHECKPOINT_NAME_TAKEN`: sudah ada checkpoint dengan nama ini di proyek yang sama.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'VALIDATION_ERROR: field wajib hilang atau di luar batas, field tidak dikenal, titik tanpa pasangan atau radius tanpa titik. `actions[i].*` yang tidak valid: 422 dengan `details.reason` = `CHECKPOINT_ACTION_INVALID`.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /admin/checkpoints/{id}:
    parameters:
    - $ref: '#/components/parameters/CheckpointIdPath'
    get:
