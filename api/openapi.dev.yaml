      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/WebRoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IamForbiddenOrgAdminOnly'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /admin/web-roles/{personnel_id}:
    parameters:
    - $ref: '#/components/parameters/PersonnelIdPath'
    put:
      operationId: putAdminWebRole
      tags:
      - Auth
      summary: Beri atau ubah peran web seseorang (hanya ORG_ADMIN)
      description: |
        Admin tidak dapat menyempitkan penugasannya sendiri: selain ORG_ADMIN untuk dirinya sendiri → 409 CONFLICT
        `ACCESS_OWN_ROLE_PROTECTED` (ORG_ADMIN lagi untuk diri sendiri tidak mengubah apa pun dan tidak diaudit),
        supaya admin terakhir tidak mengunci semua orang. Orang yang belum pernah masuk (tidak ada di tabel personel) atau
        id bukan angka positif: 404. Bentuk peran salah / koordinator wilayah tidak ada: 422 (lihat `WebRoleInput`).
        Idempotent: memberi peran yang sama lagi mengganti baris yang ada. Dicatat di audit log.
      x-roles:
      - ORG_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebRoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/WebRoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IamForbiddenOrgAdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IamOwnRoleProtected'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SysInternalError'
    delete:
      operationId: deleteAdminWebRole
      tags:
      - Auth
      summary: Cabut peran web seseorang (hanya ORG_ADMIN)
      description: |
        Orang itu menjadi petugas lapangan lagi: permintaan admin berikutnya ditolak, sesi webnya berakhir pada refresh
        berikutnya. Tidak ada body. Mencabut peran dirinya sendiri → 409 `ACCESS_OWN_ROLE_PROTECTED`; orang tanpa peran web
        atau id bukan angka positif → 404.
      x-roles:
      - ORG_ADMIN
      responses:
        '200':
          description: OK (`data` = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IamForbiddenOrgAdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IamOwnRoleProtected'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /admin/field-permissions:
    get:
      operationId: getAdminFieldPermissions
      tags:
      - Auth
      summary: Katalog hak akses lapangan dan matriks per peran regu (hanya ORG_ADMIN)
      description: |
        Hak akses petugas lapangan adalah data organisasi: tiap peran regu (DANRU, MEMBER) punya jangkauan per hak
        (`NONE`, `SELF`, `TEAM`, `PROJECT`). Katalog (daftar hak, deskripsi, bidang usaha, dan nilai bawaan dari Tabel 8 manual)
        ditetapkan oleh aplikasi; matriks adalah nilai yang berlaku sekarang. Organisasi yang belum pernah diisi mendapat
        nilai bawaan saat dibaca, jadi matriks tidak pernah kosong.
        Wewenang: hanya ORG_ADMIN. REGION_ADMIN: 403 `ROLE_DENIED` (`ACCESS_ORG_ADMIN_ONLY`), karena matriks berlaku untuk seluruh organisasi.
        Admin web tidak melewati hak lapangan; jalur `/admin` dijaga web role.
      x-roles:
      - ORG_ADMIN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/FieldPermissionMatrix'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN `NOT_ADMIN` (staf lapangan) atau ROLE_DENIED `ACCESS_ORG_ADMIN_ONLY` (REGION_ADMIN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notAdmin:
                  summary: Staf lapangan
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                orgAdminOnly:
                  summary: REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: ROLE_DENIED
                      message: Hanya admin organisasi yang dapat melakukan ini.
                      details:
                        reason: ACCESS_ORG_ADMIN_ONLY
                    meta:
                      request_id: req_abc123
        '500':
          $ref: '#/components/responses/SysInternalError'
  /admin/field-permissions/{team_role}:
    parameters:
    - $ref: '#/components/parameters/TeamRolePath'
    put:
      operationId: putAdminFieldPermissionsByTeamRole
      tags:
      - Auth
      summary: Ganti semua hak lapangan satu peran regu (hanya ORG_ADMIN)
      description: |
        Mengganti seluruh hak satu peran dalam satu transaksi (gagal berarti tidak ada yang berubah) dan mengembalikan hak peran itu
        sekarang. `grants` harus memuat setiap hak di katalog tepat satu kali: ini penggantian, jadi hak yang tidak disebut ditolak
        (422 `REQUIRED`) dan bukan dianggap dicabut, dan daftar yang pendek tidak dapat melucuti peran. Kunci yang tidak ada di
        katalog: 422 `PERMISSION_UNKNOWN`. Kunci ganda atau jangkauan di luar `NONE`, `SELF`, `TEAM`, `PROJECT`: 422 `VALIDATION_ERROR`.
        `errors[]` menyebut grant yang mana (`grants[3].scope`).
        Hak yang berubah dicatat di audit log dengan jangkauan lama dan baru; penggantian yang tidak mengubah apa pun tidak mencatat
        apa-apa. Perubahan berlaku pada permintaan berikutnya orang-orang yang memegang peran itu (hak dibaca dari database, bukan dari token).
        Wewenang: hanya ORG_ADMIN. REGION_ADMIN: 403 `ROLE_DENIED` (`ACCESS_ORG_ADMIN_ONLY`).
      x-roles:
      - ORG_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPermissionsInput'
      responses:
        '200':
          description: OK (hak peran itu sekarang)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/FieldPermissionRole'
        '400':
          description: 'BAD_REQUEST: body kosong, bukan JSON yang valid, lebih dari satu objek, atau memuat karakter NUL.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                empty:
                  summary: Body kosong
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Body wajib diisi.
                    meta:
                      request_id: req_abc123
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN `NOT_ADMIN` (staf lapangan) atau ROLE_DENIED `ACCESS_ORG_ADMIN_ONLY` (REGION_ADMIN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                orgAdminOnly:
                  summary: REGION_ADMIN
                  value:
                    success: false
                    error:
                      code: ROLE_DENIED
                      message: Hanya admin organisasi yang dapat melakukan ini.
                      details:
                        reason: ACCESS_ORG_ADMIN_ONLY
                    meta:
                      request_id: req_abc123
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: 'PAYLOAD_TOO_LARGE: body lebih dari 1 MB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tooLarge:
                  value:
                    success: false
                    error:
                      code: PAYLOAD_TOO_LARGE
                      message: Body terlalu besar.
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR: daftar hak tidak valid. Reason `PERMISSION_UNKNOWN` bila ada kunci yang tidak dikenal.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unknownPermission:
                  summary: Kunci tidak dikenal
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Ada hak akses yang tidak dikenal.
                      details:
                        reason: PERMISSION_UNKNOWN
                      errors:
                      - field: grants[2].permission
                        code: UNKNOWN
                        message: Hak akses tidak dikenal.
                    meta:
                      request_id: req_abc123
                missing:
                  summary: Hak yang tidak disebut
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Validasi gagal pada beberapa field.
                      errors:
                      - field: grants
                        code: REQUIRED
                        message: Hak akses cctv.view wajib ada di daftar.
                    meta:
                      request_id: req_abc123
        '500':
          $ref: '#/components/responses/SysInternalError'
  /admin/personnel/{personnel_id}/device-binding:
    parameters:
    - $ref: '#/components/parameters/PersonnelIdPath'
    delete:
      operationId: deleteAdminPersonnelDeviceBinding
      tags:
      - Auth
      summary: Reset ikatan HP seseorang (satu orang = satu HP)
      description: |
        Reset HR di panel Personalia hanya membebaskan aplikasi Personalia; ikatan HP SiAPP
        adalah catatan SiAPP sendiri dan direset di sini. Dalam satu transaksi ikatan dihapus
        dan sesi MOBILE orang itu dicabut (token aksesnya mati seketika). ORG_ADMIN, atau
        REGION_ADMIN untuk orang yang tergabung di regu pada koordinator wilayahnya. Orang tanpa
        ikatan: tidak terjadi apa-apa, tetap 200 (tanpa audit). Token perangkat push orang itu ikut dihapus. Tidak ada body.
        Bagi REGION_ADMIN, orang yang tidak ada dijawab sama dengan orang di luar wilayahnya (403), supaya id tidak dapat
        ditebak; bagi ORG_ADMIN orang yang tidak ada atau id bukan angka positif → 404.
      x-roles:
      - ORG_ADMIN
      - REGION_ADMIN
      responses:
        '200':
          description: OK (`data` = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN `NOT_ADMIN` (orang tanpa peran web) atau SCOPE_DENIED `ACCESS_OUTSIDE_ADMIN_SCOPE` (REGION_ADMIN;
            orang di luar wilayahnya atau tidak ada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notAdmin:
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
                outsideScope:
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: Data ini berada di luar wilayah yang Anda kelola.
                      details:
                        reason: ACCESS_OUTSIDE_ADMIN_SCOPE
                    meta:
                      request_id: req_abc123
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags:
      - Auth
      summary: Akhiri sesi ini (seluruh rantai refresh) + hapus FCM token
      description: |
        Mematikan refresh token dan access token sesi ini seketika. Tidak melepas ikatan HP
        (itu catatan admin dan bertahan setelah logout). Body boleh kosong. `firebase_token` hanya diperiksa
        bentuknya (maks 4096) dan tidak dipakai: semua token push milik rantai sesi ini ikut dihapus.
        Body yang tidak kosong harus satu objek JSON: bukan JSON → 400; field tak dikenal / tipe salah / token terlalu
        panjang → 422; lebih dari 1 MB → 413.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                firebase_token:
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: OK (`data` = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /admin/permission-categories:
    get:
      operationId: getAdminPermissionCategories
      tags:
      - Permission
      summary: Daftar kategori izin (ORG_ADMIN)
      description: 'Kategori izin, cuti dan sakit milik SiAPP (D2), aktif atau tidak. Apa yang istimewa dari sebuah kategori
        ada pada bendera barisnya, bukan pada kode atau namanya. Hanya ORG_ADMIN: REGION_ADMIN 403 `ACCESS_ORG_ADMIN_ONLY`
        (`ROLE_DENIED`), bukan admin 403 `NOT_ADMIN`. `type` selain LEAVE/PERMIT/SICK, `is_active` bukan boolean, atau
        `page`/`limit`/`q` salah: 422 `VALIDATION_ERROR`.'
      security:
      - bearerSession: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/LeaveCategoryType'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/QParam'
      - $ref: '#/components/parameters/IsActiveParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaveCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: postAdminPermissionCategories
      tags:
      - Permission
      summary: Buat kategori izin (ORG_ADMIN)
      description: 'Kode, tipe dan `is_annual` tidak bisa diubah sesudahnya, dan kode tidak pernah dipakai dua kali (409 `LEAVE_CATEGORY_CODE_TAKEN`).
        Bendera yang saling bertentangan (cuti tahunan harus LEAVE, berkuota dan membuat hari cuti; SICK tidak berkuota; jam
        dan tukar hari tidak bersamaan), `code` tidak cocok pola, `name` kosong, atau field tak dikenal: 422 `VALIDATION_ERROR`.
        Hanya ORG_ADMIN (REGION_ADMIN: 403 `ACCESS_ORG_ADMIN_ONLY`). Body bukan JSON 400; lebih dari 1 MB 413.'
      security:
      - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveCategoryInput'
      responses:
        '201':
