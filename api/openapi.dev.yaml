                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Schedule'
        '400':
          description: 'BAD_REQUEST: body kosong atau bukan JSON yang valid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                empty:
                  summary: Body kosong
                  value:
                    success: false
