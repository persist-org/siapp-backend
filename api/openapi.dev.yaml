                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Region'
        '400':
          description: 'BAD_REQUEST: query string mengandung karakter NUL (%00), yang tidak dapat disimpan di database.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nul:
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Query string tidak boleh berisi karakter NUL.
                    meta:
                      request_id: req_abc123
        '401':
          description: 'UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value:
                    success: false
                    error:
                      code: UNAUTHENTICATED
                      message: Token tidak ditemukan.
                    meta:
                      request_id: req_abc123
                expired:
                  summary: Token kedaluwarsa
                  value:
                    success: false
                    error:
                      code: TOKEN_EXPIRED
                      message: Token kedaluwarsa.
                    meta:
                      request_id: req_abc123
        '403':
          description: Tanpa web role (FORBIDDEN), atau di luar wewenang (ROLE_DENIED / SCOPE_DENIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: Anda bukan admin. Akses ini hanya untuk admin.
                      details:
                        reason: NOT_ADMIN
                    meta:
                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR: parameter query tidak valid (is_active bukan true/false, page atau limit di luar
            batas, q lebih dari 100 karakter, business_line di luar enum).'
