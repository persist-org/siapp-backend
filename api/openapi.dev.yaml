  /admin/zones:
    get:
      operationId: getAdminZones
      tags:
      - Patrol
      summary: List PatrolZone
      description: |
        Zona di wilayah admin (aktif maupun nonaktif; yang dihapus tidak), urut menurut proyek, tipe, nama, dengan
        checklist aktifnya. REGION_ADMIN hanya melihat zona proyek di wilayahnya; `project_code` di luar wilayahnya:
        403 `SCOPE_DENIED`. `q` mencari pada nama dan alias.
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/QParam'
      - $ref: '#/components/parameters/IsActiveParam'
      - name: project_code
        in: query
        schema:
          type: string
      - name: team_code
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
          enum:
          - PATROL
          - GUARD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PatrolZone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '422':
          description: 'VALIDATION_ERROR: `page`/`limit`/`q` di luar batas, `type` bukan PATROL/GUARD, `is_active` bukan true/false.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    post:
      operationId: postAdminZones
      tags:
      - Patrol
      summary: Buat PatrolZone
      description: |
        Membuat zona beserta checklist-nya dan rahasia QR baru (tanpa header `Idempotency-Key`). Titik
        (`latitude` + `longitude`) dan `radius_meters` harus terisi bersama; titik tanpa radius mendapat radius 50 m.
        Nama harus unik per proyek dan tipe di antara zona yang belum dihapus. Proyek di luar wilayah REGION_ADMIN:
        403 `SCOPE_DENIED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolZoneInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolZone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          description: '`NOT_FOUND` `PROJECT_NOT_FOUND`: `project_code` tidak ada.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '409':
          description: '`DUPLICATE` `ZONE_NAME_TAKEN`: sudah ada zona dengan nama ini di proyek dan tipe yang sama.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'VALIDATION_ERROR: field wajib hilang atau di luar batas, field tidak dikenal, titik tanpa pasangan atau radius tanpa titik, `team_code` bukan regu proyek itu (`INVALID`), `checklist[i].*` tidak valid (mis. `options`, `attach_when`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /admin/zones/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getAdminZonesById
      tags:
      - Patrol
      summary: Detail PatrolZone
      description: 'Zona beserta checklist aktifnya. Zona di luar wilayah REGION_ADMIN: 403 `SCOPE_DENIED`.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolZone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
    patch:
      operationId: patchAdminZonesById
      tags:
      - Patrol
      summary: Ubah PatrolZone
      description: |
        Hanya field yang dikirim yang berubah (`null` pada `name`, `type`, `min_visit`, `photo_required`,
        `is_active`, `checklist` sama dengan tidak dikirim); `project_code` tidak bisa diubah. Titik dan radius
        dicek sebagai satu kesatuan: mengosongkan titik ikut mengosongkan radius, radius tanpa titik 422.
        Zona di luar wilayah REGION_ADMIN: 403 `SCOPE_DENIED`. Tanpa header `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolZoneUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolZone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          description: '`NOT_FOUND`: `ZONE_NOT_FOUND`, atau `PROJECT_NOT_FOUND` saat `team_code` diperiksa terhadap proyek yang sudah tidak ada.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '409':
          description: '`DUPLICATE` `ZONE_NAME_TAKEN`: sudah ada zona dengan nama ini di proyek dan tipe yang sama.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'VALIDATION_ERROR: field di luar batas, bertipe salah atau tidak dikenal, `start_date` bukan YYYY-MM-DD, titik/radius tidak konsisten, `team_code` bukan regu proyek zona (`INVALID`), `checklist[i].*` tidak valid.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    delete:
      operationId: deleteAdminZonesById
      tags:
      - Patrol
      summary: Hapus/non-aktifkan PatrolZone
      description: |
        Penghapusan lunak: baris tetap ada karena scan menunjuk ke sana, tetapi zona tidak lagi muncul. Check-in
        yang masih terbuka di zona itu ditutup. `data` bernilai `null`. Zona di luar wilayah REGION_ADMIN: 403
        `SCOPE_DENIED`.
      responses:
        '200':
          description: OK (`data` null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolAdminForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
  /admin/teams/{code}/members:
    parameters:
    - $ref: '#/components/parameters/TeamCodePath'
    get:
      operationId: getAdminTeamsByCodeMembers
      tags:
      - Organization
