        schema:
          type: string
          example: 1K-IBMI-S1
      - name: project_code
        in: query
        description: Proyek tertentu.
        schema:
          type: string
          example: 1K-IBMI-S
      - name: status
        in: query
        description: Status tersimpan; `ABSENT` untuk riwayat mangkir.
        schema:
          type: string
          enum:
          - PRESENT
          - LEAVE
          - ABSENT
      - name: month
        in: query
        description: Bulan, YYYY-MM.
        schema:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          example: 2026-03
      - $ref: '#/components/parameters/DateFromParam'
      - $ref: '#/components/parameters/DateToParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
