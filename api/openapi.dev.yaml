                      request_id: req_abc123
        '422':
          description: 'VALIDATION_ERROR / UNPROCESSABLE: tanggal hilang atau salah format, shift_group_id wajib (FIXED) atau
            harus kosong (FLEXIBLE), personil tidak aktif di Personalia (PERSONNEL_INACTIVE), atau zona waktu personil ambigu
            pada salah satu tanggal yang akan dibuat.'
          content:
