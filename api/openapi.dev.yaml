          type: integer
          format: int64
        name:
          type: string
          example: 5 Hari Kerja
        days:
          type: array
          items:
            $ref: '#/components/schemas/ShiftGroupDay'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShiftGroupDays:
      type: object
      additionalProperties: false
      description: Nama hari (huruf kecil persis, monday sampai sunday) ke id shift. Shift harus ada dan aktif (422 pada days.<hari>).
        Hari libur = id shift OFF.
      properties:
        monday:
          type: integer
          format: int64
          minimum: 1
        tuesday:
          type: integer
          format: int64
          minimum: 1
        wednesday:
          type: integer
          format: int64
          minimum: 1
        thursday:
          type: integer
          format: int64
          minimum: 1
        friday:
          type: integer
          format: int64
          minimum: 1
        saturday:
          type: integer
          format: int64
          minimum: 1
        sunday:
          type: integer
          format: int64
          minimum: 1
    ShiftGroupInput:
      type: object
      additionalProperties: false
      required:
      - name
      - days
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: WAJIB. Unik di organisasi; 409 SHIFT_GROUP_NAME_TAKEN.
        days:
          allOf:
          - $ref: '#/components/schemas/ShiftGroupDays'
          description: WAJIB, ketujuh hari (422 days.<hari> bila ada yang kurang).
    ShiftGroupUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional. `days` boleh sebagian: hanya hari yang dikirim yang berubah.
        Seperti PJ48, perubahan hanya pada pola: jadwal yang sudah dibuat tetap; tanggal yang dibuat
        sesudahnya (perpanjangan malam, atau pengaturan jadwal baru) mengikuti pola baru.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        days:
          $ref: '#/components/schemas/ShiftGroupDays'
    ScheduleType:
      type: string
      enum:
