openapi: 3.1.0
info:
  title: 'PERSIST API (dev: built endpoints only)'
  version: 1.0.0
  description: |
    **Dev copy.** Only the operations the API serves today. The complete contract is api/openapi.yaml; this file is made by scripts/make-dev-spec.py.

    Kontrak API resmi PERSIST (platform SaaS multi-tenant SiAPP rebuild) — integration
    seam untuk tim Core / Web / Mobile yang bekerja paralel. Sumber kebenaran kontrak
    endpoint (path, skema, security, scope, kode error) per DL-25.

    Tenancy: setiap entitas ter-scope ke `organization_id` (tenant = perusahaan
    Outsourcing). Isolasi ditegakkan via PostgreSQL RLS (`app.current_org`) dari klaim
    JWT (DL-19/DL-21). `business_line` (security|cleaning) BUKAN klaim JWT — ia atribut
    data per-proyek.

    Konvensi tipe data (DL-38): uang = string desimal (mis. "125000.00"), timestamp =
    UTC ISO-8601 dengan `Z`, tanggal-saja (DATE-ONLY) = `YYYY-MM-DD` tanpa zona.

    Amplop respons PERSIST (BUKAN application/problem+json): SuccessEnvelope /
    ListEnvelope / ErrorEnvelope. Kode error permukaan /api/v1/* = UPPERCASE
    machine-readable; pengecualian POST /oauth/token = kode RFC 6749 lowercase.

    CATATAN REALTIME: kanal realtime (WebSocket multipleks + FCM fallback, DL-35)
    BERADA DI LUAR OpenAPI ini; hanya REST yang dikontrakkan di sini.

    DI LUAR LINGKUP (sengaja tidak dikontrakkan): Penilaian/Review (HOLD, DL-46);
    HR-profile personil (education/qualification-history/work-experience/skill/salary/
    KTA, DEFERRED DL-16); Face Recognition (tautan eksternal, OUT).

    Catatan PII: seluruh contoh dianonimkan (NIK 32xxxxxxxxxxxxxx, nama Andi/Budi,
    username username01, email user01@contoh.com, telp 08xxxxxxxxxx).

    HEADER KORELASI GLOBAL: `X-Request-Id` dan `X-Tenant-Id` DITERIMA pada SEMUA
    operasi sebagai header korelasi/observability SAJA — tidak perlu di-`$ref` per-op.
    Server TIDAK pernah memakai `X-Tenant-Id` untuk otorisasi/isolasi (tenant selalu
    dari klaim `organization_id` di JWT, DL-19/DL-21); `X-Request-Id` (bila dikirim)
    digemakan di `meta.request_id` untuk korelasi audit lintas log/trace.

    OUT-OF-SCOPE for MVP (Phase 2): Developer Portal / Open API management (api_clients,
    api_keys, webhook_endpoints, webhook_deliveries, api_request_logs, api_usage_counters)
    and the cleaning vertical (E-Memo, Generate-QR) — schemas retained for forward-compat;
    endpoints to be added in a later phase. Penilaian (master_review/personnel_review)
    remains HOLD (DL-46); HR-profile & Face-Recognition OUT.
  contact:
    name: PT Artha Solusi Kreasindo — Platform Engineering
    email: tech@akseskerja.com
servers:
- url: /api/v1
  description: Dev server (same origin as this page)
security:
- bearerSession: []
tags:
- name: Auth
  description: Otentikasi sesi (mobile & web)
- name: Masters
  description: Master/konfigurasi org-scoped + referensi nasional
- name: Organization
  description: |
    Domain organisasi: koordinator wilayah, kantor cabang, klien, proyek, regu, anggota regu, shift dan jadwal.
    Satu grup (KPI, IDS, PCD) adalah satu organisasi. Kode adalah id (D19): server yang membuatnya, tidak dapat diubah, dan
    tidak dipakai ulang walau barisnya dihapus.

    **Aturan untuk semua operasi**
    - Semua tanggal adalah tanggal bisnis di zona waktu proyek (WIB, WITA, atau WIT); "hari ini" juga menurut zona proyek, bukan UTC.
    - Jalur `/admin/...` memerlukan web role (staf lapangan 403 `NOT_ADMIN`). REGION_ADMIN hanya menjangkau wilayahnya
      (wilayah dibaca dari angka di depan kode: `1K-IBMI-S1` ada di OS1); di luar itu 403 `SCOPE_DENIED`, dijawab sebelum database
      ditanya. Aksi yang hanya untuk ORG_ADMIN: 403 `ROLE_DENIED`. Jalur lapangan (`/teams`, `/personnels/{id}`) tidak memerlukan
      web role: pemanggil melihat apa yang dibolehkan regu tempat ia bertugas hari ini.
    - Daftar: `page` 1 sampai 1000000, `limit` 1 sampai 100, `q` paling panjang 100 karakter. Di luar batas 422, tidak dipotong.
      Query string dengan karakter NUL 400.
    - Body: JSON satu objek, paling besar 1 MB (413). Field yang tidak dikenal 422. Karakter NUL (`\u0000`) 400.
      Field opsional yang tidak dikirim tidak berubah pada PATCH; `null` hanya berarti "hapus" bila field ditandai nullable.
    - id angka di path (shift, shift group, jadwal, personil, keanggotaan) harus angka positif; selain itu 404 resource itu.
    - Kode di path yang tidak ada atau sudah dihapus: 404. Penghapusan selalu lunak.
    - Perubahan dicatat di audit log dengan nilai sebelum dan sesudah. PATCH yang tidak mengubah apa pun tidak mencatat apa-apa.
    - Bentuk galat: `error.code` (enum ErrorCode), `error.details.reason` (enum OrganizationErrorReason), dan `error.errors[]`
      (field, code, message) untuk 422.
- name: Attendance
  description: Kehadiran (absensi) + koreksi
- name: Permission
  description: Izin & tukar jaga
- name: Instruction
  description: Instruksi + acknowledgement
- name: Media
  description: |
    Unggahan foto (swafoto absensi, laporan, instruksi, scan patroli, panik, aset, E-Memo).
    Alurnya sama untuk semua penyimpanan: daftarkan (`POST /media`), kirim byte dengan `PUT`
    ke `upload_url` memakai `upload_headers`, lalu konfirmasi (`POST /media/{id}/complete`).
    Klien tidak pernah menyusun URL sendiri dan tidak perlu tahu penyimpanan di baliknya.

    - Berkas yang sudah `UPLOADED` dilampirkan ke catatan lewat `media_ids` pada input
      create fitur (laporan, scan patroli, laporan aset, dst.).
    - Tidak ada endpoint baca per id media. Fitur pemilik catatan yang memberi akses, dan
      `photos` di responsnya berisi URL bertanda tangan berumur pendek (sekitar 1 jam).
      Jangan menyimpan URL itu; minta ulang catatannya.
    - Jenis yang diizinkan `image/jpeg`, `image/png`, `image/webp`; paling besar 10 MB.
    - Metadata pengambilan (waktu, GPS, sumber) disimpan sebagai bukti anti-kecurangan.
- name: Report
  description: Laporan lapangan (offline-capable)
- name: Patrol
  description: Patroli & Jaga (zona, scan, check-in)
- name: Panic
  description: Sinyal panik
- name: Notification
  description: Notifikasi mobile + FCM token (12 event)
- name: Tracking
  description: Personnel tracking (location logs)
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session JWT (mobile/web) dari POST /auth/login. Klaim wajib: sub, organization_id,
        roles/scope, exp, iat. Middleware set app.current_org → RLS.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Personel-Signature
      description: |
        HMAC-SHA256 (heksadesimal) dari body mentah dengan `PERSONEL_WEBHOOK_SECRET`. Dipakai
        webhook Personel; operasi itu bertanda `security: []` karena tidak membawa token sesi.
    oauth2ClientCredentials:
      type: oauth2
      description: |
        Public API M2M per-organisasi (DL-26). Token org-scoped membawa organization_id +
        scopes granular (resource:action), menempuh isolasi RLS yang sama. Scope kurang →
        403 INSUFFICIENT_SCOPE.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            personnel:read: Baca data personil
            personnel:write: Tulis data personil
            attendance:read: Baca kehadiran
            attendance:write: Tulis kehadiran
            reports:read: Baca laporan
            reports:write: Tulis laporan
            instructions:read: Baca instruksi
            instructions:write: Tulis instruksi
            patrol:read: Baca patroli/jaga
            patrol:write: Tulis patroli/jaga
            panic:read: Baca panik
            panic:write: Kirim/selesaikan panik
            cctv:read: Baca CCTV
            assets:read: Baca aset
            assets:write: Tulis laporan aset
            masters:read: Baca master/konfigurasi
            masters:write: Tulis master/konfigurasi
            reviews:read: Baca penilaian (master + personil)
            reviews:write: Tulis penilaian (master + kirim penilaian personil)
            organization:read: Baca domain organisasi
            organization:write: Tulis domain organisasi
            e-memo:read: Baca E-Memo (vertikal cleaning)
            e-memo:write: Tulis/kirim/balas E-Memo (vertikal cleaning)
            qr:generate: Generate/kelola QR identitas zona (vertikal cleaning)
            billing:read: Baca billing
            webhooks:read: Baca webhook endpoints + deliveries (WEB-38)
            webhooks:write: Kelola webhook endpoints, replay deliveries (WEB-38)
            developer:read: Baca kredensial API + usage/metering Developer Portal (WEB-38)
            developer:write: Kelola api_clients/api_keys (buat/rotasi/revoke) Developer Portal (WEB-38)
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key ber-scope statis (alternatif ringan OAuth), org-scoped + ber-scope +
        expires_at opsional. Format `<prefix>.<secret>`.
  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (1-indexed), paling besar 1000000 (422 page).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Item per halaman (maks 100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    QParam:
      name: q
      in: query
      description: 'Pencarian teks tanpa membedakan huruf besar/kecil, paling panjang 100 karakter (422 bila lebih). Dicocokkan
        sebagai potongan teks biasa: % dan _ bukan wildcard.'
      required: false
      schema:
        type: string
        maxLength: 100
    DateFromParam:
      name: date_from
      in: query
      description: Awal rentang (YYYY-MM-DD, relatif TZ proyek).
      required: false
      schema:
        type: string
        format: date
    DateToParam:
      name: date_to
      in: query
      description: Akhir rentang (YYYY-MM-DD, relatif TZ proyek).
      required: false
      schema:
        type: string
        format: date
    SinceParam:
      name: since
      in: query
      description: Delta-sync watermark (updated_at). Tanpa since → full pull (DL-34).
      required: false
      schema:
        type: string
        format: date-time
    CursorParam:
      name: cursor
      in: query
      description: Cursor opaque untuk tarik inkremental (DL-34).
      required: false
      schema:
        type: string
    IsActiveParam:
      name: is_active
      in: query
      description: Filter status aktif.
      required: false
      schema:
        type: boolean
    StatusParam:
      name: status
      in: query
      description: Filter status/enum resource.
      required: false
      schema:
        type: string
    IdPath:
      name: id
      in: path
      required: true
      description: Identitas resource.
      schema:
        type: integer
        format: int64
    RegionCodePath:
      name: code
      in: path
      required: true
      description: Kode koordinator wilayah (contoh OS1).
      schema:
        type: string
        pattern: ^OS[1-9][0-9]*$
        example: OS1
    BranchCodePath:
      name: code
      in: path
      required: true
      description: Kode kantor cabang (contoh 1K).
      schema:
        type: string
        pattern: ^[1-9][0-9]*[KIP]$
        example: 1K
    ClientCodePath:
      name: code
      in: path
      required: true
      description: Kode klien (contoh 1K-IBMI).
      schema:
        type: string
        example: 1K-IBMI
    ProjectCodePath:
      name: code
      in: path
      required: true
      description: Kode proyek (contoh 1K-IBMI-S).
      schema:
        type: string
        example: 1K-IBMI-S
    TeamCodePath:
      name: code
      in: path
      required: true
      description: Kode regu (contoh 1K-IBMI-S1).
      schema:
        type: string
        example: 1K-IBMI-S1
    RegionCodeQuery:
      name: region_code
      in: query
      required: false
      description: Opsional. Hanya baris di koordinator wilayah ini.
      schema:
        type: string
        example: OS1
    BranchCodeQuery:
      name: branch_code
      in: query
      required: false
      description: Opsional. Hanya baris di kantor cabang ini.
      schema:
        type: string
        example: 1K
    ClientCodeQuery:
      name: client_code
      in: query
      required: false
      description: Opsional. Hanya baris milik klien ini.
      schema:
        type: string
        example: 1K-IBMI
    ProjectCodeQuery:
      name: project_code
      in: query
      required: false
      description: Opsional. Hanya baris di proyek ini.
      schema:
        type: string
        example: 1K-IBMI-S
    BusinessLineQuery:
      name: business_line
      in: query
      required: false
      description: Opsional. Hanya proyek bidang usaha ini; nilai lain 422.
      schema:
        $ref: '#/components/schemas/BusinessLine'
    TeamMembershipIdPath:
      name: id
      in: path
      required: true
      description: Nomor keanggotaan (id dari TeamMembership). Harus angka positif; selain itu 404 (id seperti itu tidak mungkin
        ada).
      schema:
        type: integer
        format: int64
        minimum: 1
    PersonnelIdOfMemberPath:
      name: personnel_id
      in: path
      required: true
      description: Nomor personil anggota yang dikeluarkan. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin
        ada).
      schema:
        type: integer
        format: int64
        minimum: 1
    OnDateQuery:
      name: on_date
      in: query
      required: false
      description: 'Opsional. Tanggal bisnis (YYYY-MM-DD). Bawaan: hari ini di zona waktu proyek regu.'
      schema:
        type: string
        format: date
    ShiftIdPath:
      name: id
      in: path
      required: true
      description: Nomor shift. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada).
      schema:
        type: integer
        format: int64
        minimum: 1
    ShiftGroupIdPath:
      name: id
      in: path
      required: true
      description: Nomor shift group. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada).
      schema:
        type: integer
        format: int64
        minimum: 1
    ScheduleIdPath:
      name: id
      in: path
      required: true
      description: Nomor jadwal. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada).
      schema:
        type: integer
        format: int64
        minimum: 1
    DateFromQuery:
      name: date_from
      in: query
      required: true
      description: WAJIB. Tanggal bisnis awal (YYYY-MM-DD).
      schema:
        type: string
        format: date
    DateToQuery:
      name: date_to
      in: query
      required: true
      description: WAJIB. Tanggal bisnis akhir (YYYY-MM-DD), tidak sebelum date_from, rentang paling lama 62 hari.
      schema:
        type: string
        format: date
    PersonnelIdQuery:
      name: personnel_id
      in: query
      required: false
      description: Opsional. Hanya jadwal personil ini.
      schema:
        type: integer
        format: int64
        minimum: 1
    TeamCodeQuery:
      name: team_code
      in: query
      required: false
      description: 'Opsional. Hanya jadwal personil yang menjadi anggota regu ini pada tanggal jadwalnya. REGION_ADMIN: regu
        di wilayah lain 403.'
      schema:
        type: string
        example: 1K-IBMI-S1
    PersonnelIdPath:
      name: personnel_id
      in: path
      required: true
      description: Identitas lokal orang (personnels.id), bukan id Personalia. Harus angka positif; selain itu 404 (id seperti
        itu tidak mungkin ada).
      schema:
        type: integer
        format: int64
        minimum: 1
    TeamRolePath:
      name: team_role
      in: path
      required: true
      description: 'Peran regu yang hak-haknya dibaca atau diganti: DANRU atau MEMBER. Selain itu 404.'
      schema:
        $ref: '#/components/schemas/TeamRole'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUIDv4 stabil seumur item; WAJIB untuk mutasi tak-aman yang dapat di-retry/antre
        offline (DL-34). Retry key sama → respons tersimpan; body berbeda + key sama →
        409 CONFLICT.
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequiredHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID stabil seumur item; tanpa header ini 422 VALIDATION_ERROR. Retry dengan key dan body
        yang sama → respons tersimpan dengan header `Idempotent-Replayed: true`; body berbeda +
        key sama → 409 CONFLICT `IDEMPOTENCY_KEY_REUSED`. Permintaan pertama dengan key itu masih
        berjalan → 409 `IDEMPOTENCY_KEY_IN_FLIGHT` (coba lagi sebentar lagi). Permintaan pertama
        berhasil tetapi responsnya tidak bisa disimpan → 409 `IDEMPOTENCY_RESPONSE_NOT_STORED`
        (jangan kirim ulang dengan key baru, itu mengulang aksinya; muat ulang datanya).
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Token tidak ada/kedaluwarsa/invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthenticated:
              value:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Token tidak ditemukan.
                meta:
                  request_id: req_abc123
            expired:
              value:
                success: false
                error:
                  code: TOKEN_EXPIRED
                  message: Token kedaluwarsa.
                meta:
                  request_id: req_abc123
    Forbidden:
      description: Role/scope tidak berwenang.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              value:
                success: false
                error:
                  code: FORBIDDEN
                  message: Akses ditolak.
                meta:
                  request_id: req_abc123
            insufficientScope:
              value:
                success: false
                error:
                  code: INSUFFICIENT_SCOPE
                  message: Scope tidak mencukupi.
                  details:
                    scope_required: personnel:write
                meta:
                  request_id: req_abc123
    NotFound:
      description: Resource tidak ada atau di luar organisasi JWT (anti-enumerasi).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Data tidak ditemukan.
            meta:
              request_id: req_abc123
    ValidationError:
      description: Validasi body/query gagal atau aturan bisnis gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Validasi gagal pada beberapa field.
              errors:
              - field: nik
                code: DUPLICATE
                message: NIK sudah terdaftar.
            meta:
              request_id: req_abc123
    Conflict:
      description: Pelanggaran UNIQUE / state konflik.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: CONFLICT
              message: Data konflik.
            meta:
              request_id: req_abc123
    RateLimited:
      description: Terlalu banyak percobaan.
      headers:
        Retry-After:
          description: Detik sebelum mencoba lagi.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Epoch detik reset kuota.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Terlalu banyak permintaan.
            meta:
              request_id: req_abc123
    BadRequest:
      description: BAD_REQUEST — body bukan satu objek JSON yang valid (atau berisi karakter NUL).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — body lebih dari 1 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: |
        Persist Personel (Personalia) tidak dapat menjawab. `error.code` = INTERNAL_ERROR dengan
        `error.details.reason` = PERSONEL_UNAVAILABLE (ErrorCode tidak punya kode 503). Klien mencoba lagi nanti.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: Layanan Personalia sedang tidak tersedia. Coba lagi sebentar lagi.
              details:
                reason: PERSONEL_UNAVAILABLE
            meta:
              request_id: req_abc123
  schemas:
    Meta:
      type: object
      required:
      - request_id
      properties:
        request_id:
          type: string
          description: Korelasi audit.
        server_time:
          type: string
          format: date-time
          description: Watermark monoton untuk delta-sync (DL-34).
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      - total_pages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 143
        total_pages:
          type: integer
          example: 8
    SuccessEnvelope:
      type: object
      required:
      - success
      - data
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    ListEnvelope:
      type: object
      required:
      - success
      - data
      - pagination
      - meta
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorCode:
      type: string
      description: Kode error UPPERCASE machine-readable permukaan /api/v1/*.
      enum:
      - VALIDATION_ERROR
      - UNAUTHENTICATED
      - TOKEN_EXPIRED
      - FORBIDDEN
      - INSUFFICIENT_SCOPE
      - NOT_FOUND
      - CONFLICT
      - DUPLICATE
      - UNDERSTAFFED
      - PAYLOAD_TOO_LARGE
      - UNPROCESSABLE
      - RATE_LIMITED
      - INTERNAL_ERROR
      - BAD_REQUEST
      - ROLE_DENIED
      - ORG_MISMATCH
      - SCOPE_DENIED
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          example: nik
        code:
          type: string
          example: DUPLICATE
        message:
          type: string
          example: NIK sudah terdaftar.
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      - meta
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Pesan human-readable (Bahasa Indonesia).
            details:
              type: object
              additionalProperties: true
              description: |
                Konteks tambahan opsional (mis. scope_required, retry_after). `details.reason` adalah
                kode mesin yang lebih rinci dari `error.code`; yang sudah dirilis tidak pernah diganti
                namanya. Reason lintas-modul (reason milik satu endpoint ada pada deskripsi endpoint itu):

                - 401 `AUTH_TOKEN_INVALID`: token hilang, rusak, atau salah tanda tangan; ke layar login.
                - 401 `AUTH_TOKEN_EXPIRED` (code `TOKEN_EXPIRED`): token akses lewat masa berlaku;
                  refresh sekali lalu ulangi.
                - 401 `AUTH_INVALID_CREDENTIALS`, 403 `AUTH_DEVICE_BOUND`, 403
                  `AUTH_ORGANIZATION_SUSPENDED`: lihat `POST /auth/login`.
                - 409 `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`,
                  `IDEMPOTENCY_RESPONSE_NOT_STORED`: lihat header `Idempotency-Key`.
                - 422 `OCCURRED_AT_IN_FUTURE`: item offline mengaku terjadi lebih dari 5 menit ke depan.
                - 422 `OCCURRED_AT_TOO_OLD`: item offline lebih tua dari jendela offline 7 hari.
                - 503 `PERSONEL_UNAVAILABLE` (code `INTERNAL_ERROR`): Personalia tidak menjawab; coba lagi nanti.
                - 404 `NOT_FOUND` dengan reason `ATTENDANCE_NOT_FOUND`, `NOTIFICATION_NOT_FOUND`,
                  `CATEGORY_NOT_FOUND`, `PANIC_TYPE_NOT_FOUND`, `LETTERHEAD_NOT_FOUND`, `APP_LINK_NOT_FOUND`,
                  `LEAVE_CATEGORY_NOT_FOUND`, `LEAVE_CLIENT_NOT_FOUND`: data tidak ada, sudah dihapus, atau
                  milik organisasi/orang lain (tidak dibedakan).
                - 422 `CATEGORY_KIND_MISMATCH`: kategori bukan untuk jenis data itu.
                - 409 `MASTER_IN_USE`: master masih dipakai; nonaktifkan, jangan hapus.
                - 409 `ACCESS_OWN_ROLE_PROTECTED`: admin tidak boleh mencabut atau mempersempit perannya sendiri.
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
        meta:
          type: object
          required:
          - request_id
          properties:
            request_id:
              type: string
