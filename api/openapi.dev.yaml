      responses:
        '200':
          description: Gambar QR (PNG 512 piksel atau SVG)
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename=qr-checkpoint-gerbang-utama.png
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
