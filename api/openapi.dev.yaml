  /ws/ticket:
    post:
      operationId: postWsTicket
      tags:
      - Notification
      summary: Tiket sekali pakai untuk membuka WebSocket dari browser
      description: |
        Browser tidak bisa mengirim header `Authorization` pada WebSocket, dan token akses di URL
        akan tersimpan di log proxy. Tukarkan token akses dengan tiket yang berlaku 30 detik dan
        hanya untuk satu koneksi, lalu buka `GET /api/v1/ws?ticket=...` dengan subprotocol
        `persist.v1`. Aplikasi mobile cukup memakai `Authorization: Bearer`.

        Koneksi ditutup dengan kode `4401` saat token akses yang meminta tiket kedaluwarsa atau
        sesinya diakhiri; klien memperbarui token, meminta tiket baru, dan menyambung lagi.
        Protokol WebSocket itu sendiri (room, frame) ada di dokumen realtime dan di luar kontrak
        OpenAPI ini.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/WsTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /integrations/personel/events:
    post:
      operationId: postIntegrationsPersonelEvents
      tags:
      - Notification
      summary: Penerima event perubahan dari Persist Personel (webhook)
      description: |
        Dipanggil oleh Personel, bukan oleh aplikasi. Tidak memakai token; keasliannya dijamin
        tanda tangan `X-Personel-Signature` (HMAC-SHA256 dari body mentah dengan
        `PERSONEL_WEBHOOK_SECRET`, heksadesimal, boleh berawalan `sha256=`).

        - `timestamp` lebih lama atau lebih baru dari 5 menit ditolak (401).
        - `event_id` diklaim saat diproses (2 menit) dan disimpan 7 hari setelah berhasil; kiriman
          ulang dijawab 200 `duplicate` tanpa diproses lagi, karena Personel mengirim minimal
          sekali. Kiriman ulang saat event yang sama masih diproses dijawab 409
          `WEBHOOK_EVENT_IN_PROGRESS`: Personel mengulang, jadi event tidak hilang bila proses
          pertama mati di tengah jalan.
        - `organization_id` harus organisasi yang ada (404 jika tidak).
        - Tipe: `employee.updated`, `employee.deactivated`, `placement.changed`,
          `position.changed`. `leave.decided` diterima dan diabaikan di sini (ditangani modul
          cuti). Tipe lain dijawab 200 `ignored` agar Personel tidak mengulang tanpa akhir.
        - Kegagalan pemrosesan dijawab 5xx; Personel mengulang dan event diproses saat itu.
      security: []
      x-webhook-security: webhookSignature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonelEvent'
      responses:
        '200':
          description: Diterima.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PersonelEventResult'
        '400':
          description: Isi event tidak valid (details.reason WEBHOOK_PAYLOAD_INVALID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Tanda tangan tidak valid atau timestamp terlalu jauh (details.reason WEBHOOK_SIGNATURE_INVALID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Organisasi tidak dikenal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Event yang sama sedang diproses (details.reason WEBHOOK_EVENT_IN_PROGRESS). Kirim ulang nanti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /notifications:
    get:
      operationId: getNotifications
      tags:
      - Notification
      summary: List notifikasi (paginasi + delta-sync)
      description: |-
        Hanya notifikasi milik pemanggil. Dua bentuk jawaban:
        - **Tanpa `since` dan `cursor`**: daftar berhalaman (`page`, `limit`, terbaru dulu) dengan
          `pagination`, tanpa `deleted`. `unread_only=true` menyaring yang belum dibaca.
          `meta.server_time` tetap dikirim: itulah watermark pertama klien. Pada tarikan penuh
          berhalaman, simpan `server_time` dari halaman PERTAMA.
        - **Dengan `since` dan/atau `cursor`** (delta-sync, DL-34/DL-57): baris yang berubah sejak
          itu (dibuat atau dibaca) di `data`, tombstone baris yang dihapus di `deleted`, urut
          `updated_at` naik, tanpa `pagination`. `has_more=true` → ulangi dengan
          `cursor=next_cursor`. Simpan `meta.server_time` sebagai `since` berikutnya. Server
          menarik batas bawah `since` mundur beberapa detik, jadi baris yang baru saja berubah
          boleh datang dua kali: upsert berdasarkan `id`. `unread_only=true` tidak boleh
          dikirim bersama `since`/`cursor` (422), karena baris yang berganti jadi dibaca akan
          hilang dari aliran tanpa tombstone.
      parameters:
      - name: unread_only
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/SinceParam'
      - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: 'OK. Delta-sync: `since` → `data` ter-upsert + `deleted` tombstone (DL-34); `meta.server_time` WAJIB.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notification'
                    deleted:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tombstone'
                    pagination:
                      $ref: '#/components/schemas/Pagination'
                    meta:
                      $ref: '#/components/schemas/DeltaMeta'
              example:
                success: true
                data:
                - id: 4401
                  organization_id: 1
