    PatrolNotInProject:
      description: '403 `FORBIDDEN`, `details.reason` = `PERMISSION_DENIED` (tanpa izin `patrol.scan`/`guard.scan` menurut tipe zona) atau `ZONE_NOT_IN_PROJECT` (tidak bertugas di proyek atau regu zona pada tanggal kerja itu).'
