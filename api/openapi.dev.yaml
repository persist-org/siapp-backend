        karena dicetak jadi stiker; keamanannya dari geofence checkpoint di server, id organisasi di isinya, dan
        `POST /admin/checkpoints/{id}/rotate-qr` bila stiker bocor. Header `Content-Disposition` memuat nama berkas
        dari nama checkpoint (`qr-checkpoint-<nama>.png`); respons `Cache-Control: private, no-store` karena gambar
