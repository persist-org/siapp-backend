                    meta:
                      request_id: req_abc123
                nameBlank:
                  summary: 'name hanya spasi'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: name
                        code: REQUIRED
                        message: 'Tidak boleh kosong.'
                    meta:
                      request_id: req_abc123
                nameTooLong:
                  summary: 'name lebih dari 100 karakter setelah spasi dirapikan'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
                      errors:
                      - field: name
                        code: INVALID
                        message: 'Maksimum 100 karakter.'
                    meta:
                      request_id: req_abc123
                headerTooLong:
                  summary: 'header_text lebih dari 2000 karakter'
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: 'Validasi gagal pada beberapa field.'
