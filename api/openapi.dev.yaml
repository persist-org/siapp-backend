        Hanya untuk anggota proyek hari ini (menurut zona waktu proyek); bukan anggota 403 SCOPE_DENIED (reason NOT_PROJECT_MEMBER), proyek yang tidak ada, sudah dihapus atau milik organisasi lain 404 (PROJECT_NOT_FOUND; dicek lebih dulu dari keanggotaan). Isinya kontak proyek ditambah nomor cadangan tiap tipe stakeholder aktif yang punya `default_phone` dan belum punya kontak di proyek itu (`is_default: true`, `name` = nama tipe), diurutkan menurut `sort_order` tipe lalu id. Tidak dipaginasi sungguhan: `pagination` halaman 1, `limit` = jumlah baris (minimal 1). Cukup token sesi yang valid (tanpa web role).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProjectContact'
        '400':
          $ref: '#/components/responses/MdBadRequestQuery'
        '401':
          $ref: '#/components/responses/MdUnauthorized'
        '403':
          description: 'SCOPE_DENIED (NOT_PROJECT_MEMBER): pemanggil tidak bertugas di proyek ini hari ini.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notMember:
                  value:
                    success: false
                    error:
                      code: SCOPE_DENIED
                      message: 'Anda bukan anggota proyek ini.'
                      details:
                        reason: NOT_PROJECT_MEMBER
                    meta:
                      request_id: req_abc123
        '404':
          description: 'NOT_FOUND (PROJECT_NOT_FOUND): proyek tidak ada, sudah dihapus, atau milik organisasi lain.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notFound:
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: 'Proyek tidak ditemukan.'
                      details:
                        reason: PROJECT_NOT_FOUND
                    meta:
                      request_id: req_abc123
  /media:
    post:
      operationId: postMedia
      tags:
      - Media
      summary: Daftarkan unggahan foto (offline-capable)
      description: |
        Langkah pertama dari tiga: daftarkan, `PUT` byte ke `upload_url`, lalu `POST /media/{id}/complete`.
        Siapa pun yang sudah masuk boleh mendaftarkan; fitur yang melampirkan foto menilai haknya
        atas catatannya sendiri. `Idempotency-Key` WAJIB: antrean media offline mengulang permintaan
        ini, dan ulangan dengan kunci yang sama mengembalikan id dan `upload_url` yang sama.
        `upload_url` hanya berlaku 30 menit (`expires_at`), sedangkan ulangan tetap menjawab URL
        yang sama: antrean yang mengulang setelah itu meminta URL baru lewat
        `POST /media/{id}/upload-url` (id tetap), bukan mendaftarkan ulang.

        Media yang tidak pernah dikonfirmasi atau tidak pernah dilampirkan dihapus otomatis
        sesudah 24 jam. Ulangan dengan `Idempotency-Key` yang sama tetap menjawab id lama walau
        barisnya sudah dihapus: `upload-url` dan `complete` lalu menjawab 404 `MEDIA_NOT_FOUND`
        (atau `upload-url` menjawab 409 `MEDIA_EXPIRED` menjelang batas itu). Antrean yang
        menemukan salah satunya mendaftarkan ulang dengan `Idempotency-Key` baru.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID stabil seumur item antrean. Tanpa header ini 422.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaCreate'
      responses:
        '201':
          description: 'Terdaftar. Ulangan dengan Idempotency-Key dan body yang sama dijawab 201 juga, berisi respons pertama
            apa adanya, dengan header `Idempotent-Replayed: true`.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/MediaUpload'
        '400':
          description: 'BAD_REQUEST: body kosong, bukan JSON yang valid, lebih dari satu objek, atau memuat karakter NUL.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: CONFLICT dengan `details.reason` IDEMPOTENCY_KEY_REUSED (key sama, body berbeda), IDEMPOTENCY_KEY_IN_FLIGHT
            (permintaan pertama masih berjalan) atau IDEMPOTENCY_RESPONSE_NOT_STORED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: 'PAYLOAD_TOO_LARGE: body JSON lebih dari 1 MB, atau `size_bytes` lebih dari 10 MB (reason `MEDIA_TOO_LARGE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tooLarge:
                  value:
                    success: false
                    error:
                      code: PAYLOAD_TOO_LARGE
                      message: Ukuran foto melebihi 10 MB.
                      details:
                        reason: MEDIA_TOO_LARGE
                    meta:
                      request_id: req_abc123
        '422':
          description: VALIDATION_ERROR (field salah / tak dikenal, koordinat tidak berpasangan, `captured_at` di masa depan, atau
            `Idempotency-Key` tidak ada / bukan UUID, dengan errors[].field `Idempotency-Key`) atau UNPROCESSABLE dengan reason
            `MEDIA_TYPE_NOT_ALLOWED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /media/{id}/upload-url:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postMediaUploadUrl
      tags:
      - Media
      summary: Minta URL unggah baru untuk media yang belum dikonfirmasi
      description: |
        Hanya pemilik, dan hanya selama media masih `PENDING`. `upload_url` dari `POST /media`
        berlaku 30 menit, dan ulangan `POST /media` dengan `Idempotency-Key` yang sama menjawab URL
        lama itu; endpoint ini menerbitkan URL baru untuk id yang sama, dengan jenis dan ukuran
        yang didaftarkan. Tidak ada body dan tidak butuh `Idempotency-Key`: setiap panggilan
        menandatangani URL baru.

        Bila byte sudah sampai tetapi jawabannya hilang, URL baru dijawab 412 saat dipakai
        (satu URL hanya membuat, tidak menimpa): panggil `complete`.

        Media orang lain, milik organisasi lain, atau yang tidak ada: 404 `MEDIA_NOT_FOUND`.
        Media yang sudah `UPLOADED`: 409 `MEDIA_ALREADY_UPLOADED`.

        Media yang sudah lebih dari 22,5 jam sejak didaftarkan: 409 `MEDIA_EXPIRED`. Media yang
        belum dilampirkan dihapus otomatis sesudah 24 jam, dan URL baru tidak boleh hidup lebih
        lama dari barisnya (byte yang masuk sesudah baris dihapus tidak akan pernah dibersihkan).
        Daftarkan ulang lewat `POST /media` dengan `Idempotency-Key` baru.
      responses:
        '200':
          description: URL baru
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/MediaUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          description: 'CONFLICT dengan reason `MEDIA_ALREADY_UPLOADED` (media sudah dikonfirmasi, tidak ada yang perlu diunggah)
            atau `MEDIA_EXPIRED` (terlalu dekat dengan batas hapus otomatis: daftarkan ulang).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                alreadyUploaded:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Foto sudah terunggah dan dikonfirmasi.
                      details:
                        reason: MEDIA_ALREADY_UPLOADED
                    meta:
                      request_id: req_abc123
                expired:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Pendaftaran foto sudah kedaluwarsa. Daftarkan ulang foto ini.
                      details:
                        reason: MEDIA_EXPIRED
                    meta:
                      request_id: req_abc123
        '500':
          $ref: '#/components/responses/SysInternalError'
  /media/{id}/complete:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postMediaComplete
      tags:
      - Media
      summary: Konfirmasi byte sudah terunggah
      description: |
        Hanya pemilik. Server memeriksa bahwa objeknya ada, ukurannya sama dengan yang didaftarkan,
        dan isinya benar-benar gambar dari jenis yang didaftarkan (bukan sekadar yang diakui klien),
        lalu mengubah status menjadi `UPLOADED`. Boleh diulang: media yang sudah `UPLOADED`
        dijawab 200 tanpa memeriksa lagi.

        Media orang lain, milik organisasi lain, atau yang tidak ada: 404 `MEDIA_NOT_FOUND`.
        Pemeriksaan gagal: 409 `MEDIA_NOT_UPLOADED`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          description: 'CONFLICT dengan reason `MEDIA_NOT_UPLOADED`: byte belum ada, ukurannya berbeda, atau isinya bukan
            gambar dari jenis yang didaftarkan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notUploaded:
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: Foto belum terunggah atau tidak sesuai dengan yang didaftarkan.
                      details:
                        reason: MEDIA_NOT_UPLOADED
                    meta:
                      request_id: req_abc123
        '500':
          $ref: '#/components/responses/SysInternalError'
  /media/blobs/{token}:
    parameters:
    - name: token
      in: path
      required: true
      description: Token bertanda tangan dari `upload_url` atau dari URL foto. Kredensial selama berlaku, jangan dicatat di
        log.
      schema:
        type: string
    get:
      operationId: getMediaBlob
      tags:
      - Media
      summary: Lihat foto di penyimpanan server (hanya STORAGE_DRIVER=local)
      description: |
        URL ini muncul di `photos` respons fitur, bukan untuk disusun klien. Tanpa bearer token:
        token bertanda tangan (operasi get, kunci, jenis, kedaluwarsa) adalah izinnya, dan umurnya
        pendek (sekitar 1 jam). Dikirim dengan `Content-Type` yang ditandatangani,
        `X-Content-Type-Options: nosniff`, `Content-Disposition: inline` dan
        `Cache-Control: private` yang tidak lebih lama dari umur token. Mendukung `Range`.
      security: []
      responses:
        '200':
          description: Isi foto
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '403':
          description: 'FORBIDDEN dengan reason `MEDIA_URL_INVALID`: token rusak, lebih dari 2048 karakter, kedaluwarsa, atau untuk operasi lain.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '206':
          description: Sebagian isi (permintaan `Range`; jawaban `http.ServeContent`). Header sama dengan 200.
        '304':
          description: Tidak berubah (permintaan bersyarat `If-Modified-Since`).
        '404':
          description: 'NOT_FOUND: berkas tidak ada di disk (reason `MEDIA_NOT_FOUND`), atau server memakai `minio`/`s3` (rute ini
            tidak aktif; NOT_FOUND tanpa reason).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '416':
          description: Rentang `Range` tidak dapat dipenuhi (jawaban teks polos `http.ServeContent`).
        '500':
          $ref: '#/components/responses/SysInternalError'
    put:
      operationId: putMediaBlob
      tags:
      - Media
      summary: Unggah byte ke penyimpanan server (hanya STORAGE_DRIVER=local)
      description: |
        Hanya ada bila server menyimpan berkas sendiri (`STORAGE_DRIVER=local`); dengan `minio` atau
        `s3` byte langsung ke penyimpanan objek dan rute ini dijawab 404. Klien tidak pernah
        menyusun alamat ini: ia memakai `upload_url` dan `upload_headers` dari `POST /media`.

        Tanpa bearer token: tanda tangan di token adalah izinnya. Token memuat operasi (put),
        kunci objek, jenis, ukuran paling besar dan waktu kedaluwarsa, sehingga token baca tidak
        bisa dipakai menulis. Body harus tepat sebesar yang ditandatangani (bukan batas 1 MB
        milik JSON). Berkas ditulis ke file sementara lalu dipindah, jadi unggahan yang terputus
        tidak meninggalkan berkas.

        Kegagalan: 403 `MEDIA_URL_INVALID` (token rusak, kedaluwarsa, untuk operasi lain, atau
        `Content-Type` tidak sama dengan yang ditandatangani), 413 `MEDIA_URL_INVALID` (body lebih
        besar dari yang ditandatangani), 412 `MEDIA_URL_INVALID` (foto untuk URL ini sudah
        tersimpan: satu URL hanya membuat, tidak pernah menimpa, agar foto yang sudah diperiksa
        atau dilampirkan tidak dapat diganti).
      security: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Tersimpan
        '400':
          description: 'BAD_REQUEST: body kosong, unggahan terputus, atau ukuran body tidak sama dengan yang didaftarkan (tidak
            ada yang disimpan, URL yang sama masih bisa dipakai dengan byte yang benar).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN dengan reason `MEDIA_URL_INVALID`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '412':
          description: 'CONFLICT dengan reason `MEDIA_URL_INVALID`: foto untuk URL ini sudah tersimpan (status yang sama dengan
            S3/MinIO untuk kasus ini).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: NOT_FOUND tanpa reason — server memakai `minio`/`s3`, rute ini tidak aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: 'PAYLOAD_TOO_LARGE dengan reason `MEDIA_URL_INVALID`: body lebih besar dari ukuran yang ditandatangani.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /zones:
    get:
      operationId: getZones
      tags:
      - Patrol
      summary: List zona (filter Patroli/Jaga)
      description: |
        Zona aktif dari proyek tempat pemanggil bertugas hari ini, yang untuk seluruh proyek atau
        untuk regu pemanggil sendiri, beserta checklist aktifnya (aplikasi menggambar formulir
        dari sini). Urut menurut proyek, tipe, nama. `project_code` yang bukan proyek pemanggil dijawab
        403 `PERMISSION_DENIED`. Daftar ini satu halaman penuh tanpa query `page`/`limit`:
        `pagination` = {page 1, limit jumlah item (minimal 1), total jumlah item}.
        Rahasia QR tidak pernah dikembalikan.
      parameters:
      - name: type
        in: query
        description: Selain PATROL/GUARD dijawab 422 (field `type`).
        schema:
          type: string
          enum:
          - PATROL
          - GUARD
      - name: project_code
        in: query
        description: 'Bawaan: semua proyek tempat pemanggil bertugas.'
        schema:
          type: string
      - name: team_code
        in: query
        description: Menyaring zona milik satu regu.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PatrolZone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '422':
          description: 'VALIDATION_ERROR: `type` bukan PATROL atau GUARD.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /zones/progress:
    get:
      operationId: getZonesProgress
      tags:
      - Patrol
      summary: Progres zona (lingkaran merah, biru, hijau)
      description: |
        Untuk tiap zona aktif: `required` (merah), `submitted` (biru), `approved` (hijau) dan
        `declined`, pada satu tanggal kerja. `work_date` bawaannya hari ini menurut zona waktu proyek.
        Anggota melihat angka regunya sendiri; DANRU juga regu dalam jangkauan izin approve-nya dan
        boleh memilih satu dengan `team_code`. Regu atau proyek di luar jangkauan: 403
        `PERMISSION_DENIED`. Semua hitungan diambil dalam satu query per proyek dan tipe zona.
        `data` adalah larik biasa (tanpa pagination).
      parameters:
      - name: project_code
        in: query
        schema:
          type: string
        description: 'Bawaan: semua proyek tempat pemanggil bertugas.'
      - name: team_code
        in: query
        description: 'Regu yang dilihat; bawaan semua regu dalam jangkauan.'
        schema:
          type: string
      - name: type
        in: query
        description: Selain PATROL/GUARD dijawab 422 (field `type`).
        schema:
          type: string
          enum:
          - PATROL
          - GUARD
      - name: work_date
        in: query
        description: 'Tanggal kerja YYYY-MM-DD; format lain 422.'
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ZoneProgressItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '422':
          description: 'VALIDATION_ERROR: `type` bukan PATROL/GUARD, atau `work_date` bukan YYYY-MM-DD.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /zones/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getZonesById
      tags:
      - Patrol
      summary: Detail zona
      description: |
        Zona beserta checklist aktifnya untuk anggota proyek zona (dan regu, bila zona khusus satu regu). Zona
        yang sudah dinonaktifkan tetap terbaca (`is_active` false); yang dihapus 404. Zona di organisasi ini yang
        bukan bagian pemanggil: 403 `PERMISSION_DENIED`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolZone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
  /zones/{id}/scan:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postZonesByIdScan
      tags:
      - Patrol
      summary: Scan QR zona (offline-capable, geofence)
      description: |
        Header `Idempotency-Key` wajib (UUID) dan harus sama dengan `local_id`; `occurred_at` paling jauh 5 menit
        di depan dan 7 hari ke belakang. Memeriksa berurutan, dan yang pertama gagal menjadi jawabannya: QR
        (`ZONE_QR_INVALID`), izin `patrol.scan`/`guard.scan` menurut tipe zona (`PERMISSION_DENIED`, 403),
        keanggotaan proyek dan regu (`ZONE_NOT_IN_PROJECT`, 403), geofence (`ZONE_OUTSIDE_RADIUS`: jarak lebih
        dari radius ditambah `min(accuracy_meters, 30)`; zona tanpa geofence hanya mengandalkan QR), interval
        antar scan (`ZONE_INTERVAL_NOT_ELAPSED`: paling cepat 30 detik, atau interval patroli proyek bila lebih
        besar), lalu checklist (`CHECKLIST_ITEM_INVALID`, `CHECKLIST_ANSWER_REQUIRED`,
        `CHECKLIST_ANSWER_INVALID`, `CHECKLIST_ATTACHMENT_REQUIRED`) dan foto (`SCAN_PHOTO_REQUIRED`: zona dengan
        `photo_required` butuh minimal satu foto, umum atau jawaban); terakhir foto dilampirkan.
        Scan offline dinilai dengan checklist saat `occurred_at`: butir yang dinonaktifkan sesudahnya
        diabaikan, butir yang dibuat sesudahnya tidak wajib. Kirim ulang dengan `local_id` yang sama
        mengembalikan scan tersimpan (200) tanpa notifikasi. Setelah tersimpan, DANRU regu diberi tahu
        (`PATROL_SUBMITTED`/`GUARD_SUBMITTED`) dan, untuk `submitted_offline`, pengirim menerima
        `OFFLINE_SUBMISSION_SENT`. Bila patroli pemanggil sedang berjalan di proyek itu, scan ikut patroli
        (`patrol_id`). Respons 201/200 belum memuat `personnel_name` dan `media` (URL foto); baca scan untuk itu.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolScanCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolScan'
        '200':
          description: Idempotent replay (local_id/key sama)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolNotInProject'
        '404':
          description: '`NOT_FOUND`: `ZONE_NOT_FOUND` (zona tidak ada, nonaktif, atau id bukan angka positif) atau `MEDIA_NOT_FOUND` (foto bukan milik pemanggil).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '409':
          description: '`DUPLICATE` `SCAN_LOCAL_ID_TAKEN` (local_id sudah dipakai orang lain atau untuk zona lain); `CONFLICT` `MEDIA_NOT_UPLOADED`, `MEDIA_ALREADY_ATTACHED` (`details.media_id`); `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`, `IDEMPOTENCY_RESPONSE_NOT_STORED` (lihat header `Idempotency-Key`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '`VALIDATION_ERROR`: field body salah/tidak dikenal, header `Idempotency-Key` hilang atau bukan UUID, `local_id` tidak sama dengan header (`MISMATCH`), `media_ids` ganda (`DUPLICATE`). `UNPROCESSABLE` dengan `details.reason`: `OCCURRED_AT_IN_FUTURE`, `OCCURRED_AT_TOO_OLD`, `ZONE_QR_INVALID`, `ZONE_OUTSIDE_RADIUS` (`details.distance_meters`, `details.radius_meters`), `ZONE_INTERVAL_NOT_ELAPSED` (`details.interval_seconds`), `CHECKLIST_ITEM_INVALID`, `CHECKLIST_ANSWER_REQUIRED`, `CHECKLIST_ANSWER_INVALID`, `CHECKLIST_ATTACHMENT_REQUIRED` (semua dengan `details.item_id`), `SCAN_PHOTO_REQUIRED`, `MEDIA_PURPOSE_MISMATCH`, `MEDIA_LIMIT_EXCEEDED`.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /zones/{id}/scans:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getZonesByIdScans
      tags:
      - Patrol
      summary: Riwayat scan zona
      description: |
        Scan zona, terbaru dulu, lengkap dengan jawaban, `personnel_name` dan foto (URL bertanda tangan). DANRU
        (izin `patrol.approve`/`guard.approve` menurut tipe zona) melihat scan regu dalam jangkauannya; anggota
        proyek lain hanya scan miliknya. Bukan anggota proyek (atau regu) zona: 403 `PERMISSION_DENIED`.
        Scan yang disetujui atau ditolak tetap tampil (§3.2.6.3).
      parameters:
      - name: personnel_id
        in: query
        description: Angka positif; selain itu 422.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: work_date
        in: query
        description: Tanggal kerja YYYY-MM-DD; format lain 422.
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: Selain tiga nilai ini 422.
        schema:
          type: string
          enum:
          - SUBMITTED
          - APPROVED
          - DECLINED
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PatrolScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
        '422':
          description: 'VALIDATION_ERROR: `page`/`limit` di luar batas, `work_date` bukan YYYY-MM-DD, `status` atau `personnel_id` tidak valid.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /zones/{id}/scanners:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getZonesByIdScanners
      tags:
      - Patrol
      summary: Siapa yang scan zona, dengan angka di samping nama
      description: |
        Pemindai zona pada satu tanggal kerja (bawaan hari ini menurut zona waktu proyek) dengan
        `submitted_count` dan `approved_count` (§3.2.6.2). DANRU melihat regu dalam jangkauannya atau
        yang dipilih dengan `team_code`; anggota proyek lain hanya melihat dirinya. `team_code` di luar
        jangkauan, atau bukan anggota proyek zona: 403 `PERMISSION_DENIED`. `data` adalah larik biasa (tanpa pagination).
      parameters:
      - name: team_code
        in: query
        description: 'Regu yang dilihat; bawaan semua regu dalam jangkauan.'
        schema:
          type: string
      - name: work_date
        in: query
        description: 'Tanggal kerja YYYY-MM-DD; format lain 422.'
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ZoneScanner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
        '422':
          description: 'VALIDATION_ERROR: `work_date` bukan YYYY-MM-DD.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /zones/{id}/check-in:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postZonesByIdCheckIn
      tags:
      - Patrol
      summary: Check-in pos (Jaga)
      description: |
        Header `Idempotency-Key` wajib (UUID). Waktu check-in adalah waktu server. QR, izin
        `patrol.scan`/`guard.scan`, keanggotaan dan geofence diperiksa seperti scan (zona nonaktif: 404).
        Satu orang hanya boleh punya satu check-in terbuka di zona mana pun; check-in lagi sebelum
        check-out dijawab 409 `ZONE_ALREADY_CHECKED_IN`. Respons belum memuat `full_name`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneCheckInInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/ZoneCheckIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolNotInProject'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
        '409':
          description: '`CONFLICT` `ZONE_ALREADY_CHECKED_IN` (masih check-in di zona ini atau zona lain); `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`, `IDEMPOTENCY_RESPONSE_NOT_STORED` (lihat header `Idempotency-Key`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '`VALIDATION_ERROR`: field body salah/tidak dikenal, header `Idempotency-Key` hilang atau bukan UUID. `UNPROCESSABLE` dengan `details.reason`: `ZONE_QR_INVALID`, `ZONE_OUTSIDE_RADIUS` (`details.distance_meters`, `details.radius_meters`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /zones/{id}/check-out:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postZonesByIdCheckOut
      tags:
      - Patrol
      summary: Check-out pos (Jaga)
      description: |
        Header `Idempotency-Key` wajib (UUID). Waktu check-out adalah waktu server. QR dan geofence diperiksa
        seperti check-in; izin dan keanggotaan tidak diperiksa lagi, dan zona yang sudah dinonaktifkan tetap bisa
        di-check-out. Tanpa check-in terbuka di zona ini dijawab 409 `ZONE_NOT_CHECKED_IN`. Respons belum memuat `full_name`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneCheckInInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/ZoneCheckIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
        '409':
          description: '`CONFLICT` `ZONE_NOT_CHECKED_IN`; `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`, `IDEMPOTENCY_RESPONSE_NOT_STORED` (lihat header `Idempotency-Key`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '`VALIDATION_ERROR`: field body salah/tidak dikenal, header `Idempotency-Key` hilang atau bukan UUID. `UNPROCESSABLE` dengan `details.reason`: `ZONE_QR_INVALID`, `ZONE_OUTSIDE_RADIUS` (`details.distance_meters`, `details.radius_meters`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /zones/{id}/live:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getZonesByIdLive
      tags:
      - Patrol
      summary: Live check-ins zona (DANRU)
      description: |
        Siapa yang check-in sekarang (check-in terbuka). DANRU (izin `patrol.approve`/`guard.approve` sesuai tipe
        zona) melihat regu dalam jangkauannya; anggota proyek lain hanya melihat check-in-nya sendiri; yang bukan
        anggota proyek (atau regu) zona 403 `PERMISSION_DENIED`. Zona nonaktif tetap terbaca. `data` adalah larik
        biasa (tanpa pagination); `full_name` terisi.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ZoneCheckIn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
  /zones/{id}/tracking:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getZonesByIdTracking
      tags:
      - Patrol
      summary: Riwayat check-in zona (DANRU)
      description: |
        Check-in zona pada rentang tanggal (zona waktu proyek, keduanya termasuk, maksimal 31 hari),
        terbaru dulu, dengan `full_name`. Jangkauannya sama dengan `live`. `team_code` atau `personnel_id` di
        luar jangkauan: 403 `PERMISSION_DENIED`. `to` sebelum `from` atau rentang lebih dari 31 hari: 422 pada field `to`.
      parameters:
      - name: from
        in: query
        required: true
        description: Wajib, YYYY-MM-DD.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        description: 'Wajib, YYYY-MM-DD; tidak boleh sebelum `from`, paling jauh 31 hari dari `from` (termasuk).'
        schema:
          type: string
          format: date
      - name: team_code
        in: query
        description: Menyaring satu regu dalam jangkauan.
        schema:
          type: string
      - name: personnel_id
        in: query
        description: Angka positif; selain itu 422.
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ZoneCheckIn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolZoneNotFound'
        '422':
          description: 'VALIDATION_ERROR: `from`/`to` hilang (`REQUIRED`) atau bukan YYYY-MM-DD (`INVALID`), `to` sebelum `from`, rentang lebih dari 31 hari, `personnel_id` tidak valid, `page`/`limit` di luar batas.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /scans/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getScansById
      tags:
      - Patrol
      summary: Detail satu scan
      description: |
        Scan dengan tiap jawaban (pertanyaan, jawaban, catatan, foto), `personnel_name` dan `media`, agar DANRU
        menilai jawaban beserta buktinya. Pemindai membaca miliknya; DANRU membaca scan regu dalam jangkauan izin
        approve-nya (menurut tipe zona dan tanggal kerja scan). Scan lain dijawab 404 `SCAN_NOT_FOUND`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatrolScanNotFound'
  /scans/approve:
    post:
      operationId: postScansApprove
      tags:
      - Patrol
      summary: Setujui banyak scan sekaligus (DANRU)
      description: |
        Paling banyak 50 id (1 sampai 50, tiap id angka positif; id ganda dihitung sekali). Tiap scan harus ada
        (kalau tidak seluruh permintaan 404 `SCAN_NOT_FOUND`) dan berada di regu yang boleh diputuskan pemanggil
        (izin `patrol.approve`/`guard.approve` menurut tipe zona; kalau tidak seluruh permintaan 403
        `PERMISSION_DENIED`), dan tidak ada yang berubah. Scan yang ternyata sudah diputuskan dilewati dan
        dicantumkan di `skipped`. Tiap pemindai hanya menerima satu notifikasi per permintaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApproveInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/BulkApproveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolScanNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'VALIDATION_ERROR: `ids` hilang, kosong, lebih dari 50, atau berisi id bukan angka positif; field tidak dikenal.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /scans/{id}/approve:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postScansByIdApprove
      tags:
      - Patrol
      summary: Approval laporan patroli/jaga (DANRU)
      description: |
        Perlu izin `patrol.approve` atau `guard.approve` menurut tipe zona, dengan regu scan dalam
        jangkauan (403 `PERMISSION_DENIED`). Scan yang sudah diputuskan dijawab 409 `SCAN_ALREADY_DECIDED`.
        Pemindai diberi tahu (`PATROL_APPROVED`/`GUARD_APPROVED`). Tanpa badan permintaan (badan diabaikan).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolScanNotFound'
        '409':
          description: '`CONFLICT` `SCAN_ALREADY_DECIDED`: scan bukan `SUBMITTED` lagi.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /scans/{id}/decline:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postScansByIdDecline
      tags:
      - Patrol
      summary: Tolak scan (DANRU)
      description: |
        Aturan izin sama dengan approve. `note` wajib, tidak boleh kosong atau spasi saja, paling panjang 1000
        karakter (umpan balik DANRU, `danru_patrol_feedback`). Scan yang sudah diputuskan dijawab 409
        `SCAN_ALREADY_DECIDED`. Pemindai menerima notifikasi `PATROL_APPROVED`/`GUARD_APPROVED` dengan
        `data.decision` = `DECLINED` dan catatannya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolDeclineInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '404':
          $ref: '#/components/responses/PatrolScanNotFound'
        '409':
          description: '`CONFLICT` `SCAN_ALREADY_DECIDED`: scan bukan `SUBMITTED` lagi.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: 'VALIDATION_ERROR: `note` hilang, kosong, atau lebih dari 1000 karakter; field tidak dikenal.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /patrol/pending-approvals:
    get:
      operationId: getPatrolPendingApprovals
      tags:
      - Patrol
      summary: Antrian approval (status Biru, DANRU)
      description: |
        Scan `SUBMITTED` regu yang diputuskan pemanggil, terlama dulu; zona patroli menurut
        `patrol.approve` dan zona jaga menurut `guard.approve`. Yang tidak memutuskan regu mana pun: 403
        `PERMISSION_DENIED`; `team_code` di luar jangkauan: 403 yang sama.
      parameters:
      - name: team_code
        in: query
        description: Menyaring satu regu dalam jangkauan.
        schema:
          type: string
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PatrolScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolForbidden'
        '422':
          description: 'VALIDATION_ERROR: `page`/`limit` di luar batas.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /patrols/start:
    post:
      operationId: postPatrolsStart
      tags:
      - Patrol
      summary: Mulai patroli (rekam garis rute)
      description: |
        Header `Idempotency-Key` wajib (UUID) dan harus sama dengan `local_id`; `started_at` paling jauh 5 menit
        di depan dan 7 hari ke belakang. Penjaga mengetuk "mulai patroli" dan aplikasi merekam posisi sampai
        patroli diakhiri. Perlu izin `patrol.scan` atau `guard.scan` dan penugasan di proyek, seperti scan
        (403 `PERMISSION_DENIED`, 403 `ZONE_NOT_IN_PROJECT`; proyek yang tidak ada juga dijawab
        `ZONE_NOT_IN_PROJECT`). Satu orang hanya boleh punya satu patroli berjalan: mulai lagi
        sebelum mengakhiri dijawab 409 `PATROL_ALREADY_ACTIVE`. Kirim ulang dengan `local_id` yang sama
        mengembalikan patroli tersimpan (200). Titik awal tercatat sebagai titik `seq` 0. Perekaman tidak
        memerlukan `gps_tracking_enabled` proyek: izinnya adalah ketukan "mulai patroli".
        Respons belum memuat `personnel_name`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolRouteStart'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolRoute'
        '200':
          description: Idempotent replay (local_id/key sama)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PatrolNotInProject'
        '409':
          description: '`CONFLICT` `PATROL_ALREADY_ACTIVE`; `DUPLICATE` `PATROL_LOCAL_ID_TAKEN` (local_id sudah dipakai orang lain); `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`, `IDEMPOTENCY_RESPONSE_NOT_STORED` (lihat header `Idempotency-Key`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '`VALIDATION_ERROR`: field body salah/tidak dikenal, header `Idempotency-Key` hilang atau bukan UUID, `local_id` tidak sama dengan header (`MISMATCH`). `UNPROCESSABLE` `details.reason` `OCCURRED_AT_IN_FUTURE` atau `OCCURRED_AT_TOO_OLD` (untuk `started_at`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /patrols/active:
    get:
      operationId: getPatrolsActive
      tags:
      - Patrol
      summary: Patroli yang sedang berjalan (untuk melanjutkan setelah aplikasi dibuka ulang)
      description: |
        Patroli berjalan milik pemanggil, dengan garis sejauh titik yang diterima. `data` adalah larik:
        satu patroli, atau kosong `[]` bila tidak ada patroli berjalan (bukan 404).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      maxItems: 1
                      items:
                        $ref: '#/components/schemas/PatrolRouteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /patrols:
    get:
      operationId: getPatrols
      tags:
      - Patrol
      summary: Daftar patroli
      description: |
        Terbaru dulu, tanpa garis (`path`, `route`, `scans`). Penjaga melihat patrolinya sendiri; DANRU juga patroli
        regu dalam jangkauan izin approve-nya (`patrol.approve` atau `guard.approve`, menurut tanggal kerja patroli).
        Filter yang tidak cocok dengan jangkauan pemanggil menghasilkan daftar kosong, bukan 403. `personnel_name` terisi.
      parameters:
      - name: project_code
        in: query
        schema:
          type: string
      - name: team_code
        in: query
        schema:
          type: string
      - name: personnel_id
        in: query
        description: Angka positif; selain itu 422.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: work_date
        in: query
        description: Tanggal kerja YYYY-MM-DD; format lain 422.
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: Selain tiga nilai ini 422.
        schema:
          type: string
          enum:
          - ACTIVE
          - ENDED
          - AUTO_ENDED
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PatrolRoute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 'VALIDATION_ERROR: `page`/`limit` di luar batas, `work_date` bukan YYYY-MM-DD, `status` atau `personnel_id` tidak valid.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /patrols/{id}:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getPatrolsById
      tags:
      - Patrol
      summary: Detail patroli dengan garis rute di peta
      description: |
        `route` adalah GeoJSON `LineString` (bujur dulu) yang bisa digambar pustaka peta langsung, `path`
        titik yang sama dengan waktu dan akurasi, `scans` scan di sepanjang patroli untuk pin. Untuk patroli
        `ACTIVE`, garis dibangun dari titik yang sudah diterima, jadi DANRU melihatnya tumbuh. Patroli orang
        lain di luar jangkauan: 404 `PATROL_NOT_FOUND`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolRouteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatrolRouteNotFound'
  /patrols/{id}/points:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postPatrolsByIdPoints
      tags:
      - Patrol
      summary: Kirim titik posisi patroli (batch, aman diulang)
      description: |
        Header `Idempotency-Key` wajib (UUID). Paling banyak 200 titik (lebih dari itu 422 `PATROL_POINTS_TOO_LARGE`,
        `details.max` 200). Aplikasi menomori titiknya
        (`seq`), jadi batch yang dikirim ulang atau tidak berurutan tidak menggandakan atau mengacak titik:
        titik yang `seq`-nya sudah ada dilewati dan dihitung di `duplicates`. Hanya pemilik patroli, dan
        hanya saat `ACTIVE` (409 `PATROL_NOT_ACTIVE`); aplikasi yang offline mengirim titiknya dulu, baru
        mengakhiri patroli. Patroli milik orang lain dijawab 404 `PATROL_NOT_FOUND`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolRoutePoints'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolRoutePointsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatrolRouteNotFound'
        '409':
          description: '`CONFLICT` `PATROL_NOT_ACTIVE`: patroli sudah `ENDED`/`AUTO_ENDED`; `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`, `IDEMPOTENCY_RESPONSE_NOT_STORED` (lihat header `Idempotency-Key`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '`VALIDATION_ERROR`: `points` hilang atau kosong, field titik salah/tidak dikenal, `points[i].logged_at` lebih dari 5 menit di depan (`IN_FUTURE`), header `Idempotency-Key` hilang atau bukan UUID. `UNPROCESSABLE` `PATROL_POINTS_TOO_LARGE`.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /patrols/{id}/end:
    parameters:
    - $ref: '#/components/parameters/IdPath'
    post:
      operationId: postPatrolsByIdEnd
      tags:
      - Patrol
      summary: Akhiri patroli
      description: |
        Header `Idempotency-Key` wajib (UUID). Hanya pemilik patroli. Dalam satu transaksi: menyimpan titik terakhir, membangun garis (titik berakurasi di atas 50 m dan
        lonjakan lebih dari 15 m/detik dibuang, lalu disederhanakan 3 m tanpa membuang titik awal, titik akhir
        dan titik terdekat tiap scan), menghitung jarak dan scan, lalu status `ENDED`. Diulang dengan `ended_at`
        yang sama (aplikasi kehilangan jawaban), mengembalikan patroli tersimpan. Patroli yang sudah berakhir
        (juga `AUTO_ENDED`) dengan `ended_at` lain: 409 `PATROL_NOT_ACTIVE`. Tidak ada notifikasi: scan-nya
        sudah memberi tahu DANRU.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatrolRouteEnd'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/PatrolRouteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PatrolRouteNotFound'
        '409':
          description: '`CONFLICT` `PATROL_NOT_ACTIVE`: patroli sudah berakhir dengan `ended_at` yang berbeda; `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_KEY_IN_FLIGHT`, `IDEMPOTENCY_RESPONSE_NOT_STORED` (lihat header `Idempotency-Key`).'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '`VALIDATION_ERROR`: `ended_at` hilang, sebelum waktu mulai patroli (`BEFORE_START`), titik salah atau `points[i].logged_at` lebih dari 5 menit di depan (`IN_FUTURE`), header `Idempotency-Key` hilang atau bukan UUID. `UNPROCESSABLE`: `OCCURRED_AT_IN_FUTURE`/`OCCURRED_AT_TOO_OLD` (untuk `ended_at`), `PATROL_POINTS_TOO_LARGE`.'
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  /notifications/token:
    post:
      operationId: postNotificationsToken
      tags:
      - Notification
      summary: Daftarkan/refresh FCM token
      description: |
        Mendaftarkan push token perangkat ke rantai login pemanggil. Mendaftar ulang token yang sama memperbarui satu baris
        (aman diulang tiap aplikasi dibuka). Satu token hanya milik satu perangkat: token yang dipegang perangkat lain
        dipindahkan ke sini. Rantai login yang sudah berakhir → 401 UNAUTHENTICATED. `Idempotency-Key` opsional: tanpa header
        permintaan tetap diproses; dengan header, balasan disimpan dan diulang (header `Idempotent-Replayed: true`).
        Body wajib satu objek JSON (maks 1 MB); body kosong / bukan JSON → 400, field tak dikenal / aturan field → 422.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: |
          UUID (format apa pun yang dikenali parser UUID). Opsional di rute ini. Key yang sama dengan body berbeda → 409
          `IDEMPOTENCY_KEY_REUSED`; permintaan pertama masih berjalan → 409 `IDEMPOTENCY_KEY_IN_FLIGHT`; bukan UUID → 422 `INVALID`.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTokenInput'
      responses:
        '200':
          description: OK (`data` = null)
          headers:
            Idempotent-Replayed:
              description: '`true` bila ini balasan tersimpan dari permintaan pertama dengan key yang sama.'
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: CONFLICT dengan `details.reason` IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_KEY_IN_FLIGHT atau IDEMPOTENCY_RESPONSE_NOT_STORED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SysInternalError'
    delete:
      operationId: deleteNotificationsToken
      tags:
      - Notification
      summary: Hapus FCM token (logout)
      description: |
        Menghapus push token dari rantai login pemanggil. Token yang tidak ada bukan galat (tetap 200). Tanpa Idempotency-Key.
        Body wajib (DELETE dengan body JSON): kosong / bukan JSON → 400; field tak dikenal / `firebase_token` kosong atau
        lebih dari 4096 karakter → 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTokenDelete'
      responses:
        '200':
          description: OK (`data` = null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /ws/ticket:
    post:
      operationId: postWsTicket
      tags:
      - Notification
      summary: Tiket sekali pakai untuk membuka WebSocket dari browser
      description: |
        Browser tidak bisa mengirim header `Authorization` pada WebSocket, dan token akses di URL
        akan tersimpan di log proxy. Tukarkan token akses dengan tiket yang berlaku 30 detik dan
        hanya untuk satu koneksi, lalu buka `GET /api/v1/ws?ticket=...` dengan subprotocol
        `persist.v1`. Aplikasi mobile cukup memakai `Authorization: Bearer`.

        Koneksi ditutup dengan kode `4401` saat token akses yang meminta tiket kedaluwarsa atau
        sesinya diakhiri; klien memperbarui token, meminta tiket baru, dan menyambung lagi.
        Protokol WebSocket itu sendiri (room, frame) ada di dokumen realtime dan di luar kontrak
        OpenAPI ini.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/WsTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: INTERNAL_ERROR — tiket gagal disimpan (Redis tidak tersedia).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /ws:
    get:
      operationId: getWs
      tags:
      - Notification
      summary: Buka WebSocket realtime (upgrade HTTP)
      description: |
        Bukan operasi REST: permintaan ini di-upgrade menjadi WebSocket (subprotocol `persist.v1` harus diminta lewat
        `Sec-WebSocket-Protocol`). Rute ini publik di middleware (`security: []`) karena mengautentikasi dirinya sendiri, dan kegagalannya dijawab
        dengan kode tutup WebSocket, bukan status HTTP 401: setelah upgrade diterima, server menutup dengan `4401` bila tiket/token
        tidak valid, kedaluwarsa, atau sesinya dicabut; `4400` bila subprotocol `persist.v1` tidak dinegosiasikan.
        Autentikasi: `?ticket=` (dari `POST /ws/ticket`, berlaku 30 detik, sekali pakai; dipakai bila ada) atau
        `Authorization: Bearer <access token>` (aplikasi mobile). Tanpa header `Origin` (aplikasi mobile) selalu diterima;
        browser hanya dari host yang ada di CORS_ORIGINS (selain itu 403 dari upgrade). Permintaan tanpa header upgrade WebSocket
        dijawab 400 oleh pustaka WebSocket (bukan amplop galat). Setelah tersambung server mengirim frame `hello`, lalu `ping`
        tiap 20 detik; diam lebih dari 60 detik → ditutup `4408`; token habis → `4401`; terlalu lambat membaca → 1013.
        Frame klien: `subscribe`, `unsubscribe`, `ping`, `location.update`; batas frame 4 KB. Protokol frame lengkap ada di dokumen
        realtime, di luar kontrak ini.
      security: []
      parameters:
      - name: ticket
        in: query
        required: false
        description: 'Tiket sekali pakai dari `POST /ws/ticket`. Bila tidak ada, header `Authorization: Bearer` dipakai.'
        schema:
          type: string
      - name: Sec-WebSocket-Protocol
        in: header
        required: false
        description: Harus memuat `persist.v1`; tanpa itu koneksi diterima lalu ditutup dengan kode 4400 (setelah autentikasi).
        schema:
          type: string
          enum:
          - persist.v1
      responses:
        '101':
          description: Switching Protocols — koneksi WebSocket terbuka (kegagalan autentikasi baru terlihat sebagai kode tutup 4401).
        '400':
          description: Bukan permintaan upgrade WebSocket yang valid (jawaban pustaka, teks polos).
        '403':
          description: Origin browser tidak diizinkan (jawaban pustaka, teks polos).
  /integrations/personel/events:
    post:
      operationId: postIntegrationsPersonelEvents
      tags:
      - Notification
      summary: Penerima event perubahan dari Persist Personel (webhook)
      description: |
        Dipanggil oleh Personel, bukan oleh aplikasi. Tidak memakai token; keasliannya dijamin
        tanda tangan `X-Personel-Signature` (HMAC-SHA256 dari body mentah dengan
        `PERSONEL_WEBHOOK_SECRET`, heksadesimal, boleh berawalan `sha256=`).

        - `timestamp` lebih lama atau lebih baru dari 5 menit ditolak (401).
        - `event_id` diklaim saat diproses (2 menit) dan disimpan 7 hari setelah berhasil; kiriman
          ulang dijawab 200 `duplicate` tanpa diproses lagi, karena Personel mengirim minimal
          sekali. Kiriman ulang saat event yang sama masih diproses dijawab 409
          `WEBHOOK_EVENT_IN_PROGRESS`: Personel mengulang, jadi event tidak hilang bila proses
          pertama mati di tengah jalan.
        - `organization_id` harus organisasi yang ada (404 jika tidak).
        - Tipe: `employee.updated`, `employee.deactivated`, `placement.changed`,
          `position.changed`. `leave.decided` diterima dan diabaikan di sini (ditangani modul
          cuti). Tipe lain dijawab 200 `ignored` agar Personel tidak mengulang tanpa akhir.
        - Kegagalan pemrosesan dijawab 5xx (500 INTERNAL_ERROR; 503 INTERNAL_ERROR bila Redis tidak menjawab); klaim `event_id`
          dilepas, jadi Personel mengulang dan event diproses saat itu.
        - Urutan pemeriksaan: body (maks 64 KB) → tanda tangan → bentuk event → timestamp → organisasi → klaim `event_id` → proses.
          Body lebih dari 64 KB dijawab 400 (bukan 413). Field tak dikenal di body diabaikan (tidak ditolak).
        - Event employee.* wajib membawa `data.nik`; position.changed wajib `data.nik` dan `data.position_name` (tidak kosong);
          placement.changed wajib `data.project_id` >= 1; selain itu 400 `WEBHOOK_PAYLOAD_INVALID`.
        - Tanpa `PERSONEL_WEBHOOK_SECRET` terkonfigurasi, setiap event gagal tanda tangan (401).
      security: []
      x-webhook-security: webhookSignature
      parameters:
      - name: X-Personel-Signature
        in: header
        required: true
        description: HMAC-SHA256 heksadesimal dari body mentah, boleh berawalan `sha256=`. Hilang / bukan heks / tidak cocok → 401.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonelEvent'
      responses:
        '200':
          description: Diterima.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PersonelEventResult'
        '400':
          description: BAD_REQUEST, details.reason WEBHOOK_PAYLOAD_INVALID — body terlalu besar (> 64 KB) atau tak terbaca, bukan
            JSON, `event_id` kosong atau lebih dari 128 karakter, `type` kosong, `organization_id` < 1, `timestamp` kosong/salah
            format, atau `data` tidak valid untuk tipenya.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Tanda tangan tidak valid atau timestamp terlalu jauh (details.reason WEBHOOK_SIGNATURE_INVALID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: NOT_FOUND — `organization_id` bukan organisasi yang ada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Event yang sama sedang diproses (details.reason WEBHOOK_EVENT_IN_PROGRESS). Kirim ulang nanti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/SysInternalError'
        '503':
          description: INTERNAL_ERROR (tanpa reason) — Redis tidak menjawab saat mengklaim `event_id`; Personel mengulang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /notifications:
    get:
      operationId: getNotifications
      tags:
      - Notification
      summary: List notifikasi (paginasi + delta-sync)
      description: |-
        Hanya notifikasi milik pemanggil. Dua bentuk jawaban:
        - **Tanpa `since` dan `cursor`**: daftar berhalaman (`page`, `limit`, terbaru dulu) dengan
          `pagination`, tanpa `deleted`. `unread_only=true` menyaring yang belum dibaca.
          `meta.server_time` tetap dikirim: itulah watermark pertama klien. Pada tarikan penuh
          berhalaman, simpan `server_time` dari halaman PERTAMA.
        - **Dengan `since` dan/atau `cursor`** (delta-sync, DL-34/DL-57): baris yang berubah sejak
          itu (dibuat atau dibaca) di `data`, tombstone baris yang dihapus di `deleted`, urut
          `updated_at` naik, tanpa `pagination`. `has_more=true` → ulangi dengan
          `cursor=next_cursor`. Simpan `meta.server_time` sebagai `since` berikutnya. Server
          menarik batas bawah `since` mundur beberapa detik, jadi baris yang baru saja berubah
          boleh datang dua kali: upsert berdasarkan `id`. `unread_only=true` tidak boleh
          hilang dari aliran tanpa tombstone.

          Semua masalah query dilaporkan sekaligus dalam satu 422 VALIDATION_ERROR: `unread_only` selain
          `true`/`false`, `since` bukan RFC 3339, `cursor` tidak valid, `page`/`limit` di luar batas.
          Parameter `q`, `date`, `month` dan `category_id` tidak dipakai, tetapi bila dikirim tetap divalidasi.
          `limit` berlaku juga untuk delta-sync; `page` diabaikan di sana.
      parameters:
      - name: unread_only
        in: query
        description: Hanya `true` atau `false` (selain itu 422). Tidak boleh bersama `since`/`cursor`.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: since
        in: query
        required: false
        description: Watermark delta-sync, RFC 3339 (mis. `2026-06-01T03:00:00Z`). Salah format → 422.
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        required: false
        description: '`meta.next_cursor` dari jawaban delta sebelumnya. Cursor tanpa `since` tetap delta-sync. Tidak valid → 422.'
        schema:
          type: string
      responses:
        '200':
          description: 'OK. Delta-sync: `since` → `data` ter-upsert + `deleted` tombstone (DL-34); `meta.server_time` WAJIB.'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notification'
                    deleted:
                      type: array
                      items:
                        $ref: '#/components/schemas/Tombstone'
                    pagination:
                      $ref: '#/components/schemas/Pagination'
                    meta:
                      $ref: '#/components/schemas/DeltaMeta'
              example:
                success: true
                data:
                - id: 4401
                  organization_id: 1
                  personnel_id: 77
                  type: PANIC_TRIGGERED
                  title: Sinyal Tombol Panik
                  body: Budi menekan tombol panik.
                  priority: HIGH
                  entity_type: panic
                  entity_id: 12
                  data: {}
                  is_read: false
                  created_at: '2026-06-01T02:59:00Z'
                  updated_at: '2026-06-01T02:59:00Z'
                deleted:
                - id: 4300
                  deleted_at: '2026-06-01T02:00:00Z'
                meta:
                  request_id: req_abc
                  server_time: '2026-06-01T03:00:00Z'
                  has_more: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /notifications/count:
    get:
      operationId: getNotificationsCount
      tags:
      - Notification
      summary: Counter unread/total (AC-API-NTF-2)
      description: Hanya notifikasi milik pemanggil.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/NotificationCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /notifications/read-all:
