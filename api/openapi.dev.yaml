              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                empty:
                  summary: Body kosong
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Body wajib diisi.
                    meta:
                      request_id: req_abc123
                notJson:
                  summary: Bukan JSON
                  value:
                    success: false
                    error:
                      code: BAD_REQUEST
                      message: Body bukan JSON yang valid.
                    meta:
                      request_id: req_abc123
        '401':
          description: 'UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value:
                    success: false
                    error:
                      code: UNAUTHENTICATED
                      message: Token tidak ditemukan.
                    meta:
                      request_id: req_abc123
                expired:
                  summary: Token kedaluwarsa
                  value:
                    success: false
                    error:
                      code: TOKEN_EXPIRED
                      message: Token kedaluwarsa.
                    meta:
                      request_id: req_abc123
        '403':
          description: Tanpa web role (FORBIDDEN), atau di luar wewenang (ROLE_DENIED / SCOPE_DENIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                NOT_ADMIN:
                  summary: Staf lapangan (tanpa web role)
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
