          properties:
            id:
              type: integer
              format: int64
            url:
              type: string
              description: URL bertanda tangan, berlaku satu jam.
            content_type:
              type: string
        person:
          type: object
          description: Hanya untuk yang memutuskan (bukan pemilik).
          required:
          - personnel_id
          - name
          properties:
