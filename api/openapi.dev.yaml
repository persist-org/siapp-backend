          type: boolean
        requires_time_range:
          type: boolean
        requires_change_day:
          type: boolean
        makes_leave_days:
          type: boolean
        excuses_lateness:
          type: boolean
        has_quota:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
          maximum: 10000
        is_active:
          type: boolean
