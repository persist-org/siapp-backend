paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - Auth
      summary: Health check (database ping)
      description: |
        Probe untuk load balancer / orkestrator; publik, tanpa token. Menjawab dengan objek JSON polos, BUKAN amplop
        (`success`/`data`/`meta`). Memeriksa database (ping, batas waktu pendek); 503 bila database tidak terjangkau,
        supaya lalu lintas tidak diarahkan ke instance yang tidak bisa melayani.
      security: []
      responses:
        '200':
          description: Database terjangkau.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
        '503':
          description: Database tidak terjangkau.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
  /auth/login:
    post:
      operationId: postAuthLogin
      tags:
      - Auth
      summary: Login dengan akun Personalia (email + password)
      description: |
        Seluruh karyawan grup (KPI, IDS, PCD) masuk ke satu organisasi (D17). 403
        AUTH_NOT_IN_GROUP: karyawan itu bekerja untuk PT di luar grup, dan SiAPP tidak melayaninya.

        Kegagalan lain (details.reason): 401 AUTH_INVALID_CREDENTIALS (email atau kata sandi salah;
        email yang tidak dikenal dijawab sama persis); 403 AUTH_ACCOUNT_DISABLED (karyawan tidak aktif
        atau tanpa data kerja), AUTH_DEVICE_BOUND (akun terikat ke HP lain, hanya `client=MOBILE`),
        AUTH_ORGANIZATION_SUSPENDED (organisasi dinonaktifkan), NOT_ADMIN (`client=WEB` untuk orang
        tanpa peran web); 429 RATE_LIMITED (lihat `Retry-After`): batas kegagalan per IP (100/menit)
        dan per IP+email (10/menit) dicek sebelum Personalia ditanya, atau Personalia menolak karena
        terlalu banyak kegagalan (Retry-After 900); hanya kredensial salah yang dihitung; 503
        PERSONEL_UNAVAILABLE (Personalia tidak menjawab, atau kunci integrasinya ditolak).
        Body wajib satu objek JSON (maks 1 MB): kosong / bukan JSON → 400 BAD_REQUEST, field tak dikenal /
        tipe salah / aturan field → 422.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: UNAUTHENTICATED `AUTH_INVALID_CREDENTIALS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Email atau kata sandi salah.
                  details:
                    reason: AUTH_INVALID_CREDENTIALS
                meta:
                  request_id: req_abc123
        '403':
          description: FORBIDDEN dengan `details.reason` AUTH_ACCOUNT_DISABLED, AUTH_DEVICE_BOUND, AUTH_ORGANIZATION_SUSPENDED,
            AUTH_NOT_IN_GROUP atau NOT_ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Akun Anda terhubung dengan perangkat lain. Hubungi admin untuk ganti perangkat.
                  details:
                    reason: AUTH_DEVICE_BOUND
                meta:
                  request_id: req_abc123
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/SysRetryAfterRateLimited'
        '500':
          $ref: '#/components/responses/SysInternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags:
      - Auth
      summary: Tukar refresh → access token baru (refresh token berotasi, hanya berlaku sekali)
      description: |
        Token lama langsung mati dan token baru diterbitkan. Memakai ulang token yang sudah dipakai
        mematikan seluruh rantai sesi (AUTH_REFRESH_REUSED). Kegagalan 401: AUTH_TOKEN_INVALID,
        AUTH_REFRESH_REUSED, AUTH_DEVICE_CHANGED (HP tidak lagi terikat); semuanya berarti kembali
        ke layar login. 403: AUTH_ACCOUNT_DISABLED (karyawan sudah tidak aktif di Personalia) atau NOT_ADMIN
        (sesi WEB yang peran webnya sudah dicabut). Tanpa Authorization (publik); tidak ada batas kegagalan
        karena refresh token berupa 256 bit acak. Body kosong / bukan JSON → 400; field tak dikenal / tipe
        salah / `refresh_token` kosong atau lebih dari 128 karakter → 422.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: UNAUTHENTICATED dengan `details.reason` AUTH_TOKEN_INVALID (token tidak dikenal, kedaluwarsa, atau
            sudah logout), AUTH_REFRESH_REUSED (token sudah dipakai / dirotasi; seluruh rantai sesi dimatikan) atau
            AUTH_DEVICE_CHANGED (HP tidak lagi terikat).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Sesi dihentikan karena token digunakan ulang. Silakan masuk kembali.
                  details:
                    reason: AUTH_REFRESH_REUSED
                meta:
                  request_id: req_abc123
        '403':
          description: FORBIDDEN dengan `details.reason` AUTH_ACCOUNT_DISABLED atau NOT_ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Akun Anda tidak aktif. Hubungi HR atau administrator.
                  details:
                    reason: AUTH_ACCOUNT_DISABLED
                meta:
                  request_id: req_abc123
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/SysInternalError'
  /auth/me:
    get:
      operationId: getAuthMe
      tags:
      - Auth
      summary: Profil, peran web, regu hari ini, dan hak akses lapangan
      description: |
        - Admin web: `web_role` dan `roles` terisi; `memberships` dan `permissions` kosong bila ia tidak bertugas di regu.
        - Petugas lapangan: `web_role` tidak ada, `roles` = `[]`.
        - Token milik orang yang sudah tidak ada di cache Personalia dijawab 401 UNAUTHENTICATED.
        - NIK selalu disamarkan; token perangkat tidak pernah dikirim.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/MeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
