      summary: Absensi Group (DANRU)
      description: 'DANRU memuster personil dari satu shift dalam satu panggilan, absen datang metode GROUP dengan lokasi
        DANRU sendiri. Perlu izin `attendance.group.view` yang menjangkau `team_code`; di luar jangkauan: 403 `PERMISSION_DENIED`.
        Ditolak 422 `GROUP_ATTENDANCE_DISABLED` selama proyek regu belum mengaktifkan `allow_group_attendance`. 201 selalu
        dikembalikan bila permintaan tervalidasi: setiap personil punya hasilnya sendiri pada `data[]` (lihat `AttendanceGroupResult`),
        satu yang gagal (tidak terjadwal pada shift ini, sudah tercatat) tidak menggagalkan yang lain. Kegagalan seluruh permintaan:
        `shift_ref` tidak cocok dengan `team_code`, atau regu tidak ada: 422 `ATTENDANCE_SHIFT_NOT_ACTIVE`; geofence proyek
        ketat dan lokasi DANRU di luar radius: 422 `ATTENDANCE_OUTSIDE_AREA`; proyek tanpa koordinat: 422 `PROJECT_NOT_CONFIGURED`.
        Alasan per personil (`data[].error.reason`): `ATTENDANCE_NO_SHIFT`, `ATTENDANCE_SHIFT_NOT_ACTIVE`, `ATTENDANCE_ALREADY_CHECKED_IN`,
        `ATTENDANCE_NOT_ALLOWED`, `ATTENDANCE_PREVIOUS_NOT_CHECKED_IN`, `ATTENDANCE_PREVIOUS_NOT_CHECKED_OUT`. Body bukan
        JSON 400; lebih dari 1 MB 413.'
