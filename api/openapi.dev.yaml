    PatrolCheckpointActionInput:
      type: object
      description: |
        Aksi yang punya `id` diubah, yang tanpa `id` dibuat, dan yang tidak ada di badan permintaan
        dinonaktifkan (tidak pernah dihapus). Urutan array menentukan `sort_order`. Aksi yang dikirim
        menggantikan isi aksi itu seluruhnya: `instruction` yang tidak dikirim dikosongkan. Semua nilai diperiksa di
        server dan yang salah dijawab 422 `CHECKPOINT_ACTION_INVALID` dengan nama field-nya, mis. `actions[2].max_photos`.
      required:
      - action
      properties:
        id:
          type: string
          format: uuid
