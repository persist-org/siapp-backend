                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: "shift_group_id", code: INVALID, message: "Wajib diisi untuk jadwal FIXED." } ] }, meta: { request_id: req_abc123 } }
                groupForbidden:
