    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    post:
      operationId: postAdminPanicsByIdResolve
      tags: [Panic]
      summary: 'Tandai Ditangani dari web (Operator/Admin, DL-31)'
      description: >-
        Jalur web (AC-API-RPT-5): set `status=RESOLVED`, isi `resolved_by_web_user_id`
