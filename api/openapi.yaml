                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Attendance' } }
                      deleted: { type: array, items: { $ref: '#/components/schemas/Tombstone' } }
                      meta: { $ref: '#/components/schemas/DeltaMeta' }
              example:
                success: true
                data: [{ id: 9001, personnel_id: 1, project_id: 1, method: QR, is_absent: false }]
                deleted: [{ id: 8800, deleted_at: "2026-06-01T02:00:00Z" }]
                pagination: { page: 1, limit: 20, total: 1, total_pages: 1 }
                meta: { request_id: "req_abc", server_time: "2026-06-01T03:00:00Z" }
