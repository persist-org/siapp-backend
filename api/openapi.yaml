              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: "Personil tidak bertugas di regu wilayah REGION_ADMIN"
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Data ini berada di luar wilayah yang Anda kelola.", details: { reason: ACCESS_OUTSIDE_ADMIN_SCOPE } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Jadwal tidak ada."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                SCHEDULE_NOT_FOUND:
                  summary: "Jadwal tidak ada atau milik organisasi lain"
                  value: { success: false, error: { code: NOT_FOUND, message: "Jadwal tidak ditemukan.", details: { reason: SCHEDULE_NOT_FOUND } }, meta: { request_id: req_abc123 } }
    patch:
      operationId: patchAdminSchedulesById
      tags: [Organization]
      summary: "Ubah jadwal"
      description: |
        Pindah tanggal dan/atau ganti shift (update PJ48). Tanggal tujuan yang sudah punya jadwal: 409 SCHEDULE_EXISTS. Jadwal yang diubah menjadi manual. Absensi yang terkait dihitung ulang mulai Fase 07.
        Jadwal dengan shift yang sudah dihapus tidak dapat dipindah ke hari ini atau sesudahnya tanpa memilih shift lain (422 shift_id).
        Wewenang REGION_ADMIN: personil di regu wilayahnya pada tanggal lama DAN tanggal baru.
      x-roles: [ORG_ADMIN, REGION_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdate' }
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/Schedule' } }
        '400':
          description: "BAD_REQUEST: body kosong atau bukan JSON yang valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                empty:
                  summary: Body kosong
                  value: { success: false, error: { code: BAD_REQUEST, message: "Body wajib diisi." }, meta: { request_id: req_abc123 } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
                expired:
                  summary: Token kedaluwarsa
                  value: { success: false, error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }, meta: { request_id: req_abc123 } }
        '403':
          description: "FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): personil di luar wilayah REGION_ADMIN."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: "Personil tidak bertugas di regu wilayah REGION_ADMIN"
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Data ini berada di luar wilayah yang Anda kelola.", details: { reason: ACCESS_OUTSIDE_ADMIN_SCOPE } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Jadwal tidak ada."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                SCHEDULE_NOT_FOUND:
                  summary: "Jadwal tidak ada atau milik organisasi lain"
                  value: { success: false, error: { code: NOT_FOUND, message: "Jadwal tidak ditemukan.", details: { reason: SCHEDULE_NOT_FOUND } }, meta: { request_id: req_abc123 } }
        '409':
          description: "CONFLICT: tanggal tujuan sudah punya jadwal."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                SCHEDULE_EXISTS:
                  summary: "Tanggal itu sudah punya jadwal (satu jadwal per personil per tanggal)"
                  value: { success: false, error: { code: CONFLICT, message: "Personil sudah memiliki jadwal pada 2026-10-21. Ubah jadwal tanggal tersebut.", details: { reason: SCHEDULE_EXISTS } }, meta: { request_id: req_abc123 } }
        '422':
          description: "VALIDATION_ERROR / UNPROCESSABLE: tanggal salah format, shift tidak ada atau nonaktif, atau zona waktu ambigu pada tanggal baru."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unknownShift:
                  summary: "Shift tidak ada"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: "shift_id", code: INVALID, message: "Shift tidak ditemukan." } ] }, meta: { request_id: req_abc123 } }
                SCHEDULE_TIMEZONE_AMBIGUOUS:
                  summary: "Pada tanggal itu personil bertugas di proyek WIB dan WITA/WIT sekaligus"
                  value: { success: false, error: { code: UNPROCESSABLE, message: "Personil bertugas di proyek dengan zona waktu berbeda pada tanggal tersebut.", details: { reason: SCHEDULE_TIMEZONE_AMBIGUOUS } }, meta: { request_id: req_abc123 } }
        '413':
          description: "PAYLOAD_TOO_LARGE: body lebih dari 1 MB."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                tooLarge:
                  value: { success: false, error: { code: PAYLOAD_TOO_LARGE, message: "Body terlalu besar." }, meta: { request_id: req_abc123 } }
    delete:
      operationId: deleteAdminSchedulesById
      tags: [Organization]
      summary: "Hapus jadwal"
      description: |
        Dihapus sungguhan; jejaknya di audit log.
        Wewenang REGION_ADMIN: hanya personil yang bertugas di regu wilayahnya pada tanggal jadwal itu (wilayah regu = nomor di depan kode regu).
      x-roles: [ORG_ADMIN, REGION_ADMIN]
      responses:
        '200':
          description: OK (data null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
                expired:
                  summary: Token kedaluwarsa
                  value: { success: false, error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }, meta: { request_id: req_abc123 } }
        '403':
          description: "FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): personil di luar wilayah REGION_ADMIN."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: "Personil tidak bertugas di regu wilayah REGION_ADMIN"
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Data ini berada di luar wilayah yang Anda kelola.", details: { reason: ACCESS_OUTSIDE_ADMIN_SCOPE } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Jadwal tidak ada."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                SCHEDULE_NOT_FOUND:
                  summary: "Jadwal tidak ada atau milik organisasi lain"
                  value: { success: false, error: { code: NOT_FOUND, message: "Jadwal tidak ditemukan.", details: { reason: SCHEDULE_NOT_FOUND } }, meta: { request_id: req_abc123 } }
