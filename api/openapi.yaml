      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PanicResolve' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/Panic' } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Optimistic-lock dua operator (CONFLICT)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /admin/panics:
    get:
      operationId: getAdminPanics
      tags: [Panic]
