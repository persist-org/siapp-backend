        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /asset-reports:
    get:
      operationId: getAssetReports
      tags: [Asset]
      summary: Detail/riwayat laporan aset per aset
      security:
        - bearerSession: []
        - oauth2ClientCredentials: [assets:read]
        - apiKey: []
      parameters:
        - name: asset_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SinceParam'
      responses:
        '200':
          description: >-
            OK. Delta-sync: `since` → `data` ter-upsert + `deleted` tombstone (DL-34);
            `meta.server_time` WAJIB.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AssetReport' } }
                      deleted: { type: array, items: { $ref: '#/components/schemas/Tombstone' } }
                      meta: { $ref: '#/components/schemas/DeltaMeta' }
              example:
                success: true
                data: [{ id: 6601, asset_id: 12 }]
                deleted: [{ id: 6500, deleted_at: "2026-06-01T02:00:00Z" }]
                pagination: { page: 1, limit: 20, total: 1, total_pages: 1 }
                meta: { request_id: "req_abc", server_time: "2026-06-01T03:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: postAssetReports
      tags: [Asset]
      summary: Buat laporan aset (offline + Idempotency-Key)
      security:
        - bearerSession: []
        - oauth2ClientCredentials: [assets:write]
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetReportCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/AssetReport' } } } ] } } } }
        '200': { description: Idempotent replay (local_id/key sama), content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/AssetReport' } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ============ VERTIKAL CLEANING — E-Memo (WEB-34/MOB-14) + Generate-QR (WEB-35/MOB-15) ============
  # CS-only: guard flag e_memo/generate_qr (projects.business_line='cleaning'); proyek security → 403/404.
  /e-memos:
    get:
      operationId: getEMemos
      tags: [Asset]
      summary: List/riwayat E-Memo (kotak masuk + terkirim)
      security:
        - bearerSession: []
        - oauth2ClientCredentials: [e-memo:read]
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/QParam'
        - $ref: '#/components/parameters/ProjectIdParam'
        - $ref: '#/components/parameters/DateFromParam'
        - $ref: '#/components/parameters/DateToParam'
        - name: box
          in: query
          description: Filter kotak masuk vs terkirim.
          required: false
          schema: { type: string, enum: [inbox, sent] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ListEnvelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/EMemo' } } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postEMemos
      tags: [Asset]
      summary: Compose/kirim E-Memo (offline + Idempotency-Key)
      security:
        - bearerSession: []
        - oauth2ClientCredentials: [e-memo:write]
        - apiKey: []
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EMemoCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/EMemo' } } } ] } } } }
        '200': { description: Idempotent replay (local_id/key sama), content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/EMemo' } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /e-memos/{id}:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    get:
      operationId: getEMemosById
      tags: [Asset]
      summary: Detail E-Memo + thread balasan
      security:
        - bearerSession: []
        - oauth2ClientCredentials: [e-memo:read]
        - apiKey: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/EMemo' } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchEMemosById
      tags: [Asset]
      summary: Ubah E-Memo induk (subject/body)
      security:
        - bearerSession: []
        - oauth2ClientCredentials: [e-memo:write]
        - apiKey: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EMemoUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/EMemo' } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteEMemosById
      tags: [Asset]
      summary: Hapus E-Memo (CASCADE ke e_memo_responses)
      security:
        - bearerSession: []
        - oauth2ClientCredentials: [e-memo:write]
        - apiKey: []
      responses:
