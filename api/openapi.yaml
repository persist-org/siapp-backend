  /admin/regions:
    get:
      operationId: getAdminRegions
      tags: [Organization]
      summary: "Daftar koordinator wilayah"
      description: |
        ORG_ADMIN melihat semuanya. REGION_ADMIN hanya melihat wilayahnya sendiri. Urutan: nomor wilayah (OS2 sebelum OS10). Pencarian `q` mencocokkan kode dan deskripsi.
      x-roles: [ORG_ADMIN, REGION_ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/QParam'
        - $ref: '#/components/parameters/IsActiveParam'
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ListEnvelope' }
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/Region' } } }
        '400':
          description: "BAD_REQUEST: query string mengandung karakter NUL (%00), yang tidak dapat disimpan di database."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                nul:
                  value: { success: false, error: { code: BAD_REQUEST, message: "Query string tidak boleh berisi karakter NUL." }, meta: { request_id: req_abc123 } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
                expired:
                  summary: Token kedaluwarsa
                  value: { success: false, error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }, meta: { request_id: req_abc123 } }
        '403':
          description: "Tanpa web role (FORBIDDEN), atau di luar wewenang (ROLE_DENIED / SCOPE_DENIED)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
        '422':
          description: "VALIDATION_ERROR: parameter query tidak valid (is_active bukan true/false, page atau limit di luar batas, q lebih dari 100 karakter, business_line di luar enum)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                badIsActive:
                  summary: "is_active=maybe"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: is_active, code: INVALID, message: "Harus true atau false." } ] }, meta: { request_id: req_abc123 } }
                badLimit:
                  summary: "limit=1000"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: limit, code: INVALID, message: "Maksimum 100." } ] }, meta: { request_id: req_abc123 } }
    post:
      operationId: postAdminRegions
      tags: [Organization]
      summary: "Buat koordinator wilayah"
      description: |
        Hanya ORG_ADMIN. Kode dikirim klien (OS diikuti angka) dan tidak dapat diubah. 409 CODE_TAKEN bila kode sudah dipakai, juga oleh wilayah yang dihapus.
      x-roles: [ORG_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionInput' }
      responses:
        '201':
          description: "Created"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/Region' } }
        '400':
          description: "BAD_REQUEST: body kosong, bukan JSON yang valid, lebih dari satu nilai JSON, atau berisi karakter NUL (\\u0000)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                empty:
                  summary: Body kosong
                  value: { success: false, error: { code: BAD_REQUEST, message: "Body wajib diisi." }, meta: { request_id: req_abc123 } }
                notJson:
                  summary: Bukan JSON
                  value: { success: false, error: { code: BAD_REQUEST, message: "Body bukan JSON yang valid." }, meta: { request_id: req_abc123 } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
                expired:
                  summary: Token kedaluwarsa
                  value: { success: false, error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }, meta: { request_id: req_abc123 } }
        '403':
          description: "Tanpa web role (FORBIDDEN), atau di luar wewenang (ROLE_DENIED / SCOPE_DENIED)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_ORG_ADMIN_ONLY:
                  summary: "REGION_ADMIN pada aksi khusus ORG_ADMIN"
                  value: { success: false, error: { code: ROLE_DENIED, message: "Hanya admin organisasi yang dapat melakukan ini.", details: { reason: ACCESS_ORG_ADMIN_ONLY } }, meta: { request_id: req_abc123 } }
        '409':
          description: "DUPLICATE: kode sudah dipakai."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                CODE_TAKEN:
                  value: { success: false, error: { code: DUPLICATE, message: "Kode sudah dipakai.", details: { reason: CODE_TAKEN } }, meta: { request_id: req_abc123 } }
        '422':
          description: "VALIDATION_ERROR: kode atau deskripsi tidak valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                badCode:
                  summary: "Kode salah bentuk (os1, OS01, OS0, XX1, 1K)"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: code, code: INVALID, message: "Harus berformat OS diikuti angka tanpa nol di depan, misalnya OS1." } ] }, meta: { request_id: req_abc123 } }
                blankDescription:
                  summary: "Deskripsi kosong atau hanya spasi"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: description, code: INVALID, message: "Tidak boleh kosong." } ] }, meta: { request_id: req_abc123 } }
                unknownField:
                  summary: "Field yang tidak boleh dikirim (kode atau kolom pembentuk kode)"
