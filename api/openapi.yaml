  /admin/field-permissions:
    get:
      operationId: getAdminFieldPermissions
      tags: [Auth]
      summary: Katalog hak akses lapangan dan matriks per peran regu (hanya ORG_ADMIN)
      description: |
        Hak akses petugas lapangan adalah data organisasi: tiap peran regu (DANRU, MEMBER) punya jangkauan per hak
        (`NONE`, `SELF`, `TEAM`, `PROJECT`). Katalog (daftar hak, deskripsi, bidang usaha, dan nilai bawaan dari Tabel 8 manual)
        ditetapkan oleh aplikasi; matriks adalah nilai yang berlaku sekarang. Organisasi yang belum pernah diisi mendapat
        nilai bawaan saat dibaca, jadi matriks tidak pernah kosong.
        Wewenang: hanya ORG_ADMIN. REGION_ADMIN: 403 `ROLE_DENIED` (`ACCESS_ORG_ADMIN_ONLY`), karena matriks berlaku untuk seluruh organisasi.
        Admin web tidak melewati hak lapangan; jalur `/admin` dijaga web role.
      x-roles: [ORG_ADMIN]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/FieldPermissionMatrix' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "FORBIDDEN `NOT_ADMIN` (staf lapangan) atau ROLE_DENIED `ACCESS_ORG_ADMIN_ONLY` (REGION_ADMIN)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                notAdmin:
                  summary: Staf lapangan
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                orgAdminOnly:
                  summary: REGION_ADMIN
                  value: { success: false, error: { code: ROLE_DENIED, message: "Hanya admin organisasi yang dapat melakukan ini.", details: { reason: ACCESS_ORG_ADMIN_ONLY } }, meta: { request_id: req_abc123 } }
  /admin/field-permissions/{team_role}:
    parameters: [ { $ref: '#/components/parameters/TeamRolePath' } ]
    put:
      operationId: putAdminFieldPermissionsByTeamRole
      tags: [Auth]
      summary: Ganti semua hak lapangan satu peran regu (hanya ORG_ADMIN)
      description: |
        Mengganti seluruh hak satu peran dalam satu transaksi (gagal berarti tidak ada yang berubah) dan mengembalikan hak peran itu
        sekarang. `grants` harus memuat setiap hak di katalog tepat satu kali: ini penggantian, jadi hak yang tidak disebut ditolak
        (422 `REQUIRED`) dan bukan dianggap dicabut, dan daftar yang pendek tidak dapat melucuti peran. Kunci yang tidak ada di
        katalog: 422 `PERMISSION_UNKNOWN`. Kunci ganda atau jangkauan di luar `NONE`, `SELF`, `TEAM`, `PROJECT`: 422 `VALIDATION_ERROR`.
        `errors[]` menyebut grant yang mana (`grants[3].scope`).
        Hak yang berubah dicatat di audit log dengan jangkauan lama dan baru; penggantian yang tidak mengubah apa pun tidak mencatat
        apa-apa. Perubahan berlaku pada permintaan berikutnya orang-orang yang memegang peran itu (hak dibaca dari database, bukan dari token).
        Wewenang: hanya ORG_ADMIN. REGION_ADMIN: 403 `ROLE_DENIED` (`ACCESS_ORG_ADMIN_ONLY`).
      x-roles: [ORG_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldPermissionsInput' }
      responses:
        '200':
          description: OK (hak peran itu sekarang)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/FieldPermissionRole' } }
        '400':
          description: "BAD_REQUEST: body kosong, bukan JSON yang valid, lebih dari satu objek, atau memuat karakter NUL."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                empty:
                  summary: Body kosong
                  value: { success: false, error: { code: BAD_REQUEST, message: "Body wajib diisi." }, meta: { request_id: req_abc123 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "FORBIDDEN `NOT_ADMIN` (staf lapangan) atau ROLE_DENIED `ACCESS_ORG_ADMIN_ONLY` (REGION_ADMIN)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                orgAdminOnly:
                  summary: REGION_ADMIN
                  value: { success: false, error: { code: ROLE_DENIED, message: "Hanya admin organisasi yang dapat melakukan ini.", details: { reason: ACCESS_ORG_ADMIN_ONLY } }, meta: { request_id: req_abc123 } }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: "PAYLOAD_TOO_LARGE: body lebih dari 1 MB."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                tooLarge:
                  value: { success: false, error: { code: PAYLOAD_TOO_LARGE, message: "Body terlalu besar." }, meta: { request_id: req_abc123 } }
        '422':
          description: "VALIDATION_ERROR: daftar hak tidak valid. Reason `PERMISSION_UNKNOWN` bila ada kunci yang tidak dikenal."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unknownPermission:
                  summary: Kunci tidak dikenal
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Ada hak akses yang tidak dikenal.", details: { reason: PERMISSION_UNKNOWN }, errors: [ { field: "grants[2].permission", code: UNKNOWN, message: "Hak akses tidak dikenal." } ] }, meta: { request_id: req_abc123 } }
                missing:
                  summary: Hak yang tidak disebut
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: grants, code: REQUIRED, message: "Hak akses cctv.view wajib ada di daftar." } ] }, meta: { request_id: req_abc123 } }
