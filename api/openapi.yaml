openapi: 3.0.3
info:
  title: SiAPP API
  version: 0.1.0
  description: >
    Backend API for SiAPP. Every endpoint added by a phase is described here, and HTTP tests
    validate each request and response against this file.

# Bearer auth is the default; public endpoints opt out with `security: []`.
security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in with email or username
      description: >
        Public. Creates a session (12 hours, or 30 days with `rememberMe`) and returns an
        access token (15 minutes) and a refresh token. Only failed logins are limited: 10 per
        minute for one client IP and account name, and 100 per minute for one client IP.
        Successful logins never count, so many users on one network are not affected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: >
            Unknown user or wrong password (`AUTH_INVALID_CREDENTIALS`). The same response is
            used for both, so it cannot be used to find out which accounts exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >
            The password is correct but the account is disabled (`AUTH_ACCOUNT_DISABLED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: >
            Locked for 15 minutes after 5 consecutive failed attempts (`AUTH_ACCOUNT_LOCKED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >
            Too many failed logins from this client IP (`RATE_LIMITED`). Even the right
            password is refused until the window ends. `Retry-After` gives the seconds to wait.
          headers:
            Retry-After:
              description: Seconds until the limit resets.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new token pair
      description: >
        Public: it authenticates with the refresh token, because the access token has usually
        expired by then. A refresh token works exactly once. Using it retires it and returns
        the next one, and the new session lives as long as the old one would have from now.
        Presenting a token that was already used, or whose session was ended, revokes every
        session of that login chain (`AUTH_REFRESH_REUSED`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair. The old refresh token no longer works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: >
            The refresh token is unknown or expired (`AUTH_TOKEN_INVALID`), or it was already
            used or its session ended (`AUTH_REFRESH_REUSED`, and the whole chain is revoked).
            Either way the client must log in again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The account is disabled (`AUTH_ACCOUNT_DISABLED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: >
        Ends the session of the access token. Its refresh token stops working and the access
        token itself is cut off at once, on every endpoint. Calling it again with the same
        access token therefore returns 401.
      responses:
        "200":
          description: The session is ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: End every session of the user
      description: >
        Ends all sessions on every device, and cuts off their access tokens at once, including
        the one used for this call. Calling it again with the same access token returns 401.
      responses:
        "200":
          description: All sessions are ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutAllResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Ask for a password reset link
      description: >
        Public. Always answers 202 with the same body, whether or not the email has an account,
        so it cannot be used to find out which addresses are registered. For an ACTIVE user
        an email with a single-use link, valid for 1 hour, is sent; asking again replaces the
        earlier link. Every request counts toward the limits, including ones for unknown
        addresses: 30 per 15 minutes per client IP, and 3 per 15 minutes per email address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Accepted. A link is sent if the address belongs to an active account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitedWithRetryAfter"

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with a reset link's token
      description: >
        Public: the token from the emailed link is the credential. On success the password is
        replaced, the lockout is cleared, and every session of the user is ended, so all
        devices have to log in again. The link works once. A password that breaks the rules
        (`AUTH_PASSWORD_WEAK`) does not use the link up.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: The password is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: >
            The body is invalid (`VALIDATION_FAILED`), the link is unknown, expired or already
            used (`AUTH_RESET_INVALID`), or the new password breaks the rules
            (`AUTH_PASSWORD_WEAK`: at least 8 characters, not the email name or username).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/users:
    post:
      operationId: createUser
      summary: Create a user (admin)
      description: >
        Creates an ACTIVE user who can log in at once, with no activation step. The password is
        the birthdate as `DDMMYYYY` (for example 1994-05-10 gives `10051994`); it is never
        returned, and the user is not forced to change it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "409":
          description: The email (`USER_EMAIL_TAKEN`) or the username (`USER_USERNAME_TAKEN`) is already used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listUsers
      summary: List users (admin)
      description: Newest first, with cursor pagination.
      parameters:
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, DISABLED] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUser
      summary: Get one user (admin)
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/UserNotFound"
    patch:
      operationId: updateUser
      summary: Change a user's profile (admin)
      description: >
        Every field is optional and a missing one is left alone; send at least one. An empty
        `username` or `phone` clears it. Changing `birthDate` does not change the password. An
        admin cannot change their own role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: >
            The username is already used (`USER_USERNAME_TAKEN`), or an admin tried to change
            their own role (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: disableUser
      summary: Disable a user (admin)
      description: >
        The user can no longer log in or refresh, and every session is ended at once, including
        the access tokens. Disabling a user who is already disabled changes nothing. An admin
        cannot disable their own account.
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: enableUser
      summary: Enable a disabled user (admin)
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "404":
          $ref: "#/components/responses/UserNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Q:
      name: q
      in: query
      description: Free-text search.
      schema: { type: string, maxLength: 100 }
    Date:
      name: date
      in: query
      description: Business date. Cannot be combined with `month`.
      schema: { type: string, format: date }
    Month:
      name: month
      in: query
      description: Business month, `YYYY-MM`. Cannot be combined with `date`.
      schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
    CategoryId:
      name: categoryId
      in: query
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the `nextCursor` of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size. Values above 100 are clamped to 100.
      schema: { type: integer, minimum: 1, default: 20 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: The request is malformed or failed validation (`VALIDATION_FAILED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing or invalid credentials (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PermissionDenied:
      description: The caller may not do this (`PERMISSION_DENIED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource does not exist (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with current state (`CONFLICT` or `ID_CONFLICT`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests (`RATE_LIMITED`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimitedWithRetryAfter:
      description: Too many requests (`RATE_LIMITED`). `Retry-After` gives the seconds to wait.
      headers:
        Retry-After:
          description: Seconds until the limit allows another request.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UserNotFound:
      description: No such user (`USER_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected failure (`INTERNAL_ERROR`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          maxLength: 255
          description: The user's email or username.
        password:
          type: string
          maxLength: 256
        rememberMe:
          type: boolean
          default: false

    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256

    Message:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: Indonesian text that is safe to show to users.

    ForgotPasswordRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 255 }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: The `token` from the emailed link.
        newPassword:
          type: string
          minLength: 1
          maxLength: 256

    CreateUserRequest:
      type: object
      required: [email, fullName, birthDate, systemRole]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 255 }
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{3,50}$'
          description: Optional. Letters, digits, dot, underscore and hyphen; never an "@".
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, maxLength: 30 }
        birthDate:
          type: string
          format: date
          description: Also the user's starting password, as `DDMMYYYY`.
        systemRole: { type: string, enum: [ADMIN, MEMBER] }

    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, maxLength: 30, description: Empty clears it. }
        username: { type: string, maxLength: 50, description: Empty clears it. }
        birthDate: { type: string, format: date }
        systemRole: { type: string, enum: [ADMIN, MEMBER] }

    AdminUser:
      type: object
      required: [id, email, username, fullName, phone, birthDate, systemRole, status, lastLoginAt, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string, nullable: true }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        systemRole: { type: string, enum: [ADMIN, MEMBER] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AdminUserPage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Null on the last page.

    LogoutResponse:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: Indonesian text that is safe to show to users.

    LogoutAllResponse:
      type: object
      required: [message, sessionsEnded]
      additionalProperties: false
      properties:
        message:
          type: string
          description: Indonesian text that is safe to show to users.
        sessionsEnded:
          type: integer
          minimum: 0
          description: How many sessions were still active and have now been revoked.

    TokenPairResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken]
      additionalProperties: false
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: The next refresh token. Replace the stored one; the old one is now dead.

    LoginResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, user]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: JWT (HS256), valid for 15 minutes. Send it as a Bearer token in the Authorization header.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Opaque token for getting a new access token.
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, username, fullName, phone, systemRole, status]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string, nullable: true }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        systemRole: { type: string, enum: [ADMIN, MEMBER] }
        status: { type: string, enum: [ACTIVE, DISABLED] }

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable UPPER_SNAKE code.
              example: VALIDATION_FAILED
            message:
              type: string
              description: Indonesian text that is safe to show to users.
            details:
              description: >
                Optional context. For `VALIDATION_FAILED` it is a list of `FieldError`.
              type: array
              items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, messages]
      additionalProperties: false
      properties:
        field:
          type: string
          description: The JSON name of the offending field.
        messages:
          type: array
          items: { type: string }

    # Endpoints return `allOf` this wrapper with a concrete `items` schema.
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page. Null on the last page.
