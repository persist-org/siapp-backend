    put:
      operationId: putAdminPersonnelByPersonnelIdShiftAssignment
      tags: [Organization]
      summary: "Atur jadwal personil (FIXED/FLEXIBLE)"
      description: |
        Sama dengan halaman Shift Group PJ48, dalam satu transaksi.
        FIXED: jadwal dibuat dari pola shift group mulai effective_date sampai hari ini + 60 hari, lalu diperpanjang tiap malam. Sebelumnya jadwal yang akan diganti dihapus, mulai dari effective_date (atau effective_date lama bila lebih awal), tetapi tidak pernah tanggal lampau, dan tidak hari ini bila shift hari ini sudah dimulai. Jadwal manual dalam rentang itu ikut diganti, seperti PJ48.
