openapi: 3.1.0
info:
  title: PERSIST API
  version: 1.0.0
  description: |
    Kontrak API resmi PERSIST (platform SaaS multi-tenant SiAPP rebuild) — integration
    seam untuk tim Core / Web / Mobile yang bekerja paralel. Sumber kebenaran kontrak
    endpoint (path, skema, security, scope, kode error) per DL-25.

    Tenancy: setiap entitas ter-scope ke `organization_id` (tenant = perusahaan
    Outsourcing). Isolasi ditegakkan via PostgreSQL RLS (`app.current_org`) dari klaim
    JWT (DL-19/DL-21). `business_line` (security|cleaning) BUKAN klaim JWT — ia atribut
    data per-proyek.

    Konvensi tipe data (DL-38): uang = string desimal (mis. "125000.00"), timestamp =
    UTC ISO-8601 dengan `Z`, tanggal-saja (DATE-ONLY) = `YYYY-MM-DD` tanpa zona.

    Amplop respons PERSIST (BUKAN application/problem+json): SuccessEnvelope /
    ListEnvelope / ErrorEnvelope. Kode error permukaan /api/v1/* = UPPERCASE
    machine-readable; pengecualian POST /oauth/token = kode RFC 6749 lowercase.

    CATATAN REALTIME: kanal realtime (WebSocket multipleks + FCM fallback, DL-35)
    BERADA DI LUAR OpenAPI ini; hanya REST yang dikontrakkan di sini.

    DI LUAR LINGKUP (sengaja tidak dikontrakkan): Penilaian/Review (HOLD, DL-46);
    HR-profile personil (education/qualification-history/work-experience/skill/salary/
    KTA, DEFERRED DL-16); Face Recognition (tautan eksternal, OUT).

    Catatan PII: seluruh contoh dianonimkan (NIK 32xxxxxxxxxxxxxx, nama Andi/Budi,
    username username01, email user01@contoh.com, telp 08xxxxxxxxxx).

    HEADER KORELASI GLOBAL: `X-Request-Id` dan `X-Tenant-Id` DITERIMA pada SEMUA
    operasi sebagai header korelasi/observability SAJA — tidak perlu di-`$ref` per-op.
    Server TIDAK pernah memakai `X-Tenant-Id` untuk otorisasi/isolasi (tenant selalu
    dari klaim `organization_id` di JWT, DL-19/DL-21); `X-Request-Id` (bila dikirim)
    digemakan di `meta.request_id` untuk korelasi audit lintas log/trace.

    OUT-OF-SCOPE for MVP (Phase 2): Developer Portal / Open API management (api_clients,
    api_keys, webhook_endpoints, webhook_deliveries, api_request_logs, api_usage_counters)
    and the cleaning vertical (E-Memo, Generate-QR) — schemas retained for forward-compat;
    endpoints to be added in a later phase. Penilaian (master_review/personnel_review)
    remains HOLD (DL-46); HR-profile & Face-Recognition OUT.
  contact:
    name: PT Artha Solusi Kreasindo — Platform Engineering
    email: tech@akseskerja.com

servers:
  - url: https://{host}/api/v1
    description: Permukaan utama (session JWT dashboard + Public API per-organisasi)
    variables:
      host:
        default: api.persist.example.com
  - url: https://{host}/api/v1/platform
    description: Permukaan Platform (staf PT ASK, lintas-organisasi)
    variables:
      host:
        default: api.persist.example.com

security:
  - bearerSession: []

tags:
  - name: Auth
    description: Otentikasi sesi (mobile & web)
  - name: OAuth
    description: OAuth2 client-credentials (Public API M2M)
  - name: Masters
    description: Master/konfigurasi org-scoped + referensi nasional
  - name: Organization
    description: Domain organisasi (region/branch/client/project/team/personnel)
  - name: Attendance
    description: Kehadiran (absensi) + koreksi
  - name: Permission
    description: Izin & tukar jaga
  - name: Instruction
    description: Instruksi + acknowledgement
  - name: Report
    description: Laporan lapangan (offline-capable)
  - name: Patrol
    description: Patroli & Jaga (zona, scan, check-in)
  - name: Panic
    description: Sinyal panik
  - name: CCTV
    description: CCTV
  - name: Notification
    description: Notifikasi mobile + FCM token (12 event)
  - name: Dashboard
    description: Overview/dashboard agregat + chart (WEB-03/04)
  - name: Tracking
    description: Personnel tracking (location logs)
  - name: Asset
    description: Aset (inventaris) & laporan aset
  - name: ReportSummary
    description: Ringkasan Laporan (13 jenis) + export
  - name: Platform
    description: Manajemen tenant/onboarding/plan/subscription/invoice/headcount
  - name: Billing
    description: Billing org-facing
  - name: Seam
    description: |
      Seam server-to-server SiAPP <-> Persist Personel (LOCK F1). TIDAK dilayani oleh API ini:
      ini adalah permukaan milik Personel (kpi-personalia-api), dipanggil backend SiAPP dengan
      header X-Integration-Key (kunci bersama; Personalia hanya menyimpan SHA-256-nya, D8).
      Daftar ini adalah satu-satunya tempat status tiap seam dicatat. `x-status`:
      `implemented` = sudah ada di Personel dan diuji kontrak; `proposed` = usulan SiAPP,
      menunggu review tim Personel (belum ada endpoint-nya).
    x-seams:
      - id: S1
        name: Login (cek kredensial akun Personalia)
        x-status: implemented
        x-owner: personel
        endpoint: POST /api/v3/integrations/siapp/login
        notes: "Request {email, password, client_ip?, user_agent?}. Mengembalikan Identity (termasuk domain personalia|siapp), tanpa token dan tanpa binding perangkat. Binding satu-HP milik SiAPP."
      - id: S2
        name: Struktur organisasi (project, penempatan, jabatan)
        x-status: proposed
        x-owner: personel
      - id: S3
        name: Kehadiran (push event, status)
        x-status: proposed
        x-owner: personel
      - id: S4
        name: Lookup karyawan per NIK (maks. 200)
        x-status: implemented
        x-owner: personel
        endpoint: POST /api/v3/integrations/siapp/employees
        notes: "Request {niks: [...]}. NIK tidak dikenal dihilangkan; karyawan nonaktif dikembalikan dengan active=false."
      - id: S5
        name: Izin / cuti (jenis, ajukan, putuskan, daftar)
        x-status: proposed
        x-owner: personel
      - id: S6
        name: Event perubahan (webhook Personel ke SiAPP)
        x-status: proposed
        x-owner: personel

components:

  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session JWT (mobile/web) dari POST /auth/login. Klaim wajib: sub, organization_id,
        roles/scope, exp, iat. Middleware set app.current_org → RLS.
    oauth2ClientCredentials:
      type: oauth2
      description: |
        Public API M2M per-organisasi (DL-26). Token org-scoped membawa organization_id +
        scopes granular (resource:action), menempuh isolasi RLS yang sama. Scope kurang →
        403 INSUFFICIENT_SCOPE.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            personnel:read: Baca data personil
            personnel:write: Tulis data personil
            attendance:read: Baca kehadiran
            attendance:write: Tulis kehadiran
            reports:read: Baca laporan
            reports:write: Tulis laporan
            instructions:read: Baca instruksi
            instructions:write: Tulis instruksi
            patrol:read: Baca patroli/jaga
            patrol:write: Tulis patroli/jaga
            panic:read: Baca panik
            panic:write: Kirim/selesaikan panik
            cctv:read: Baca CCTV
            assets:read: Baca aset
            assets:write: Tulis laporan aset
            masters:read: Baca master/konfigurasi
            masters:write: Tulis master/konfigurasi
            reviews:read: Baca penilaian (master + personil)
            reviews:write: Tulis penilaian (master + kirim penilaian personil)
            organization:read: Baca domain organisasi
            organization:write: Tulis domain organisasi
            e-memo:read: Baca E-Memo (vertikal cleaning)
            e-memo:write: Tulis/kirim/balas E-Memo (vertikal cleaning)
            qr:generate: Generate/kelola QR identitas zona (vertikal cleaning)
            billing:read: Baca billing
            webhooks:read: Baca webhook endpoints + deliveries (WEB-38)
            webhooks:write: Kelola webhook endpoints, replay deliveries (WEB-38)
            developer:read: Baca kredensial API + usage/metering Developer Portal (WEB-38)
            developer:write: Kelola api_clients/api_keys (buat/rotasi/revoke) Developer Portal (WEB-38)
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key ber-scope statis (alternatif ringan OAuth), org-scoped + ber-scope +
        expires_at opsional. Format `<prefix>.<secret>`.

  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (1-indexed).
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      description: Item per halaman (maks 100).
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortParam:
      name: sort
      in: query
      description: Sortir per-resource, mis. `created_at:desc`.
      required: false
      schema: { type: string, example: created_at:desc }
    QParam:
      name: q
      in: query
      description: Pencarian teks case-insensitive (nama/kode/subjek).
      required: false
      schema: { type: string }
    BranchIdParam:
      name: branch_id
      in: query
      description: Filter scope cabang.
      required: false
      schema: { type: integer, format: int64 }
    ClientIdParam:
      name: client_id
      in: query
      description: Filter scope klien.
      required: false
      schema: { type: integer, format: int64 }
    ProjectIdParam:
      name: project_id
      in: query
      description: Filter scope proyek.
      required: false
      schema: { type: integer, format: int64 }
    TeamIdParam:
      name: team_id
      in: query
      description: Filter scope regu.
      required: false
      schema: { type: integer, format: int64 }
    EndpointIdParam:
      name: endpoint_id
      in: query
      description: Filter webhook_deliveries per endpoint (WEB-38).
      required: false
      schema: { type: integer, format: int64 }
    DateFromParam:
      name: date_from
      in: query
      description: Awal rentang (YYYY-MM-DD, relatif TZ proyek).
      required: false
      schema: { type: string, format: date }
    DateToParam:
      name: date_to
      in: query
      description: Akhir rentang (YYYY-MM-DD, relatif TZ proyek).
      required: false
      schema: { type: string, format: date }
    SinceParam:
      name: since
      in: query
      description: Delta-sync watermark (updated_at). Tanpa since → full pull (DL-34).
      required: false
      schema: { type: string, format: date-time }
    CursorParam:
      name: cursor
      in: query
      description: Cursor opaque untuk tarik inkremental (DL-34).
      required: false
      schema: { type: string }
    IsActiveParam:
      name: is_active
      in: query
      description: Filter status aktif.
      required: false
      schema: { type: boolean }
    StatusParam:
      name: status
      in: query
      description: Filter status/enum resource.
      required: false
      schema: { type: string }
    BusinessLineParam:
      name: business_line
      in: query
      description: Vertikal per-proyek.
      required: false
      schema: { type: string, enum: [security, cleaning] }
    IdPath:
      name: id
      in: path
      required: true
      description: Identitas resource.
      schema: { type: integer, format: int64 }
    # Header parameters (correlation / idempotency)
    PersonnelIdPath:
      name: personnel_id
      in: path
      required: true
      description: Identitas lokal orang (personnels.id), bukan id Personalia.
      schema: { type: integer, format: int64 }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUIDv4 stabil seumur item; WAJIB untuk mutasi tak-aman yang dapat di-retry/antre
        offline (DL-34). Retry key sama → respons tersimpan; body berbeda + key sama →
        409 CONFLICT.
      schema: { type: string, format: uuid }
    XRequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Korelasi audit; digemakan server bila dikirim, jika tidak dibangkitkan.
      schema: { type: string }
    XTenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        KORELASI/OBSERVABILITY SAJA (DL-40). Server TIDAK pernah memakainya untuk
        otorisasi/isolasi; tenant selalu dari klaim organization_id JWT.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Token tidak ada/kedaluwarsa/invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            unauthenticated:
              value:
                success: false
                error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }
                meta: { request_id: "req_abc123" }
            expired:
              value:
                success: false
                error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }
                meta: { request_id: "req_abc123" }
    Forbidden:
      description: Role/scope tidak berwenang.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            forbidden:
              value:
                success: false
                error: { code: FORBIDDEN, message: "Akses ditolak." }
                meta: { request_id: "req_abc123" }
            insufficientScope:
              value:
                success: false
                error:
                  code: INSUFFICIENT_SCOPE
                  message: "Scope tidak mencukupi."
                  details: { scope_required: "personnel:write" }
                meta: { request_id: "req_abc123" }
    NotFound:
      description: Resource tidak ada atau di luar organisasi JWT (anti-enumerasi).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: NOT_FOUND, message: "Data tidak ditemukan." }
            meta: { request_id: "req_abc123" }
    ValidationError:
      description: Validasi body/query gagal atau aturan bisnis gagal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: "Validasi gagal pada beberapa field."
              errors:
                - { field: nik, code: DUPLICATE, message: "NIK sudah terdaftar." }
            meta: { request_id: "req_abc123" }
    Conflict:
      description: Pelanggaran UNIQUE / state konflik.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: CONFLICT, message: "Data konflik." }
            meta: { request_id: "req_abc123" }
    RateLimited:
      description: Terlalu banyak percobaan.
      headers:
        Retry-After:
          description: Detik sebelum mencoba lagi.
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          description: Epoch detik reset kuota.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: RATE_LIMITED, message: "Terlalu banyak permintaan." }
            meta: { request_id: "req_abc123" }
    ServiceUnavailable:
      description: |
        Persist Personel (Personalia) tidak dapat menjawab. `error.code` = INTERNAL_ERROR dengan
        `error.details.reason` = PERSONEL_UNAVAILABLE (ErrorCode tidak punya kode 503). Klien mencoba lagi nanti.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: "Layanan Personalia sedang tidak tersedia. Coba lagi sebentar lagi."
              details: { reason: PERSONEL_UNAVAILABLE }
            meta: { request_id: "req_abc123" }

  schemas:

    # ---------- Envelopes & error model ----------
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, description: Korelasi audit. }
        server_time:
          type: string
          format: date-time
          description: Watermark monoton untuk delta-sync (DL-34).
    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 143 }
        total_pages: { type: integer, example: 8 }
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ListEnvelope:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: {}
        pagination: { $ref: '#/components/schemas/Pagination' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorCode:
      type: string
      description: Kode error UPPERCASE machine-readable permukaan /api/v1/*.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - INSUFFICIENT_SCOPE
        - NOT_FOUND
        - CONFLICT
        - DUPLICATE
        - UNDERSTAFFED
        - PAYLOAD_TOO_LARGE
        - UNPROCESSABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - BAD_REQUEST
        - ROLE_DENIED
        - ORG_MISMATCH
        - SCOPE_DENIED
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, example: nik }
        code: { type: string, example: DUPLICATE }
        message: { type: string, example: "NIK sudah terdaftar." }
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Pesan human-readable (Bahasa Indonesia). }
            details:
              type: object
              additionalProperties: true
              description: Konteks tambahan opsional (mis. scope_required, retry_after).
            errors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
        meta:
          type: object
          required: [request_id]
          properties:
            request_id: { type: string }
    OAuthError:
      type: object
      description: Error token endpoint (kode RFC 6749 lowercase — KHUSUS /oauth/token).
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_client, invalid_scope, unsupported_grant_type, invalid_grant]
        error_description: { type: string }
    Tombstone:
      type: object
      description: Record terhapus untuk cache lokal delta-sync (DL-34).
      required: [id, deleted_at]
      properties:
        id: { type: integer, format: int64 }
        deleted_at: { type: string, format: date-time }
    DeltaMeta:
      type: object
      description: >-
        Meta untuk respons delta-sync (DL-34) — `server_time` WAJIB sebagai watermark
        monoton untuk pull berikutnya.
      required: [request_id, server_time]
      properties:
        request_id: { type: string, description: Korelasi audit. }
        server_time:
          type: string
          format: date-time
          description: Watermark monoton (= titik mulai pull `since` berikutnya).
        next_cursor:
          type: string
          description: Cursor opaque untuk halaman berikutnya; dihilangkan bila tidak ada lagi data (lihat has_more).
        has_more:
          type: boolean
          description: true bila masih ada data setelah halaman ini (tarik lagi dengan cursor).

    # ---------- Shared primitives ----------
    Money:
      type: string
      description: Nominal sebagai string desimal (DL-38) — jangan float.
      example: "125000.00"
    Coordinate:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: -6.2 }
        lng: { type: number, format: double, example: 106.8 }

    # ---------- Auth payloads ----------
    LoginRequest:
      type: object
      required: [identifier, password, client]
      properties:
        identifier:
          type: string
          description: Email akun Persist Personalia. Password diperiksa oleh Personalia, SiAPP tidak menyimpannya.
          example: budi@contoh.com
        password: { type: string, format: password }
        client:
          type: string
          enum: [MOBILE, WEB]
          description: Aplikasi yang login. MOBILE mengikat satu perangkat per orang; WEB tidak mengikat perangkat.
        device_token:
          type: string
          maxLength: 512
          description: Pengenal perangkat. Wajib bila client = MOBILE (satu orang = satu HP); diabaikan untuk WEB.
        remember_me: { type: boolean }
        organization_code:
          type: string
          deprecated: true
          description: Diabaikan. Organisasi ditentukan oleh Personalia (perusahaan tempat orang itu bekerja), bukan oleh request.
          example: OS1
    LoginResult:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        user: { $ref: '#/components/schemas/Personnel' }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: user01@contoh.com }
        organization_code: { type: string }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, format: password }
    MeResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Personnel' }
        roles:
          type: array
          items: { type: string }
          example: [OWNER, PLATFORM]
        team_role: { type: string, enum: [DANRU, MEMBER], nullable: true, example: DANRU }
        organization:
          type: object
          description: Organisasi (tenant) orang ini, dari Personalia.
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        web_role:
          type: object
          nullable: true
          description: Penugasan peran web (admin) milik SiAPP; null untuk petugas lapangan.
          properties:
            role: { type: string, enum: [ORG_ADMIN, PROJECT_ADMIN] }
            project_ids: { type: array, items: { type: integer, format: int64 } }
        memberships:
          type: array
          description: Keanggotaan regu aktif beserta peran (diisi sejak Fase 02.2; kosong sebelumnya).
          items: { type: object, additionalProperties: true }
    WebRoleAssignment:
      type: object
      properties:
        personnel_id: { type: integer, format: int64 }
        full_name: { type: string }
        nik: { type: string, description: Disamarkan; hanya 4 digit terakhir. }
        role: { type: string, enum: [ORG_ADMIN, PROJECT_ADMIN] }
        project_ids: { type: array, items: { type: integer, format: int64 } }
        granted_by_personnel_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebRoleInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ORG_ADMIN, PROJECT_ADMIN] }
        project_ids:
          type: array
          items: { type: integer, format: int64 }
          description: Wajib dan tidak kosong untuk PROJECT_ADMIN; harus kosong untuk ORG_ADMIN.
    OAuthTokenResult:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string, example: "personnel:read attendance:read reports:read" }

    # ---------- 1. organizations (tenant) ----------
    Organization:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: OS1 }
        name: { type: string }
        legal_name: { type: string, nullable: true }
        status: { type: string, enum: [trial, active, suspended, churned] }
        enabled_business_lines:
          type: array
          items: { type: string, enum: [security, cleaning] }
        branding:
          type: object
          nullable: true
          properties:
            logo_url: { type: string }
            primary_color: { type: string }
            app_name: { type: string }
        timezone_default: { type: string, example: Asia/Jakarta }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      required: [code, name, enabled_business_lines]
      properties:
        code: { type: string }
        name: { type: string }
        legal_name: { type: string }
        enabled_business_lines:
          type: array
          items: { type: string, enum: [security, cleaning] }
        timezone_default: { type: string, default: Asia/Jakarta }
        branding: { type: object, additionalProperties: true }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string }
        legal_name: { type: string }
        enabled_business_lines:
          type: array
          items: { type: string, enum: [security, cleaning] }
        branding: { type: object, additionalProperties: true }
        timezone_default: { type: string }

    # ---------- 2. regions (Wilayah/Korwil) ----------
    Region:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegionInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }

    # ---------- 3. branches ----------
    Branch:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        branch_code: { type: string, example: "1K" }
        region_id: { type: integer, format: int64 }
        manager_name: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        province_id: { type: integer, format: int64, nullable: true }
        city_id: { type: integer, format: int64, nullable: true }
        phone: { type: string, nullable: true, example: "08xxxxxxxxxx" }
        fax: { type: string, nullable: true }
        office_email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        map_address: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        postal_code: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BranchInput:
      type: object
      required: [branch_code, region_id]
      properties:
        branch_code: { type: string }
        region_id: { type: integer, format: int64 }
        manager_name: { type: string }
        city: { type: string }
        province: { type: string }
        province_id: { type: integer, format: int64 }
        city_id: { type: integer, format: int64 }
        phone: { type: string }
        fax: { type: string }
        office_email: { type: string }
        address: { type: string }
        map_address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        postal_code: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }

    # ---------- 4. clients ----------
    Client:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        client_code: { type: string, example: "1K-IBMI" }
        branch_id: { type: integer, format: int64 }
        manager_name: { type: string, nullable: true }
        director_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        fax: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        map_address: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        province_id: { type: integer, format: int64, nullable: true }
        city_id: { type: integer, format: int64, nullable: true }
        postal_code: { type: string, nullable: true }
        client_type_id: { type: integer, format: int64, nullable: true }
        client_group_id: { type: integer, format: int64, nullable: true }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [client_code, branch_id]
      properties:
        client_code: { type: string }
        branch_id: { type: integer, format: int64 }
        manager_name: { type: string }
        director_name: { type: string }
        phone: { type: string }
        fax: { type: string }
        email: { type: string }
        address: { type: string }
        map_address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        province_id: { type: integer, format: int64 }
        city_id: { type: integer, format: int64 }
        postal_code: { type: string }
        client_type_id: { type: integer, format: int64 }
        client_group_id: { type: integer, format: int64 }
        description: { type: string }
        is_active: { type: boolean, default: true }

    # ---------- 5. projects ----------
    Project:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        project_code: { type: string, example: "1K-IBMI-S" }
        client_id: { type: integer, format: int64 }
        branch_id: { type: integer, format: int64, nullable: true }
        business_line: { type: string, enum: [security, cleaning] }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        timezone: { type: string, enum: [WIB, WITA, WIT] }
        iana_tz: { type: string, example: Asia/Jakarta }
        province_id: { type: integer, format: int64, nullable: true }
        city_id: { type: integer, format: int64, nullable: true }
        map_address: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        status_gps_tracking: { type: boolean, description: "Aktifkan tracking GPS personil (DL-48)." }
        is_patrol_limited_by_interval: { type: boolean, description: "Batasi scan patroli per interval (DL-48)." }
        patrol_interval_in_minutes: { type: integer, nullable: true, minimum: 1 }
        contract_start: { type: string, format: date, nullable: true }
        contract_end: { type: string, format: date, nullable: true }
        chief_security: { type: string, nullable: true }
        manager_name: { type: string, nullable: true }
        shift_config: { type: object, nullable: true, additionalProperties: true }
        salary: { allOf: [ { $ref: '#/components/schemas/Money' } ], nullable: true }
        emergency_contacts:
          type: array
          nullable: true
          description: 'Telp 3 tipe kejadian (Polisi/RS/Pemadam) — DL-14/manual 2.17.'
          items:
            type: object
            required: [type, name, phone]
            properties:
              type: { type: string, example: Polisi }
              name: { type: string }
              phone: { type: string, example: "08xxxxxxxxxx" }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [project_code, client_id, business_line]
      properties:
        project_code: { type: string }
        client_id: { type: integer, format: int64 }
        branch_id: { type: integer, format: int64 }
        business_line: { type: string, enum: [security, cleaning] }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        timezone: { type: string, enum: [WIB, WITA, WIT], default: WIB }
        iana_tz: { type: string, default: Asia/Jakarta }
        province_id: { type: integer, format: int64 }
        city_id: { type: integer, format: int64 }
        map_address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        status_gps_tracking: { type: boolean, default: false }
        is_patrol_limited_by_interval: { type: boolean, default: false }
        patrol_interval_in_minutes: { type: integer, minimum: 1 }
        contract_start: { type: string, format: date }
        contract_end: { type: string, format: date }
        chief_security: { type: string }
        manager_name: { type: string }
        shift_config: { type: object, additionalProperties: true }
        salary: { $ref: '#/components/schemas/Money' }
        emergency_contacts:
          type: array
          items:
            type: object
            required: [type, name, phone]
            properties:
              type: { type: string }
              name: { type: string }
              phone: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }
    ActivationInput:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }

    # ---------- 6. teams ----------
    Team:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string, example: "1K-IBMI-S1" }
        project_id: { type: integer, format: int64 }
        phone: { type: string, nullable: true }
        shift: { type: string, nullable: true }
        min_personnel: { type: integer, minimum: 0 }
        status_validate_shift: { type: boolean, description: "Validasi shift saat absensi (DL-48)." }
        is_not_accepting_attendance_after_tolerate_time: { type: boolean, description: "Tolak absensi setelah waktu toleransi (DL-48)." }
        status_geofencing: { type: boolean, description: "Aktifkan geofencing lokasi regu (DL-48)." }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        radius: { type: integer, nullable: true, minimum: 1, description: "Radius geofence (meter)." }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamInput:
      type: object
      required: [name, project_id]
      properties:
        name: { type: string }
        project_id: { type: integer, format: int64 }
        phone: { type: string }
        shift: { type: string }
        min_personnel: { type: integer, minimum: 0, default: 0 }
        status_validate_shift: { type: boolean, default: false }
        is_not_accepting_attendance_after_tolerate_time: { type: boolean, default: false }
        status_geofencing: { type: boolean, default: false }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        radius: { type: integer, minimum: 1 }
        description: { type: string }
        is_active: { type: boolean, default: true }

    # ---------- 7. team_members ----------
    TeamMember:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        role: { type: string, enum: [DANRU, MEMBER] }
        shift: { type: string, nullable: true }
        joined_at: { type: string, format: date-time }
    TeamMemberInput:
      type: object
      required: [personnel_id, role]
      properties:
        personnel_id: { type: integer, format: int64 }
        role: { type: string, enum: [DANRU, MEMBER] }
        shift: { type: string }

    # ---------- 8. personnels (PII tertinggi; HR-profile OUT DL-16) ----------
    Personnel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        nik: { type: string, example: "32xxxxxxxxxxxxxx", description: 16 digit, PII tinggi (mask + audit). }
        npwp: { type: string, nullable: true }
        first_name: { type: string, example: Andi }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true, example: Budi }
        position_id: { type: integer, format: int64 }
        gender: { type: string, enum: [M, F] }
        username: { type: string, example: username01 }
        email: { type: string, nullable: true, example: user01@contoh.com }
        height_cm: { type: integer, nullable: true, minimum: 100, maximum: 230 }
        weight_kg: { type: integer, nullable: true, minimum: 30, maximum: 200 }
        birth_date: { type: string, format: date, nullable: true }
        birth_place: { type: string, nullable: true }
        phone: { type: string, nullable: true, example: "08xxxxxxxxxx" }
        address: { type: string, nullable: true }
        province_id: { type: integer, format: int64, nullable: true }
        city_id: { type: integer, format: int64, nullable: true }
        postal_code: { type: string, nullable: true }
        site_unit: { type: string, nullable: true }
        qualification_id: { type: integer, format: int64 }
        personnel_code: { type: string, nullable: true }
        description: { type: string, nullable: true }
        profile_photo: { type: string, nullable: true, format: uri }
        id_card_photo: { type: string, nullable: true, format: uri }
        contract_document: { type: string, nullable: true, format: uri }
        last_seen_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PersonnelInput:
      type: object
      required: [nik, first_name, position_id, gender, username, qualification_id]
      properties:
        nik: { type: string }
        npwp: { type: string }
        first_name: { type: string }
        middle_name: { type: string }
        last_name: { type: string }
        position_id: { type: integer, format: int64 }
        gender: { type: string, enum: [M, F] }
        username: { type: string }
        email: { type: string, format: email }
        height_cm: { type: integer, minimum: 100, maximum: 230 }
        weight_kg: { type: integer, minimum: 30, maximum: 200 }
        birth_date: { type: string, format: date }
        birth_place: { type: string }
        phone: { type: string }
        address: { type: string }
        province_id: { type: integer, format: int64 }
        city_id: { type: integer, format: int64 }
        postal_code: { type: string }
        site_unit: { type: string }
        qualification_id: { type: integer, format: int64 }
        personnel_code: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }

    # ---------- 9-21. Master tables (code/name/description shape) ----------
    CodedMaster:
      type: object
      description: Master umum (qualifications, client_types, client_groups, stakeholder_types, panic_types, report_categories, instruction_categories, permission_categories).
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        code: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CodedMasterInput:
      type: object
      required: [name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }
    Qualification:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
      description: Kualifikasi (Gada Pratama/Madya/Utama).
    ClientType:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    ClientGroup:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    StakeholderType:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    PanicType:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
      description: Tipe panik (Keamanan/Medis/Kebakaran/Lainnya).
    ReportCategory:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    InstructionCategory:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    PermissionCategory:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    Letterhead:
      type: object
      description: Kop Surat (WEB-12).
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }
        logo_url: { type: string, nullable: true, format: uri }
        header: { type: string, nullable: true }
        footer: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LetterheadInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        logo_url: { type: string, format: uri }
        header: { type: string }
        footer: { type: string }
        is_active: { type: boolean, default: true }
    Position:
      type: object
      description: Master Tingkat Posisi (DL-42); level LEADER/MEMBER.
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        code: { type: string, nullable: true }
        name: { type: string }
        level: { type: string, enum: [LEADER, MEMBER] }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PositionInput:
      type: object
      required: [name, level]
      properties:
        code: { type: string }
        name: { type: string }
        level: { type: string, enum: [LEADER, MEMBER] }
        description: { type: string }
        is_active: { type: boolean, default: true }
    AssetCondition:
      type: object
      description: Master kondisi aset (DL-43) — Baik/Rusak Ringan/Rusak Berat/Kadaluarsa/Dalam Perbaikan.
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetConditionInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        is_active: { type: boolean, default: true }
    # NOTE (DL-14 fix): entitas Stakeholder pembawa-telepon DIHAPUS — tidak ada tabel
    # backing. Master "Telp Stakeholder" adalah `stakeholder_types` (CodedMaster:
    # id/code/name/description/is_active) di /admin/stakeholder-types; nomor telepon
    # darurat tinggal di `projects.emergency_contacts` (array {type,name,phone}).

    # ---------- Master global / referensi nasional (DL-47) ----------
    Province:
      type: object
      description: Master global provinsi (read-only, lintas-tenant).
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
    City:
      type: object
      description: Master global kota (cascading dari province).
      properties:
        id: { type: integer, format: int64 }
        province_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }

    # ---------- 22. attendances ----------
    Attendance:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64, nullable: true }
        method: { type: string, enum: [QR, SELFIE, SHIFT, FORCE] }
        check_in_at: { type: string, format: date-time, nullable: true }
        check_out_at: { type: string, format: date-time, nullable: true }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        photo_url: { type: string, nullable: true, format: uri }
        timezone: { type: string, enum: [WIB, WITA, WIT] }
        replaced_by_id: { type: integer, format: int64, nullable: true }
        is_absent: { type: boolean }
        local_id: { type: string, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttendanceQrCheckIn:
      type: object
      required: [qr_token, lat, lng]
      properties:
        qr_token: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        photo: { type: string, format: uri }
        local_id: { type: string }
    AttendanceQrCheckOut:
      type: object
      required: [qr_token, lat, lng]
      properties:
        qr_token: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    AttendanceCheckOutPatch:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    AttendanceGroupInput:
      type: object
      required: [team_id, entries]
      properties:
        team_id: { type: integer, format: int64 }
        entries:
          type: array
          items:
            type: object
            required: [personnel_id, status]
            properties:
              personnel_id: { type: integer, format: int64 }
              status: { type: string }
    AttendanceAbsentInput:
      type: object
      required: [personnel_id, date]
      properties:
        personnel_id: { type: integer, format: int64 }
        date: { type: string, format: date }
        reason: { type: string }
    AttendanceCorrection:
      type: object
      properties:
        check_in: { type: string, format: date-time }
        check_out: { type: string, format: date-time }
        is_absent: { type: boolean }
        note: { type: string }

    # ---------- 23. permissions ----------
    Permission:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        permission_category_id: { type: integer, format: int64 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        approved_by: { type: integer, format: int64, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PermissionCreate:
      type: object
      required: [category_id, date_from, date_to]
      properties:
        category_id: { type: integer, format: int64 }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        reason: { type: string }
        attachment: { type: string, format: uri }
    ApprovalNote:
      type: object
      properties:
        note: { type: string }
    RejectionNote:
      type: object
      required: [note]
      properties:
        note: { type: string }

    # ---------- 24. shift_swaps (replacement) ----------
    ShiftSwap:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        replaced_personnel_id: { type: integer, format: int64 }
        replacing_personnel_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64, nullable: true }
        swap_date: { type: string, format: date }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        approved_by: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShiftSwapCreate:
      type: object
      required: [replaced_personnel_id, replacing_personnel_id, swap_date]
      properties:
        replaced_personnel_id: { type: integer, format: int64 }
        replacing_personnel_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        swap_date: { type: string, format: date }
        reason: { type: string }

    # ---------- 25. reports + report_categories ----------
    Report:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        report_category_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64, nullable: true }
        subject: { type: string }
        body: { type: string, nullable: true }
        photos:
          type: array
          nullable: true
          items: { type: string, format: uri }
        only_to_danru: { type: boolean }
        local_id: { type: string, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReportCreate:
      type: object
      required: [category_id, subject]
      properties:
        local_id: { type: string, format: uuid, description: Dedup offline; SEBAIKNYA = Idempotency-Key. }
        category_id: { type: integer, format: int64 }
        subject: { type: string }
        body: { type: string }
        only_to_danru: { type: boolean, default: false }
        photos:
          type: array
          items: { type: string, format: uri }

    # ---------- 26. instructions + recipients ----------
    Instruction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        instruction_category_id: { type: integer, format: int64 }
        sender_personnel_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64, nullable: true }
        team_id: { type: integer, format: int64, nullable: true }
        subject: { type: string }
        body: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        requires_feedback: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InstructionCreate:
      type: object
      required: [category_id, subject, recipient_ids]
      properties:
        category_id: { type: integer, format: int64 }
        subject: { type: string }
        body: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        requires_feedback: { type: boolean, default: false }
        recipient_ids:
          type: array
          items: { type: integer, format: int64 }
    InstructionRecipient:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        instruction_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        read_at: { type: string, format: date-time, nullable: true }
        feedback: { type: string, nullable: true }
        feedback_at: { type: string, format: date-time, nullable: true }
    InstructionFeedback:
      type: object
      required: [read]
      properties:
        feedback: { type: string }
        read: { type: boolean, enum: [true] }

    # ---------- 27. patrol_zones ----------
    PatrolZone:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        type: { type: string, enum: [PATROL, GUARD], description: "Jaga = GUARD (DL-11)." }
        name: { type: string }
        start_date: { type: string, format: date, nullable: true }
        alias: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true, example: -6.2, description: "Pusat zona." }
        longitude: { type: number, format: double, nullable: true, example: 106.8, description: "Pusat zona." }
        radius_meters: { type: integer, nullable: true, minimum: 1 }
        min_visit: { type: integer }
        popup_text: { type: string, nullable: true }
        members: { type: array, nullable: true, items: { type: integer, format: int64 } }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PatrolZoneInput:
      type: object
      required: [project_id, type, name]
      properties:
        project_id: { type: integer, format: int64 }
        type: { type: string, enum: [PATROL, GUARD] }
        name: { type: string }
        alias: { type: string }
        start_date: { type: string, format: date }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        radius_meters: { type: integer, minimum: 1 }
        min_visit: { type: integer, default: 1 }
        popup_text: { type: string }
        members: { type: array, items: { type: integer, format: int64 } }
        is_active: { type: boolean, default: true }

    # ---------- 28. patrol_scans ----------
    PatrolScan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        zone_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        scanned_at: { type: string, format: date-time }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        checklist: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        note: { type: string, nullable: true }
        photos: { type: array, nullable: true, items: { type: string, format: uri } }
        is_approved: { type: boolean }
        approved_by: { type: integer, format: int64, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        local_id: { type: string, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    PatrolScanCreate:
      type: object
      required: [lat, lng]
      properties:
        local_id: { type: string, format: uuid, description: Dedup offline; SEBAIKNYA = Idempotency-Key. }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        checklist: { type: array, items: { type: object, additionalProperties: true } }
        note: { type: string }
        photos: { type: array, items: { type: string, format: uri } }
    ZoneCheckInInput:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    # ---------- 29. panics ----------
    Panic:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        panic_type_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64, nullable: true }
        team_id: { type: integer, format: int64, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }
        note: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, RESOLVED] }
        resolved_by_personnel_id: { type: integer, format: int64, nullable: true }
        resolved_by_web_user_id: { type: integer, format: int64, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PanicCreate:
      type: object
      required: [panic_type_id, lat, lng]
      properties:
        panic_type_id: { type: integer, format: int64 }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        note: { type: string }
    PanicResolve:
      type: object
      required: [resolution_note]
      properties:
        resolution_note: { type: string }
        report_id: { type: integer, format: int64 }

    # ---------- 30. cctvs + cctv_role_access ----------
    Cctv:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        zone_name: { type: string, nullable: true }
        code: { type: string, nullable: true }
        url: { type: string, format: uri, description: "RTSP stream." }
        username: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CctvInput:
      type: object
      required: [project_id, url]
      properties:
        project_id: { type: integer, format: int64 }
        zone_name: { type: string }
        code: { type: string }
        url: { type: string, format: uri }
        username: { type: string }
        password: { type: string, format: password, description: "Disimpan terenkripsi AES-256-GCM; tak pernah dikembalikan." }
        is_active: { type: boolean, default: true }
    CctvAccessInput:
      type: object
      required: [allowed_role_ids]
      properties:
        allowed_role_ids:
          type: array
          items: { type: integer, format: int64 }
    CctvRoleAccess:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        cctv_id: { type: integer, format: int64 }
        role_id: { type: integer, format: int64 }

    # ---------- 31. location_logs (tracking) ----------
    LocationLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        accuracy: { type: number, format: double, nullable: true }
        logged_at: { type: string, format: date-time }

    # ---------- 32. roles + 33. web_users (access/RBAC) ----------
    Role:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string, example: "Admin Cabang" }
        permissions:
          type: object
          description: "Matriks modul × aksi (view/create/edit/delete/export)."
          additionalProperties:
            type: object
            properties:
              view: { type: boolean }
              create: { type: boolean }
              edit: { type: boolean }
              delete: { type: boolean }
              export: { type: boolean }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string }
        permissions:
          type: object
          additionalProperties:
            type: object
            properties:
              view: { type: boolean }
              create: { type: boolean }
              edit: { type: boolean }
              delete: { type: boolean }
              export: { type: boolean }
    WebUser:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string, nullable: true }
        role_id: { type: integer, format: int64 }
        scope_type: { type: string, nullable: true, enum: [region, branch, client, project] }
        scope_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebUserInput:
      type: object
      required: [username, role_id]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        role_id: { type: integer, format: int64 }
        scope_type: { type: string, enum: [region, branch, client, project] }
        scope_id: { type: integer, format: int64 }
        is_active: { type: boolean, default: true }

    # ---------- 34-35. e_memos + e_memo_responses (E-Memo CS-only) ----------
    EMemo:
      type: object
      description: >-
        Memo induk E-Memo (WEB-34/MOB-14) — CS-only (`business_line='cleaning'`, di-derive dari
        `projects.business_line`, dijaga guard flag `e_memo`). Isolasi `organization_id` (RLS).
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        sender_personnel_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64, nullable: true }
        subject: { type: string }
        body: { type: string, nullable: true }
        recipients: { $ref: '#/components/schemas/EMemoRecipients' }
        is_read: { type: boolean, nullable: true, description: "Status baca per penerima (derived di service, bukan kolom mutable)." }
        responses: { type: array, nullable: true, description: "Thread balasan (hanya pada detail by-id), urut created_at ASC.", items: { $ref: '#/components/schemas/EMemoResponse' } }
        local_id: { type: string, nullable: true, description: "Echo local_id offline (MOB-14)." }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EMemoRecipients:
      type: object
      description: Distribusi penerima memo — tim (regu) dan/atau individu (personil). Minimal satu penerima.
      properties:
        team_ids: { type: array, items: { type: integer, format: int64 } }
        personnel_ids: { type: array, items: { type: integer, format: int64 } }
    EMemoCreate:
      type: object
      required: [subject, recipients]
      description: >-
        Compose E-Memo. `organization_id`, `business_line` (=cleaning), & `sender_personnel_id`
        diinjeksi server dari JWT/konteks — TIDAK pernah dari input klien. Offline-capable (MOB-14):
        sertakan `local_id` (= Idempotency-Key) untuk dedup antrean offline.
      properties:
        local_id: { type: string, format: uuid, description: "Dedup offline (= Idempotency-Key, DL-34)." }
        project_id: { type: integer, format: int64, description: "Konteks scope; menentukan kandidat regu/personil penerima." }
        subject: { type: string, maxLength: 255, description: "Perihal; tidak boleh kosong/whitespace-only." }
        body: { type: string }
        recipients: { $ref: '#/components/schemas/EMemoRecipients' }
    EMemoUpdate:
      type: object
      description: Ubah memo induk (subject/body). Penerima & konteks tidak diubah lewat endpoint ini.
      properties:
        subject: { type: string, maxLength: 255 }
        body: { type: string }
    EMemoResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        e_memo_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        body: { type: string }
        local_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    EMemoResponseCreate:
      type: object
      required: [body]
      description: >-
        Balasan thread — INSERT ke `e_memo_responses` (`body NOT NULL`, tolak kosong/whitespace-only).
        `personnel_id` & `organization_id` diinjeksi server. Offline-capable (MOB-14).
      properties:
        local_id: { type: string, format: uuid, description: "Dedup offline (= Idempotency-Key, DL-34)." }
        body: { type: string, description: "Tidak boleh kosong/whitespace-only." }

    # ---------- QR identitas zona (Generate-QR WEB-35/MOB-15) ----------
    QrCode:
      type: object
      description: >-
        Rekaman QR identitas zona (WEB-35/MOB-15) diturunkan dari `patrol_zones.qr_token`.
        Payload yang dikodekan bersifat OPAQUE (token, bukan URL kredensial/PII); resolusi
        token→zona dilakukan server saat scan. CS-only (guard flag `generate_qr`), RLS per-org.
      properties:
        zone_id: { type: integer, format: int64, description: "FK→patrol_zones(id)." }
        organization_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        zone_name: { type: string, description: "Nama/alias zona untuk label terbaca manusia." }
        qr_token: { type: string, description: "Token identitas QR opaque (dirotasi saat regenerate)." }
        format: { type: string, enum: [png, svg, pdf], description: "Format artefak yang dihasilkan." }
        content_url: { type: string, format: uri, nullable: true, description: "URL unduh artefak QR (PNG/SVG/PDF)." }
        revoked: { type: boolean, description: "True bila token lama sudah di-revoke (scan ditolak server)." }
        generated_at: { type: string, format: date-time }
    QrGenerateRequest:
      type: object
      required: [format]
      description: >-
        Permintaan generate/cetak QR. `zone_ids` untuk cetak massal (multi-select) ATAU
        `zone_id` tunggal; `project_id`+filter untuk "pilih semua dalam proyek". Zona di luar
        scope/org/`business_line='cleaning'` dibuang server (RLS + guard flag `generate_qr`).
      properties:
        zone_id: { type: integer, format: int64, description: "Generate untuk satu zona." }
        zone_ids: { type: array, items: { type: integer, format: int64 }, description: "Cetak massal beberapa zona." }
        project_id: { type: integer, format: int64, description: "Cetak semua zona aktif dalam proyek (dengan filter)." }
        format: { type: string, enum: [png, svg, pdf], description: "Enum; selain ini → 400/422." }
        layout: { type: string, nullable: true, description: "Tata letak label cetak massal (mis. grid 2x4 A4)." }
        include_inactive: { type: boolean, default: false, description: "Sertakan zona non-aktif (default kecualikan)." }

    # ---------- 7A.1 assets + 7A.2 asset_reports ----------
    Asset:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        stock: { type: integer, minimum: 0 }
        condition_id: { type: integer, format: int64 }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetInput:
      type: object
      required: [project_id, code, name, condition_id]
      properties:
        project_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        stock: { type: integer, minimum: 0, default: 0 }
        condition_id: { type: integer, format: int64 }
        description: { type: string }
        is_active: { type: boolean, default: true }
    AssetReport:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        transaction_no: { type: string }
        asset_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64, nullable: true }
        group_id: { type: integer, format: int64, nullable: true }
        position_id: { type: integer, format: int64, nullable: true }
        condition_id: { type: integer, format: int64 }
        stock: { type: integer, nullable: true, minimum: 0 }
        title: { type: string }
        content: { type: string, nullable: true }
        photos: { type: array, nullable: true, items: { type: string, format: uri } }
        reported_at: { type: string, format: date-time }
        local_id: { type: string, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
    AssetReportCreate:
      type: object
      required: [asset_id, condition_id, title]
      properties:
        local_id: { type: string, format: uuid, description: "Dedup offline (= Idempotency-Key, DL-34)." }
        asset_id: { type: integer, format: int64 }
        condition_id: { type: integer, format: int64 }
        stock: { type: integer, minimum: 0 }
        title: { type: string }
        content: { type: string }
        photos: { type: array, items: { type: string, format: uri } }

    # ---------- Penilaian (Master + Personil) — DL-59 (un-HOLD DL-46, discovery live) ----------
    MasterReview:
      type: object
      description: >-
        Master Penilaian (WEB, `/master_review`; mobile `get_master_review_by_type`) — DL-59.
        `type` memisah Pelanggaran vs Penghargaan; `default_reward_punishment_amount` = nominal
        default (string desimal, DL-38) yang bisa di-override per penilaian personil.
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        type: { type: string, enum: [PELANGGARAN, PENGHARGAAN] }
        code: { type: string, nullable: true }
        name: { type: string }
        default_reward_punishment_amount: { allOf: [ { $ref: '#/components/schemas/Money' } ], nullable: true }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MasterReviewCreate:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [PELANGGARAN, PENGHARGAAN] }
        code: { type: string }
        name: { type: string }
        default_reward_punishment_amount: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        is_active: { type: boolean, default: true }
    PersonnelReview:
      type: object
      description: >-
        Penilaian Personil (WEB `/personnel_review`; mobile `my_review`/`send_review`) — DL-59.
        Nominal reward/punishment sebagai string desimal (DL-38, nullable). `period` = bulan/tanggal
        (DATE-ONLY, relatif TZ proyek DL-03). Integrasi uang (payroll/koperasi) belum ditentukan.
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        master_review_id: { type: integer, format: int64 }
        reviewer_type: { type: string, enum: [web_user, personnel], nullable: true, description: "Jenis penilai (server-set dari sesi): web_user (admin web) atau personnel (DANRU mobile via send_review). Polimorfik seperti audit_logs.actor_type." }
        reviewer_id: { type: integer, format: int64, nullable: true, description: "ID penilai; merujuk web_users(id) atau personnels(id) sesuai reviewer_type. Server-set." }
        period: { type: string, format: date, nullable: true }
        score: { type: number, format: double, nullable: true }
        reward_punishment_amount: { allOf: [ { $ref: '#/components/schemas/Money' } ], nullable: true }
        notes: { type: string, nullable: true }
        local_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PersonnelReviewCreate:
      type: object
      required: [personnel_id, master_review_id]
      properties:
        local_id: { type: string, format: uuid, description: "Dedup offline (= Idempotency-Key, DL-34)." }
        personnel_id: { type: integer, format: int64 }
        master_review_id: { type: integer, format: int64 }
        period: { type: string, format: date }
        score: { type: number, format: double }
        reward_punishment_amount: { $ref: '#/components/schemas/Money' }
        notes: { type: string }

    # ---------- 12.1 subscription_plans ----------
    SubscriptionPlan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        billing_model: { type: string, example: per_active_head }
        price_per_field_seat: { $ref: '#/components/schemas/Money' }
        price_per_web_seat: { $ref: '#/components/schemas/Money' }
        included_field_seats: { type: integer }
        included_web_seats: { type: integer }
        currency: { type: string, example: IDR }
        features: { type: object, nullable: true, additionalProperties: true }
        api_enabled: { type: boolean }
        api_included_calls: { type: integer }
        price_per_call_overage: { allOf: [ { $ref: '#/components/schemas/Money' } ], nullable: true }
        api_rate_limit_per_min: { type: integer, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- 12.2 subscriptions ----------
    Subscription:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        plan_id: { type: integer, format: int64 }
        status: { type: string, enum: [trial, active, past_due, canceled] }
        billing_cycle: { type: string, enum: [monthly, annual] }
        period_start: { type: string, format: date, nullable: true }
        period_end: { type: string, format: date, nullable: true }
        started_at: { type: string, format: date-time }
        canceled_at: { type: string, format: date-time, nullable: true }
    SubscriptionCreate:
      type: object
      required: [organization_id, plan_id, billing_cycle]
      properties:
        organization_id: { type: integer, format: int64 }
        plan_id: { type: integer, format: int64 }
        billing_cycle: { type: string, enum: [monthly, annual] }
        period_start: { type: string, format: date }
    SubscriptionCancel:
      type: object
      required: [reason]
      properties:
        effective_at: { type: string, format: date }
        reason: { type: string }

    # ---------- 12.3 headcount_snapshots ----------
    HeadcountSnapshot:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        snapshot_date: { type: string, format: date }
        active_field_seats: { type: integer }
        active_web_seats: { type: integer }
        breakdown: { type: object, nullable: true, additionalProperties: true }
        source: { type: string, example: daily_job }
        created_at: { type: string, format: date-time }

    # ---------- 12.4 invoices + 12.5 invoice_lines + 12.6 payments ----------
    Invoice:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        subscription_id: { type: integer, format: int64 }
        period_start: { type: string, format: date, nullable: true }
        period_end: { type: string, format: date, nullable: true }
        billable_field_seats: { type: integer }
        billable_web_seats: { type: integer }
        amount_field: { $ref: '#/components/schemas/Money' }
        amount_web: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        currency: { type: string, example: IDR }
        status: { type: string, enum: [draft, issued, paid, void] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLine' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InvoiceLine:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        invoice_id: { type: integer, format: int64 }
        description: { type: string }
        qty: { type: integer }
        unit_price: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
    InvoiceGenerate:
      type: object
      required: [organization_id, period_start, period_end]
      properties:
        organization_id: { type: integer, format: int64 }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
    InvoiceIssue:
      type: object
      required: [due_at]
      properties:
        due_at: { type: string, format: date }
    VoidInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    Payment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        invoice_id: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        method: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        paid_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    PaymentCreate:
      type: object
      required: [amount, paid_at]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        method: { type: string }
        paid_at: { type: string, format: date-time }
        reference: { type: string }

    # ---------- 12A.1 api_clients ----------
    ApiClient:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        client_id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        ip_allowlist: { type: array, nullable: true, items: { type: string } }
        status: { type: string, enum: [active, revoked] }
        created_by: { type: integer, format: int64, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ApiClientInput:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        ip_allowlist: { type: array, items: { type: string } }
    ApiClientSecretResult:
      type: object
      description: "client_secret ditampilkan SEKALI saat dibuat (disimpan hash)."
      properties:
        client_id: { type: string }
        client_secret: { type: string }
        scopes: { type: array, items: { type: string } }

    # ---------- 12A.2 api_keys ----------
    ApiKey:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        key_prefix: { type: string, example: pk_live_ }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [active, revoked] }
        created_by: { type: integer, format: int64, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ApiKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }
    ApiKeySecretResult:
      type: object
      description: "Secret penuh ditampilkan SEKALI saat dibuat (disimpan hash)."
      properties:
        key_prefix: { type: string }
        key: { type: string, description: "<prefix>.<secret>" }
        scopes: { type: array, items: { type: string } }

    # ---------- 12A.3 webhook_endpoints + 12A.4 webhook_deliveries ----------
    WebhookEndpoint:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        url: { type: string, format: uri }
        event_types: { type: array, items: { type: string }, example: [panic.created, attendance.created] }
        status: { type: string, enum: [active, paused, disabled] }
        created_by: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
    WebhookEndpointInput:
      type: object
      required: [url, event_types]
      properties:
        url: { type: string, format: uri, description: "HTTPS wajib; tolak loopback/internal (anti-SSRF)." }
        event_types: { type: array, items: { type: string } }
        status: { type: string, enum: [active, paused, disabled] }
    WebhookEndpointSecretResult:
      type: object
      description: "Signing secret HMAC-SHA256 ditampilkan SEKALI saat dibuat/rotasi (disimpan secret_hash)."
      properties:
        id: { type: integer, format: int64 }
        url: { type: string, format: uri }
        secret: { type: string, description: "Signing secret HMAC; hanya tampil sekali." }
        event_types: { type: array, items: { type: string } }
    WebhookDelivery:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        endpoint_id: { type: integer, format: int64 }
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        last_response_code: { type: integer, nullable: true }
        next_retry_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- 12A.5 api_request_logs + 12A.6 api_usage_counters ----------
    ApiRequestLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        principal: { type: string, description: "client_id atau key_prefix pemanggil." }
        method: { type: string }
        path: { type: string }
        status_code: { type: integer }
        latency_ms: { type: integer, nullable: true }
        request_id: { type: string, format: uuid, nullable: true }
        ts: { type: string, format: date-time }
    ApiUsageCounter:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        period_start: { type: string, format: date, nullable: true }
        period_end: { type: string, format: date, nullable: true }
        call_count: { type: integer, format: int64 }

    # ---------- Onboarding (platform job) ----------
    OnboardingRequest:
      type: object
      required: [organization]
      properties:
        organization: { $ref: '#/components/schemas/OrganizationCreate' }
        plan_id: { type: integer, format: int64 }
        billing_cycle: { type: string, enum: [monthly, annual] }
        super_admin:
          type: object
          properties:
            username: { type: string }
            email: { type: string, format: email }
    OnboardingJob:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [queued, running, completed, failed] }
        organization_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- Impersonation / suspend ----------
    ImpersonateInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        ttl_minutes: { type: integer }
    SuspendInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    # ---------- Report summary (13 types) generic row ----------
    ReportSummaryResult:
      type: object
      description: "Hasil agregasi Ringkasan Laporan (struktur per-type)."
      properties:
        type: { type: string }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        totals: { type: object, additionalProperties: true }

    # ---------- Notifications (mobile, 12 event) ----------
    Notification:
      type: object
      description: Notifikasi mobile (12 event, AC-API-NTF-1).
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        type:
          type: string
          description: "Jenis event (mis. izin, mangkir, laporan, instruksi, perpindahan_regu, pergantian_posisi, patroli, jaga, panik, laporan_offline)."
          example: panik
        title: { type: string }
        body: { type: string }
        data: { type: object, nullable: true, additionalProperties: true, description: "Payload deep-link (entity id/route)." }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationTokenInput:
      type: object
      required: [firebase_token, platform]
      properties:
        firebase_token: { type: string, maxLength: 4096, description: "Push token perangkat ini. Satu token hanya milik satu perangkat; mendaftar ulang memperbarui baris yang sama." }
        platform: { type: string, enum: [android, ios, web] }
        app_version: { type: string, maxLength: 64, example: "1.4.2" }
    NotificationTokenDelete:
      type: object
      required: [firebase_token]
      properties:
        firebase_token: { type: string, minLength: 1, maxLength: 4096 }
    NotificationCount:
      type: object
      required: [unread, total]
      properties:
        unread: { type: integer, example: 3 }
        total: { type: integer, example: 42 }

    # ---------- Dashboard overview (WEB-03/04) ----------
    Overview:
      type: object
      description: Statistik agregat dashboard (WEB-03).
      properties:
        total_personnel: { type: integer }
        total_clients: { type: integer }
        total_projects: { type: integer }
        total_teams: { type: integer }
        total_zones: { type: integer }
        active_panics: { type: integer }
        attendance_ratio: { type: number, format: double, description: "Rasio kehadiran hari ini (0..1)." }
        patrol_ratio: { type: number, format: double }
        report_ratio: { type: number, format: double }
    ChartSeries:
      type: object
      properties:
        label: { type: string }
        points:
          type: array
          items:
            type: object
            properties:
              x: { type: string, description: "Bucket (mis. tanggal)." }
              y: { type: number, format: double }
    OverviewCharts:
      type: object
      description: Seri chart dashboard (WEB-04) — absensi/patroli/laporan.
      properties:
        attendance: { type: array, items: { $ref: '#/components/schemas/ChartSeries' } }
        patrol: { type: array, items: { $ref: '#/components/schemas/ChartSeries' } }
        report: { type: array, items: { $ref: '#/components/schemas/ChartSeries' } }

    # ---------- Organization profile + settings (WEB-37) ----------
    OrganizationProfileUpdate:
      type: object
      description: Update profil + branding organisasi (WEB-37).
      properties:
        name: { type: string }
        legal_name: { type: string }
        timezone_default: { type: string }
        branding:
          type: object
          properties:
            logo_url: { type: string }
            primary_color: { type: string, example: "#0C6CB0" }
            app_name: { type: string }
    OrganizationSettings:
      type: object
      description: Pengaturan operasional org-level (WEB-37).
      properties:
        default_timezone: { type: string, enum: [WIB, WITA, WIT], nullable: true }
        attendance_tolerate_minutes: { type: integer, nullable: true }
        patrol_default_radius_meters: { type: integer, nullable: true }
        notification_enabled: { type: boolean }
        settings: { type: object, additionalProperties: true, description: "Bag pengaturan tambahan." }

paths:

  # ============ AUTH ============
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Login dengan akun Personalia (email + password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/LoginResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [Auth]
      summary: Tukar refresh → access token baru (refresh token berotasi, hanya berlaku sekali)
      description: |
        Token lama langsung mati dan token baru diterbitkan. Memakai ulang token yang sudah dipakai
        mematikan seluruh rantai sesi (AUTH_REFRESH_REUSED). Kegagalan 401: AUTH_TOKEN_INVALID,
        AUTH_REFRESH_REUSED, AUTH_DEVICE_CHANGED (HP tidak lagi terikat); semuanya berarti kembali
        ke layar login. 403 AUTH_ACCOUNT_DISABLED: karyawan sudah tidak aktif di Personalia.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/LoginResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/forgot-password:
    post:
      x-owner: personel
      operationId: postAuthForgotPassword
      tags: [Auth]
      summary: Kirim reset link / random password ke email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/change-password:
    post:
      x-owner: personel
      operationId: postAuthChangePassword
      tags: [Auth]
      summary: Ubah password (wajib setelah default/reset)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Profil + role per-regu
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/MeResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/web-roles:
    get:
      operationId: getAdminWebRoles
      tags: [Auth]
      summary: Daftar penugasan peran web di organisasi ini (hanya ORG_ADMIN)
      description: |
        Peran web (admin) adalah data SiAPP sendiri: Personalia menyatakan siapa seseorang,
        SiAPP menyatakan apa yang boleh dilakukannya di sini. Menggantikan /admin/web-users
        yang dimiliki Personalia (D5).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ListEnvelope' }
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/WebRoleAssignment' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/web-roles/{personnel_id}:
    parameters: [ { $ref: '#/components/parameters/PersonnelIdPath' } ]
    put:
      operationId: putAdminWebRole
      tags: [Auth]
      summary: Beri atau ubah peran web seseorang (hanya ORG_ADMIN)
      description: |
        Admin tidak dapat menyempitkan penugasannya sendiri (409 CONFLICT), supaya admin
        terakhir tidak mengunci semua orang.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebRoleInput' } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/WebRoleAssignment' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAdminWebRole
      tags: [Auth]
      summary: Cabut peran web seseorang (hanya ORG_ADMIN)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/personnel/{personnel_id}/device-binding:
    parameters: [ { $ref: '#/components/parameters/PersonnelIdPath' } ]
    delete:
      operationId: deleteAdminPersonnelDeviceBinding
      tags: [Auth]
      summary: Reset ikatan HP seseorang (satu orang = satu HP)
      description: |
        Reset HR di panel Personalia hanya membebaskan aplikasi Personalia; ikatan HP SiAPP
        adalah catatan SiAPP sendiri dan direset di sini. Dalam satu transaksi ikatan dihapus
        dan sesi MOBILE orang itu dicabut (token aksesnya mati seketika). ORG_ADMIN, atau
        PROJECT_ADMIN untuk orang yang ditempatkan di salah satu proyeknya. Orang tanpa
        ikatan: tidak terjadi apa-apa, tetap 200.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: Akhiri sesi ini (seluruh rantai refresh) + hapus FCM token
      description: |
        Mematikan refresh token dan access token sesi ini seketika. Tidak melepas ikatan HP
        (itu catatan admin dan bertahan setelah logout).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { firebase_token: { type: string, maxLength: 4096 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ============ OAUTH (Public API token) ============
  /oauth/token:
    servers:
      - url: https://{host}/api/v1
        variables: { host: { default: api.persist.example.com } }
    post:
      operationId: postOauthToken
      tags: [OAuth]
      summary: OAuth2 client-credentials token endpoint
      description: |
        Kode error endpoint ini = RFC 6749 lowercase (invalid_client/invalid_scope/
        unsupported_grant_type/invalid_grant), BUKAN amplop PERSIST UPPERCASE.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string }
                client_secret: { type: string }
                scope: { type: string, description: "space-delimited; default = seluruh scope client." }
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string }
                client_secret: { type: string }
                scope: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthTokenResult' }
        '400':
          description: invalid_scope / unsupported_grant_type / invalid_grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: invalid_client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }

