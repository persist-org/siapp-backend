  # ============ REGU & PERSONIL (mobile read) ============
  /teams/me:
    get:
      operationId: getTeamsMe
      tags: [Organization]
      summary: "Lihat Regu Saya (§3.2.5.5)"
      description: |
        Detail setiap regu tempat pemanggil menjadi anggota hari ini (hari ini menurut zona waktu
        masing-masing proyek). Kosong bila pemanggil bukan anggota regu mana pun.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/TeamDetail' } } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
  /teams:
    get:
      operationId: getTeams
      tags: [Organization]
      summary: "Daftar regu (§2.9.1-2.9.2)"
      description: |
        Dengan project_code: semua regu proyek itu; pemanggil harus anggota regu di proyek itu hari ini
        (403 NOT_PROJECT_MEMBER, juga untuk proyek yang tidak ada). Tanpa project_code: regu-regu di
        setiap proyek tempat pemanggil menjadi anggota hari ini. Urut proyek, lalu nomor regu.
      parameters:
        - $ref: '#/components/parameters/ProjectCodeQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/TeamSummary' } } }
        '400':
          description: "BAD_REQUEST: query string mengandung karakter NUL (%00), yang tidak dapat disimpan di database."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                nul:
                  value: { success: false, error: { code: BAD_REQUEST, message: "Query string tidak boleh berisi karakter NUL." }, meta: { request_id: req_abc123 } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
        '403':
          description: "SCOPE_DENIED (NOT_PROJECT_MEMBER): pemanggil bukan anggota regu mana pun di proyek ini hari ini."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_PROJECT_MEMBER:
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Anda bukan anggota proyek ini.", details: { reason: NOT_PROJECT_MEMBER } }, meta: { request_id: req_abc123 } }
  /teams/{code}/members:
    parameters:
      - $ref: '#/components/parameters/TeamCodePath'
    get:
      operationId: getTeamsByCodeMembers
      tags: [Organization]
      summary: "Detail regu dan anggotanya (§3.2.5.1-3.2.5.2)"
      description: |
        Nama proyek, klien dan regu, relationship officer, DANRU, shift hari ini, understaffed, dan
        anggota (DANRU lebih dulu, lalu menurut nama) dengan jadwal masing-masing hari ini. Hanya untuk
        anggota regu di proyek regu ini hari ini. Status online tidak ada di sini (Fase 08.1).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/TeamDetail' } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
        '403':
          description: "SCOPE_DENIED (NOT_PROJECT_MEMBER): pemanggil bukan anggota regu mana pun di proyek ini hari ini."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_PROJECT_MEMBER:
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Anda bukan anggota proyek ini.", details: { reason: NOT_PROJECT_MEMBER } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Regu tidak ada, sudah dihapus, atau milik organisasi lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                TEAM_NOT_FOUND:
                  value: { success: false, error: { code: NOT_FOUND, message: "Regu tidak ditemukan.", details: { reason: TEAM_NOT_FOUND } }, meta: { request_id: req_abc123 } }
  /teams/{id}/map:
    parameters: [ { $ref: '#/components/parameters/IdPath' } ]
    get:
      operationId: getTeamsByIdMap
      tags: [Organization]
      summary: Lihat Peta Koordinat Anggota (DANRU)
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ListEnvelope' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/LocationLog' } } } } ] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /personnels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identitas lokal orang (personnels.id), bukan id Personalia.
        schema: { type: integer, format: int64 }
    get:
      operationId: getPersonnelsById
      tags: [Organization]
      summary: "Biodata personil (§3.2.5.3)"
      description: |
        Hanya bila pemanggil dan personil itu sama-sama anggota regu di satu proyek hari ini, atau
        pemanggil melihat dirinya sendiri. NIK dimasker. Tanpa data HR lain (milik Personalia).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/PersonnelCard' } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
        '403':
          description: "SCOPE_DENIED (NOT_PROJECT_MEMBER): pemanggil dan personil ini tidak berbagi proyek hari ini."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_PROJECT_MEMBER:
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Anda bukan anggota proyek ini.", details: { reason: NOT_PROJECT_MEMBER } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Personil tidak ada, milik organisasi lain, atau sudah tidak aktif di Personalia (keluar)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                PERSONNEL_NOT_FOUND:
                  value: { success: false, error: { code: NOT_FOUND, message: "Personil tidak ditemukan.", details: { reason: PERSONNEL_NOT_FOUND } }, meta: { request_id: req_abc123 } }
