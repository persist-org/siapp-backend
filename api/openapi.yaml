  /notifications/token:
    post:
      operationId: postNotificationsToken
      tags: [Notification]
      summary: Daftarkan/refresh FCM token
      description: "Upsert token (token duplikat → upsert), tertaut personnels.firebase_token (AC-API-NTF-3)."
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTokenInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteNotificationsToken
      tags: [Notification]
      summary: Hapus FCM token (logout)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTokenDelete' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /notifications:
    get:
      operationId: getNotifications
      tags: [Notification]
      summary: List notifikasi (paginasi + delta-sync)
      parameters:
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SinceParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: >-
            OK. Delta-sync: `since` → `data` ter-upsert + `deleted` tombstone (DL-34);
            `meta.server_time` WAJIB.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                      deleted: { type: array, items: { $ref: '#/components/schemas/Tombstone' } }
                      meta: { $ref: '#/components/schemas/DeltaMeta' }
              example:
                success: true
                data: [{ id: 4401, type: panik, title: "Sinyal Panik", body: "Panik di Pos 1", is_read: false }]
                deleted: [{ id: 4300, deleted_at: "2026-06-01T02:00:00Z" }]
                pagination: { page: 1, limit: 20, total: 1, total_pages: 1 }
                meta: { request_id: "req_abc", server_time: "2026-06-01T03:00:00Z" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/count:
    get:
      operationId: getNotificationsCount
      tags: [Notification]
      summary: Counter unread/total (AC-API-NTF-2)
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/NotificationCount' } } } ] } } } }
