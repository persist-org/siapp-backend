openapi: 3.1.0
info:
  title: PERSIST API
  version: 1.0.0
  description: |
    Kontrak API resmi PERSIST (platform SaaS multi-tenant SiAPP rebuild) — integration
    seam untuk tim Core / Web / Mobile yang bekerja paralel. Sumber kebenaran kontrak
    endpoint (path, skema, security, scope, kode error) per DL-25.

    Tenancy: setiap entitas ter-scope ke `organization_id` (tenant = perusahaan
    Outsourcing). Isolasi ditegakkan via PostgreSQL RLS (`app.current_org`) dari klaim
    JWT (DL-19/DL-21). `business_line` (security|cleaning) BUKAN klaim JWT — ia atribut
    data per-proyek.

    Konvensi tipe data (DL-38): uang = string desimal (mis. "125000.00"), timestamp =
    UTC ISO-8601 dengan `Z`, tanggal-saja (DATE-ONLY) = `YYYY-MM-DD` tanpa zona.

    Amplop respons PERSIST (BUKAN application/problem+json): SuccessEnvelope /
    ListEnvelope / ErrorEnvelope. Kode error permukaan /api/v1/* = UPPERCASE
    machine-readable; pengecualian POST /oauth/token = kode RFC 6749 lowercase.

    CATATAN REALTIME: kanal realtime (WebSocket multipleks + FCM fallback, DL-35)
    BERADA DI LUAR OpenAPI ini; hanya REST yang dikontrakkan di sini.

    DI LUAR LINGKUP (sengaja tidak dikontrakkan): Penilaian/Review (HOLD, DL-46);
    HR-profile personil (education/qualification-history/work-experience/skill/salary/
    KTA, DEFERRED DL-16); Face Recognition (tautan eksternal, OUT).

    Catatan PII: seluruh contoh dianonimkan (NIK 32xxxxxxxxxxxxxx, nama Andi/Budi,
    username username01, email user01@contoh.com, telp 08xxxxxxxxxx).

    HEADER KORELASI GLOBAL: `X-Request-Id` dan `X-Tenant-Id` DITERIMA pada SEMUA
    operasi sebagai header korelasi/observability SAJA — tidak perlu di-`$ref` per-op.
    Server TIDAK pernah memakai `X-Tenant-Id` untuk otorisasi/isolasi (tenant selalu
    dari klaim `organization_id` di JWT, DL-19/DL-21); `X-Request-Id` (bila dikirim)
    digemakan di `meta.request_id` untuk korelasi audit lintas log/trace.

    OUT-OF-SCOPE for MVP (Phase 2): Developer Portal / Open API management (api_clients,
    api_keys, webhook_endpoints, webhook_deliveries, api_request_logs, api_usage_counters)
    and the cleaning vertical (E-Memo, Generate-QR) — schemas retained for forward-compat;
    endpoints to be added in a later phase. Penilaian (master_review/personnel_review)
    remains HOLD (DL-46); HR-profile & Face-Recognition OUT.
  contact:
    name: PT Artha Solusi Kreasindo — Platform Engineering
    email: tech@akseskerja.com

servers:
  - url: https://{host}/api/v1
    description: Permukaan utama (session JWT dashboard + Public API per-organisasi)
    variables:
      host:
        default: api.persist.example.com
  - url: https://{host}/api/v1/platform
    description: Permukaan Platform (staf PT ASK, lintas-organisasi)
    variables:
      host:
        default: api.persist.example.com

security:
  - bearerSession: []

tags:
  - name: Auth
    description: Otentikasi sesi (mobile & web)
  - name: OAuth
    description: OAuth2 client-credentials (Public API M2M)
  - name: Masters
    description: Master/konfigurasi org-scoped + referensi nasional
  - name: Organization
    description: |
      Domain organisasi: koordinator wilayah, kantor cabang, klien, proyek, regu, anggota regu, shift dan jadwal.
      Satu grup (KPI, IDS, PCD) adalah satu organisasi. Kode adalah id (D19): server yang membuatnya, tidak dapat diubah, dan
      tidak dipakai ulang walau barisnya dihapus.

      **Aturan untuk semua operasi**
      - Semua tanggal adalah tanggal bisnis di zona waktu proyek (WIB, WITA, atau WIT); "hari ini" juga menurut zona proyek, bukan UTC.
      - Jalur `/admin/...` memerlukan web role (staf lapangan 403 `NOT_ADMIN`). REGION_ADMIN hanya menjangkau wilayahnya
        (wilayah dibaca dari angka di depan kode: `1K-IBMI-S1` ada di OS1); di luar itu 403 `SCOPE_DENIED`, dijawab sebelum database
        ditanya. Aksi yang hanya untuk ORG_ADMIN: 403 `ROLE_DENIED`. Jalur lapangan (`/teams`, `/personnels/{id}`) tidak memerlukan
        web role: pemanggil melihat apa yang dibolehkan regu tempat ia bertugas hari ini.
      - Daftar: `page` 1 sampai 1000000, `limit` 1 sampai 100, `q` paling panjang 100 karakter. Di luar batas 422, tidak dipotong.
        Query string dengan karakter NUL 400.
      - Body: JSON satu objek, paling besar 1 MB (413). Field yang tidak dikenal 422. Karakter NUL (`\u0000`) 400.
        Field opsional yang tidak dikirim tidak berubah pada PATCH; `null` hanya berarti "hapus" bila field ditandai nullable.
      - id angka di path (shift, shift group, jadwal, personil, keanggotaan) harus angka positif; selain itu 404 resource itu.
      - Kode di path yang tidak ada atau sudah dihapus: 404. Penghapusan selalu lunak.
      - Perubahan dicatat di audit log dengan nilai sebelum dan sesudah. PATCH yang tidak mengubah apa pun tidak mencatat apa-apa.
      - Bentuk galat: `error.code` (enum ErrorCode), `error.details.reason` (enum OrganizationErrorReason), dan `error.errors[]`
        (field, code, message) untuk 422.
  - name: Attendance
    description: Kehadiran (absensi) + koreksi
  - name: Permission
    description: Izin & tukar jaga
  - name: Instruction
    description: Instruksi + acknowledgement
  - name: Media
    description: |
      Unggahan foto (swafoto absensi, laporan, instruksi, scan patroli, panik, aset, E-Memo).
      Alurnya sama untuk semua penyimpanan: daftarkan (`POST /media`), kirim byte dengan `PUT`
      ke `upload_url` memakai `upload_headers`, lalu konfirmasi (`POST /media/{id}/complete`).
      Klien tidak pernah menyusun URL sendiri dan tidak perlu tahu penyimpanan di baliknya.

      - Berkas yang sudah `UPLOADED` dilampirkan ke catatan lewat `media_ids` pada input
        create fitur (laporan, scan patroli, laporan aset, dst.).
      - Tidak ada endpoint baca per id media. Fitur pemilik catatan yang memberi akses, dan
        `photos` di responsnya berisi URL bertanda tangan berumur pendek (sekitar 1 jam).
        Jangan menyimpan URL itu; minta ulang catatannya.
      - Jenis yang diizinkan `image/jpeg`, `image/png`, `image/webp`; paling besar 10 MB.
      - Metadata pengambilan (waktu, GPS, sumber) disimpan sebagai bukti anti-kecurangan.
  - name: Report
    description: Laporan lapangan (offline-capable)
  - name: Patrol
    description: Patroli & Jaga (zona, scan, check-in)
  - name: Panic
    description: Sinyal panik
  - name: CCTV
    description: CCTV
  - name: Notification
    description: Notifikasi mobile + FCM token (12 event)
  - name: Dashboard
    description: Overview/dashboard agregat + chart (WEB-03/04)
  - name: Tracking
    description: Personnel tracking (location logs)
  - name: Asset
    description: Aset (inventaris) & laporan aset
  - name: ReportSummary
    description: Ringkasan Laporan (13 jenis) + export
  - name: Platform
    description: Manajemen tenant/onboarding/plan/subscription/invoice/headcount
  - name: Billing
    description: Billing org-facing
  - name: Seam
    description: |
      Seam server-to-server SiAPP <-> Persist Personel (LOCK F1). TIDAK dilayani oleh API ini:
      ini adalah permukaan milik Personel (kpi-personalia-api), dipanggil backend SiAPP dengan
      header X-Integration-Key (kunci bersama; Personalia hanya menyimpan SHA-256-nya, D8).
      Daftar ini adalah satu-satunya tempat status tiap seam dicatat. `x-status`:
      `implemented` = sudah ada di Personel dan diuji kontrak; `proposed` = usulan SiAPP,
      menunggu review tim Personel (belum ada endpoint-nya).
    x-seams:
      - id: S1
        name: Login (cek kredensial akun Personalia)
        x-status: implemented
        x-owner: personel
        endpoint: POST /api/v3/integrations/siapp/login
        notes: "Request {email, password, client_ip?, user_agent?}. Mengembalikan Identity (termasuk domain personalia|siapp), tanpa token dan tanpa binding perangkat. Binding satu-HP milik SiAPP."
      - id: S2
        name: Struktur organisasi (project, penempatan, jabatan)
        x-status: proposed
        x-owner: personel
      - id: S3
        name: Kehadiran (push event, status)
        x-status: proposed
        x-owner: personel
      - id: S4
        name: Lookup karyawan per NIK (maks. 200)
        x-status: implemented
        x-owner: personel
        endpoint: POST /api/v3/integrations/siapp/employees
        notes: "Request {niks: [...]}. NIK tidak dikenal dihilangkan; karyawan nonaktif dikembalikan dengan active=false."
      - id: S5
        name: Izin / cuti (jenis, ajukan, putuskan, daftar)
        x-status: proposed
        x-owner: personel
      - id: S6
        name: Event perubahan (webhook Personel ke SiAPP)
        x-status: proposed
        x-owner: personel

components:

  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session JWT (mobile/web) dari POST /auth/login. Klaim wajib: sub, organization_id,
        roles/scope, exp, iat. Middleware set app.current_org → RLS.
    oauth2ClientCredentials:
      type: oauth2
      description: |
        Public API M2M per-organisasi (DL-26). Token org-scoped membawa organization_id +
        scopes granular (resource:action), menempuh isolasi RLS yang sama. Scope kurang →
        403 INSUFFICIENT_SCOPE.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            personnel:read: Baca data personil
            personnel:write: Tulis data personil
            attendance:read: Baca kehadiran
            attendance:write: Tulis kehadiran
            reports:read: Baca laporan
            reports:write: Tulis laporan
            instructions:read: Baca instruksi
            instructions:write: Tulis instruksi
            patrol:read: Baca patroli/jaga
            patrol:write: Tulis patroli/jaga
            panic:read: Baca panik
            panic:write: Kirim/selesaikan panik
            cctv:read: Baca CCTV
            assets:read: Baca aset
            assets:write: Tulis laporan aset
            masters:read: Baca master/konfigurasi
            masters:write: Tulis master/konfigurasi
            reviews:read: Baca penilaian (master + personil)
            reviews:write: Tulis penilaian (master + kirim penilaian personil)
            organization:read: Baca domain organisasi
            organization:write: Tulis domain organisasi
            e-memo:read: Baca E-Memo (vertikal cleaning)
            e-memo:write: Tulis/kirim/balas E-Memo (vertikal cleaning)
            qr:generate: Generate/kelola QR identitas zona (vertikal cleaning)
            billing:read: Baca billing
            webhooks:read: Baca webhook endpoints + deliveries (WEB-38)
            webhooks:write: Kelola webhook endpoints, replay deliveries (WEB-38)
            developer:read: Baca kredensial API + usage/metering Developer Portal (WEB-38)
            developer:write: Kelola api_clients/api_keys (buat/rotasi/revoke) Developer Portal (WEB-38)
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key ber-scope statis (alternatif ringan OAuth), org-scoped + ber-scope +
        expires_at opsional. Format `<prefix>.<secret>`.

  parameters:
    PageParam:
      name: page
      in: query
      description: Nomor halaman (1-indexed), paling besar 1000000 (422 page).
      required: false
      schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
    LimitParam:
      name: limit
      in: query
      description: Item per halaman (maks 100).
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortParam:
      name: sort
      in: query
      description: Sortir per-resource, mis. `created_at:desc`.
      required: false
      schema: { type: string, example: created_at:desc }
    QParam:
      name: q
      in: query
      description: "Pencarian teks tanpa membedakan huruf besar/kecil, paling panjang 100 karakter (422 bila lebih). Dicocokkan sebagai potongan teks biasa: % dan _ bukan wildcard."
      required: false
      schema: { type: string, maxLength: 100 }
    BranchIdParam:
      name: branch_id
      in: query
      description: Filter scope cabang.
      required: false
      schema: { type: integer, format: int64 }
    ClientIdParam:
      name: client_id
      in: query
      description: Filter scope klien.
      required: false
      schema: { type: integer, format: int64 }
    ProjectIdParam:
      name: project_id
      in: query
      description: Filter scope proyek.
      required: false
      schema: { type: integer, format: int64 }
    TeamIdParam:
      name: team_id
      in: query
      description: Filter scope regu.
      required: false
      schema: { type: integer, format: int64 }
    EndpointIdParam:
      name: endpoint_id
      in: query
      description: Filter webhook_deliveries per endpoint (WEB-38).
      required: false
      schema: { type: integer, format: int64 }
    DateFromParam:
      name: date_from
      in: query
      description: Awal rentang (YYYY-MM-DD, relatif TZ proyek).
      required: false
      schema: { type: string, format: date }
    DateToParam:
      name: date_to
      in: query
      description: Akhir rentang (YYYY-MM-DD, relatif TZ proyek).
      required: false
      schema: { type: string, format: date }
    SinceParam:
      name: since
      in: query
      description: Delta-sync watermark (updated_at). Tanpa since → full pull (DL-34).
      required: false
      schema: { type: string, format: date-time }
    CursorParam:
      name: cursor
      in: query
      description: Cursor opaque untuk tarik inkremental (DL-34).
      required: false
      schema: { type: string }
    IsActiveParam:
      name: is_active
      in: query
      description: Filter status aktif.
      required: false
      schema: { type: boolean }
    StatusParam:
      name: status
      in: query
      description: Filter status/enum resource.
      required: false
      schema: { type: string }
    BusinessLineParam:
      name: business_line
      in: query
      description: Vertikal per-proyek.
      required: false
      schema: { type: string, enum: [security, cleaning] }
    IdPath:
      name: id
      in: path
      required: true
      description: Identitas resource.
      schema: { type: integer, format: int64 }
    # Header parameters (correlation / idempotency)
    RegionCodePath:
      name: code
      in: path
      required: true
      description: Kode koordinator wilayah (contoh OS1).
      schema: { type: string, pattern: '^OS[1-9][0-9]*$', example: OS1 }
    BranchCodePath:
      name: code
      in: path
      required: true
      description: Kode kantor cabang (contoh 1K).
      schema: { type: string, pattern: '^[1-9][0-9]*[KIP]$', example: "1K" }
    ClientCodePath:
      name: code
      in: path
      required: true
      description: Kode klien (contoh 1K-IBMI).
      schema: { type: string, example: "1K-IBMI" }
    ProjectCodePath:
      name: code
      in: path
      required: true
      description: Kode proyek (contoh 1K-IBMI-S).
      schema: { type: string, example: "1K-IBMI-S" }
    TeamCodePath:
      name: code
      in: path
      required: true
      description: Kode regu (contoh 1K-IBMI-S1).
      schema: { type: string, example: "1K-IBMI-S1" }
    RegionCodeQuery:
      name: region_code
      in: query
      required: false
      description: Opsional. Hanya baris di koordinator wilayah ini.
      schema: { type: string, example: OS1 }
    BranchCodeQuery:
      name: branch_code
      in: query
      required: false
      description: Opsional. Hanya baris di kantor cabang ini.
      schema: { type: string, example: "1K" }
    ClientCodeQuery:
      name: client_code
      in: query
      required: false
      description: Opsional. Hanya baris milik klien ini.
      schema: { type: string, example: "1K-IBMI" }
    ProjectCodeQuery:
      name: project_code
      in: query
      required: false
      description: Opsional. Hanya baris di proyek ini.
      schema: { type: string, example: "1K-IBMI-S" }
    BusinessLineQuery:
      name: business_line
      in: query
      required: false
      description: Opsional. Hanya proyek bidang usaha ini; nilai lain 422.
      schema: { $ref: '#/components/schemas/BusinessLine' }
    TeamMembershipIdPath:
      name: id
      in: path
      required: true
      description: "Nomor keanggotaan (id dari TeamMembership). Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada)."
      schema: { type: integer, format: int64, minimum: 1 }
    PersonnelIdOfMemberPath:
      name: personnel_id
      in: path
      required: true
      description: "Nomor personil anggota yang dikeluarkan. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada)."
      schema: { type: integer, format: int64, minimum: 1 }
    OnDateQuery:
      name: on_date
      in: query
      required: false
      description: "Opsional. Tanggal bisnis (YYYY-MM-DD). Bawaan: hari ini di zona waktu proyek regu."
      schema: { type: string, format: date }
    ShiftIdPath:
      name: id
      in: path
      required: true
      description: "Nomor shift. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada)."
      schema: { type: integer, format: int64, minimum: 1 }
    ShiftGroupIdPath:
      name: id
      in: path
      required: true
      description: "Nomor shift group. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada)."
      schema: { type: integer, format: int64, minimum: 1 }
    ScheduleIdPath:
      name: id
      in: path
      required: true
      description: "Nomor jadwal. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada)."
      schema: { type: integer, format: int64, minimum: 1 }
    DateFromQuery:
      name: date_from
      in: query
      required: true
      description: "WAJIB. Tanggal bisnis awal (YYYY-MM-DD)."
      schema: { type: string, format: date }
    DateToQuery:
      name: date_to
      in: query
      required: true
      description: "WAJIB. Tanggal bisnis akhir (YYYY-MM-DD), tidak sebelum date_from, rentang paling lama 62 hari."
      schema: { type: string, format: date }
    PersonnelIdQuery:
      name: personnel_id
      in: query
      required: false
      description: Opsional. Hanya jadwal personil ini.
      schema: { type: integer, format: int64, minimum: 1 }
    TeamCodeQuery:
      name: team_code
      in: query
      required: false
      description: "Opsional. Hanya jadwal personil yang menjadi anggota regu ini pada tanggal jadwalnya. REGION_ADMIN: regu di wilayah lain 403."
      schema: { type: string, example: "1K-IBMI-S1" }
    PersonnelIdPath:
      name: personnel_id
      in: path
      required: true
      description: "Identitas lokal orang (personnels.id), bukan id Personalia. Harus angka positif; selain itu 404 (id seperti itu tidak mungkin ada)."
      schema: { type: integer, format: int64, minimum: 1 }
    TeamRolePath:
      name: team_role
      in: path
      required: true
      description: "Peran regu yang hak-haknya dibaca atau diganti: DANRU atau MEMBER. Selain itu 404."
      schema: { $ref: '#/components/schemas/TeamRole' }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUIDv4 stabil seumur item; WAJIB untuk mutasi tak-aman yang dapat di-retry/antre
        offline (DL-34). Retry key sama → respons tersimpan; body berbeda + key sama →
        409 CONFLICT.
      schema: { type: string, format: uuid }
    XRequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Korelasi audit; digemakan server bila dikirim, jika tidak dibangkitkan.
      schema: { type: string }
    XTenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        KORELASI/OBSERVABILITY SAJA (DL-40). Server TIDAK pernah memakainya untuk
        otorisasi/isolasi; tenant selalu dari klaim organization_id JWT.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Token tidak ada/kedaluwarsa/invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            unauthenticated:
              value:
                success: false
                error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }
                meta: { request_id: "req_abc123" }
            expired:
              value:
                success: false
                error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }
                meta: { request_id: "req_abc123" }
    Forbidden:
      description: Role/scope tidak berwenang.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            forbidden:
              value:
                success: false
                error: { code: FORBIDDEN, message: "Akses ditolak." }
                meta: { request_id: "req_abc123" }
            insufficientScope:
              value:
                success: false
                error:
                  code: INSUFFICIENT_SCOPE
                  message: "Scope tidak mencukupi."
                  details: { scope_required: "personnel:write" }
                meta: { request_id: "req_abc123" }
    NotFound:
      description: Resource tidak ada atau di luar organisasi JWT (anti-enumerasi).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: NOT_FOUND, message: "Data tidak ditemukan." }
            meta: { request_id: "req_abc123" }
    ValidationError:
      description: Validasi body/query gagal atau aturan bisnis gagal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: "Validasi gagal pada beberapa field."
              errors:
                - { field: nik, code: DUPLICATE, message: "NIK sudah terdaftar." }
            meta: { request_id: "req_abc123" }
    Conflict:
      description: Pelanggaran UNIQUE / state konflik.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: CONFLICT, message: "Data konflik." }
            meta: { request_id: "req_abc123" }
    RateLimited:
      description: Terlalu banyak percobaan.
      headers:
        Retry-After:
          description: Detik sebelum mencoba lagi.
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          description: Epoch detik reset kuota.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error: { code: RATE_LIMITED, message: "Terlalu banyak permintaan." }
            meta: { request_id: "req_abc123" }
    ServiceUnavailable:
      description: |
        Persist Personel (Personalia) tidak dapat menjawab. `error.code` = INTERNAL_ERROR dengan
        `error.details.reason` = PERSONEL_UNAVAILABLE (ErrorCode tidak punya kode 503). Klien mencoba lagi nanti.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: "Layanan Personalia sedang tidak tersedia. Coba lagi sebentar lagi."
              details: { reason: PERSONEL_UNAVAILABLE }
            meta: { request_id: "req_abc123" }

  schemas:

    # ---------- Envelopes & error model ----------
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, description: Korelasi audit. }
        server_time:
          type: string
          format: date-time
          description: Watermark monoton untuk delta-sync (DL-34).
    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 143 }
        total_pages: { type: integer, example: 8 }
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ListEnvelope:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: array
          items: {}
        pagination: { $ref: '#/components/schemas/Pagination' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorCode:
      type: string
      description: Kode error UPPERCASE machine-readable permukaan /api/v1/*.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - INSUFFICIENT_SCOPE
        - NOT_FOUND
        - CONFLICT
        - DUPLICATE
        - UNDERSTAFFED
        - PAYLOAD_TOO_LARGE
        - UNPROCESSABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - BAD_REQUEST
        - ROLE_DENIED
        - ORG_MISMATCH
        - SCOPE_DENIED
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, example: nik }
        code: { type: string, example: DUPLICATE }
        message: { type: string, example: "NIK sudah terdaftar." }
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: Pesan human-readable (Bahasa Indonesia). }
            details:
              type: object
              additionalProperties: true
              description: Konteks tambahan opsional (mis. scope_required, retry_after).
            errors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
        meta:
          type: object
          required: [request_id]
          properties:
            request_id: { type: string }
    OAuthError:
      type: object
      description: Error token endpoint (kode RFC 6749 lowercase — KHUSUS /oauth/token).
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_client, invalid_scope, unsupported_grant_type, invalid_grant]
        error_description: { type: string }
    Tombstone:
      type: object
      description: Record terhapus untuk cache lokal delta-sync (DL-34).
      required: [id, deleted_at]
      properties:
        id: { type: integer, format: int64 }
        deleted_at: { type: string, format: date-time }
    DeltaMeta:
      type: object
      description: >-
        Meta untuk respons delta-sync (DL-34) — `server_time` WAJIB sebagai watermark
        monoton untuk pull berikutnya.
      required: [request_id, server_time]
      properties:
        request_id: { type: string, description: Korelasi audit. }
        server_time:
          type: string
          format: date-time
          description: Watermark monoton (= titik mulai pull `since` berikutnya).
        next_cursor:
          type: string
          description: Cursor opaque untuk halaman berikutnya; dihilangkan bila tidak ada lagi data (lihat has_more).
        has_more:
          type: boolean
          description: true bila masih ada data setelah halaman ini (tarik lagi dengan cursor).

    # ---------- Shared primitives ----------
    Money:
      type: string
      description: Nominal sebagai string desimal (DL-38) — jangan float.
      example: "125000.00"
    Coordinate:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double, example: -6.2 }
        lng: { type: number, format: double, example: 106.8 }

    # ---------- Auth payloads ----------
    LoginRequest:
      type: object
      required: [identifier, password, client]
      properties:
        identifier:
          type: string
          description: Email akun Persist Personalia. Password diperiksa oleh Personalia, SiAPP tidak menyimpannya.
          example: budi@contoh.com
        password: { type: string, format: password }
        client:
          type: string
          enum: [MOBILE, WEB]
          description: Aplikasi yang login. MOBILE mengikat satu perangkat per orang; WEB tidak mengikat perangkat.
        device_token:
          type: string
          maxLength: 512
          description: Pengenal perangkat. Wajib bila client = MOBILE (satu orang = satu HP); diabaikan untuk WEB.
        remember_me: { type: boolean }
        organization_code:
          type: string
          deprecated: true
          description: Diabaikan. Organisasi ditentukan oleh Personalia (perusahaan tempat orang itu bekerja), bukan oleh request.
          example: OS1
    LoginResult:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        user: { $ref: '#/components/schemas/Personnel' }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: user01@contoh.com }
        organization_code: { type: string }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password }
        new_password: { type: string, format: password }
    MeResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/Personnel' }
        roles:
          type: array
          items: { type: string }
          example: [OWNER, PLATFORM]
        team_role: { type: string, enum: [DANRU, MEMBER], nullable: true, example: DANRU }
        organization:
          type: object
          description: Organisasi (tenant) orang ini. Satu organisasi untuk seluruh grup (KPI, IDS, PCD); PT orang itu hanya informasi tampilan (D17).
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        web_role:
          type: object
          nullable: true
          description: Penugasan peran web (admin) milik SiAPP; null untuk petugas lapangan.
          properties:
            role: { type: string, enum: [ORG_ADMIN, REGION_ADMIN] }
            region_code: { type: string, nullable: true, example: OS1, description: Koordinator wilayah milik REGION_ADMIN; tidak ada (atau null) untuk ORG_ADMIN. }
        memberships:
          type: array
          description: Regu tempat orang ini bertugas hari ini (kosong bila tidak ada).
          items: { $ref: '#/components/schemas/MeMembership' }
        permissions:
          type: array
          description: |
            Hak akses lapangan orang ini hari ini, untuk menampilkan atau menyembunyikan menu. Selalu ada; kosong bila orang
            ini tidak bertugas di regu mana pun (admin web tidak memakai hak lapangan). Tiap kunci muncul sekali, dengan jangkauan
            terluas dari semua keanggotaan yang masih berjalan; kunci tanpa jangkauan tidak dikirim. Hak yang khusus satu bidang
            usaha (mis. `ememo.use`, hanya cleaning) dihitung hanya dari keanggotaan di proyek bidang itu.
            Daftar ini hanya untuk tampilan: setiap fitur memeriksa haknya sendiri di server.
          items: { $ref: '#/components/schemas/MePermission' }
    PermissionScope:
      type: string
      enum: [SELF, TEAM, PROJECT]
      description: |
        Jangkauan hak yang dimiliki seseorang. `SELF`: hanya catatannya sendiri. `TEAM`: catatan regu tempat ia memegang peran itu.
        `PROJECT`: catatan semua regu di proyek tempat ia memegang peran itu.
    MePermission:
      type: object
      required: [permission, scope]
      properties:
        permission: { type: string, maxLength: 64, example: attendance.leave.approve, description: Kunci hak akses (lihat katalog di /admin/field-permissions). }
        scope: { $ref: '#/components/schemas/PermissionScope' }
    FieldPermissionScope:
      type: string
      enum: [NONE, SELF, TEAM, PROJECT]
      description: |
        Jangkauan satu hak di matriks. `NONE`: peran itu tidak boleh. Selebihnya sama dengan `PermissionScope`.
        `NONE` disimpan sebagai nilai, bukan sebagai baris yang tidak ada, supaya hak yang dicabut admin tidak kembali saat seed ulang.
    FieldPermissionGrant:
      type: object
      additionalProperties: false
      required: [permission, scope]
      properties:
        permission: { type: string, minLength: 1, maxLength: 64, example: attendance.leave.approve }
        scope: { $ref: '#/components/schemas/FieldPermissionScope' }
    FieldPermissionDefaults:
      type: object
      description: Jangkauan bawaan tiap peran, dari Tabel 8 manual.
      required: [DANRU, MEMBER]
      properties:
        DANRU: { $ref: '#/components/schemas/FieldPermissionScope' }
        MEMBER: { $ref: '#/components/schemas/FieldPermissionScope' }
    FieldPermissionDefinition:
      type: object
      description: Satu hak akses di katalog. Katalog ditetapkan oleh aplikasi; admin hanya mengubah jangkauannya per peran.
      required: [permission, module, description, business_lines, defaults]
      properties:
        permission: { type: string, maxLength: 64, example: attendance.leave.approve }
        module: { type: string, example: attendance, description: Modul pemilik hak ini, untuk mengelompokkan di layar. }
        description: { type: string, example: Persetujuan izin, description: Nama hak di Tabel 8 manual (Bahasa Indonesia). }
        business_lines:
          type: array
          description: Hak ini hanya berlaku di proyek bidang usaha ini. Kosong berarti semua bidang.
          items: { $ref: '#/components/schemas/BusinessLine' }
        defaults: { $ref: '#/components/schemas/FieldPermissionDefaults' }
    FieldPermissionRole:
      type: object
      description: Semua hak satu peran regu, satu per hak di katalog, urut seperti katalog.
      required: [team_role, grants]
      properties:
        team_role: { $ref: '#/components/schemas/TeamRole' }
        grants:
          type: array
          items: { $ref: '#/components/schemas/FieldPermissionGrant' }
    FieldPermissionMatrix:
      type: object
      required: [catalog, roles]
      properties:
        catalog:
          type: array
          items: { $ref: '#/components/schemas/FieldPermissionDefinition' }
        roles:
          type: array
          description: Satu entri per peran regu (DANRU, MEMBER).
          items: { $ref: '#/components/schemas/FieldPermissionRole' }
    FieldPermissionsInput:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 200
          description: |
            WAJIB: setiap hak di katalog tepat satu kali. Ini penggantian seluruh hak satu peran, jadi hak yang tidak disebut
            ditolak (422 `REQUIRED`), bukan dianggap dicabut.
          items: { $ref: '#/components/schemas/FieldPermissionGrant' }
    WebRoleAssignment:
      type: object
      properties:
        personnel_id: { type: integer, format: int64 }
        full_name: { type: string }
        nik: { type: string, description: Disamarkan; hanya 4 digit terakhir. }
        role: { type: string, enum: [ORG_ADMIN, REGION_ADMIN] }
        region_code: { type: string, nullable: true, example: OS1 }
        granted_by_personnel_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebRoleInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ORG_ADMIN, REGION_ADMIN] }
        region_code:
          type: string
          maxLength: 10
          pattern: '^OS[1-9][0-9]*$'
          description: Wajib untuk REGION_ADMIN (harus koordinator wilayah yang ada); harus kosong untuk ORG_ADMIN.
    OAuthTokenResult:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string, example: "personnel:read attendance:read reports:read" }

    # ---------- 1. organizations (tenant) ----------
    Organization:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: OS1 }
        name: { type: string }
        legal_name: { type: string, nullable: true }
        status: { type: string, enum: [trial, active, suspended, churned] }
        enabled_business_lines:
          type: array
          items: { type: string, enum: [security, cleaning] }
        branding:
          type: object
          nullable: true
          properties:
            logo_url: { type: string }
            primary_color: { type: string }
            app_name: { type: string }
        timezone_default: { type: string, example: Asia/Jakarta }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationCreate:
      type: object
      required: [code, name, enabled_business_lines]
      properties:
        code: { type: string }
        name: { type: string }
        legal_name: { type: string }
        enabled_business_lines:
          type: array
          items: { type: string, enum: [security, cleaning] }
        timezone_default: { type: string, default: Asia/Jakarta }
        branding: { type: object, additionalProperties: true }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string }
        legal_name: { type: string }
        enabled_business_lines:
          type: array
          items: { type: string, enum: [security, cleaning] }
        branding: { type: object, additionalProperties: true }
        timezone_default: { type: string }

    # ---------- 2. regions (Koordinator Wilayah) ----------
    # Dimiliki SiAPP sejak D17. Kode adalah identitasnya (tanpa id angka, D19).
    # Skema respons tidak memakai `required`: setiap field selalu dikirim, kecuali field
    # nullable yang dihilangkan bila kosong.
    Region:
      type: object
      properties:
        code: { type: string, example: OS1, pattern: '^OS[1-9][0-9]*$' }
        description: { type: string, example: Outsourcing 1, description: Nama koordinator wilayah. }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegionInput:
      type: object
      additionalProperties: false
      required: [code, description]
      properties:
        code:
          type: string
          example: OS1
          maxLength: 10
          pattern: '^OS[1-9][0-9]*$'
          description: "WAJIB. OS diikuti angka tanpa nol di depan. Tidak dapat diubah setelah dibuat. Kode yang pernah dipakai, juga oleh wilayah yang dihapus, tidak dapat dipakai lagi (409 CODE_TAKEN)."
        description: { type: string, minLength: 1, maxLength: 200, example: Outsourcing 1, description: "WAJIB. Nama wilayah; tidak boleh hanya spasi." }
        is_active: { type: boolean, default: true, description: "Opsional. Bawaan true." }
    RegionUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional; field yang tidak dikirim tidak berubah. Body kosong `{}` sah dan
        tidak mengubah apa pun. `code` tidak dapat dikirim (422, field tidak dikenal).
      properties:
        description: { type: string, minLength: 1, maxLength: 200, description: "Tidak boleh hanya spasi." }
        is_active: { type: boolean }

    # ---------- 3. branches ----------
    # Kantor cabang. Kode = {nomor wilayah}{huruf PT}: 1K ada di bawah OS1 (D19). Klien mengirim
    # region_code dan company_letter; server yang membentuk kode. Kode tidak dapat diubah.
    Branch:
      type: object
      properties:
        code: { type: string, example: "1K", pattern: '^[1-9][0-9]*[KIP]$' }
        region_code: { type: string, example: OS1, pattern: '^OS[1-9][0-9]*$' }
        company_letter: { $ref: '#/components/schemas/CompanyLetter' }
        manager_name: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true, example: "08xxxxxxxxxx" }
        fax: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        description: { type: string, example: Jakarta, description: Nama kantor cabang. }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyLetter:
      type: string
      enum: [K, I, P]
      description: "PT pemberi kerja dalam grup: K = PT Kharisma Potensia Indonesia (KPI), I = PT Insan Daya Sentosa (IDS), P = PT Potensial Cipta Daya (PCD)."
    BranchInput:
      type: object
      additionalProperties: false
      required: [region_code, company_letter, description]
      properties:
        region_code: { type: string, example: OS1, pattern: '^OS[1-9][0-9]*$', description: "WAJIB. Harus koordinator wilayah yang ada (404 REGION_NOT_FOUND). Tidak dapat diubah." }
        company_letter: { allOf: [ { $ref: '#/components/schemas/CompanyLetter' } ], description: "WAJIB. Selain K, I, P ditolak (422 BRANCH_LETTER_INVALID). Tidak dapat diubah." }
        description: { type: string, minLength: 1, maxLength: 200, example: Jakarta, description: "WAJIB. Nama kantor cabang; tidak boleh hanya spasi." }
        manager_name: { type: string, maxLength: 200, description: Opsional. }
        city: { type: string, maxLength: 100, description: Opsional. }
        phone: { type: string, maxLength: 50, description: Opsional. }
        fax: { type: string, maxLength: 50, description: Opsional. }
        email: { type: string, maxLength: 200, description: Opsional. }
        address: { type: string, maxLength: 500, description: Opsional. }
        zip_code: { type: string, maxLength: 20, description: Opsional. }
        is_active: { type: boolean, default: true, description: "Opsional. Bawaan true." }
    BranchUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional; field yang tidak dikirim tidak berubah. Body kosong `{}` sah.
        `code`, `region_code`, dan `company_letter` tidak dapat dikirim (422, field tidak dikenal):
        kode dibentuk dari ketiganya.
      properties:
        description: { type: string, minLength: 1, maxLength: 200, description: "Tidak boleh hanya spasi." }
        manager_name: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 50 }
        fax: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        zip_code: { type: string, maxLength: 20 }
        is_active: { type: boolean }

    # ---------- 4. clients ----------
    # Klien. Kode = {kode cabang}-{company_prefix}, misalnya 1K-IBMI (D19).
    Client:
      type: object
      properties:
        code: { type: string, example: "1K-IBMI" }
        branch_code: { type: string, example: "1K" }
        description: { type: string, description: Nama klien. }
        company_code: { type: string, nullable: true, description: Diisi manual, tidak dibentuk server. }
        company_prefix: { type: string, example: IBMI, pattern: '^[A-Z0-9]{2,10}$' }
        company_bidang_usaha: { type: string, nullable: true }
        director_name: { type: string, nullable: true }
        city: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        fax: { type: string, nullable: true }
        address: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        email: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClientInput:
      type: object
      additionalProperties: false
      required: [branch_code, company_prefix, description]
      properties:
        branch_code: { type: string, example: "1K", description: "WAJIB. Harus kantor cabang yang ada (404 BRANCH_NOT_FOUND). Tidak dapat diubah." }
        company_prefix: { type: string, example: IBMI, pattern: '^[A-Z0-9]{2,10}$', description: "WAJIB. 2 sampai 10 huruf besar atau angka; selain itu 422 CLIENT_PREFIX_INVALID. Tidak dapat diubah." }
        description: { type: string, minLength: 1, maxLength: 200, example: PT IBM Indonesia, description: "WAJIB. Nama klien; tidak boleh hanya spasi." }
        company_code: { type: string, maxLength: 50, description: "Opsional. Diisi manual." }
        company_bidang_usaha: { type: string, maxLength: 200, description: Opsional. }
        director_name: { type: string, maxLength: 200, description: Opsional. }
        city: { type: string, maxLength: 100, description: Opsional. }
        phone: { type: string, maxLength: 50, description: Opsional. }
        fax: { type: string, maxLength: 50, description: Opsional. }
        address: { type: string, maxLength: 500, description: Opsional. }
        zip_code: { type: string, maxLength: 20, description: Opsional. }
        email: { type: string, maxLength: 200, description: Opsional. }
        is_active: { type: boolean, default: true, description: "Opsional. Bawaan true." }
    ClientUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional; field yang tidak dikirim tidak berubah. Body kosong `{}` sah.
        `code`, `branch_code`, dan `company_prefix` tidak dapat dikirim (422, field tidak dikenal).
      properties:
        description: { type: string, minLength: 1, maxLength: 200, description: "Tidak boleh hanya spasi." }
        company_code: { type: string, maxLength: 50 }
        company_bidang_usaha: { type: string, maxLength: 200 }
        director_name: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 50 }
        fax: { type: string, maxLength: 50 }
        address: { type: string, maxLength: 500 }
        zip_code: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 200 }
        is_active: { type: boolean }

    # ---------- 5. projects ----------
    # Proyek. Kode = {kode klien}-{S|C}: S security, C cleaning (D19). Satu proyek punya satu
    # alamat, zona waktu, dan titik GPS (D20). Tanpa koordinat, proyek belum dikonfigurasi dan
    # fitur yang memakainya menjawab PROJECT_NOT_CONFIGURED.
    BusinessLine:
      type: string
      enum: [security, cleaning]
      description: "Bidang usaha proyek (DL-20). security membentuk kode berakhiran S, cleaning berakhiran C; satu klien paling banyak satu proyek per bidang."
    ProjectTimezone:
      type: string
      enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
      description: "Zona waktu IANA proyek: WIB = Asia/Jakarta, WITA = Asia/Makassar, WIT = Asia/Jayapura."
    EmergencyContact:
      type: object
      required: [type, name, phone]
      properties:
        type: { type: string, minLength: 1, maxLength: 50, example: Polisi, description: "Jenis kejadian, misalnya Polisi, RS, Pemadam." }
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 50, example: "08xxxxxxxxxx" }
    Project:
      type: object
      properties:
        code: { type: string, example: "1K-IBMI-S" }
        client_code: { type: string, example: "1K-IBMI" }
        description: { type: string, description: Nama proyek. }
        company_code: { type: string, nullable: true }
        company_prefix: { type: string, nullable: true }
        company_bidang_usaha: { type: string, nullable: true }
        business_line: { $ref: '#/components/schemas/BusinessLine' }
        city: { type: string, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        timezone: { $ref: '#/components/schemas/ProjectTimezone' }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        configured: { type: boolean, description: "false bila koordinat belum diisi (PROJECT_NOT_CONFIGURED)." }
        attendance_radius_meters: { type: integer, minimum: 1, example: 150 }
        strict_attendance_geofence: { type: boolean }
        gps_tracking_enabled: { type: boolean, description: "Aktifkan tracking GPS personil (DL-48)." }
        patrol_interval_minutes: { type: integer, nullable: true, minimum: 1, description: "null = tidak dibatasi (DL-48)." }
        emergency_contacts:
          type: array
          description: 'Telp 3 tipe kejadian (Polisi/RS/Pemadam) — DL-14/manual 2.17.'
          items: { $ref: '#/components/schemas/EmergencyContact' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectInput:
      type: object
      additionalProperties: false
      required: [client_code, business_line, description, timezone]
      properties:
        client_code: { type: string, example: "1K-IBMI", description: "WAJIB. Harus klien yang ada (404 CLIENT_NOT_FOUND). Tidak dapat diubah." }
        business_line: { allOf: [ { $ref: '#/components/schemas/BusinessLine' } ], description: "WAJIB. Menentukan akhiran kode. Klien yang sudah punya proyek untuk bidang itu: 409 CODE_TAKEN. Tidak dapat diubah." }
        description: { type: string, minLength: 1, maxLength: 200, example: Pengamanan Gedung A, description: "WAJIB. Nama proyek; tidak boleh hanya spasi." }
        timezone: { allOf: [ { $ref: '#/components/schemas/ProjectTimezone' } ], description: "WAJIB. Tidak ada nilai bawaan agar zona waktu tidak keliru diam-diam." }
        company_code: { type: string, maxLength: 50, description: Opsional. }
        company_prefix: { type: string, pattern: '^[A-Z0-9]{2,10}$', description: "Opsional. Bila dikirim harus 2 sampai 10 huruf besar atau angka (422 CLIENT_PREFIX_INVALID)." }
        company_bidang_usaha: { type: string, maxLength: 200, description: Opsional. }
        city: { type: string, maxLength: 100, description: Opsional. }
        address: { type: string, maxLength: 500, description: Opsional. }
        phone: { type: string, maxLength: 50, description: Opsional. }
        email: { type: string, maxLength: 200, description: Opsional. }
        latitude: { type: number, format: double, minimum: -90, maximum: 90, description: "Opsional, tetapi harus dikirim bersama longitude (422 bila hanya satu). Tanpa keduanya proyek belum dikonfigurasi." }
        longitude: { type: number, format: double, minimum: -180, maximum: 180, description: "Opsional, tetapi harus dikirim bersama latitude." }
        attendance_radius_meters: { type: integer, minimum: 1, maximum: 10000, default: 150, description: "Opsional. Radius geofence absensi (meter), 1 sampai 10000. Bawaan 150." }
        strict_attendance_geofence: { type: boolean, default: false, description: "Opsional. Bawaan false." }
        gps_tracking_enabled: { type: boolean, default: true, description: "Opsional. Bawaan true." }
        patrol_interval_minutes: { type: integer, minimum: 1, maximum: 1440, description: "Opsional, 1 sampai 1440. Tidak dikirim = tidak dibatasi." }
        emergency_contacts:
          type: array
          description: "Opsional. Bawaan daftar kosong."
          items: { $ref: '#/components/schemas/EmergencyContact' }
        is_active: { type: boolean, default: true, description: "Opsional. Bawaan true." }
    ProjectUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional; field yang tidak dikirim tidak berubah. Body kosong `{}` sah.
        `code`, `client_code`, dan `business_line` tidak dapat dikirim (422, field tidak dikenal).
        Nilai yang sudah diisi (koordinat, interval patroli) dapat diganti tetapi tidak dikosongkan.
        `emergency_contacts` dikirim = menggantikan seluruh daftar; `[]` mengosongkan; tidak dikirim = tetap.
        Hasil akhir latitude dan longitude harus lengkap berpasangan (422 bila tidak).
      properties:
        description: { type: string, minLength: 1, maxLength: 200, description: "Tidak boleh hanya spasi." }
        timezone: { $ref: '#/components/schemas/ProjectTimezone' }
        company_code: { type: string, maxLength: 50 }
        company_bidang_usaha: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 500 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 200 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        attendance_radius_meters: { type: integer, minimum: 1, maximum: 10000 }
        strict_attendance_geofence: { type: boolean }
        gps_tracking_enabled: { type: boolean }
        patrol_interval_minutes: { type: integer, minimum: 1, maximum: 1440 }
        emergency_contacts:
          type: array
          items: { $ref: '#/components/schemas/EmergencyContact' }
        is_active: { type: boolean }
    ActivationInput:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }

    # ---------- 6. teams ----------
    # Regu. Kode = {kode proyek}{n}: n dari 1 per proyek dan tidak pernah dipakai ulang (D19).
    # Regu tidak punya geofence sendiri (D20): lokasinya lokasi proyek.
    Team:
      type: object
      properties:
        code: { type: string, example: "1K-IBMI-S1" }
        project_code: { type: string, example: "1K-IBMI-S" }
        description: { type: string, description: Nama regu. }
        phone: { type: string, nullable: true }
        min_personnel: { type: integer, minimum: 0, description: "Regu kekurangan personil bila anggota aktif kurang dari ini (DL-02)." }
        notes: { type: string, nullable: true }
        validate_shift: { type: boolean, description: "Validasi shift saat absensi (DL-48)." }
        reject_attendance_after_tolerance: { type: boolean, description: "Tolak absensi setelah waktu toleransi (DL-48)." }
        relationship_officer_personnel_id: { type: integer, format: int64, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamInput:
      type: object
      additionalProperties: false
      required: [project_code, description]
      properties:
        project_code: { type: string, example: "1K-IBMI-S", description: "WAJIB. Harus proyek yang ada (404 PROJECT_NOT_FOUND). Tidak dapat diubah. Nomor regu diambil dari penghitung proyek dan tidak pernah dipakai ulang." }
        description: { type: string, minLength: 1, maxLength: 200, example: Regu Pagi, description: "WAJIB. Nama regu; tidak boleh hanya spasi." }
        phone: { type: string, maxLength: 50, description: Opsional. }
        min_personnel: { type: integer, minimum: 0, maximum: 10000, default: 0, description: "Opsional. Bawaan 0." }
        notes: { type: string, maxLength: 1000, description: Opsional. }
        validate_shift: { type: boolean, default: true, description: "Opsional. Bawaan true." }
        reject_attendance_after_tolerance: { type: boolean, default: false, description: "Opsional. Bawaan false." }
        relationship_officer_personnel_id: { type: integer, format: int64, minimum: 1, description: "Opsional. Harus personil aktif di organisasi ini (422 bila tidak)." }
        is_active: { type: boolean, default: true, description: "Opsional. Bawaan true." }
    TeamUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional; field yang tidak dikirim tidak berubah. Body kosong `{}` sah.
        `code` dan `project_code` tidak dapat dikirim (422, field tidak dikenal).
      properties:
        description: { type: string, minLength: 1, maxLength: 200, description: "Tidak boleh hanya spasi." }
        phone: { type: string, maxLength: 50 }
        min_personnel: { type: integer, minimum: 0, maximum: 10000 }
        notes: { type: string, maxLength: 1000 }
        validate_shift: { type: boolean }
        reject_attendance_after_tolerance: { type: boolean }
        relationship_officer_personnel_id: { type: integer, format: int64, minimum: 1, nullable: true, description: "null menghapus relationship officer. Officer BARU harus personil aktif di organisasi ini (422); officer yang sudah ada tetap walau kemudian nonaktif." }
        is_active: { type: boolean }

    # ---------- error reasons of the organization module ----------
    # Dikirim di error.details.reason. Satu reason yang sudah rilis tidak pernah diganti namanya.
    OrganizationErrorReason:
      type: string
      description: |
        - `NOT_ADMIN`: 403 FORBIDDEN. Pemanggil tidak punya web role (staf lapangan).
        - `ACCESS_ORG_ADMIN_ONLY`: 403 ROLE_DENIED. REGION_ADMIN mencoba aksi yang hanya boleh ORG_ADMIN.
        - `ACCESS_OUTSIDE_ADMIN_SCOPE`: 403 SCOPE_DENIED. REGION_ADMIN menyentuh data di luar wilayahnya.
        - `REGION_NOT_FOUND`: 404 NOT_FOUND. Koordinator wilayah tidak ada atau sudah dihapus.
        - `BRANCH_NOT_FOUND`: 404 NOT_FOUND. Kantor cabang tidak ada atau sudah dihapus.
        - `CLIENT_NOT_FOUND`: 404 NOT_FOUND. Klien tidak ada atau sudah dihapus.
        - `PROJECT_NOT_FOUND`: 404 NOT_FOUND. Proyek tidak ada atau sudah dihapus.
        - `TEAM_NOT_FOUND`: 404 NOT_FOUND. Regu tidak ada atau sudah dihapus.
        - `CODE_TAKEN`: 409 DUPLICATE. Kode sudah dipakai, termasuk oleh baris yang sudah dihapus (D19).
        - `HAS_ACTIVE_CHILDREN`: 409 CONFLICT. Masih ada data yang belum dihapus di bawahnya, aktif maupun nonaktif (atau admin wilayah yang menunjuknya).
        - `BRANCH_LETTER_INVALID`: 422 VALIDATION_ERROR. Huruf PT cabang bukan K, I, atau P.
        - `BRANCH_REGION_MISMATCH`: 422 VALIDATION_ERROR. Nomor kode cabang tidak sama dengan nomor wilayahnya (hanya import, 02.4).
        - `CLIENT_PREFIX_INVALID`: 422 VALIDATION_ERROR. Prefix klien bukan 2 sampai 10 huruf besar atau angka.
        - `PROJECT_NOT_CONFIGURED`: 422 UNPROCESSABLE. Koordinat proyek belum diisi; fitur yang memerlukan lokasi menolaknya.
        - `MEMBERSHIP_NOT_FOUND`: 404 NOT_FOUND. Keanggotaan tidak ada atau sudah berakhir (gerak, ganti peran, dan keluar berlaku untuk keanggotaan yang masih berjalan).
        - `MEMBERSHIP_OVERLAP`: 409 CONFLICT. Personil sudah menjadi anggota regu yang sama pada sebagian tanggal itu.
        - `TEAM_HAS_DANRU`: 409 CONFLICT. Regu sudah punya DANRU pada sebagian tanggal itu (satu DANRU per regu per tanggal).
        - `PERSONNEL_NOT_FOUND`: 404 NOT_FOUND. NIK tidak dikenal Personalia di organisasi ini (tambah anggota), atau id personil tidak ada (jadwal, biodata); di layar Regu juga untuk personil yang sudah tidak aktif.
        - `PERSONNEL_INACTIVE`: 422 VALIDATION_ERROR. Personil nonaktif di Personalia (sudah keluar): tidak dapat ditambah, dipindah, diubah perannya, atau diberi jadwal FIXED atau jadwal manual. Mengeluarkannya dan mengatur jadwalnya menjadi FLEXIBLE tetap boleh.
        - `NOT_PROJECT_MEMBER`: 403 SCOPE_DENIED. Staf lapangan menanyakan proyek, regu, atau personil yang tidak berbagi proyek dengannya hari ini (juga untuk proyek yang tidak ada, agar tidak dapat ditebak).
        - `SHIFT_NOT_FOUND` / `SHIFT_GROUP_NOT_FOUND`: 404. Shift atau shift group tidak ada atau sudah dihapus.
        - `SHIFT_INVALID_TIME`: 422. Jam bukan HH:mm, jam masuk = jam pulang, jam pulang sebelum jam masuk tanpa `overnight: true` (atau `overnight: true` dengan jam pulang setelah jam masuk), atau shift OFF dikirim dengan jam, overnight, atau toleransi. Field yang salah disebut di `errors`.
        - `SHIFT_NAME_TAKEN` / `SHIFT_GROUP_NAME_TAKEN`: 409 DUPLICATE. Nama sudah dipakai.
        - `SHIFT_IN_USE`: 409. Shift dipakai shift group (tidak dapat dihapus maupun dinonaktifkan) atau dijadwalkan mulai hari ini (tidak dapat dihapus).
        - `SHIFT_GROUP_IN_USE`: 409. Shift group dipakai pengaturan jadwal personil.
        - `SHIFT_ASSIGNMENT_NOT_FOUND`: 404. Personil belum punya pengaturan jadwal.
        - `SCHEDULE_NOT_FOUND`: 404. Jadwal tidak ada.
        - `SCHEDULE_EXISTS`: 409. Personil sudah punya jadwal pada tanggal itu.
        - `SCHEDULE_TIMEZONE_AMBIGUOUS`: 422 UNPROCESSABLE. Pada tanggal itu personil bertugas di proyek dengan zona waktu berbeda, sehingga jam shift berarti dua waktu. Hanya menolak shift kerja; hari OFF tidak.
        - `PERMISSION_UNKNOWN`: 422 VALIDATION_ERROR. Daftar hak yang dikirim memuat kunci yang tidak ada di katalog; `errors[]` menyebut hak yang mana.
        - `PERMISSION_DENIED`: 403 FORBIDDEN. Peran orang itu di regunya tidak memberi hak ini, atau hak itu tidak mencakup regu yang ditanyakan (regu yang tidak ada atau milik organisasi lain dijawab sama).
        - `FEATURE_NOT_ENABLED`: 403 FORBIDDEN. Fitur hanya ada untuk satu bidang usaha (mis. E-Memo hanya cleaning) dan proyeknya bukan bidang itu. Proyek yang tidak ada dijawab sama.
      enum: [NOT_ADMIN, ACCESS_ORG_ADMIN_ONLY, ACCESS_OUTSIDE_ADMIN_SCOPE, REGION_NOT_FOUND, BRANCH_NOT_FOUND, CLIENT_NOT_FOUND, PROJECT_NOT_FOUND, TEAM_NOT_FOUND, CODE_TAKEN, HAS_ACTIVE_CHILDREN, BRANCH_LETTER_INVALID, BRANCH_REGION_MISMATCH, CLIENT_PREFIX_INVALID, PROJECT_NOT_CONFIGURED, MEMBERSHIP_NOT_FOUND, MEMBERSHIP_OVERLAP, TEAM_HAS_DANRU, PERSONNEL_NOT_FOUND, PERSONNEL_INACTIVE, SHIFT_NOT_FOUND, SHIFT_GROUP_NOT_FOUND, SHIFT_INVALID_TIME, SHIFT_NAME_TAKEN, SHIFT_GROUP_NAME_TAKEN, SHIFT_IN_USE, SHIFT_GROUP_IN_USE, SHIFT_ASSIGNMENT_NOT_FOUND, SCHEDULE_NOT_FOUND, SCHEDULE_EXISTS, SCHEDULE_TIMEZONE_AMBIGUOUS, NOT_PROJECT_MEMBER, PERMISSION_UNKNOWN, PERMISSION_DENIED, FEATURE_NOT_ENABLED]

    # ---------- 7. team memberships (keanggotaan regu, 02.3) ----------
    # Riwayat dijaga: keluar, pindah, dan ganti peran MENGAKHIRI baris (end_date) dan, untuk dua
    # yang terakhir, memulai baris baru. Tanggal adalah tanggal bisnis di zona waktu proyek;
    # end_date inklusif.
    TeamRole:
      type: string
      enum: [DANRU, MEMBER]
      description: "Peran lapangan di regu (DL-04). Satu DANRU per regu per tanggal (BR-RULE-02)."
    TeamMembership:
      type: object
      properties:
        id: { type: integer, format: int64, description: "Dipakai oleh /admin/team-members/{id}/move dan /change-role." }
        team_code: { type: string, example: "1K-IBMI-S1" }
        personnel_id: { type: integer, format: int64 }
        nik: { type: string, nullable: true, example: "************0001", description: NIK dimasker (hanya 4 karakter terakhir). }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        start_date: { type: string, format: date, example: "2026-01-15" }
        end_date: { type: string, format: date, nullable: true, description: "Inklusif; tidak ada = masih berjalan." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamMembershipInput:
      type: object
      additionalProperties: false
      required: [nik, role, start_date]
      properties:
        nik: { type: string, minLength: 1, maxLength: 32, example: SIAPPA0002, description: "WAJIB. Dicari di Personalia; orang yang belum pernah login tetap dapat ditambahkan (404 PERSONNEL_NOT_FOUND bila NIK tidak dikenal, 422 PERSONNEL_INACTIVE bila nonaktif)." }
        role: { $ref: '#/components/schemas/TeamRole' }
        start_date: { type: string, format: date, example: "2026-01-15", description: "WAJIB. Boleh tanggal depan (keanggotaan terjadwal)." }
    TeamMembershipMoveInput:
      type: object
      additionalProperties: false
      required: [to_team_code, effective_date]
      properties:
        to_team_code: { type: string, example: "1K-IBMI-S2", description: "WAJIB. Regu tujuan; harus ada (404 TEAM_NOT_FOUND) dan berbeda dari regu sekarang (422). Peran dibawa." }
        effective_date: { type: string, format: date, description: "WAJIB. Baris lama berakhir sehari sebelumnya, baris baru mulai pada tanggal ini. Harus setelah tanggal mulai keanggotaan (422)." }
    TeamMembershipChangeRoleInput:
      type: object
      additionalProperties: false
      required: [role, effective_date]
      properties:
        role: { allOf: [ { $ref: '#/components/schemas/TeamRole' } ], description: "WAJIB. Harus berbeda dari peran sekarang (422)." }
        effective_date: { type: string, format: date, description: "WAJIB. Baris lama berakhir sehari sebelumnya, baris baru mulai pada tanggal ini. Harus setelah tanggal mulai keanggotaan (422)." }
    MeMembership:
      type: object
      description: Satu regu tempat orang ini bertugas hari ini (tanggal bisnis di zona waktu proyek regu itu).
      properties:
        team_code: { type: string, example: "1K-IBMI-S1" }
        team_name: { type: string }
        project_code: { type: string, example: "1K-IBMI-S" }
        project_name: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        start_date: { type: string, format: date }

    # ---------- 8. shifts & schedules (02.5, model PJ48) ----------
    # Master shift dan shift group berlaku untuk seluruh organisasi (seperti PJ48). Jadwal adalah
    # satu baris per personil per tanggal. Jam adalah jam lokal proyek tempat personil bertugas
    # pada tanggal itu (DL-03).
    Shift:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Day Shift }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "08:00", description: "Jam masuk lokal; 00:00 untuk OFF." }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "17:00", description: "Jam pulang lokal; 00:00 untuk OFF." }
        is_off: { type: boolean, description: Hari libur (tanpa jam). }
        overnight: { type: boolean, description: "true bila shift berakhir keesokan harinya (jam pulang sebelum jam masuk, mis. 22:00-06:00). Selalu false untuk OFF." }
        tolerance_minutes: { type: integer, minimum: 0, maximum: 720, description: "Toleransi terlambat (dipakai reject_attendance_after_tolerance regu). 0 untuk OFF." }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShiftInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Night Shift, description: "WAJIB. Unik di organisasi (tanpa membedakan huruf besar/kecil) di antara shift yang belum dihapus; 409 SHIFT_NAME_TAKEN." }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "22:00", description: "WAJIB untuk shift kerja, HH:mm. Shift OFF: tidak boleh dikirim (422 SHIFT_INVALID_TIME)." }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "06:00", description: "WAJIB untuk shift kerja, HH:mm, berbeda dari start_time. Harus setelah start_time bila overnight false, dan sebelum start_time bila overnight true (422 SHIFT_INVALID_TIME). Shift OFF: tidak boleh dikirim." }
        is_off: { type: boolean, default: false, description: "Opsional. true = hari libur tanpa jam. Tidak dapat diubah setelah dibuat." }
        overnight: { type: boolean, default: false, description: "Opsional. true = shift berakhir keesokan harinya (mis. 22:00-06:00); wajib true agar end_time boleh sebelum start_time. Shift OFF: tidak boleh dikirim." }
        tolerance_minutes: { type: integer, minimum: 0, maximum: 720, default: 15, description: "Opsional. Bawaan 15; harus lebih pendek dari durasi shift (422 tolerance_minutes). Shift OFF: tidak boleh dikirim (disimpan 0)." }
        is_active: { type: boolean, default: true, description: "Opsional. Shift nonaktif tidak dapat dipilih untuk shift group atau jadwal baru." }
    ShiftUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional; yang tidak dikirim tidak berubah. `is_off` tidak dapat dikirim (422).
        Mengubah jam berlaku untuk semua tanggal yang sudah dijadwalkan dengan shift ini (seperti PJ48).
        Hasilnya diperiksa utuh: `overnight` yang tidak dikirim tetap milik shift, jadi jam baru harus
        sesuai dengannya (422 SHIFT_INVALID_TIME), dan toleransi harus lebih pendek dari durasi shift.
        Shift OFF tidak menerima start_time, end_time, overnight, maupun tolerance_minutes (422 SHIFT_INVALID_TIME).
        is_active false ditolak selama shift dipakai shift group (409 SHIFT_IN_USE).
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        overnight: { type: boolean, description: "true = berakhir keesokan harinya (end_time sebelum start_time)." }
        tolerance_minutes: { type: integer, minimum: 0, maximum: 720 }
        is_active: { type: boolean }
    Weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    ShiftGroupDay:
      type: object
      properties:
        weekday: { $ref: '#/components/schemas/Weekday' }
        shift: { $ref: '#/components/schemas/Shift' }
    ShiftGroup:
      type: object
      description: Pola mingguan (shift group PJ48). Selalu tujuh hari, Senin lebih dulu.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: "5 Hari Kerja" }
        days: { type: array, items: { $ref: '#/components/schemas/ShiftGroupDay' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShiftGroupDays:
      type: object
      additionalProperties: false
      description: "Nama hari (huruf kecil persis, monday sampai sunday) ke id shift. Shift harus ada dan aktif (422 pada days.<hari>). Hari libur = id shift OFF."
      properties:
        monday: { type: integer, format: int64, minimum: 1 }
        tuesday: { type: integer, format: int64, minimum: 1 }
        wednesday: { type: integer, format: int64, minimum: 1 }
        thursday: { type: integer, format: int64, minimum: 1 }
        friday: { type: integer, format: int64, minimum: 1 }
        saturday: { type: integer, format: int64, minimum: 1 }
        sunday: { type: integer, format: int64, minimum: 1 }
    ShiftGroupInput:
      type: object
      additionalProperties: false
      required: [name, days]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "WAJIB. Unik di organisasi; 409 SHIFT_GROUP_NAME_TAKEN." }
        days:
          allOf: [ { $ref: '#/components/schemas/ShiftGroupDays' } ]
          description: "WAJIB, ketujuh hari (422 days.<hari> bila ada yang kurang)."
    ShiftGroupUpdate:
      type: object
      additionalProperties: false
      description: |
        Semua field opsional. `days` boleh sebagian: hanya hari yang dikirim yang berubah.
        Seperti PJ48, perubahan hanya pada pola: jadwal yang sudah dibuat tetap; tanggal yang dibuat
        sesudahnya (perpanjangan malam, atau pengaturan jadwal baru) mengikuti pola baru.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        days: { $ref: '#/components/schemas/ShiftGroupDays' }
    ScheduleType:
      type: string
      enum: [FIXED, FLEXIBLE]
      description: "FIXED: jadwal dibuat otomatis dari pola shift group. FLEXIBLE: tidak dibuat otomatis; admin mengisi tiap tanggal."
    ShiftAssignment:
      type: object
      description: Pengaturan jadwal seorang personil (shift_groub PJ48).
      properties:
        personnel_id: { type: integer, format: int64 }
        schedule_type: { $ref: '#/components/schemas/ScheduleType' }
        shift_group_id: { type: integer, format: int64, nullable: true, description: null untuk FLEXIBLE. }
        effective_date: { type: string, format: date }
        generated_until: { type: string, format: date, nullable: true, description: "Tanggal terakhir yang sudah dibuat (FIXED). Diperpanjang tiap malam hingga hari ini + 60 hari." }
        updated_at: { type: string, format: date-time }
    ShiftAssignmentInput:
      type: object
      additionalProperties: false
      required: [schedule_type, effective_date]
      properties:
        schedule_type: { $ref: '#/components/schemas/ScheduleType' }
        shift_group_id: { type: integer, format: int64, minimum: 1, description: "WAJIB untuk FIXED, harus kosong untuk FLEXIBLE (422). Harus ada (404 SHIFT_GROUP_NOT_FOUND)." }
        effective_date: { type: string, format: date, description: "WAJIB. Tanggal mulai pola berlaku. Boleh tanggal depan." }
    ShiftAssignmentResult:
      type: object
      properties:
        assignment: { $ref: '#/components/schemas/ShiftAssignment' }
        from: { type: string, format: date, description: "Tanggal pertama yang dapat berubah: hari ini di zona waktu personil, atau besok bila shift hari ini sudah dimulai. Tanggal lampau tidak pernah diubah." }
        deleted: { type: integer, format: int64, description: Jumlah jadwal yang dihapus untuk diganti. }
        generated: { type: integer, format: int64, description: Jumlah jadwal yang dibuat. }
    ScheduleShift:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        start_time: { type: string, example: "08:00" }
        end_time: { type: string, example: "17:00" }
        is_off: { type: boolean }
        overnight: { type: boolean }
    Schedule:
      type: object
      properties:
        id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        full_name: { type: string }
        nik: { type: string, nullable: true, example: "******0001", description: NIK dimasker. }
        work_date: { type: string, format: date, description: "Tanggal bisnis shift dimulai, di zona waktu proyek personil. Shift malam berakhir pada work_date + 1." }
        shift: { $ref: '#/components/schemas/ScheduleShift' }
        shift_group_id: { type: integer, format: int64, nullable: true, description: "Shift group asal bila dibuat otomatis; null bila diisi atau diubah manual." }
        created_by: { type: integer, format: int64, nullable: true, description: "Personil yang membuat; null bila dibuat sistem (perpanjangan malam)." }
        updated_by: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScheduleEntry:
      type: object
      additionalProperties: false
      required: [work_date, shift_id]
      properties:
        work_date: { type: string, format: date }
        shift_id: { type: integer, format: int64, minimum: 1, description: "Shift yang ada dan aktif (422 entries[i].shift_id)." }
    ScheduleEntriesInput:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 62
          description: "1 sampai 62 tanggal; satu tanggal tidak boleh muncul dua kali (422)."
          items: { $ref: '#/components/schemas/ScheduleEntry' }
    ScheduleUpdate:
      type: object
      additionalProperties: false
      description: "Kedua field opsional. Jadwal yang diubah dianggap manual (shift_group_id menjadi null). Bila tidak ada yang berubah, jadwal dikembalikan apa adanya (tetap milik shift group). Hanya shift BARU yang harus aktif."
      properties:
        work_date: { type: string, format: date, description: "Pindah tanggal; tanggal tujuan yang sudah punya jadwal: 409 SCHEDULE_EXISTS." }
        shift_id: { type: integer, format: int64, minimum: 1 }
    ScheduleBulkDeleteInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer, format: int64, minimum: 1 } }
    ScheduleBulkDeleteResult:
      type: object
      properties:
        deleted: { type: integer }

    # ---------- 7b. layar Regu aplikasi lapangan (02.6) ----------
    # "Hari ini" adalah tanggal bisnis proyek: tanggal kalender di zona waktu proyek (DL-03).
    # Personil melihat proyek tempat ia menjadi anggota regu yang berlaku hari ini; DANRU melihat
    # proyek regunya karena ia DANRU regu itu, MEMBER proyek regunya sendiri.
    DirectoryPerson:
      type: object
      description: Kartu singkat seorang personil (DANRU, relationship officer).
      properties:
        personnel_id: { type: integer, format: int64 }
        full_name: { type: string, example: Budi Santoso }
        phone: { type: string, nullable: true, example: "08xxxxxxxxxx" }
        photo_url: { type: string, nullable: true }
    TeamShiftToday:
      type: object
      description: Shift kerja yang dijadwalkan hari ini untuk anggota regu, dengan jumlah anggotanya. OFF tidak termasuk.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Day Shift }
        start_time: { type: string, example: "08:00" }
        end_time: { type: string, example: "17:00" }
        overnight: { type: boolean }
        personnel_count: { type: integer }
    TeamRosterMember:
      type: object
      description: Anggota regu hari ini. Personil yang sudah tidak aktif di Personalia tidak tercantum dan tidak dihitung.
      properties:
        personnel_id: { type: integer, format: int64 }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
        position_name: { type: string, nullable: true, description: "Jabatan dari Personalia (salinan, hanya untuk tampilan)." }
        photo_url: { type: string, nullable: true }
        today_shift:
          allOf: [ { $ref: '#/components/schemas/ScheduleShift' } ]
          nullable: true
          description: Jadwal personil hari ini (termasuk OFF); tidak ada (atau null) bila belum dijadwalkan.
    TeamSummary:
      type: object
      description: Satu regu dengan proyek dan kliennya.
      properties:
        code: { type: string, example: "1K-IBMI-S1" }
        name: { type: string, example: Regu A }
        phone: { type: string, nullable: true }
        project_code: { type: string, example: "1K-IBMI-S" }
        project_name: { type: string }
        client_code: { type: string, example: "1K-IBMI" }
        client_name: { type: string }
        business_date: { type: string, format: date, description: Hari ini di zona waktu proyek. }
        member_count: { type: integer, description: Anggota yang berlaku hari ini. }
        min_personnel: { type: integer }
        understaffed: { type: boolean, description: "true bila member_count di bawah min_personnel (DL-02)." }
        is_my_team: { type: boolean, description: Pemanggil anggota regu ini hari ini. }
        my_role:
          allOf: [ { $ref: '#/components/schemas/TeamRole' } ]
          nullable: true
          description: Peran pemanggil di regu ini; tidak ada (atau null) bila bukan anggotanya.
        danru:
          allOf: [ { $ref: '#/components/schemas/DirectoryPerson' } ]
          nullable: true
          description: DANRU hari ini; tidak ada (atau null) bila regu belum punya DANRU.
    TeamDetail:
      description: Detail regu untuk layar Regu (§3.2.5).
      allOf:
        - { $ref: '#/components/schemas/TeamSummary' }
        - type: object
          properties:
            relationship_officer:
              allOf: [ { $ref: '#/components/schemas/DirectoryPerson' } ]
              nullable: true
            today_shifts: { type: array, items: { $ref: '#/components/schemas/TeamShiftToday' }, description: "Urut jam masuk." }
            members: { type: array, items: { $ref: '#/components/schemas/TeamRosterMember' }, description: "DANRU lebih dulu, lalu menurut nama." }
    PersonnelMembership:
      type: object
      properties:
        team_code: { type: string, example: "1K-IBMI-S1" }
        team_name: { type: string }
        project_code: { type: string, example: "1K-IBMI-S" }
        project_name: { type: string }
        role: { $ref: '#/components/schemas/TeamRole' }
    PersonnelCard:
      type: object
      description: |
        Biodata personil untuk layar Regu. Hanya yang dibutuhkan layar itu: profil HR (tanggal lahir,
        alamat, dokumen) milik Personalia dan tidak ditampilkan di SiAPP. Field yang kosong tidak dikirim.
      properties:
        personnel_id: { type: integer, format: int64 }
        full_name: { type: string }
        nik: { type: string, nullable: true, example: "******0001", description: NIK dimasker. }
        position_name: { type: string, nullable: true, description: "Jabatan dari Personalia (salinan, hanya untuk tampilan)." }
        phone: { type: string, nullable: true }
        photo_url: { type: string, nullable: true }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/PersonnelMembership' }
          description: "Regu personil hari ini di proyek yang juga proyek pemanggil (semua regunya bila melihat diri sendiri)."

    # ---------- 7. team_members ----------
    TeamMember:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        role: { type: string, enum: [DANRU, MEMBER] }
        shift: { type: string, nullable: true }
        joined_at: { type: string, format: date-time }
    TeamMemberInput:
      type: object
      required: [personnel_id, role]
      properties:
        personnel_id: { type: integer, format: int64 }
        role: { type: string, enum: [DANRU, MEMBER] }
        shift: { type: string }

    # ---------- 8. personnels (PII tertinggi; HR-profile OUT DL-16) ----------
    Personnel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        nik: { type: string, example: "32xxxxxxxxxxxxxx", description: 16 digit, PII tinggi (mask + audit). }
        npwp: { type: string, nullable: true }
        first_name: { type: string, example: Andi }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true, example: Budi }
        position_id: { type: integer, format: int64 }
        gender: { type: string, enum: [M, F] }
        username: { type: string, example: username01 }
        email: { type: string, nullable: true, example: user01@contoh.com }
        height_cm: { type: integer, nullable: true, minimum: 100, maximum: 230 }
        weight_kg: { type: integer, nullable: true, minimum: 30, maximum: 200 }
        birth_date: { type: string, format: date, nullable: true }
        birth_place: { type: string, nullable: true }
        phone: { type: string, nullable: true, example: "08xxxxxxxxxx" }
        address: { type: string, nullable: true }
        province_id: { type: integer, format: int64, nullable: true }
        city_id: { type: integer, format: int64, nullable: true }
        postal_code: { type: string, nullable: true }
        site_unit: { type: string, nullable: true }
        qualification_id: { type: integer, format: int64 }
        personnel_code: { type: string, nullable: true }
        description: { type: string, nullable: true }
        profile_photo: { type: string, nullable: true, format: uri }
        id_card_photo: { type: string, nullable: true, format: uri }
        contract_document: { type: string, nullable: true, format: uri }
        last_seen_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PersonnelInput:
      type: object
      required: [nik, first_name, position_id, gender, username, qualification_id]
      properties:
        nik: { type: string }
        npwp: { type: string }
        first_name: { type: string }
        middle_name: { type: string }
        last_name: { type: string }
        position_id: { type: integer, format: int64 }
        gender: { type: string, enum: [M, F] }
        username: { type: string }
        email: { type: string, format: email }
        height_cm: { type: integer, minimum: 100, maximum: 230 }
        weight_kg: { type: integer, minimum: 30, maximum: 200 }
        birth_date: { type: string, format: date }
        birth_place: { type: string }
        phone: { type: string }
        address: { type: string }
        province_id: { type: integer, format: int64 }
        city_id: { type: integer, format: int64 }
        postal_code: { type: string }
        site_unit: { type: string }
        qualification_id: { type: integer, format: int64 }
        personnel_code: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }

    # ---------- 9-21. Master tables (code/name/description shape) ----------
    CodedMaster:
      type: object
      description: Master umum (qualifications, client_types, client_groups, stakeholder_types, panic_types, report_categories, instruction_categories, permission_categories).
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        code: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CodedMasterInput:
      type: object
      required: [name]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        is_active: { type: boolean, default: true }
    Qualification:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
      description: Kualifikasi (Gada Pratama/Madya/Utama).
    ClientType:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    ClientGroup:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    StakeholderType:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    PanicType:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
      description: Tipe panik (Keamanan/Medis/Kebakaran/Lainnya).
    ReportCategory:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    InstructionCategory:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    PermissionCategory:
      allOf: [ { $ref: '#/components/schemas/CodedMaster' } ]
    Letterhead:
      type: object
      description: Kop Surat (WEB-12).
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }
        logo_url: { type: string, nullable: true, format: uri }
        header: { type: string, nullable: true }
        footer: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LetterheadInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        logo_url: { type: string, format: uri }
        header: { type: string }
        footer: { type: string }
        is_active: { type: boolean, default: true }
    Position:
      type: object
      description: Master Tingkat Posisi (DL-42); level LEADER/MEMBER.
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        code: { type: string, nullable: true }
        name: { type: string }
        level: { type: string, enum: [LEADER, MEMBER] }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PositionInput:
      type: object
      required: [name, level]
      properties:
        code: { type: string }
        name: { type: string }
        level: { type: string, enum: [LEADER, MEMBER] }
        description: { type: string }
        is_active: { type: boolean, default: true }
    AssetCondition:
      type: object
      description: Master kondisi aset (DL-43) — Baik/Rusak Ringan/Rusak Berat/Kadaluarsa/Dalam Perbaikan.
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        name: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetConditionInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        is_active: { type: boolean, default: true }
    # NOTE (DL-14 fix): entitas Stakeholder pembawa-telepon DIHAPUS — tidak ada tabel
    # backing. Master "Telp Stakeholder" adalah `stakeholder_types` (CodedMaster:
    # id/code/name/description/is_active) di /admin/stakeholder-types; nomor telepon
    # darurat tinggal di `projects.emergency_contacts` (array {type,name,phone}).

    # ---------- Master global / referensi nasional (DL-47) ----------
    Province:
      type: object
      description: Master global provinsi (read-only, lintas-tenant).
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
    City:
      type: object
      description: Master global kota (cascading dari province).
      properties:
        id: { type: integer, format: int64 }
        province_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }

    # ---------- 22. attendances ----------
    Attendance:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64, nullable: true }
        method: { type: string, enum: [QR, SELFIE, SHIFT, FORCE] }
        check_in_at: { type: string, format: date-time, nullable: true }
        check_out_at: { type: string, format: date-time, nullable: true }
        latitude: { type: number, format: double, nullable: true, example: -6.2 }
        longitude: { type: number, format: double, nullable: true, example: 106.8 }
        photo_url: { type: string, nullable: true, format: uri }
        timezone: { type: string, enum: [WIB, WITA, WIT] }
        replaced_by_id: { type: integer, format: int64, nullable: true }
        is_absent: { type: boolean }
        local_id: { type: string, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttendanceQrCheckIn:
      type: object
      required: [qr_token, lat, lng]
      properties:
        qr_token: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        photo: { type: string, format: uri }
        local_id: { type: string }
    AttendanceQrCheckOut:
      type: object
      required: [qr_token, lat, lng]
      properties:
        qr_token: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    AttendanceCheckOutPatch:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    AttendanceGroupInput:
      type: object
      required: [team_id, entries]
      properties:
        team_id: { type: integer, format: int64 }
        entries:
          type: array
          items:
            type: object
            required: [personnel_id, status]
            properties:
              personnel_id: { type: integer, format: int64 }
              status: { type: string }
    AttendanceAbsentInput:
      type: object
      required: [personnel_id, date]
      properties:
        personnel_id: { type: integer, format: int64 }
        date: { type: string, format: date }
        reason: { type: string }
    AttendanceCorrection:
      type: object
      properties:
        check_in: { type: string, format: date-time }
        check_out: { type: string, format: date-time }
        is_absent: { type: boolean }
        note: { type: string }

    # ---------- 23. permissions ----------
    Permission:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        personnel_id: { type: integer, format: int64 }
        permission_category_id: { type: integer, format: int64 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        approved_by: { type: integer, format: int64, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PermissionCreate:
      type: object
      required: [category_id, date_from, date_to]
      properties:
        category_id: { type: integer, format: int64 }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        reason: { type: string }
        attachment: { type: string, format: uri }
    ApprovalNote:
      type: object
      properties:
        note: { type: string }
    RejectionNote:
      type: object
      required: [note]
      properties:
        note: { type: string }

    # ---------- 24. shift_swaps (replacement) ----------
    ShiftSwap:
      type: object
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        replaced_personnel_id: { type: integer, format: int64 }
        replacing_personnel_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64, nullable: true }
        swap_date: { type: string, format: date }
        reason: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        approved_by: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShiftSwapCreate:
      type: object
      required: [replaced_personnel_id, replacing_personnel_id, swap_date]
      properties:
        replaced_personnel_id: { type: integer, format: int64 }
        replacing_personnel_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        swap_date: { type: string, format: date }
        reason: { type: string }

    # ---------- media: unggahan foto (Phase 04.1) ----------
    MediaPurpose:
      type: string
      enum: [PROFILE_PHOTO, ATTENDANCE_SELFIE, REPORT, INSTRUCTION, PATROL_SCAN, PANIC_REPORT, ASSET_REPORT, EMEMO]
      description: Untuk apa foto itu. Fitur yang melampirkannya menolak tujuan yang tidak cocok (MEDIA_PURPOSE_MISMATCH).
    MediaStatus:
      type: string
      enum: [PENDING, UPLOADED]
      description: "`PENDING` sudah didaftarkan tetapi byte belum dikonfirmasi; `UPLOADED` sudah dikonfirmasi dan boleh dilampirkan."
    CaptureSource:
      type: string
      enum: [CAMERA, GALLERY, UNKNOWN]
      description: Dari mana foto berasal. Swafoto absensi hanya boleh `CAMERA` (manual §3.2.3.1).
    MediaCreate:
      type: object
      required: [purpose, content_type, size_bytes, capture_source]
      properties:
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: Jenis lain 422 `MEDIA_TYPE_NOT_ALLOWED`.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: Ukuran tepat berkas dalam byte. Lebih dari 10485760 (10 MB) 413 `MEDIA_TOO_LARGE`. Byte yang diunggah harus sebesar ini, atau konfirmasi gagal.
        captured_at: { type: string, format: date-time, nullable: true, description: Waktu foto diambil menurut perangkat (UTC). Paling jauh 5 menit di depan waktu server. }
        latitude: { type: number, format: double, minimum: -90, maximum: 90, nullable: true, description: "Harus dikirim bersama `longitude`." }
        longitude: { type: number, format: double, minimum: -180, maximum: 180, nullable: true, description: "Harus dikirim bersama `latitude`." }
        capture_source: { $ref: '#/components/schemas/CaptureSource' }
    MediaUpload:
      type: object
      required: [id, upload_url, upload_method, upload_headers, expires_at]
      properties:
        id: { type: integer, format: int64, description: "Dipakai di `POST /media/{id}/complete` dan di `media_ids`." }
        upload_url:
          type: string
          format: uri
          description: |
            Alamat tujuan byte. Klien memakainya apa adanya dan tidak pernah menyusun alamat sendiri.
            Bisa alamat penyimpanan objek (S3/MinIO) atau `/media/blobs/{token}` di server ini,
            tergantung lingkungan. Token di dalamnya adalah kredensial: jangan dicatat di log.
        upload_method:
          type: string
          enum: [PUT]
          description: Selalu `PUT`. Ada di respons agar metode lain (misalnya POST bertanda tangan) tidak memerlukan rilis aplikasi.
        upload_headers:
          type: object
          additionalProperties: { type: string }
          description: Header yang HARUS dikirim bersama byte (di antaranya `Content-Type`). Header lain tidak boleh ditambahkan.
        expires_at: { type: string, format: date-time, description: Setelah ini `upload_url` ditolak. Daftarkan ulang untuk URL baru. }
    Media:
      type: object
      required: [id, purpose, content_type, size_bytes, status, capture_source, created_at]
      properties:
        id: { type: integer, format: int64 }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/MediaStatus' }
        captured_at: { type: string, format: date-time, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        capture_source: { $ref: '#/components/schemas/CaptureSource' }
        created_at: { type: string, format: date-time }
    MediaErrorReason:
      type: string
      description: |
        Dikirim di error.details.reason. Satu reason yang sudah rilis tidak pernah diganti namanya.
        - `MEDIA_NOT_FOUND`: 404 NOT_FOUND. Media tidak ada, milik organisasi lain, atau milik orang lain (tidak dibedakan agar id tidak dapat ditebak).
        - `MEDIA_TYPE_NOT_ALLOWED`: 422 UNPROCESSABLE. Jenis berkas bukan `image/jpeg`, `image/png`, atau `image/webp`.
        - `MEDIA_TOO_LARGE`: 413 PAYLOAD_TOO_LARGE. Ukuran lebih dari 10 MB.
        - `MEDIA_NOT_UPLOADED`: 409 CONFLICT. Pada `complete`: byte belum ada, ukurannya tidak sama dengan yang didaftarkan, atau isinya bukan gambar dari jenis yang didaftarkan. Unggah ulang lalu konfirmasi lagi.
        - `MEDIA_ALREADY_ATTACHED`: 409 CONFLICT. Foto itu sudah dilampirkan ke catatan lain (04.2).
        - `MEDIA_PURPOSE_MISMATCH`: 422 UNPROCESSABLE. Tujuan foto tidak cocok dengan catatan yang melampirkannya (04.2).
        - `MEDIA_LIMIT_EXCEEDED`: 422 UNPROCESSABLE. Lebih banyak foto daripada batas satu catatan (04.2).
        - `MEDIA_URL_INVALID`: 403 FORBIDDEN, atau 413 PAYLOAD_TOO_LARGE bila byte melebihi ukuran yang ditandatangani. Hanya pada `/media/blobs/{token}` (penyimpanan `local`): token rusak, kedaluwarsa, untuk operasi lain, atau dipakai dengan jenis atau ukuran yang salah.

