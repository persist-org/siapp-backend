  /admin/teams/{code}/members:
    parameters:
      - $ref: '#/components/parameters/TeamCodePath'
    get:
      operationId: getAdminTeamsByCodeMembers
      tags: [Organization]
      summary: "Daftar anggota regu"
      description: |
        Anggota regu pada satu tanggal: DANRU lebih dulu, lalu menurut nama (tanpa membedakan huruf besar/kecil).
        `on_date` opsional; bawaannya hari ini di zona waktu proyek regu (bukan UTC). Sebuah keanggotaan berlaku pada tanggal D
        bila mulai pada atau sebelum D dan berakhir pada atau sesudah D (atau belum berakhir).

        Wewenang: ORG_ADMIN menjangkau semua regu. REGION_ADMIN hanya regu di koordinator wilayahnya;
        wilayah sebuah regu adalah nomor di depan kodenya (1K-IBMI-S1 ada di OS1), apa pun proyeknya.
        Pemeriksaan wilayah dijawab sebelum database ditanya, sehingga regu di wilayah lain mendapat 403 SCOPE_DENIED juga bila kodenya tidak ada. Staf lapangan (tanpa web role) mendapat 403 NOT_ADMIN.
      x-roles: [ORG_ADMIN, REGION_ADMIN]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OnDateQuery'
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ListEnvelope' }
                  - properties: { data: { type: array, items: { $ref: '#/components/schemas/TeamMembership' } } }
        '400':
          description: "BAD_REQUEST: query string mengandung karakter NUL (%00), yang tidak dapat disimpan di database."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                nul:
                  value: { success: false, error: { code: BAD_REQUEST, message: "Query string tidak boleh berisi karakter NUL." }, meta: { request_id: req_abc123 } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
                expired:
                  summary: Token kedaluwarsa
                  value: { success: false, error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }, meta: { request_id: req_abc123 } }
        '403':
          description: "FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): REGION_ADMIN menyentuh regu di wilayah lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: "Regu di wilayah lain, ada ataupun tidak"
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Data ini berada di luar wilayah yang Anda kelola.", details: { reason: ACCESS_OUTSIDE_ADMIN_SCOPE } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Regu tidak ada, sudah dihapus, atau milik organisasi lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                TEAM_NOT_FOUND:
                  summary: "Regu tidak ada, sudah dihapus, atau milik organisasi lain (ORG_ADMIN; REGION_ADMIN mendapat 403 untuk wilayah lain)"
                  value: { success: false, error: { code: NOT_FOUND, message: "Regu tidak ditemukan.", details: { reason: TEAM_NOT_FOUND } }, meta: { request_id: req_abc123 } }
        '422':
          description: "VALIDATION_ERROR: on_date bukan YYYY-MM-DD, atau page/limit di luar batas."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                badOnDate:
                  summary: "on_date=2026-13-40"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: on_date, code: INVALID, message: "Harus berformat YYYY-MM-DD." } ] }, meta: { request_id: req_abc123 } }
                badLimit:
                  summary: "limit=1000"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: limit, code: INVALID, message: "Maksimum 100." } ] }, meta: { request_id: req_abc123 } }
    post:
      operationId: postAdminTeamsByCodeMembers
      tags: [Organization]
      summary: "Tambah anggota regu"
      description: |
        Menambahkan personil, dicari lewat NIK, ke regu mulai `start_date`. Orang yang belum pernah login ikut diambil dari Personalia dan disimpan; personil nonaktif ditolak.
        Satu personil boleh berada di beberapa regu dan proyek sekaligus, tetapi tidak dua kali di regu yang sama pada tanggal yang bertumpuk (409 MEMBERSHIP_OVERLAP); satu regu hanya punya satu DANRU per tanggal (409 TEAM_HAS_DANRU). Kegagalan apa pun tidak meninggalkan data setengah jadi.

        Wewenang: ORG_ADMIN menjangkau semua regu. REGION_ADMIN hanya regu di koordinator wilayahnya;
        wilayah sebuah regu adalah nomor di depan kodenya (1K-IBMI-S1 ada di OS1), apa pun proyeknya.
        Pemeriksaan wilayah dijawab sebelum database ditanya, sehingga regu di wilayah lain mendapat 403 SCOPE_DENIED juga bila kodenya tidak ada. Staf lapangan (tanpa web role) mendapat 403 NOT_ADMIN.
      x-roles: [ORG_ADMIN, REGION_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamMembershipInput' }
      responses:
        '201':
          description: "Created"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SuccessEnvelope' }
                  - properties: { data: { $ref: '#/components/schemas/TeamMembership' } }
        '400':
          description: "BAD_REQUEST: body kosong atau bukan JSON yang valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                empty:
                  summary: Body kosong
                  value: { success: false, error: { code: BAD_REQUEST, message: "Body wajib diisi." }, meta: { request_id: req_abc123 } }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
                expired:
                  summary: Token kedaluwarsa
                  value: { success: false, error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }, meta: { request_id: req_abc123 } }
        '403':
          description: "FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): REGION_ADMIN menyentuh regu di wilayah lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: "Regu di wilayah lain, ada ataupun tidak"
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Data ini berada di luar wilayah yang Anda kelola.", details: { reason: ACCESS_OUTSIDE_ADMIN_SCOPE } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Regu tidak ada, atau NIK tidak dikenal Personalia di organisasi ini."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                TEAM_NOT_FOUND:
                  summary: "Regu tidak ada, sudah dihapus, atau milik organisasi lain (ORG_ADMIN; REGION_ADMIN mendapat 403 untuk wilayah lain)"
                  value: { success: false, error: { code: NOT_FOUND, message: "Regu tidak ditemukan.", details: { reason: TEAM_NOT_FOUND } }, meta: { request_id: req_abc123 } }
                PERSONNEL_NOT_FOUND:
                  summary: "NIK tidak dikenal, atau milik PT di luar grup"
                  value: { success: false, error: { code: NOT_FOUND, message: "NIK tidak ditemukan di Personalia.", details: { reason: PERSONNEL_NOT_FOUND } }, meta: { request_id: req_abc123 } }
        '409':
          description: "CONFLICT: keanggotaan bertumpuk, atau DANRU kedua."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                MEMBERSHIP_OVERLAP:
                  summary: "Personil yang sama sudah di regu ini pada sebagian tanggal itu"
                  value: { success: false, error: { code: CONFLICT, message: "Personil sudah menjadi anggota regu ini pada tanggal tersebut.", details: { reason: MEMBERSHIP_OVERLAP } }, meta: { request_id: req_abc123 } }
                TEAM_HAS_DANRU:
                  summary: "Regu sudah punya DANRU pada sebagian tanggal itu"
                  value: { success: false, error: { code: CONFLICT, message: "Regu ini sudah memiliki DANRU pada tanggal tersebut.", details: { reason: TEAM_HAS_DANRU } }, meta: { request_id: req_abc123 } }
        '422':
          description: "VALIDATION_ERROR: nik, role atau start_date tidak valid, field tidak dikenal, atau personil nonaktif."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                missingDate:
                  summary: "start_date tidak dikirim"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: start_date, code: INVALID, message: "Wajib diisi dengan format YYYY-MM-DD." } ] }, meta: { request_id: req_abc123 } }
                badDate:
                  summary: "start_date = 01/02/2026"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: start_date, code: INVALID, message: "Harus berformat YYYY-MM-DD." } ] }, meta: { request_id: req_abc123 } }
                badRole:
                  summary: "role di luar enum (DANRU, MEMBER)"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: role, code: INVALID, message: "Harus salah satu dari DANRU MEMBER." } ] }, meta: { request_id: req_abc123 } }
                blankNik:
                  summary: "nik kosong atau hanya spasi"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: nik, code: INVALID, message: "Tidak boleh kosong." } ] }, meta: { request_id: req_abc123 } }
                unknownField:
                  summary: "Field yang tidak dikenal"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Validasi gagal pada beberapa field.", errors: [ { field: team_code, code: INVALID, message: "Field tidak dikenal." } ] }, meta: { request_id: req_abc123 } }
                PERSONNEL_INACTIVE:
                  summary: "Personil nonaktif di Personalia"
                  value: { success: false, error: { code: VALIDATION_ERROR, message: "Personil tidak aktif di Personalia dan tidak dapat ditambahkan ke regu.", details: { reason: PERSONNEL_INACTIVE } }, meta: { request_id: req_abc123 } }
        '429':
          description: "RATE_LIMITED: Personalia membatasi pencarian NIK saat ini. Coba lagi nanti."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: "PERSONEL_UNAVAILABLE: Personalia tidak dapat dihubungi saat mencari NIK (orang yang sudah dikenal tidak memerlukan panggilan itu)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                PERSONEL_UNAVAILABLE:
                  value: { success: false, error: { code: INTERNAL_ERROR, message: "Layanan Personalia sedang tidak tersedia. Coba lagi sebentar lagi.", details: { reason: PERSONEL_UNAVAILABLE } }, meta: { request_id: req_abc123 } }
        '413':
          description: "PAYLOAD_TOO_LARGE: body lebih dari 1 MB."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                tooLarge:
                  value: { success: false, error: { code: PAYLOAD_TOO_LARGE, message: "Body terlalu besar." }, meta: { request_id: req_abc123 } }
  /admin/teams/{code}/members/{personnel_id}:
    parameters:
      - $ref: '#/components/parameters/TeamCodePath'
      - $ref: '#/components/parameters/PersonnelIdOfMemberPath'
    delete:
      operationId: deleteAdminTeamsByCodeMembersByPersonnelId
      tags: [Organization]
      summary: "Keluarkan anggota dari regu"
      description: |
        Mengakhiri keanggotaan yang masih berjalan: `end_date` diisi hari ini di zona waktu proyek regu, dan tanggal itu masih dihitung (inklusif). Baris tidak dihapus, supaya kehadiran dan laporan lama tetap menemukan regunya.
        Keanggotaan yang belum mulai (start_date setelah hari ini) tidak pernah berlaku, jadi dihapus.
        Pindah regu atau ganti peran yang dijadwalkan ke tanggal depan ikut batal: keanggotaan hari ini
        berakhir hari ini (walau sudah dijadwalkan berakhir lebih lambat), dan baris yang dijadwalkan dihapus.
        Setelah keluar, personil dapat ditambahkan lagi dengan keanggotaan baru.

        Wewenang: ORG_ADMIN menjangkau semua regu. REGION_ADMIN hanya regu di koordinator wilayahnya;
        wilayah sebuah regu adalah nomor di depan kodenya (1K-IBMI-S1 ada di OS1), apa pun proyeknya.
        Pemeriksaan wilayah dijawab sebelum database ditanya, sehingga regu di wilayah lain mendapat 403 SCOPE_DENIED juga bila kodenya tidak ada. Staf lapangan (tanpa web role) mendapat 403 NOT_ADMIN.
      x-roles: [ORG_ADMIN, REGION_ADMIN]
      responses:
        '200':
          description: OK (data null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          description: "UNAUTHENTICATED atau TOKEN_EXPIRED: token tidak ada, tidak valid, atau kedaluwarsa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                unauthenticated:
                  summary: Tanpa token
                  value: { success: false, error: { code: UNAUTHENTICATED, message: "Token tidak ditemukan." }, meta: { request_id: req_abc123 } }
                expired:
                  summary: Token kedaluwarsa
                  value: { success: false, error: { code: TOKEN_EXPIRED, message: "Token kedaluwarsa." }, meta: { request_id: req_abc123 } }
        '403':
          description: "FORBIDDEN (NOT_ADMIN): bukan admin. SCOPE_DENIED (ACCESS_OUTSIDE_ADMIN_SCOPE): REGION_ADMIN menyentuh regu di wilayah lain."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: "Regu di wilayah lain, ada ataupun tidak"
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Data ini berada di luar wilayah yang Anda kelola.", details: { reason: ACCESS_OUTSIDE_ADMIN_SCOPE } }, meta: { request_id: req_abc123 } }
        '404':
          description: "Regu tidak ada, atau personil tidak punya keanggotaan yang masih berjalan di regu ini."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                TEAM_NOT_FOUND:
                  summary: "Regu tidak ada, sudah dihapus, atau milik organisasi lain (ORG_ADMIN; REGION_ADMIN mendapat 403 untuk wilayah lain)"
                  value: { success: false, error: { code: NOT_FOUND, message: "Regu tidak ditemukan.", details: { reason: TEAM_NOT_FOUND } }, meta: { request_id: req_abc123 } }
                MEMBERSHIP_NOT_FOUND:
                  summary: "Personil tidak punya keanggotaan yang masih berjalan di regu ini"
                  value: { success: false, error: { code: NOT_FOUND, message: "Keanggotaan regu tidak ditemukan atau sudah berakhir.", details: { reason: MEMBERSHIP_NOT_FOUND } }, meta: { request_id: req_abc123 } }
  /admin/team-members/{id}/move:
    parameters:
      - $ref: '#/components/parameters/TeamMembershipIdPath'
    post:
      operationId: postAdminTeamMembersByIdMove
      tags: [Organization]
      summary: "Pindahkan anggota ke regu lain"
      description: |
        Mengakhiri keanggotaan sehari sebelum `effective_date` dan memulai peran yang sama di regu tujuan pada tanggal itu, dalam satu transaksi (gagal berarti tidak ada yang berubah). Mengembalikan keanggotaan baru; baris lama menjadi riwayat.
        Hanya keanggotaan yang masih berjalan yang dapat dipindahkan. Regu tujuan boleh di proyek lain.
