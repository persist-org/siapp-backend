            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                NOT_ADMIN:
                  summary: "Staf lapangan (tanpa web role)"
                  value: { success: false, error: { code: FORBIDDEN, message: "Anda bukan admin. Akses ini hanya untuk admin.", details: { reason: NOT_ADMIN } }, meta: { request_id: req_abc123 } }
                ACCESS_OUTSIDE_ADMIN_SCOPE:
                  summary: "REGION_ADMIN di luar wilayahnya (dijawab sebelum database ditanya, juga untuk kode yang tidak ada)"
                  value: { success: false, error: { code: SCOPE_DENIED, message: "Data ini berada di luar wilayah yang Anda kelola.", details: { reason: ACCESS_OUTSIDE_ADMIN_SCOPE } }, meta: { request_id: req_abc123 } }
